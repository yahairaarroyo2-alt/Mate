function parseFactores(s){
  s = String(s).toLowerCase().replace(/[×·]/g,'*').replace(/\s+/g,'').replace(/x/g,'*');
  if(!s) return null;
  const out = {};
  for(const t of s.split('*')){
    if(!t) return null;
    const m = t.match(/^(\d+)(?:\^(\d+))?$/);
    if(!m) return null;
    const p = +m[1], e = m[2] ? +m[2] : 1;
    if(p < 2) return null;
    out[p] = (out[p]||0) + e;
  }
  return out;
}
const numLimpio = s => Number(String(s).trim().replace(/\s+/g,'').replace(',','.'));

function verificar(ej, ent){
  switch(ej.tipo){
    case 'sino': return { ok: ent === ej.respuesta };
    case 'cmp':  return { ok: ent === ej.respuesta };
    case 'num': {
      const v = numLimpio(ent);
      if(!isFinite(v) || ent === '') return { ok:false, vacio:true };
      return { ok: Math.abs(v - ej.respuesta) < (ej.tol ?? 0.01) };   // tolerancia: promedio/círculo redondean a 2 decimales; circuitos traen su propia tol (valores de 0.000470 A)
    }
    case 'opciones': return { ok: ent === ej.respuesta };
    case 'orden': return { ok: ent.length===ej.respuesta.length && ent.every((v,i)=>v===ej.respuesta[i]) };
    case 'frac': {
      let n = numLimpio(ent.n), d = numLimpio(ent.d);
      if(!isFinite(n) || !isFinite(d) || ent.n==='' || ent.d==='') return { ok:false, vacio:true };
      if(d === 0) return { ok:false, msg:'El denominador no puede ser 0.' };
      if(d < 0){ n = -n; d = -d; }                       // signo delante = signo arriba
      const Rp = ej.respuesta;
      if(n*Rp.d !== Rp.n*d) return { ok:false };
      if(ej.pedirSimple && mcd(Math.abs(n), d) !== 1)
        return { ok:false, incompleto:true,
                 msg:`${n}/${d} vale lo mismo, pero el ejercicio pedía la mínima expresión.` };
      return { ok:true };
    }
    case 'mixto': {
      const e = numLimpio(ent.e), n = numLimpio(ent.n), d = numLimpio(ent.d);
      if(![e,n,d].every(isFinite) || ent.e==='' || ent.n==='' || ent.d==='') return { ok:false, vacio:true };
      if(d <= 0) return { ok:false, msg:'El denominador tiene que ser mayor que 0.' };
      const Rp = ej.respuesta;
      // −2 2/7 es −(2 + 2/7): el signo del entero afecta a TODO el número, no solo al entero
      const neg = /^\s*[-−]/.test(ent.e), val = (neg ? -1 : 1) * (Math.abs(e)*d + n), valR = (Rp.e < 0 ? -1 : 1) * (Math.abs(Rp.e)*Rp.d + Rp.n);
      if(val*Rp.d !== valR*d) return { ok:false };
      if(n >= d) return { ok:false, incompleto:true,
        msg:'El valor es correcto, pero en un número mixto el numerador tiene que ser menor que el denominador.' };
      if(mcd(n,d) !== 1) return { ok:false, incompleto:true, msg:'Falta simplificar la parte fraccionaria.' };
      return { ok:true };
    }
    case 'multi': {
      // un ejercicio de la presentación que pide varios valores a la vez (ej. "Calcule Rtotal, Itotal y VR1,VR2,VR3")
      // circuitos: la fórmula (ent.f) es OPCIONAL — si la dejó en blanco no se revisa; si la
      // escribió, se le dice si está bien o mal escrita (y una mal escrita cuenta como error)
      const fs = ent.f || [];
      if(ent.some(v => String(v).trim() === '')) return { ok:false, vacio:true };
      if(ej.pares){   // pares de ángulos (casillas de 2 en 2): los pares en cualquier orden, y ∠AOC = ∠COA
        const ang = s => { const t = String(s).toUpperCase().replace(/[^A-Z]/g, ''); return t.length === 3 ? [t, [...t].reverse().join('')].sort()[0] : t; };
        const par = (a, b) => [ang(a), ang(b)].sort().join('|');
        const dados = ej.pares.map((_, k) => par(ent[2*k], ent[2*k+1])).sort(), bien = ej.pares.map(p => par(...p)).sort();
        const nBien = dados.filter(d => bien.includes(d)).length;
        return nBien === bien.length ? { ok:true } : { ok:false, incompleto: nBien > 0, msg:`Tienes ${nBien} de ${bien.length} pares bien.` };
      }
      const mal = [], fBien = [], fMal = [];
      ej.campos.forEach((c,i) => {
        if(c.ops){ if(ent[i] !== ej.respuesta[i]) mal.push(c.et); return; }
        if(c.q){   // valor exacto (Repaso/Autoevaluación del cap. 5): "7/50", "3 8/9", "-54"
          const v = leerQ(ent[i]);
          if(!v || v.d <= 0 || v.n*c.q.d !== c.q.n*v.d) mal.push(c.et);
          else if(v.d !== 1 && (mcd(v.fn, v.d) !== 1 || (v.mixto && v.fn >= v.d))) mal.push(`${c.et} (falta simplificar)`);
          return;
        }
        if(c.ex){   // con letras (Repaso/Autoevaluación del cap. 4): se compara sustituyendo valores
          const s = String(ent[i]).toLowerCase().replace(/\s+/g,'');
          if(!(c.ex === 'No definido' ? NO_DEF.test(s) : !NO_DEF.test(s) && mismaExpr(ent[i], c.ex))) mal.push(c.et);
          return;
        }
        const escrita = c.fs && String(fs[i] || '').trim() !== '';
        const malF = escrita && !formulaOk(fs[i], c);
        if(escrita) (malF ? fMal : fBien).push(c.et);
        const vIn = c.din ? Number(String(ent[i]).replace(/[\s$,]/g, '').replace('−', '-')) : numLimpio(ent[i]);   // dinero: "-$32,585" vale
        const malR = !(Math.abs(vIn - ej.respuesta[i]) < (c.tol ?? 0.01));
        if(malF || malR) mal.push(`${c.et} (${[malF && 'fórmula', malR && 'resultado'].filter(Boolean).join(' y ')})`);
      });
      const notaF = [fBien.length && `✓ Fórmulas bien escritas: ${fBien.join(', ')}.`,
                     fMal.length && `✗ Fórmulas mal escritas: ${fMal.join(', ')}.`].filter(Boolean).join('<br>');
      if(!mal.length) return notaF ? { ok:true, msg:notaF } : { ok:true };
      return { ok:false, incompleto: mal.length < ej.campos.length,
        msg:`Tienes ${ej.campos.length-mal.length} de ${ej.campos.length} bien. Revisa: ${mal.join(', ')}.${notaF ? '<br>'+notaF : ''}` };
    }
    case 'angulo2': {
      const a = numLimpio(ent.a), b = numLimpio(ent.b);
      if(!isFinite(a) || !isFinite(b) || ent.a==='' || ent.b==='') return { ok:false, vacio:true };
      return { ok: a === ej.respuesta.a && b === ej.respuesta.b };
    }
    case 'basexp': {
      const b = numLimpio(ent.b), e = numLimpio(ent.e), v = numLimpio(ent.v);
      if(![b,e,v].every(isFinite) || ent.b==='' || ent.e==='' || ent.v==='') return { ok:false, vacio:true };
      return { ok: b === ej.respuesta.b && e === ej.respuesta.e && v === ej.respuesta.v };
    }
    case 'coefvar': {
      const c = numLimpio(ent.coef);
      if(!isFinite(c) || ent.coef==='' || String(ent.variable||'').trim()==='') return { ok:false, vacio:true };
      return { ok: c === ej.respuesta.coef && normVar(ent.variable) === ej.respuesta.variable };
    }
    case 'texto': {
      const f = parseFactores(ent);
      if(!f) return { ok:false, msg:'No entendí lo que escribiste. Ejemplo: <b>2^3 * 5</b>' };
      const bases = Object.keys(f).map(Number);
      if(bases.some(p => !esPrimo(p)))
        return { ok:false, msg:`Todos los factores tienen que ser primos (${bases.filter(p=>!esPrimo(p)).join(', ')} no lo ${bases.filter(p=>!esPrimo(p)).length>1?'son':'es'}).` };
      const Rp = ej.respuesta, ks = Object.keys(Rp);
      const ok = bases.length===ks.length && ks.every(p => f[p] === Rp[p]);
      return { ok };
    }
  }
  return { ok:false };
}

// respuesta correcta con la forma que tendría escrita el usuario (lo usa autotest)
function respuestaComoEntrada(ej){
  switch(ej.tipo){
    case 'sino': case 'cmp': case 'orden': case 'opciones': return ej.respuesta;
    case 'num':   return String(ej.respuesta);
    case 'frac':  return { n:String(ej.respuesta.n), d:String(ej.respuesta.d) };
    case 'mixto': return { e:String(ej.respuesta.e), n:String(ej.respuesta.n), d:String(ej.respuesta.d) };
    case 'angulo2': return { a:String(ej.respuesta.a), b:String(ej.respuesta.b) };
    case 'multi': return Object.assign(ej.respuesta.map(String), { f: ej.campos.map(c => c.fs || '') });
    case 'basexp': return { b:String(ej.respuesta.b), e:String(ej.respuesta.e), v:String(ej.respuesta.v) };
    case 'coefvar': return { coef:String(ej.respuesta.coef), variable:ej.respuesta.variable };
    case 'texto': return fmtFactoresPlano(ej.respuesta);
  }
}
function fmtRespuesta(ej){
  switch(ej.tipo){
    case 'sino':  return ej.respuesta ? 'Sí' : 'No';
    case 'cmp':   return ej.respuesta;
    case 'num':   return String(ej.respuesta);
    case 'frac':  return `${ej.respuesta.n}/${ej.respuesta.d}`;
    case 'mixto': return `${ej.respuesta.e} ${ej.respuesta.n}/${ej.respuesta.d}`;
    case 'angulo2': return ej.etiquetas
      ? `${ej.etiquetas[0]} = ${ej.respuesta.a}, ${ej.etiquetas[1]} = ${ej.respuesta.b}`
      : `∠2 = ${ej.respuesta.a}°, ∠3 = ${ej.respuesta.b}°`;
    case 'multi': return ej.campos.some(c => c.fs)
      ? ej.campos.map((c,i) => c.fs ? `<br>${c.et}: ${c.fs} → ${c.sub} → ${ej.respuesta[i]}${c.u ? ' '+c.u : ''}` : `<br>${c.et}: ${ej.respuesta[i]}`).join('')
      : ej.campos.map((c,i) => `${c.et} = ${ej.respuesta[i]}${c.u ? ' '+c.u : ''}`).join(', ');
    case 'basexp': return `Base = ${ej.respuesta.b}, Exponente = ${ej.respuesta.e}, Valor = ${ej.respuesta.v}`;
    case 'coefvar': return `Coeficiente = ${ej.respuesta.coef}, Variable = ${ej.respuesta.variable}`;
    case 'texto': return fmtFactores(ej.respuesta);
    case 'orden': return ej.respuesta.map(i=>_ordenTexto(ej.opciones[i])).join(' , ');
    case 'opciones': return ej.respuesta;
  }
}

function analizarTexto(txt){
  const t = ' ' + String(txt).toLowerCase().replace(/\s+/g,' ') + ' ';
  const puntos = {}, secs = new Set();
  // SECMAP/CLAVES son propios de Álgebra — al pegar texto de otra materia, esto solo compara
  // contra SUS módulos (y CLAVES puede faltar para ellos, de ahí el ||[] más abajo)
  const msMateria = MODULOS.filter(m => m.clase === materia);
  msMateria.forEach(m => puntos[m.id] = 0);

  // (a) rangos "3.1 - 3.8" y "3.1 a 3.8"
  const rangos = t.match(/(\d+)\s*\.\s*(\d+)\s*(?:-|–|—|a|to)\s*(\d+)\s*\.\s*(\d+)/g) || [];
  rangos.forEach(r=>{
    const m = r.match(/(\d+)\s*\.\s*(\d+)\s*(?:-|–|—|a|to)\s*(\d+)\s*\.\s*(\d+)/);
    if(+m[1] !== +m[3]) return;                          // solo dentro del mismo capítulo
    for(let s = +m[2]; s <= +m[4]; s++) secs.add(`${+m[1]}.${s}`);
  });
  // (b) secciones sueltas — solo cuentan las que existen en el mapa
  (t.match(/\b\d+\s*\.\s*\d+\b/g) || []).forEach(s => {
    const k = s.replace(/\s+/g,'');
    if(SECMAP[k]) secs.add(k);
  });

  const secsValidas = [...secs].filter(s => SECMAP[s]).sort();
  secsValidas.forEach(s => SECMAP[s].forEach(id => puntos[id] += 5));

  // (c) palabras clave — límite de palabra en LOS DOS lados, no solo uno. Con solo un lado
  // (como antes: " k" O "k "), una clave corta como "rate" hacía match dentro de "corporate ",
  // o "order" dentro de "disorder" — bastaba con que un solo extremo tuviera espacio.
  const encontradas = {};
  msMateria.forEach(m=>{
    encontradas[m.id] = [];
    (CLAVES[m.id] || []).forEach(k=>{
      const re = new RegExp('(?:^|[^a-záéíóúñ0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?:$|[^a-záéíóúñ0-9])');
      if(re.test(t)){
        puntos[m.id] += 1; encontradas[m.id].push(k);
      }
    });
  });

  const detectados = msMateria.filter(m => puntos[m.id] > 0)
    .sort((a,b) => puntos[b.id] - puntos[a.id]);
  return { puntos, secciones: secsValidas, detectados, claves: encontradas };
}

/* --- lectura de archivos (las librerías se cargan solo si hacen falta) --- */
const URL_JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const URL_PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const URL_PDFWK = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function cargarScript(src){
  return new Promise((ok, err)=>{
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>ok();
    s.onerror = ()=>err(new Error('No se pudo cargar la librería. ¿Hay internet?'));
    document.head.appendChild(s);
  });
}
const desXml = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                     .replace(/&apos;/g,"'").replace(/&amp;/g,'&');

async function textoDePptx(file){
  await cargarScript(URL_JSZIP);
  const zip = await JSZip.loadAsync(file);
  const slides = Object.keys(zip.files)
    .filter(n => /^ppt\/(slides|notesSlides)\/\w+\d+\.xml$/.test(n))
    .sort((a,b) => (+a.replace(/\D/g,'')) - (+b.replace(/\D/g,'')));
  if(!slides.length) throw new Error('Ese .pptx no tiene diapositivas legibles.');
  const out = [];
  for(const n of slides){
    const xml = await zip.files[n].async('string');
    out.push((xml.match(/<a:t[^>]*>[\s\S]*?<\/a:t>/g) || [])
      .map(t => desXml(t.replace(/<[^>]+>/g,''))).join(' '));
  }
  return out.join('\n');
}
async function textoDePdf(file){
  await cargarScript(URL_PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL_PDFWK;
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for(let i=1; i<=doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    out.push(tc.items.map(it => it.str).join(' '));
  }
  return out.join('\n');
}
async function textoDeArchivo(file){
  const n = file.name.toLowerCase();
  if(n.endsWith('.pptx')) return textoDePptx(file);
  if(n.endsWith('.pdf'))  return textoDePdf(file);
  return file.text();
}

function _registrarHistorialYRachaDias(){
  const hoy = fechaLocal();

    rachaDias.mejor = Math.max(rachaDias.mejor, rachaDias.actual);
    rachaDias.ultimoDia = hoy;

function generarCodigo(){
  let s = '';
  for(let g=0; g<3; g++){
    for(let i=0; i<4; i++) s += ALFABETO_CODIGO[Math.floor(Math.random()*ALFABETO_CODIGO.length)];
    if(g<2) s += '-';
  }
  return s;
}
async function _hashCodigo(codigo){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codigo.trim().toUpperCase()));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

  await cargarScript(URL_FB_APP);

  if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}  // offline: cachea y reintenta sola
  }
  return firebase.firestore();
}
function _fusionarStats(a, b){
  const ids = new Set([...Object.keys(a), ...Object.keys(b)]);
  const out = {};
  ids.forEach(id => {
    const x = a[id] || {ok:0, fallo:0}, y = b[id] || {ok:0, fallo:0};
    out[id] = { ok: (x.ok||0) + (y.ok||0), fallo: (x.fallo||0) + (y.fallo||0) };
  });
  return out;
}
// junta los grupos de los dos aparatos por id, sin perder ninguno — los id son al azar
// (idGrupo()) así que una colisión entre dos aparatos distintos es prácticamente imposible
function _unirGrupos(a, b){
  const vistos = new Set(a.map(g=>g.id));
  return a.concat(b.filter(g=>!vistos.has(g.id)));
}
async function conectarSync(codigo){           // se llama UNA vez, al vincular este aparato
  const db = await _initFirebase();
  const id = await _hashCodigo(codigo);
  const ref = db.collection('syncs').doc(id);
  const snap = await ref.get();
  const remoto = snap.exists ? snap.data() : {};
  grupos = _unirGrupos(remoto.grupos || [], grupos);
  guardar('mate_grupos_v1', grupos);
  await ref.set({
    stats: _fusionarStats(remoto.stats || {}, stats),
    racha: { actual: (remoto.racha && remoto.racha.actual) || racha.actual,
             mejor: Math.max((remoto.racha && remoto.racha.mejor) || 0, racha.mejor) },
    nivel: remoto.nivel || nivel,
    clase: remoto.clase !== undefined ? remoto.clase : (clase || null),
    grupos
  }, { merge: true });

  syncCode = codigo.trim().toUpperCase();
  guardar('mate_sync_code_v1', syncCode);

}
async function _reengancharSync(){              // se llama en cada apertura, si ya había un código guardado
  if(!syncCode) return;

function _escucharSync(){
  if(!syncDoc || syncListo) return;
  syncListo = true;
  _syncUnsub = syncDoc.onSnapshot(snap => {
    const d = snap.data();
    if(!d) return;
    // Firestore solo guarda el campo que se incrementó (ok o fallo) — un tema sin fallos
    // nunca queda con esa clave. Se normaliza al recibir para que pct() no dé NaN.
    if(d.stats){
      stats = {};
      Object.keys(d.stats).forEach(id => { stats[id] = { ok: d.stats[id].ok||0, fallo: d.stats[id].fallo||0 }; });
    }
    if(d.racha){ racha.actual = d.racha.actual||0; racha.mejor = Math.max(racha.mejor||0, d.racha.mejor||0); }
    if(d.nivel) nivel = d.nivel;
    if(d.clase !== undefined) clase = d.clase;
    if(d.grupos !== undefined) grupos = d.grupos;
    guardar('mate_stats_v1', stats); guardar('mate_racha_v1', racha);
    guardar('mate_nivel_v1', nivel); guardar('mate_clase_v1', clase);
    guardar('mate_grupos_v1', grupos);
    // si estás mirando Inicio o Progreso cuando llega el cambio del otro aparato, refresca sola
    if(_pantallaActual === pantallaInicio || _pantallaActual === pantallaStats) _pantallaActual();
  }, err => console.warn('sync:', err.message));
}

// veces que se despierta la radio del teléfono para lo mismo
let _syncPendiente = null, _syncTimer = null;
function _empujarSync(modId, ok){
  if(!syncDoc) return;
  if(!_syncPendiente) _syncPendiente = { stats:{} };
  const p = _syncPendiente.stats[modId] || (_syncPendiente.stats[modId] = { ok:0, fallo:0 });
  p[ok ? 'ok' : 'fallo']++;
  _syncPendiente.racha = { actual: racha.actual, mejor: racha.mejor };
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(_flushSync, 4000);
}
function _flushSync(){
  clearTimeout(_syncTimer); _syncTimer = null;
  if(!syncDoc || !_syncPendiente) return;
  const p = _syncPendiente; _syncPendiente = null;
  const statsInc = {};
  Object.keys(p.stats).forEach(id => {
    statsInc[id] = {};
    if(p.stats[id].ok)    statsInc[id].ok    = firebase.firestore.FieldValue.increment(p.stats[id].ok);
    if(p.stats[id].fallo) statsInc[id].fallo = firebase.firestore.FieldValue.increment(p.stats[id].fallo);
  });
  syncDoc.set({ stats: statsInc, racha: p.racha }, { merge: true }).catch(()=>{});
}
function desconectarSync(){
  _flushSync();
  if(_syncUnsub) _syncUnsub();
  _syncUnsub = null; syncDoc = null; syncListo = false; syncCode = null;
  localStorage.removeItem('mate_sync_code_v1');

const pct = s => { const t = s.ok + s.fallo; return t ? Math.round(s.ok*100/t) : null; };

/* módulos disponibles ahora mismo (según el modo clase) */
function modulosActivos(){
  // clase.mods es de UNA materia — si cambiaste de materia y quedó un grupo/mezcla de la otra
  // sin quitar, se ignora en vez de mezclar módulos de las dos materias en una misma ronda
  if(clase && clase.mods && clase.mods.length){
    const ms = clase.mods.map(id => MOD_POR_ID[id]).filter(m => m && m.clase === materia);
    if(ms.length) return ms;
  }
  return MODULOS.filter(m => m.clase === materia);
}
/* sortea uno de "ms" dando más peso a los que van peor — la usan elegirModulo() e iniciarExamen() */
function elegirDe(ms){
  const pesos = ms.map(m => {
    const s = stats[m.id] || { ok:0, fallo:0 };
    return 1 + s.fallo / (s.ok + s.fallo + 1);
  });
  let r = Math.random() * pesos.reduce((a,b)=>a+b, 0);
  for(let i=0; i<ms.length; i++){ r -= pesos[i]; if(r <= 0) return ms[i]; }
  return ms[ms.length-1];
}
/* elige módulo para la práctica normal; cap (1/2/3) limita la mezcla a ese capítulo */
function elegirModulo(cap){
  // "Mezcla del capítulo N" siempre usa TODOS los temas del capítulo, sin importar si hay una
  // mezcla personalizada activa — si no, pedir el capítulo 3 con una mezcla de solo cap.1 se
  // quedaba sin candidatos y tronaba.
  return elegirDe(cap ? MODULOS.filter(m=>m.clase===materia && m.secciones[0][0]===String(cap)) : modulosActivos());
}

  return shuffle(cola);
}
function toggleAgrupar(){

// agenda la pregunta fallada para que vuelva a salir, igual (mismo enunciado y números), más
// adelante en la misma ronda — nunca la próxima (esperar arranca en 2 como mínimo), y la ronda
// se alarga un puesto para que le entre. Sirve tanto para mezcla (sesionCola) como para tema fijo.

let ultimoFeedback = null;// resultado de verificar() del último responder(), para poder retomarlo
let ultimoProceso = '';   // lo que el usuario escribió en "Tu proceso" antes de responder (un paso por línea)
let _reintento = false;    // true = el ejercicio se reinició después de contestarlo o de ver la explicación (ya no cuenta otra vez)
let ultimaEntrada = null; // lo que respondió (ent de responder()), para que la IA pueda revisarlo después
// "Tu proceso": una caja por paso, opcional, en todos los ejercicios. Va FUERA de #zonaEntrada
// para que la calculadora no escriba ahí y no se ponga opaca al contestar.
const attrEsc = s => escHtml(s).replace(/"/g, '&quot;');
// cada paso es una fila de pedazos: cajas de texto y, si hace falta, fracciones con arriba y abajo (botón a/b).
// Se guardan como una línea de texto; la fracción va como ⟦arriba|abajo⟧ para poder volver a dibujarla.
const _ptHTML = (v, id, ph) => `<input class="campo pt"${id ? ` id="${id}"` : ''} autocomplete="off" autocapitalize="off"${ph ? ` placeholder="${ph}"` : ''} value="${attrEsc(v)}">`;
const _frHTML = (n, d, x = true) => `<span class="pfr">${x ? `<button type="button" class="pfrX" onclick="quitarFraccion(this)" aria-label="Quitar la fracción">×</button>` : ''}<input class="campo pn" autocomplete="off" autocapitalize="off" placeholder="arriba" value="${attrEsc(n)}"><i class="pbarra"></i><input class="campo pd" autocomplete="off" autocapitalize="off" placeholder="abajo" value="${attrEsc(d)}"></span>`;
// igualdad de fracciones a/b = c/d (botón de cada paso)
const _faHTML = (a, b, c, d, k) => `<span class="pfa"><button type="button" class="pfrX" onclick="quitarFraccion(this)" aria-label="Quitar la fracción con flechas">×</button>
  <span class="pfaFila">${_frHTML(a, b, false)}<b>=</b>${_frHTML(c, d, false)}</span></span>`;
const _RX_PARTE = /⟦([^|⟧]*)\|([^⟧]*)⟧|⟪([^|⟫]*)\|([^|⟫]*)\|([^|⟫]*)\|([^|⟫]*)\|([^⟫]*)⟫/g;
function pasoFilaHTML(i, v){
  v = String(v || ''); let h = '', ult = 0, m;
  _RX_PARTE.lastIndex = 0;
  while((m = _RX_PARTE.exec(v))){
    h += (ult === 0 && !h) ? _ptHTML(v.slice(0, m.index), 'inP' + i, `Paso ${i+1}`) : _ptHTML(v.slice(ult, m.index), '', '');
    h += m[1] !== undefined ? _frHTML(m[1], m[2]) : _faHTML(m[3], m[4], m[5], m[6], m[7]);
    ult = m.index + m[0].length;
  }
  h += h ? _ptHTML(v.slice(ult), '', '') : _ptHTML(v, 'inP' + i, `Paso ${i+1}`);
  return `<div class="pasoFila"><span>${i+1}</span><div class="pasoPartes">${h}</div><button type="button" class="pasoFrBtn" onclick="agregarFraccion(this, true)" aria-label="Agregar dos fracciones iguales (a/b = c/d)" title="Dos fracciones con = en medio">a/b=c/d</button></div>`;
}
function agregarFraccion(btn, flechas){
  const partes = btn.closest('.pasoFila').querySelector('.pasoPartes');
  partes.insertAdjacentHTML('beforeend', (flechas ? _faHTML('', '', '', '', '') : _frHTML('', '')) + _ptHTML('', '', ''));
  partes.lastElementChild.previousElementSibling.querySelector('.pn').focus();
}
function quitarFraccion(x){ const fr = x.closest('.pfa, .pfr'), sig = fr.nextElementSibling, prev = fr.previousElementSibling;
  if(sig && prev && sig.classList.contains('pt') && prev.classList.contains('pt')){ prev.value = (prev.value + ' ' + sig.value).trim(); sig.remove(); }
  const foco = prev || fr.parentNode.firstElementChild; fr.remove(); if(foco && foco.focus) foco.focus(); }
function procesoHTML(){
  const guardados = ((respondido || vioExpl) && ultimoProceso) ? ultimoProceso.split('\n') : [];
  const n = Math.max(3, guardados.length);
  return `<div class="procesoCaja"><div class="procesoTit"><span>Tu proceso</span>
      <button type="button" id="btnOcultarProceso" class="procesoOcultar" onclick="toggleProceso()">▲ Ocultar</button></div>
    <div id="cuerpoProceso"><div id="listaPasos">${Array.from({length:n}, (_, i) => pasoFilaHTML(i, guardados[i] || '')).join('')}</div>
    <button type="button" class="btn sec chico" onclick="agregarPaso()">+ Agregar paso</button></div></div>`;
}
// esconde / muestra solo la caja de "Tu proceso" (lo que escribiste se queda guardado)
function toggleProceso(){

}
function agregarPaso(){ const l = $('listaPasos'), i = l.children.length; l.insertAdjacentHTML('beforeend', pasoFilaHTML(i, '')); $('inP' + i).focus(); }
const leerProceso = () => [...document.querySelectorAll('#listaPasos .pasoPartes')].map(fila => [...fila.children].map(x => {
    if(x.classList.contains('pt')) return x.value.trim();
    if(x.classList.contains('pfr')){ const n = x.querySelector('.pn').value.trim(), d = x.querySelector('.pd').value.trim(); return (n || d) ? `⟦${n}|${d}⟧` : ''; }
    if(x.classList.contains('pfa')){ const v = [...x.querySelectorAll('.pn, .pd')].map(i => i.value.trim().replace(/[|⟫]/g, ''));   // n1, d1, n2, d2 en orden de la pantalla
      return v.some(Boolean) ? `⟪${v.join('|')}|⟫` : ''; }
    return ''; }).filter(Boolean).join(' ')).filter(Boolean).join('\n');

/* ---------- retomar donde quedó (mate_sesion_v1) ---------- */
function guardarSesion(){
  guardar('mate_sesion_v1', { modId: modActual.id, esTemaFijo, capFijo, sesionHechos, sesionCorrectos,
    sesionCola, sesionPendientes, sesionFallos, temasEjemploVisto, sesionTotal, sesionIdx, sesionAbiertos, sesionVistos, ejActual, respondido, vioExpl, ordenSel, ultimoFeedback, ultimoProceso, ultimaEntrada });
  // los ejercicios ya sacados van aparte: si no caben, solo se pierde poder volver a los de antes. Las prácticas del examen se vuelven a armar solas (siempre salen igual)
  guardar('mate_sesion_ejs_v1', modActual.nuevaRonda ? [] : sesionEjs);
}
const borrarSesion = () => { try{ localStorage.removeItem('mate_sesion_v1'); localStorage.removeItem('mate_sesion_ejs_v1'); }catch(e){} };
function restaurarSesion(){
  const s = leer('mate_sesion_v1', null);
  if(!s || !MOD_POR_ID[s.modId] || !s.ejActual) return false;
  modActual = MOD_POR_ID[s.modId];
  esTemaFijo = s.esTemaFijo; capFijo = s.capFijo; sesionHechos = s.sesionHechos || 1;
  sesionCorrectos = s.sesionCorrectos || 0; sesionCola = s.sesionCola || [];
  sesionPendientes = s.sesionPendientes || []; sesionFallos = s.sesionFallos || [];
  temasEjemploVisto = s.temasEjemploVisto || {};
  sesionTotal = s.sesionTotal || sesionCola.length || SESION_TEMA;
  ejActual = s.ejActual; respondido = s.respondido; vioExpl = s.vioExpl;
  sesionIdx = s.sesionIdx != null ? s.sesionIdx : sesionHechos - 1;
  sesionAbiertos = s.sesionAbiertos || Object.fromEntries(Array.from({length:sesionHechos}, (_, i) => [i, true]));
  sesionVistos = s.sesionVistos || {};
  sesionEjs = modActual.nuevaRonda ? [] : (leer('mate_sesion_ejs_v1', []) || []); sesionEjs[sesionIdx] = ejActual;
  ordenSel = s.ordenSel || []; ultimoFeedback = s.ultimoFeedback || null;
  if(modActual.nuevaRonda && ejActual && ejActual.__n != null){   // las 30 del examen: sigue desde donde ibas
    // la explicación guardada puede ser de una versión vieja de la app: se vuelve a sacar la de ahora (la pregunta es la misma)
    modActual._sig = ejActual.__n; const fresco = modActual.gen(nivel);
    ejActual.explicacion = fresco.explicacion; ejActual.enunciado = fresco.enunciado;
  }
  ultimoProceso = s.ultimoProceso || '';
  ultimaEntrada = s.ultimaEntrada === undefined ? null : s.ultimaEntrada;
  pintarEjercicio();
  if(respondido && ultimoFeedback) mostrarFb(ultimoFeedback, false);   // ya contestó de verdad
  else if(vioExpl) _pintarVistaExplicacion();                          // solo vio la explicación, sigue pudiendo responder
  return true;
}

// calculadora — botón flotante, disponible en toda la app (incluso practicando) para
// comprobar una cuenta a mano; no toca ninguna variable de la práctica.
// calcTokens guarda la expresión tal como se escribe (números y signos alternados) y
// calcVal el número que se está escribiendo ahora mismo — nada se calcula hasta "=":
// antes calcVal se sobreescribía con el resultado parcial apenas se tocaba un segundo
// signo, y ese resultado se colaba en pantalla aunque el usuario no hubiera pedido "=".
let calcVal = '0', calcNuevo = false, calcTokens = [];
// cuentas ya resueltas (con "=") en el ejercicio actual — se reinicia con cada ejercicio nuevo
// (ver los 4 sitios que hacen "ultimoProceso = ''"), no al abrir/cerrar la calculadora, así que
// si la cierras y la vuelves a abrir en el MISMO ejercicio sigues viendo lo que ya hiciste.
let calcHist = [];   // [{expr, res}]
function _calcRenderHist(){
  const el = $('calcHist'); if(!el) return;
  el.style.display = calcHist.length ? 'block' : 'none';
  el.innerHTML = calcHist.slice().reverse().map(h =>
    `<button class="calcHistFila" onclick="calcVal='${h.res}';calcNuevo=false;_calcRender()">
      <span>${h.expr} =</span><b>${h.res}</b>
    </button>`).join('');
}
function _calcRender(){
  // justo después de tocar un signo (calcNuevo true) calcVal todavía guarda el operando
  // anterior, que ya está en calcTokens — mostrarlo de nuevo lo duplicaba en pantalla
  // ("5 × 5 + 5" antes de escribir el segundo 5). Se oculta hasta que se escriba uno nuevo.
  const ocultarVal = calcNuevo && calcTokens.length;
  $('calcPantalla').textContent = calcTokens.length
    ? calcTokens.join(' ') + (ocultarVal ? '' : ' ' + calcVal)
    : calcVal;
}
function abrirCalc(){
  calcVal = '0'; calcNuevo = false; calcTokens = [];
  _calcRender();
  _calcRenderHist();
  // "Usar" aparece si hay al menos un campo de respuesta donde ponerlo (num, frac, mixto,
  // ángulos con figura...); los pasos de "Tu proceso" están en #zonaProceso, fuera de #zonaEntrada,
  // así que este selector no los toma.
  $('calcUsarBtn').style.display = $('zonaEntrada').querySelector('input.campo') ? '' : 'none';
  $('calcOv').style.display = 'flex';
}
function cerrarCalc(){ $('calcOv').style.display = 'none'; }
// Llena el primer campo VACÍO (arriba antes que abajo, entero antes que la fracción...,
// según el orden en que aparecen en pantalla); si ya están todos llenos, empieza de nuevo
// por el primero — así una sola cuenta sirve para ir llenando numerador y denominador,
// las dos partes de un mixto, o los dos ángulos, con dos o tres toques de "Usar".
function calcUsar(){
  if(calcVal === 'Error') return;
  const campos = [...$('zonaEntrada').querySelectorAll('input.campo')];
  if(!campos.length) return;
  (campos.find(c => c.value === '') || campos[0]).value = calcVal;
  cerrarCalc();
}
function calcDigito(d){
  if(calcNuevo || calcVal === '0'){ calcVal = d; calcNuevo = false; }
  else if(calcVal.length < 12) calcVal += d;
  _calcRender();
}
function calcPunto(){
  if(calcNuevo){ calcVal = '0.'; calcNuevo = false; }
  else if(calcVal.indexOf('.') === -1) calcVal += '.';
  _calcRender();
}
function calcSigno(){
  calcVal = calcVal.startsWith('-') ? calcVal.slice(1) : (calcVal === '0' ? '0' : '-'+calcVal);
  _calcRender();
}
function calcPorcentaje(){
  calcVal = _calcFormato(parseFloat(calcVal) / 100);
  _calcRender();
}
function calcClear(){
  calcVal = '0'; calcNuevo = false; calcTokens = [];
  _calcRender();
}
function _calcOperar(a, b, op){
  if(op === '+') return a + b;
  if(op === '-') return a - b;
  if(op === '×') return a * b;
  if(op === '÷') return b === 0 ? NaN : a / b;
}
function _calcFormato(n){
  if(!isFinite(n)) return 'Error';
  return String(Math.round(n * 1e8) / 1e8);   // recorta el ruido de coma flotante
}
function calcOp(op){
  // si ya había un signo pendiente y no se escribió número nuevo, el usuario solo está
  // cambiando de opinión sobre el signo — se reemplaza, no se apila
  if(calcTokens.length && calcNuevo) calcTokens[calcTokens.length-1] = op;
  else calcTokens.push(calcVal, op);
  calcNuevo = true;
  _calcRender();
}
function calcIgual(){
  if(!calcTokens.length) return;
  const nums = calcTokens.filter((_,i)=>i%2===0).map(parseFloat).concat(parseFloat(calcVal));
  const ops = calcTokens.filter((_,i)=>i%2===1);
  let total = nums[0];
  for(let i=0; i<ops.length; i++) total = _calcOperar(total, nums[i+1], ops[i]);
  const expr = calcTokens.concat(calcVal).join(' ');
  calcVal = _calcFormato(total);
  calcHist.push({ expr, res: calcVal });
  calcNuevo = true; calcTokens = [];
  _calcRender();
  _calcRenderHist();
}
// teclado físico para la calculadora — antes solo funcionaba a clics, incómodo en la compu.
// Solo actúa mientras el overlay está abierto, así que no interfiere con Enter en los
// inputs de la práctica ni con ningún otro atajo de la página.
document.addEventListener('keydown', e => {
  if($('calcOv').style.display !== 'flex') return;
  if(/^[0-9]$/.test(e.key)) calcDigito(e.key);
  else if(e.key === '.' || e.key === ',') calcPunto();
  else if(e.key === '+') calcOp('+');
  else if(e.key === '-') calcOp('-');
  else if(e.key === '*') calcOp('×');
  else if(e.key === '/'){ e.preventDefault(); calcOp('÷'); }   // '/' abre la búsqueda rápida en Firefox
  else if(e.key === '%') calcPorcentaje();
  else if(e.key === 'Enter' || e.key === '=') calcIgual();
  else if(e.key === 'u' || e.key === 'U') calcUsar();
  else if(e.key === 'Escape') cerrarCalc();
  else if(e.key === 'Backspace'){ calcVal = calcVal.length>1 ? calcVal.slice(0,-1) : '0'; _calcRender(); }
  else return;
  e.preventDefault();
});
// Enter para "Siguiente ejercicio" una vez que ya se contestó — se busca el botón en vez de
// mirar la variable `respondido` (que queda pegada en true al navegar a otra pantalla) para
// no disparar esto por accidente, por ejemplo al escribir el nombre de un grupo nuevo. Cubre
// también los ejercicios de botones (sí/no, opciones, comparar) que no tienen ningún input
// donde colgar un listener propio.
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if($('calcOv').style.display === 'flex') return;   // la calculadora ya maneja su propio Enter
  if(e.target && /^inP\d+$/.test(e.target.id || '')){   // Enter en un paso: al siguiente paso (o agrega uno), no avanza
    e.preventDefault(); const sig = $('inP' + (+e.target.id.slice(3) + 1)); if(sig) sig.focus(); else agregarPaso(); return;
  }
  const btnSig = $('zonaFb') && $('zonaFb').querySelector('button.btn.amar');
  if(!btnSig) return;
  e.preventDefault();
  _siguienteEjercicio();
});

let _swReloadPendiente = false;   // ver el listener 'controllerchange' en ARRANQUE
function ir(pantalla, arg, continuar){
  if(_swReloadPendiente){ window.location.reload(); return; }
  cerrarMenuGrupos();   // cambiar de pantalla no debe dejar la tarjeta flotando encima
  cerrarCalc();         // ni la calculadora abierta
  window.scrollTo(0,0);
  if(pantalla !== 'practica') borrarSesion();   // salir de la práctica = ronda terminada
  // salir de examen/errores sin terminar no debe dejar el modo "pegado" — si no, el modo
  // práctica normal queda contaminado (responder() y el botón "Siguiente" siguen esas reglas)
  if(pantalla !== 'examen'){ examen = null; clearInterval(_examenTimerIv); }
  if(pantalla !== 'errores') modoErrores = false;
  modoRepasoRonda = false;   // no hay pantalla dedicada — cualquier ir() cancela el repaso de la ronda
  // _pantallaActual solo debe apuntar a Inicio/Progreso mientras de verdad estás ahí — si no,
  // queda "pegado" ahí y un cambio remoto de sync te saca de la práctica solo, a media ronda
  // (bug real: pasaba en cualquier pantalla a la que entraras después de haber visto Inicio).
  if(pantalla !== 'inicio' && pantalla !== 'stats') _pantallaActual = null;
  if(pantalla === 'inicio')   return pantallaInicio();
  if(pantalla === 'temas')    return pantallaTemas();
  if(pantalla === 'practica') return nuevoEjercicio(arg, continuar);
  if(pantalla === 'stats')    return pantallaStats();
  if(pantalla === 'ajustes')  return pantallaAjustes();
  if(pantalla === 'tema')     return pantallaTema();
  if(pantalla === 'clase')    return pantallaClase();
  if(pantalla === 'elegir')   return pantallaElegirTemas();
  if(pantalla === 'grupos')   return pantallaGrupos();
  if(pantalla === 'sync')     return pantallaSync();
  if(pantalla === 'ia')       return pantallaIA();
  if(pantalla === 'examen')   return iniciarExamen();
  if(pantalla === 'errores')  return pantallaErrores();
  if(pantalla === 'ayLeer')   return pantallaAyLeer(arg);
  if(pantalla === 'ayGaleria') return pantallaAyGaleria();
}

/* ══════════════════════════════════════════════════════════
   IA (Gemini) — OPCIONAL. Sin clave no se dibuja ningún botón de IA y la app queda igual.
   La IA solo EXPLICA, COMPARA y SUGIERE: nunca genera ejercicios, nunca decide si una respuesta
   está bien (eso es verificar()) y nunca toca stats/errores/racha. Todo lo que devuelve se valida

// responseSchema). Lanza un Error cuyo message es un aviso listo para mostrar.
async function _aiJSON(prompt, schema, extraParts){
  const key = getAiKey();
  if(!key) throw new Error('Primero pega tu clave en Ajustes → Inteligencia artificial');
  const body = JSON.stringify({
    contents: [{ parts: [{ text: prompt }, ...(extraParts || [])] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: schema }
  });
  let r;
  const now = Date.now();
  const disponibles = AI_MODELS.filter(m => !(_aiSkipUntil[m] > now));
  const lista = disponibles.length ? disponibles : AI_MODELS;   // si todos están en pausa, se prueban igual
  let reintentado = false, redReintentada = false;
  for(let i = 0; i < lista.length; i++){
    const model = lista[i], ultimo = i === lista.length - 1;
    try{
      // 10 s por modelo (un 503 saturado llegó a tardar 13 s); el último espera 30 s
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: 'POST',
        headers: { 'x-goog-api-key': key, 'Content-Type': 'application/json' },
        body,
        signal: AbortSignal.timeout(ultimo ? 30000 : 10000)
      });
    }catch(e){
      if(e.name === 'TimeoutError'){
        if(!ultimo){ _aiSkipUntil[model] = now + AI_SKIP_MS; continue; }
        throw new Error('La IA tardó demasiado — inténtalo de nuevo');
      }
      // Cualquier fallo de red cae aquí, no solo "sin internet": un microcorte al cambiar de wifi a datos
      // pasa en un segundo. Se reintenta una vez y se prueba el siguiente modelo antes de rendirse.
      if (!redReintentada) { redReintentada = true; i--; await new Promise(ok => setTimeout(ok, 1200)); continue; }
      if (!ultimo) continue;
      throw new Error(navigator.onLine === false ? 'Sin señal — inténtalo cuando tengas internet' : 'No se pudo conectar con la IA — inténtalo de nuevo');
    }
    // el último no tiene a cuál pasar: un 500/503 suele ser un pico de un segundo, se reintenta una vez
    if(ultimo && [500, 503].includes(r.status) && !reintentado){ reintentado = true; i--; await new Promise(ok => setTimeout(ok, 1500)); continue; }
    if(![404, 429, 500, 503].includes(r.status)) break;
    _aiSkipUntil[model] = now + AI_SKIP_MS;
  }
  if(r.status === 429) throw new Error('Llegaste al límite gratis de la IA por hoy');
  if(!r.ok){
    // un 400 también sale por una foto que Google no puede leer — solo es culpa de la clave si el mensaje lo dice
    const err = await r.json().catch(() => ({}));
    const msg = JSON.stringify(err.error || {});
    if(r.status === 401 || r.status === 403 || /API.?key|API_KEY/i.test(msg)) throw new Error('La clave de IA no funciona — revísala en Ajustes');
    throw new Error(r.status === 400 ? 'La IA no pudo con eso — prueba con otra foto o texto' : 'La IA no respondió — inténtalo de nuevo');
  }
  const d = await r.json();
  const txt = (d.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');

  catch(e){ throw new Error('La IA no respondió bien — inténtalo de nuevo'); }
}
// Foto → { mime, data } en base64, achicada (una foto del teléfono pesa varios MB). Fondo blanco:
// un PNG transparente pasado a JPEG sale con fondo NEGRO y la letra negra desaparece.
async function _imgParaIA(file, max){
  max = max || 1024;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return { mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
  }catch(e){
    const data = await new Promise((ok, fail) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = fail; fr.readAsDataURL(file); });
    return { mime: file.type || 'image/jpeg', data };
  }
}

    const img = await _imgParaIA(file, cfg.fotoMax);
    if (!_aiGen || _aiGen.clave !== clave) return;   // cambió de chat mientras se achicaba
    _aiGenImg = img; _aiGenFotoUI();
  } catch (e) { showToast('No se pudo leer la foto'); }
}
async function aiGenEnviar(texto) {
  _dictarParar(true);   // si el micrófono seguía encendido, se apaga (el texto ya está en el campo)
  const g = _aiGen; if (!g) return;
  const msgs = _aiGenMsgs[g.clave];
  if (!msgs || msgs.some(m => m.cargando)) return; // una a la vez
  const inp = document.getElementById('aigInput');
  const img = _aiGenImg;
  let q = (typeof texto === 'string' ? texto : (inp && inp.value || '')).trim().slice(0, 300);
  if (!q && !img) { if (inp) inp.focus(); return; }
  if (!q) q = 'Mira la foto.';
  if (inp) inp.value = '';
  _aiGenImg = null; _aiGenFotoUI();
  // lo que se dijo antes (sin errores ni "pensando"), para que "¿y por qué?" se entienda
  const previos = msgs.filter(m => !m.cargando && !m.error).slice(-8).map(m => ({ quien: m.rol === 'yo' ? 'estudiante' : 'tutora', texto: _aiGenTxt(m) }));
  msgs.push({ rol: 'yo', texto: q, foto: !!img }, { rol: 'ia', cargando: true });
  const pos = msgs.length - 1;
  _aiGenRender();
  let resp, efecto = null;
  try {
    const r = await _AIG[g.f].enviar(q, previos, g.ctx, img);
    resp = { rol: 'ia', texto: r.texto, textoFn: r.textoFn, acciones: r.acciones || [] };
    efecto = r.efecto || null;
  } catch (e) {
    resp = { rol: 'ia', error: e.message, q, img };
  }
  if (_aiGenMsgs[g.clave] !== msgs) return;   // empezó una conversación nueva mientras la IA pensaba
  msgs[pos] = resp;
  if (efecto) efecto();
  if (_aiGen && _aiGen.clave === g.clave) _aiGenRender();   // si abrió otro chat mientras tanto, este queda guardado y se ve al volver
}

// ronda (ver temasEjemploVisto en nuevoEjercicio), tanto si la ronda es de un tema puntual como
// si es una mezcla (ahí, cada tema nuevo que aparece trae su propio ejemplo antes de empezar).
// Genera su propio ejemplo aparte — no toca modActual/ejActual, que ya están listos con el
// ejercicio real esperando a que se toque "Continuar".

// saca el ejercicio del puesto i de la ronda (lo genera la primera vez; después es el mismo). arg = id del tema si la ronda es de un tema fijo
function _ejDelPuesto(i, arg){
  if(sesionEjs[i]) return sesionEjs[i];
  const mod0 = esTemaFijo ? MOD_POR_ID[arg] : null;
  let mod, ej;
  if(mod0 && mod0.nuevaRonda){          // las 30 del examen: el puesto i es siempre la pregunta i
    mod = mod0; mod._sig = i % mod.banco; ej = mod.gen(nivel);
  } else {
    const nuevo = !sesionAbiertos[i];
    if(nuevo) sesionPendientes.forEach(p => p.esperar--);
    const repite = nuevo && sesionPendientes.find(p => p.esperar <= 0);
    if(repite){
      sesionPendientes.splice(sesionPendientes.indexOf(repite), 1);
      mod = MOD_POR_ID[repite.modId] || modActual; ej = repite.ej;
    } else if(mod0){
      mod = mod0; ej = mod.gen(nivel);
    } else {
      if(!sesionCola.length) sesionCola = construirCola(capFijo);   // red de seguridad, no debería pasar
      mod = MOD_POR_ID[sesionCola.shift()]; ej = mod.gen(nivel);
    }
  }
  ej.__mod = mod.id;
  sesionAbiertos[i] = true; sesionHechos = Object.keys(sesionAbiertos).length;
  return sesionEjs[i] = ej;
}
// pone en pantalla (sin pintar) el puesto i, desde cero
function _mostrarPuesto(i, arg){
  ejActual = _ejDelPuesto(i, arg);
  modActual = MOD_POR_ID[ejActual.__mod] || modActual;
  sesionIdx = i;
  vioExpl = !!sesionVistos[i];   // ya contestado o con la explicación vista: si lo repite, no cuenta otra vez
  respondido = false; _reintento = vioExpl; ordenSel = []; ultimoFeedback = null; ultimoProceso = ''; ultimaEntrada = null; calcHist = [];
}
function nuevoEjercicio(arg, continuar){
  // límite real: al llegar al final de la ronda, no se sigue solo — hay que elegir "seguir" o "terminar"
  if(continuar && sesionIdx + 1 >= sesionTotal) return pantallaRondaCompleta();
  if(!continuar){                       // ronda nueva: arma la cola y fija el tamaño
    sesionHechos = 0; sesionCorrectos = 0; sesionPendientes = []; sesionFallos = []; temasEjemploVisto = {};
    sesionEjs = []; sesionAbiertos = {}; sesionVistos = {}; sesionIdx = -1;
    esTemaFijo = typeof arg !== 'number' && !!arg;
    capFijo = typeof arg === 'number' ? arg : null;
    sesionCola = esTemaFijo ? [] : construirCola(capFijo);
    sesionTotal = esTemaFijo ? (MOD_POR_ID[arg].banco || SESION_TEMA) : sesionCola.length;   // banco = temas de preguntas fijas (Repaso de ayudante): una ronda las trae todas
    if(esTemaFijo && MOD_POR_ID[arg].nuevaRonda) MOD_POR_ID[arg].nuevaRonda();               // las 30 del examen: cada ronda empieza en la pregunta 1
  }
  _mostrarPuesto(sesionIdx + 1, arg);
  if(!temasEjemploVisto[modActual.id] && !modActual.banco){   // temas de preguntas fijas (Repaso de ayudante, las 30 del examen): sin "ejemplo resuelto", sería gastar una pregunta
    temasEjemploVisto[modActual.id] = true;
    guardarSesion();
    return _pintarEjemploTema(modActual);
  }
  pintarEjercicio();
  guardarSesion();
}

function leerEntrada(ej){
  switch(ej.tipo){
    case 'num':   return $('inNum').value;
    case 'texto': return $('inTexto').value;
    case 'frac':  return { n:$('inN').value, d:$('inD').value };
    case 'mixto': return { e:$('inE').value, n:$('inN').value, d:$('inD').value };
    case 'orden': return ordenSel.slice();
    case 'angulo2': return { a:$('inA2').value, b:$('inA3').value };
    case 'multi': return Object.assign(ej.campos.map((_,i) => $('inM'+i).value), { f: ej.campos.map((_,i) => ($('inF'+i) || {}).value || '') });
    case 'basexp': return { b:$('inBase').value, e:$('inExp').value, v:$('inVal').value };
    case 'coefvar': return { coef:$('inCoef').value, variable:$('inVariable').value };
  }
}

function responder(valor){
  if(examen) return responderExamen(valor);
  if(respondido) return;
  const ent = (valor !== undefined) ? valor : leerEntrada(ejActual);
  if(ejActual.tipo === 'orden' && ent.length < ejActual.opciones.length){
    return mostrarFb({ ok:false, msg:'Toca las tres fracciones, en el orden que pide.' }, true);
  }
  const res = verificar(ejActual, ent);
  if(res.vacio) return mostrarFb({ ok:false, msg:'Te falta escribir la respuesta.' }, true);

  respondido = true;
  ultimoFeedback = res;
  ultimoProceso = leerProceso();
  ultimaEntrada = ent;
  if(modoErrores){
    // acierto → sale de la lista. Fallo → se manda al final en vez de quedarse en el frente,
    // o "Siguiente ejercicio" volvía a mostrar EXACTAMENTE la misma pregunta que acabas de fallar.
    // Por índice de _errorActual, no errores[0] — errores mezcla TODAS las materias, así que la
    // que se está repasando no siempre está al frente del array completo.
    const i = errores.indexOf(_errorActual);
    if(i >= 0){ if(res.ok){ errores.splice(i,1); } else { errores.push(errores.splice(i,1)[0]); } }
    guardar('mate_errores_v1', errores);
  } else if(modoRepasoRonda){
    // mismo vaivén que modoErrores pero sobre la copia de trabajo de sesionFallos —
    // no toca `errores` ni las estadísticas, es solo repetir lo que ya se falló en esta ronda
    if(res.ok){ colaRepasoRonda.shift(); } else { colaRepasoRonda.push(colaRepasoRonda.shift()); }
  } else {
    sesionVistos[sesionIdx] = true;
    if(!vioExpl) anotar(ejActual.__mod, res.ok);
    if(!vioExpl && res.ok) sesionCorrectos++;
    if(!vioExpl && !res.ok){
      _registrarError(ejActual);
      sesionFallos.push({ modId: ejActual.__mod, nombre: modActual.nombre, ej: ejActual });
      if(repetirFallo) _programarRepeticion();
    }
    guardarSesion();
  }
  mostrarFb(res, false);
}

// Una línea que empieza con "TRUCO:" no es un paso más: sale de la lista numerada y se
// pinta como recuadro aparte al final (atajo para resolverlo más rápido la próxima vez).
// explicaciones de líneas sueltas (temas sin receta propia) → misma forma que receta(): cada línea de texto
// abre un paso CON TÍTULO (se deduce de lo que dice la línea o de la nota del dibujo), los dibujos van con el
// paso de arriba, la última "→ …" es la Respuesta y "Comprobación/Verificación" va a Comprueba.
// Lo aplica el envoltorio de gen() de los módulos de Álgebra (tras MOD_POR_ID).
const _TIPO_SVG = [[/Dividir entre una fracción es/, 'volt'], [/Se multiplica arriba con arriba/, 'mult'], [/¿Por qué \d/, 'simp'], [/Entero × denominador \+ numerador/, 'imp'],
  [/Se multiplica en X/, 'cruz'], [/El número de afuera multiplica/, 'dist'], [/Abajo: [\s\S]*Arriba también/, 'conv'], [/en los DOS lados|Para dejar la letra sola|Para quitar lo que está/, 'ambos'],
  [/Cada letra de arriba/, 'tach'], [/Lo de arriba \(/, 'rec'], [/sobran/, 'amix'], [/La línea va de|Arriba, lo que le falta/, 'ang']];
const _TIT_SVG = { volt:'Voltea la segunda fracción (÷ pasa a ×)', mult:'Multiplica arriba con arriba y abajo con abajo', simp:'Simplifica: divide arriba y abajo entre el mismo número', imp:'Pasa el mixto a fracción impropia',
  cruz:'Multiplica en cruz', dist:'Reparte el número de afuera a cada término', conv:'Pasa la fracción al denominador común', ambos:'Haz lo contrario en los DOS lados', tach:'Tacha las letras iguales de arriba y de abajo',
  rec:'Voltea la fracción', amix:'Pasa a número mixto', ang:'Ubica el ángulo en la línea' };
const _ERR_SVG = { volt:'voltear la primera fracción (o las dos): se voltea SOLO la segunda.', cruz:'multiplicar en paralelo (arriba con arriba): en una proporción se multiplica en X.',
  conv:'sumar o restar también los de abajo: el de abajo no se suma, solo se iguala con el MCM.', imp:'sumar el entero y el de arriba sin multiplicar antes el entero por el de abajo.',
  ambos:'hacer la operación solo en un lado: va en los DOS lados.', dist:'repartir el número solo al primer término.', simp:'dejar la fracción sin simplificar: hay que dividir entre el número más grande que entre en los dos.',
  mult:'olvidar simplificar al final, o los signos (dos negativos dan positivo).' };
const _tipoSvg = l => { const t = l.replace(/<svg[\s\S]*?<\/svg>/g, ''); for(const [re, k] of _TIPO_SVG) if(re.test(t)) return k; return ''; };
// títulos para las frases que más se repiten (el cuerpo es la línea entera)
const _REGLAS_TIT = [[/^[Ss]e (dividen|multiplican) ambos lados|^[Ss]e (suma|resta) .*(AMBOS|ambos) lados/, 'Haz lo contrario en los DOS lados'], [/^El \d+: (está|no está) en todos/, 'Escoge los primos que están en TODOS (con las MENOS veces)'], [/^\d+ = \d+[²³⁴⁵⁶⁷⁸⁹]?( × \d+[²³⁴⁵⁶⁷⁸⁹]?)*$/, 'Factoriza cada número'],
  [/ya tienen el mismo de abajo|el de abajo es el mismo|MISMO denominador/, 'Suma los de arriba (el de abajo se queda igual)'],
  [/Los números están en el mismo orden|Los factores siguen en el mismo orden|^La propiedad (conmutativa|asociativa)/, 'Mira qué cambió entre los dos lados del ='],
  [/ya tiene el denominador común/, 'Esa fracción ya tiene el denominador común (se queda igual)'], [/dividir entre \d+ es multiplicar por/, 'Dividir es multiplicar por el opuesto'], [/es .* volteada \(su recíproco\)/, 'Comprueba con el recíproco'], [/^Para restar una fracción de/, 'Parte el entero en pedazos iguales'],
  [/^El recíproco .*intercambiando/i, 'Intercambia el de arriba con el de abajo'], [/^Dividir entre una fracción es multiplicar/i, 'Voltea la segunda fracción'],
  [/^Los productos cruzados son/, 'Compara los productos cruzados'], [/^se traduce el problema a una ecuación/i, 'Traduce el problema a una ecuación'],
  [/^se multiplican ambos lados por el recíproco/i, 'Multiplica los DOS lados por el recíproco'], [/identidad de la (suma|multiplicación)|tiene un recíproco|tiene un opuesto|intercambiaron de lugar/, 'Identifica la propiedad'],
  [/el recíproco de un número es el que multiplicado/, 'Recuerda qué es el recíproco'], [/^la proporción sale directo de la tabla/i, 'Arma la proporción con la tabla'],
  [/^Primero se quita el /, 'Quita el término que suma o resta (en los DOS lados)'], [/^Ahora se quita el coeficiente/, 'Quita el coeficiente (en los DOS lados)'],
  [/^Para simplificar, un mismo número tendría/, 'Revisa si se puede simplificar'], [/son términos semejantes/, 'Junta los términos semejantes'], [/el signo negativo se conserva/, 'Voltea y conserva el signo']];
const _TIT_MAP = { 'Arriba':'Resuelve lo de arriba', 'Abajo':'Resuelve lo de abajo', 'Signos':'Mira los signos', 'Dividir':'Divide', 'Orden':'Recuerda el orden de operaciones', 'Se resuelve':'Resuelve',
  '¿hace sentido? Sí':'Revisa que tenga sentido', 'Arriba, de dos en dos':'Suma los de arriba, de dos en dos', 'Fórmula y sustitución':'Escribe la fórmula y pon los números', 'La raya larga es una división':'La raya larga es una división (÷)' };
// título y cuerpo de una línea de texto
function _titulo(l){
  l = l.replace(/^(Paso \d+ — |[IVX]+\. )/, '');
  for(const [re, t] of _REGLAS_TIT) if(re.test(l)) return { t, b:l };
  const r = _titulo2(l); if(_TIT_MAP[r.t]) r.t = _TIT_MAP[r.t]; return r;
}
function _titulo2(l){
  const limpia = s => s.replace(/[.:]+\s*$/, '').trim(), mayus = s => s.charAt(0).toUpperCase() + s.slice(1);
  if(/^Los de abajo \(/.test(l)) return { t:'Busca el MCM de los de abajo', b:l };
  if(/^(Se pasan a impropias|Mixtos a fracción impropia)/.test(l)) return { t:'Pasa los mixtos a fracción impropia', b:'' };
  const c = l.indexOf(':');
  if(c > 3 && c < 90 && !/[\d=×÷]/.test(l.slice(0, c)) && !/^[a-z]\. /.test(l)) return { t:mayus(limpia(l.slice(0, c))), b:l.slice(c + 1).trim() };
  const inc = /^([a-z]\.) (.+?\.)\s+(.+)$/.exec(l); if(inc && inc[2].length < 90) return { t:`${inc[1]} ${limpia(inc[2])}`, b:inc[3] };
  const plana = l.replace(/<[^>]+>/g, '');
  if(plana.length <= 70 && /^(Ahora|Luego|Después|Primero|Por último|Al final)\b/.test(plana)) return { t:mayus(limpia(plana)), b:'' };
  if(plana.length <= 70 && /[=÷×+−\-]/.test(plana) && /\d/.test(plana) && !/ (se|es|el|la|los|las|que|de|del|para|porque) /.test(plana)) return { t:'Haz la cuenta', b:l };
  if(plana.length <= 70) return { t:mayus(limpia(l)), b:'' };
  const f = /^(.+?[.!?])\s+(.+)$/.exec(l); if(f && f[1].length <= 90) return { t:limpia(f[1]), b:f[2] };
  // sin título claro: las primeras palabras de la línea hacen de título (la línea completa se queda abajo)
  const ini = plana.slice(0, 62).replace(/\s+\S*$/, '').replace(/[,;:(\s]+$/, '');
  return { t: ini.length >= 12 ? mayus(ini) + '…' : '', b:l };
}
// "Qué te piden": la instrucción del enunciado (o su pregunta), sin el rótulo del libro ni las fracciones
function _pideDe(enun){
  let t = String(enun || '').replace(/<svg[\s\S]*?<\/svg>/g, ' ').replace(/<br\s*\/?>/g, '. ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(/^(Repaso|Autoevaluación) del capítulo \d+ · Ejercicio \d+ \(E-Book, pág\. \d+\)\s*/, '');
  t = t.replace(/^[\s.:]+/, '');
  const q = /¿[^?]*\?/.exec(t); let s = q ? q[0] : t.split(/\s*:\s*|\.\s+/)[0];
  if(!q && !/^(Halla|Calcula|Determina|Simplifica|Resuelve|Multiplica|Divide|Suma|Resta|Escribe|Efectúa|Convierte|Identifica|Cambia|Utiliza|Completa|Evalúa|Expresa|Usa|Reduce|Traduce|Indica)/.test(s)){ const o = t.split(/(?<=[.:])\s+/).find(x => /^(Halla|Calcula|Determina|Simplifica|Resuelve|Multiplica|Divide|Suma|Resta|Escribe|Efectúa|Convierte|Identifica|Cambia|Utiliza|Completa|Evalúa|Expresa|Usa|Reduce|Traduce|Indica)/.test(x)); if(o) s = o; }
  s = s.replace(/\s+([,.;:?!])/g, '$1').trim(); if(s.length > 160) s = s.slice(0, 157).replace(/\s+\S*$/, '') + '…';
  return s.replace(/[.:]+$/, '');
}
const _COMP_SVG = { volt:'multiplica tu resultado por la segunda fracción: tiene que dar la primera.', conv:'resta de vuelta: tu resultado menos una de las fracciones tiene que dar la otra.',
  simp:'multiplica arriba y abajo de tu respuesta por el número entre el que dividiste: tiene que volver a la fracción de antes.', imp:'divide el de arriba entre el de abajo: tiene que darte el entero y lo que sobra del mixto.',
  ambos:'pon tu respuesta en la ecuación original: los dos lados tienen que dar igual.', mult:'estima: si un factor es menor que 1, el resultado es más chico que el otro factor.' };
function aReceta(lista, enun){
  const esT = l => typeof l === 'string' && /^TRUCO:/.test(l), resto = lista.filter(l => l && !esT(l)), L = [], kinds = [];
  let fin = -1; for(let i = resto.length - 1; i >= 0; i--) if(/^→/.test(resto[i])){ fin = i; break; }
  let n = 0, comp = '', prevK = null, marcado = false, ultTit = '';
  resto.forEach((l, i) => {
    if(i === fin) return;
    if(!comp && /^(Comprobación|Verificación)/.test(l)){ comp = l.replace(/^(Comprobación|Verificación)\s*:?\s*/, ''); return; }
    if(typeof l === 'string' && l.startsWith('▸ ')){ L.push(`§paso|Paso ${++n} — ${l.slice(2)}`); prevK = ''; marcado = true; return; }
    if(marcado && !/^([a-z]\.|[IVX]+\.) /.test(l) && !/:\s*$/.test(l) && !/^(Se despeja|Ahora|Luego|Primero|Por último|Productos|Proporción|Tabla|Fórmula|Verificación|Comprobación|Paso \d|Dividir:|Lado)/.test(l)){ if(l.startsWith('<svg')){ const k = _tipoSvg(l); if(k) kinds.push(k); } L.push(l); return; }
    marcado = false;
    const dib = l.startsWith('<svg');
    if(dib){ const k = _tipoSvg(l); if(k) kinds.push(k);
      if(n && prevK !== null && prevK === k){ L.push(l); return; }                // varios dibujos iguales seguidos: un solo paso
      if(n && prevK === '' ){ L.push(l); prevK = k || ''; return; }                // dibujo suelto después de un texto: va con ese texto
      L.push(`§paso|Paso ${++n} — ${_TIT_SVG[k] || 'Mira el dibujo'}`, l); prevK = k; return; }
    if(n && /^→/.test(l)){ L.push(l); return; }
    const { t, b } = _titulo(l);
    if(t && t === ultTit && L.length){ if(b) L.push(b); prevK = ''; return; }          // mismo título que el paso de arriba: va dentro de ese paso
    L.push(`§paso|Paso ${++n}${t ? ' — ' + t : ''}`); if(b) L.push(b); prevK = ''; ultTit = t;
  });
  if(fin >= 0) L.push(`§resp|${resto[fin].replace(/^→\s*/, '')}`);
  if(comp) L.push(`§comp|${comp}`);
  const k1 = ['volt','cruz','conv','imp','ambos','dist','simp','mult'].find(k => kinds.includes(k));
  if(!comp && kinds.includes('ambos')) L.push(`§comp|${_COMP_SVG.ambos}`);
  if(k1) L.push(`§error|${_ERR_SVG[k1]}`);
  const pide = _pideDe(enun); if(pide) L.unshift(`§pide|${pide}${/[?!]$/.test(pide) ? '' : '.'}`);
  return [...L, ...lista.filter(esT)];
}
// explicación con forma de RECETA (líneas '§', ver receta()): se ve "Qué te piden" y el Paso 1; los demás
// pasos se abren de a uno con "Siguiente paso", o todos con "Ver todo". La receta para el examen sale al final.
function explReceta(lista){
  const grupos = [], fin = [], trucos = [];
  let pide = '', g = null;
  lista.filter(Boolean).forEach(l => {
    if(/^TRUCO:/.test(l)) return trucos.push(l.replace(/^TRUCO:\s*/, ''));
    const m = /^§(\w+)\|([\s\S]*)$/.exec(l);
    if(!m) return (g ? g.l : fin).push(l);
    const [, k, t] = m;
    if(k === 'pide') pide = t;
    else if(k === 'paso') grupos.push(g = { t, l:[] });
    else { g = null; fin.push(`<div class="rFin"><b>${{ resp:'Respuesta', comp:'Comprueba', error:'Error común' }[k]}:</b> ${t}</div>`); }
  });
  const id = 'rc' + (++_dgId);
  const memo = trucos.map(t => { const r = /^Receta para el examen:\s*/.test(t);
    t = t.replace(/^Receta para el examen:\s*/, '');
    return `<div class="truco"><b>${r ? 'RECETA PARA EL EXAMEN' : 'TRUCO PARA QUE SEA MÁS FÁCIL'}</b>${r ? t.replace(/ (\d+\)) /g, '<br>$1 ').replace(/ (Ejemplo con este mismo:)/, '<br>$1') : t}</div>`; }).join('');
  return `<div class="receta" id="${id}">` +
    (pide ? `<div class="rPide"><b>Qué te piden:</b> ${pide}</div>` : '') +
    grupos.map((p, i) => `<div class="rPaso${i ? ' oculto' : ''}"><div class="rTit">${p.t}</div>${p.l.map(x => typeof x === 'string' && x.startsWith('▸ ') ? `<div class="rSub">${x.slice(2)}</div>` : `<div class="rLin">${x}</div>`).join('')}</div>`).join('') +
    `<div class="rPaso rFinal oculto">${fin.join('')}${memo}</div>` +
    `<div class="rNav"><div class="rBtns"><button type="button" class="btn sec chico rAnt" onclick="rAnt('${id}')" disabled>◀ Anterior</button><button type="button" class="btn amar chico rSig" onclick="rSig('${id}')">Siguiente paso ▶</button></div>` +
    `<div class="rPie"><span class="rPag">Paso 1 de ${grupos.length + 1}</span><button type="button" class="rModo" onclick="rModo('${id}')">Ver todo</button></div></div></div>`;
}
// la explicación cambia de PÁGINA: se ve un solo paso a la vez (no se va alargando); "Ver todo" los muestra todos
function _rVer(c, i){
  const ps = c.querySelectorAll('.rPaso'); i = Math.max(0, Math.min(ps.length - 1, i)); c.dataset.i = i; c.dataset.modo = 'pag';
  ps.forEach((p, k) => p.classList.toggle('oculto', k !== i));
  const pd = c.querySelector('.rPide'); if(pd) pd.classList.toggle('oculto', i !== 0);
  c.querySelector('.rAnt').disabled = i === 0; c.querySelector('.rSig').disabled = i === ps.length - 1;
  c.querySelector('.rPag').textContent = i === ps.length - 1 ? 'Resultado' : `Paso ${i + 1} de ${ps.length}`;
  c.querySelector('.rModo').textContent = 'Ver todo';
  c.querySelector('.rBtns').style.display = '';
}
function rSig(id){ const c = document.getElementById(id); if(!c) return; _rVer(c, (+c.dataset.i || 0) + 1); c.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
function rAnt(id){ const c = document.getElementById(id); if(!c) return; _rVer(c, (+c.dataset.i || 0) - 1); c.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
function rTodo(id){ const c = document.getElementById(id); if(!c) return;
  c.dataset.modo = 'todo'; c.querySelectorAll('.rPaso, .rPide').forEach(p => p.classList.remove('oculto'));
  c.querySelector('.rBtns').style.display = 'none'; c.querySelector('.rPag').textContent = 'Todos los pasos'; c.querySelector('.rModo').textContent = 'Ver por pasos'; }
function rModo(id){ const c = document.getElementById(id); if(!c) return; if(c.dataset.modo === 'todo') _rVer(c, 0); else rTodo(id); }
function explPasos(lista, sinNumeros){ return _sinNotasRepetidas(_explPasos(lista, sinNumeros)); }
function _explPasos(lista, sinNumeros){
  if(lista.some(l => typeof l === 'string' && l.startsWith('§'))) return explReceta(lista);
  const pasos = [], trucos = [];
  lista.filter(Boolean).forEach(l => {
    if(!/^TRUCO:/.test(l)) return pasos.push(l);
    const t = l.replace(/^TRUCO:\s*/,'');
    // el rótulo hace de título (la frase empieza en mayúscula) y los ejemplos van en su propio renglón
    trucos.push((t.charAt(0).toUpperCase() + t.slice(1))
      .replace(/ ((?:Otro )?Ejemplos?\b[^:]{0,40}:)/g, '<br>$1'));
  });
  // circuitos: como en la presentación, solo se marca dónde EMPIEZA cada paso (I., II., a., b.,
  // Método…); las líneas de fórmula van debajo, sin número
  const cuerpo = sinNumeros
    ? `<div class="pasosLibres">${pasos.map(l => `<div class="${/^(→|[IVX]+\. |[a-z]\. |Método|Fórmula|Calcular|Comprobación)/.test(l) ? 'pasoTit' : 'pasoLin'}">${l}</div>`).join('')}</div>`
    : `<ol>${pasos.map(l => l.startsWith('<svg') ? `<li style="display:block">${l}</li>` : `<li>${l}</li>`).join('')}</ol>`;
  return cuerpo +
    trucos.map(t=>`<div class="truco"><b>TRUCO PARA QUE SEA MÁS FÁCIL</b>${t}</div>`).join('');
}

}

/* ---------- modo examen ---------- */
const EXAMEN_TOTAL = 10, EXAMEN_SEGUNDOS = 60 * EXAMEN_TOTAL;   // 1 minuto por pregunta
let _examenTimerIv = null;
function iniciarExamen(){
  _barra(null);
  examen = { preguntas: [], idx: 0, finLimite: Date.now() + EXAMEN_SEGUNDOS*1000 };
  for(let i=0; i<EXAMEN_TOTAL; i++){
    const m = elegirDe(MODULOS.filter(x=>x.clase===materia));   // todos los temas DE LA MATERIA actual — no se limita a la mezcla/grupo activo
    const ej = m.gen(nivel); ej.__mod = m.id; ej.__modNombre = m.nombre;
    examen.preguntas.push({ ej, ok:null, completado:false });
  }
  pintarExamen();
}
function _abandonarExamen(){
  confirmarAccion('¿Abandonar el examen? No se guarda ningún resultado.', () => {
    clearInterval(_examenTimerIv);
    examen = null;
    ir('inicio');
  });
}
function pintarExamen(){
  const p = examen.preguntas[examen.idx];
  ordenSel = [];
  main.innerHTML = `
    <button class="back" onclick="_abandonarExamen()">← Abandonar examen</button>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="pill">Pregunta ${examen.idx+1} de ${examen.preguntas.length}</span>
        <span class="pill" id="examenReloj" style="background:var(--rojo-bg);color:#b03a2e">--:--</span>
      </div>
      <div class="enunciado">${p.ej.enunciado}</div>
      <div id="zonaEntrada">${entradaHTML(p.ej)}</div>
    </div>
    <div class="nota">Modo examen: sin explicaciones ni saltar — el repaso queda para el final.</div>`;
  const primero = $('inNum') || $('inTexto') || $('inE') || $('inN');
  if(primero && window.innerWidth > 640) primero.focus();
  _actualizarRelojExamen();
}
function _actualizarRelojExamen(){
  clearInterval(_examenTimerIv);
  const tick = () => {
    if(!examen) return clearInterval(_examenTimerIv);
    const restante = Math.max(0, Math.round((examen.finLimite - Date.now())/1000));
    const el = $('examenReloj');
    if(el) el.textContent = String(Math.floor(restante/60)).padStart(2,'0')+':'+String(restante%60).padStart(2,'0');
    if(restante <= 0){ clearInterval(_examenTimerIv); finalizarExamen(); }
  };
  tick();
  _examenTimerIv = setInterval(tick, 1000);
}
function responderExamen(valor){
  const p = examen.preguntas[examen.idx];
  const ent = (valor !== undefined) ? valor : leerEntrada(p.ej);
  if(p.ej.tipo === 'orden' && ent.length < p.ej.opciones.length) return;   // en examen se exige completar, sin aviso
  const res = verificar(p.ej, ent);
  if(res.vacio) return;
  p.ok = res.ok; p.completado = true;
  examen.idx++;
  if(examen.idx >= examen.preguntas.length) finalizarExamen();
  else pintarExamen();
}
function finalizarExamen(){
  clearInterval(_examenTimerIv);
  const total = examen.preguntas.length;
  const correctas = examen.preguntas.filter(p=>p.ok===true).length;
  const nota = Math.round(correctas*100/total);
  examenes.unshift({ fecha: fechaLocal(), correctas, total });
  examenes = examenes.slice(0, 30);
  guardar('mate_examenes_v1', examenes);
  main.innerHTML = `
    <div class="card">
      <h2>Resultado del examen</h2>
      <div class="racha">
        <div><b>${correctas}/${total}</b><span>correctas</span></div>
        <div><b>${nota}%</b><span>nota</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Repaso</h2>
      ${examen.preguntas.map((p,i)=>`
        <div class="fb ${!p.completado?'medio':p.ok?'ok':'mal'}" style="margin-bottom:6px">
          ${i+1}. ${p.ej.enunciado}
          <small>${!p.completado ? 'Sin responder (se acabó el tiempo)' : p.ok?'Correcto':'Incorrecto — la respuesta es '+fmtRespuesta(p.ej)}</small>
        </div>
        <div class="expl" style="margin-bottom:14px">${explPasos(p.ej.explicacion, p.ej.sinNumeros)}</div>`).join('')}
      <button class="btn amar" onclick="examen=null; ir('inicio')">Volver a Inicio</button>
    </div>`;
  examen = null;
}

      ${total ? `<button class="btn sec chico" style="margin-top:10px" onclick="borrarProgreso()">Borrar mi progreso</button>` : ''}
    </div>`;
}
function _historialUltimosDias(n){
  const out = [];
  for(let i=n-1; i>=0; i--){
    const d = fechaHaceDias(i);
    out.push({ dia:d, n: historial[d]||0 });
  }
  return out;
}
function exportarRespaldo(){
  const datos = {};
  Object.keys(localStorage).filter(k=>k.startsWith('mate_')).forEach(k=>{ datos[k] = localStorage.getItem(k); });
  const blob = new Blob([JSON.stringify(datos)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mate-respaldo-'+fechaLocal()+'.json';
  a.click();
}
function importarRespaldo(file){
  const reader = new FileReader();
  reader.onload = () => {
    let datos;
    try{ datos = JSON.parse(reader.result); }catch(e){ datos = null; }
    // se valida ANTES de tocar nada — un JSON que solo "parsea" (null, un arreglo, un texto)
    // no debe borrar el progreso que ya había
    const claves = (datos && typeof datos === 'object' && !Array.isArray(datos))
      ? Object.keys(datos).filter(k => k.startsWith('mate_')) : [];
    if(!claves.length){ avisar('Ese archivo no es un respaldo válido de esta app.'); return; }
    claves.forEach(k => localStorage.setItem(k, datos[k]));
    avisar('Progreso restaurado. La app se va a recargar.', () => location.reload());
  };
  reader.readAsText(file);
}

function borrarProgreso(){
  // el botón dice "Borrar MI PROGRESO" — antes solo tocaba stats/racha y dejaba el heatmap

  confirmarAccion('¿Borrar todo tu progreso? Se borran las estadísticas por tema, la racha, el historial de días practicados y tus errores guardados.', () => {
    stats = {}; racha = { actual:0, mejor:0 }; historial = {}; rachaDias = { actual:0, mejor:0, ultimoDia:null }; errores = [];

    // sin {merge:true}: un merge con {} no borra nada en Firestore, hay que reemplazar el

function listaCheckHTML(mods, a){
  return mods.map(m=>{
    const on = seleccion.indexOf(m.id) >= 0;
    const razon = a ? (a.secciones.filter(s => SECMAP[s].indexOf(m.id) >= 0).join(', ')
                       || (a.claves[m.id] || []).slice(0,2).join(', ')) : '';
    return `<label class="modCheck ${on?'on':''}" id="mc_${m.id}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleMod('${m.id}', this.checked)">
      <span>${m.nombre}</span>
      ${razon ? `<span class="sc">${razon}</span>` : ''}
    </label>`;
  }).join('');
}
function toggleMod(id, on){
  const i = seleccion.indexOf(id);
  if(on && i < 0) seleccion.push(id);
  if(!on && i >= 0) seleccion.splice(i,1);
  const el = $('mc_'+id); if(el) el.classList.toggle('on', on);
  const cta = $('ctaMezclaCount'); if(cta) cta.textContent = tamanoMezcla(seleccion) + ' preguntas';
