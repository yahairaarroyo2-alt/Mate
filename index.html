  clase = { etiqueta, mods: seleccion.slice() };
  guardar('mate_clase_v1', clase);
  if(syncDoc) syncDoc.set({clase},{merge:true}).catch(()=>{});
  ir('inicio');
}

/* ══════════════════════════════════════════════════════════
   8. AUTOTEST  — abrir index.html?test
   ══════════════════════════════════════════════════════════ */
function autotest(){
  const fallos = [], lineas = [];
  const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b);
  const chk = (nombre, cond) => { lineas.push(`${cond?'  ok  ':'FALLA'}  ${nombre}`); if(!cond) fallos.push(nombre); };

  lineas.push('── helpers ──');
  chk('mcd(48,18) = 6',            mcd(48,18) === 6);
  chk('mcd(17,5) = 1',             mcd(17,5) === 1);
  chk('mcd(0,7) = 7',              mcd(0,7) === 7);
  chk('mcm(4,6) = 12',             mcm(4,6) === 12);
  chk('mcm(21,6) = 42',            mcm(21,6) === 42);
  chk('factorizar(360)',           eq(factorizar(360), {2:3, 3:2, 5:1}));
  chk('factorizar(97) primo',      eq(factorizar(97), {97:1}));
  chk('esPrimo(91) = false',       esPrimo(91) === false);
  chk('esPrimo(2) = true',         esPrimo(2) === true);
  chk('esPrimo(1) = false',        esPrimo(1) === false);
  chk('esPrimo(289) = false',      esPrimo(289) === false);
  chk('simplificar(18,24)=[3,4]',  eq(simplificar(18,24), [3,4]));
  chk('fmtFactores(360)',          fmtFactores(factorizar(360)) === '2³ × 3² × 5');
  chk('sumaDig(529) = 16',         sumaDig(529) === 16);
  chk('parseFactores 2*2*2 → 2^3', eq(parseFactores('2*2*2'), {2:3}));
  chk('parseFactores 2^3 × 5',     eq(parseFactores('2^3 × 5'), {2:3, 5:1}));
  chk('parseFactores basura',      parseFactores('hola') === null);

  lineas.push('', '── generadores (200 por módulo × 3 niveles) ──');
  ['facil','medio','dificil'].forEach(nv=>{
    MODULOS.forEach(m=>{
      let malas = 0, sinExpl = 0, raras = 0, sinTruco = 0;
      for(let i=0; i<200; i++){
        let ej;
        try { ej = m.gen(nv); }
        catch(e){ raras++; continue; }
        if(!ej || !ej.enunciado || /NaN|undefined|Infinity/.test(ej.enunciado)) raras++;
        if(!ej.explicacion || !ej.explicacion.length ||
           ej.explicacion.some(l => /NaN|undefined|Infinity/.test(l))) sinExpl++;
        // toda explicación lleva su atajo (lo pide la usuaria) — si falta, algún return se quedó sin él
        else if(!ej.explicacion.some(l => /^TRUCO:/.test(l))) sinTruco++;
        // la respuesta correcta tiene que pasar la verificación
        const r = verificar(ej, respuestaComoEntrada(ej));
        if(!r.ok) malas++;
      }
      chk(`${nv}/${m.nombre}`, malas===0 && sinExpl===0 && raras===0 && sinTruco===0);
      if(malas)   lineas.push(`        ↳ ${malas} respuestas correctas rechazadas`);
      if(sinExpl) lineas.push(`        ↳ ${sinExpl} explicaciones vacías o con NaN`);
      if(sinTruco)lineas.push(`        ↳ ${sinTruco} explicaciones sin línea TRUCO:`);
      if(raras)   lineas.push(`        ↳ ${raras} enunciados rotos`);
    });
  });

  lineas.push('', '── verificación (casos borde) ──');
  const ejS = { tipo:'frac', respuesta:{n:3,d:4}, pedirSimple:true };
  chk('6/8 con pedirSimple → incompleto', verificar(ejS,{n:'6',d:'8'}).incompleto === true);
  chk('3/4 con pedirSimple → ok',         verificar(ejS,{n:'3',d:'4'}).ok === true);
  const ejN = { tipo:'frac', respuesta:{n:-3,d:4}, pedirSimple:true };
  chk('-3/4 escrito como 3/-4',           verificar(ejN,{n:'3',d:'-4'}).ok === true);
  chk('denominador 0 se rechaza',         verificar(ejS,{n:'3',d:'0'}).ok === false);
  const ejT = { tipo:'texto', respuesta:{2:2, 3:2} };
  chk('4*9 rechazado (no son primos)',    verificar(ejT,'4*9').ok === false);
  chk('2^2*3^2 aceptado',                 verificar(ejT,'2^2*3^2').ok === true);
  chk('2*2*3*3 aceptado',                 verificar(ejT,'2*2*3*3').ok === true);
  const ejM = { tipo:'mixto', respuesta:{e:2, n:3, d:4} };
  chk('mixto 1 7/4 → incompleto',         verificar(ejM,{e:'1',n:'7',d:'4'}).incompleto === true);
  chk('mixto 2 3/4 → ok',                 verificar(ejM,{e:'2',n:'3',d:'4'}).ok === true);

  lineas.push('', '── validez geométrica y unicidad (2ª auditoría) ──');
  {
    let malTri=0, malTrapArea=0, malTrapPerim=0;
    for(let i=0;i<3000;i++){
      const e = MOD_POR_ID['perimetro-area']._gen('dificil');
      let m;
      if((m=e.enunciado.match(/triángulo con lados (\d+), (\d+) y (\d+)/))){
        const [a,b,c]=m.slice(1).map(Number);
        if(a+b<=c || a+c<=b || b+c<=a) malTri++;
      }
      if((m=e.enunciado.match(/trapecio con bases (\d+) y (\d+)/)) && m[1]===m[2]) malTrapArea++;
      if((m=e.enunciado.match(/trapecio con lados (\d+), (\d+), (\d+) y (\d+)/))){
        const [B,b2,l1,l2]=m.slice(1).map(Number);
        if(l1+l2 <= B-b2) malTrapPerim++;
      }
    }
    chk('triángulos generados siempre cumplen la desigualdad triangular', malTri===0);
    // el módulo "Triángulos según sus lados" también: salían lados como 15, 9 y 4 (3ª auditoría)
    let malTriClas = 0;
    for(let i=0;i<300;i++){ for(const nv of ['facil','medio','dificil']){
      const m = MOD_POR_ID['triangulos'].gen(nv).enunciado.match(/lados de <b>(\d+), (\d+) y (\d+)/);
      const [a,b,c] = m.slice(1).map(Number);
      if(a+b<=c || a+c<=b || b+c<=a) malTriClas++;
    } }
    chk('"Triángulos según sus lados" nunca pide clasificar un triángulo imposible', malTriClas===0);
    // suma/resta de 3 fracciones con resta: la respuesta guardada tiene que ser la de la
    // expresión que se VE (antes el 3er término se restaba por dentro y se mostraba con "+")
    let malSigno = 0;
    for(let i=0;i<300;i++){
      const e = MOD_POR_ID['suma-resta-frac'].gen('dificil');
      const fs_ = [...e.enunciado.matchAll(/(\(?−?)<span class="fr"><b>(\d+)<\/b><i>(\d+)<\/i><\/span>/g)];
      if(fs_.length !== 3 || /\d <span/.test(e.enunciado)) continue;          // solo el caso de 3 fracciones sin mixtos
      const ops = [...e.enunciado.matchAll(/<\/span>\)? ([+−]) /g)].map(x=>x[1]);
      let tot = null;
      fs_.forEach((f,k)=>{ let v = { n:(f[1].includes('−')?-1:1)*+f[2], d:+f[3] };
        if(k>0 && ops[k-1]==='−') v = { n:-v.n, d:v.d };
        tot = tot ? { n: tot.n*v.d + v.n*tot.d, d: tot.d*v.d } : v; });
      if(tot.n*e.respuesta.d !== e.respuesta.n*tot.d) malSigno++;
    }
    chk('suma/resta de 3 fracciones: la respuesta coincide con los signos que se ven', malSigno===0);
    chk('trapecio (área) nunca genera las dos bases iguales',             malTrapArea===0);
    chk('trapecio (perímetro) los lados no paralelos alcanzan a cerrarlo', malTrapPerim===0);
  }
  {
    let iguales=0;
    for(let i=0;i<1000;i++){
      const e = MOD_POR_ID['mcm-listado'].gen('facil');
      const m = e.enunciado.match(/de <b>(\d+)<\/b> y <b>(\d+)<\/b>/);
      if(m && m[1]===m[2]) iguales++;
    }
    chk('MCM por listado nunca compara un número consigo mismo', iguales===0);
  }

  lineas.push('', '── fechas locales y racha de días (2ª auditoría) ──');
  chk('fechaLocal usa el calendario local, no UTC (toISOString usaba UTC)', fechaLocal(new Date(2026,0,15,23,30)) === '2026-01-15');
  {
    const hoy = new Date(), ayerEsperado = new Date(hoy); ayerEsperado.setDate(hoy.getDate()-1);
    chk('fechaHaceDias(1) es el día de calendario anterior a hoy', fechaHaceDias(1) === fechaLocal(ayerEsperado));
  }
  {
    const _backup = rachaDias;
    rachaDias = { actual:5, mejor:5, ultimoDia: fechaHaceDias(3) };
    chk('racha de días caduca si pasó más de 1 día sin practicar', _rachaDiasVigente() === 0);
    rachaDias = { actual:5, mejor:5, ultimoDia: fechaHaceDias(1) };
    chk('racha de días sigue viva si se practicó ayer',            _rachaDiasVigente() === 5);
    rachaDias = _backup;
  }
  {
    const _backupErrores = errores, _backupLS = localStorage.getItem('mate_errores_v1');
    errores = [];
    _registrarError({ __mod:'divisibilidad', enunciado:'¿Es 10 divisible por 2?' });
    _registrarError({ __mod:'divisibilidad', enunciado:'¿Es 10 divisible por 2?' });
    chk('_registrarError no duplica el mismo fallo repetido seguido', errores.length === 1);
    _registrarError({ __mod:'divisibilidad', enunciado:'¿Es 7 divisible por 2?' });
    chk('_registrarError sí agrega un fallo distinto', errores.length === 2);
    errores = _backupErrores;
    if(_backupLS === null) localStorage.removeItem('mate_errores_v1'); else localStorage.setItem('mate_errores_v1', _backupLS);
  }

  lineas.push('', '── modo clase ──');
  const a1 = analizarTexto('Homework on 3.1 - 3.3 due Friday');
  chk('rango 3.1-3.3 → 3 secciones',      eq(a1.secciones, ['3.1','3.2','3.3']));
  chk('rango 3.1-3.3 incluye primos',     a1.detectados.some(m => m.id === 'primos'));
  const a2 = analizarTexto('Section 3.6: Comparing and Ordering Fractions');
  chk('3.6 detecta comparar',             a2.detectados[0].id === 'comparar');
  const a3 = analizarTexto('Least Common Multiple and Greatest Common Factor');
  chk('claves en inglés (LCM/GCF)',       a3.detectados.some(m=>m.id==='mcd') && a3.detectados.some(m=>m.id.indexOf('mcm')===0));
  chk('3.14 no se cuela como sección',    analizarTexto('pi vale 3.14').secciones.length === 0);
  chk('texto vacío no detecta nada',      analizarTexto('').detectados.length === 0);
  chk('"corporate" no dispara la clave "rate" (límite de palabra en los 2 lados)', !analizarTexto('the corporate structure').detectados.some(m=>m.id==='razones'));

  const total = lineas.filter(l => /^(  ok  |FALLA)/.test(l)).length;
  main.innerHTML = `<div class="card">
    <h2>${fallos.length ? `${fallos.length} de ${total} comprobaciones FALLAN` : `Las ${total} comprobaciones PASAN`}</h2>
    <pre class="test">${lineas.join('\n')}</pre>
    <button class="btn amar" onclick="location.search=''">Ir a la app</button></div>`;
}
