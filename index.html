    e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0]; if(f) leerArchivoClase(f); });
}

async function leerArchivoClase(file){
  $('zonaClase').innerHTML = `<div class="cargando">Leyendo ${file.name}…</div>`;
  try {
    const txt = await textoDeArchivo(file);
    if(!txt || !txt.trim()) throw new Error('No se pudo sacar texto de ese archivo. Prueba a copiar y pegar.');
    $('txtClase').value = txt.slice(0, 200000);
    mostrarAnalisis(analizarTexto(txt), file.name);
  } catch(e){
    $('zonaClase').innerHTML = `<div class="fb mal">${e.message}</div>`;
  }
}
function analizarPegado(){
  const txt = $('txtClase').value;
  if(!txt.trim()) return $('zonaClase').innerHTML = `<div class="fb medio">Pega algo primero.</div>`;
  mostrarAnalisis(analizarTexto(txt), 'el texto pegado');
}

function mostrarAnalisis(a, fuente){
  analisis = a;
  seleccion = a.detectados.map(m => m.id);
  if(!a.detectados.length){
    $('zonaClase').innerHTML = `
      <div class="fb medio">No reconocí ningún tema en ${fuente}.
        <small>Puedes elegirlos a mano abajo.</small></div>
      ${listaCheckHTML(MODULOS)}
      <button class="btn amar" onclick="guardarClase()">Usar estos temas</button>`;
    seleccion = [];
    return;
  }
  const secs = a.secciones.length
    ? `<div class="fb ok">Secciones detectadas: <b>${a.secciones.join(', ')}</b></div>` : '';
  $('zonaClase').innerHTML = `
    ${secs}
    <h3>Esto es lo que detecté — corrígelo si hace falta</h3>
    ${listaCheckHTML(a.detectados, a)}
    <details style="margin:8px 0 12px">
      <summary style="cursor:pointer;font-size:.88rem;color:var(--muted)">Ver los demás temas</summary>
      <div style="margin-top:8px">${listaCheckHTML(MODULOS.filter(m => a.detectados.indexOf(m) < 0), a)}</div>
    </details>
    <button class="btn amar" onclick="guardarClase()">Practicar solo estos temas</button>`;
}

function listaCheckHTML(mods, a){
  return mods.map(m=>{
    const on = seleccion.indexOf(m.id) >= 0;
    const razon = a ? (a.secciones.filter(s => SECMAP[s].indexOf(m.id) >= 0).join(', ')
                       || (a.claves[m.id] || []).slice(0,2).join(', ')) : '';
    return `<label class="modCheck ${on?'on':''}" id="mc_${m.id}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleMod('${m.id}', this.checked)">
      <span>${m.nombre}</span>
      ${razon ? `<span class="sc">${razon}</span>` : ''}
    </label>`;
  }).join('');
}
function toggleMod(id, on){
  const i = seleccion.indexOf(id);
  if(on && i < 0) seleccion.push(id);
  if(!on && i >= 0) seleccion.splice(i,1);
  const el = $('mc_'+id); if(el) el.classList.toggle('on', on);
}
function guardarClase(){
  if(!seleccion.length) return $('zonaClase').insertAdjacentHTML('beforeend',
    `<div class="fb medio">Marca al menos un tema.</div>`);
  const secs = analisis && analisis.secciones.length ? analisis.secciones : null;
  const etiqueta = secs
    ? (secs.length > 1 ? `${secs[0]}–${secs[secs.length-1]}` : secs[0])
    : seleccion.map(id => MOD_POR_ID[id].nombre).slice(0,2).join(', ') + (seleccion.length>2 ? '…' : '');
  clase = { etiqueta, mods: seleccion.slice() };
  guardar('mate_clase_v1', clase);
  ir('inicio');
}

/* ══════════════════════════════════════════════════════════
   8. AUTOTEST  — abrir index.html?test
   ══════════════════════════════════════════════════════════ */
function autotest(){
  const fallos = [], lineas = [];
  const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b);
  const chk = (nombre, cond) => { lineas.push(`${cond?'  ok  ':'FALLA'}  ${nombre}`); if(!cond) fallos.push(nombre); };

  lineas.push('── helpers ──');
  chk('mcd(48,18) = 6',            mcd(48,18) === 6);
  chk('mcd(17,5) = 1',             mcd(17,5) === 1);
  chk('mcd(0,7) = 7',              mcd(0,7) === 7);
  chk('mcm(4,6) = 12',             mcm(4,6) === 12);
  chk('mcm(21,6) = 42',            mcm(21,6) === 42);
  chk('factorizar(360)',           eq(factorizar(360), {2:3, 3:2, 5:1}));
  chk('factorizar(97) primo',      eq(factorizar(97), {97:1}));
  chk('esPrimo(91) = false',       esPrimo(91) === false);
  chk('esPrimo(2) = true',         esPrimo(2) === true);
  chk('esPrimo(1) = false',        esPrimo(1) === false);
  chk('esPrimo(289) = false',      esPrimo(289) === false);
  chk('simplificar(18,24)=[3,4]',  eq(simplificar(18,24), [3,4]));
  chk('fmtFactores(360)',          fmtFactores(factorizar(360)) === '2³ × 3² × 5');
  chk('sumaDig(529) = 16',         sumaDig(529) === 16);
  chk('parseFactores 2*2*2 → 2^3', eq(parseFactores('2*2*2'), {2:3}));
  chk('parseFactores 2^3 × 5',     eq(parseFactores('2^3 × 5'), {2:3, 5:1}));
  chk('parseFactores basura',      parseFactores('hola') === null);

  lineas.push('', '── generadores (200 por módulo × 3 niveles) ──');
  ['facil','medio','dificil'].forEach(nv=>{
    MODULOS.forEach(m=>{
      let malas = 0, sinExpl = 0, raras = 0;
      for(let i=0; i<200; i++){
        let ej;
        try { ej = m.gen(nv); }
        catch(e){ raras++; continue; }
        if(!ej || !ej.enunciado || /NaN|undefined|Infinity/.test(ej.enunciado)) raras++;
        if(!ej.explicacion || !ej.explicacion.length ||
           ej.explicacion.some(l => /NaN|undefined|Infinity/.test(l))) sinExpl++;
        // la respuesta correcta tiene que pasar la verificación
        const r = verificar(ej, respuestaComoEntrada(ej));
        if(!r.ok) malas++;
      }
      chk(`${nv}/${m.nombre}`, malas===0 && sinExpl===0 && raras===0);
      if(malas)   lineas.push(`        ↳ ${malas} respuestas correctas rechazadas`);
      if(sinExpl) lineas.push(`        ↳ ${sinExpl} explicaciones vacías o con NaN`);
      if(raras)   lineas.push(`        ↳ ${raras} enunciados rotos`);
    });
  });

  lineas.push('', '── verificación (casos borde) ──');
  const ejS = { tipo:'frac', respuesta:{n:3,d:4}, pedirSimple:true };
  chk('6/8 con pedirSimple → incompleto', verificar(ejS,{n:'6',d:'8'}).incompleto === true);
  chk('3/4 con pedirSimple → ok',         verificar(ejS,{n:'3',d:'4'}).ok === true);
  const ejN = { tipo:'frac', respuesta:{n:-3,d:4}, pedirSimple:true };
  chk('-3/4 escrito como 3/-4',           verificar(ejN,{n:'3',d:'-4'}).ok === true);
  chk('denominador 0 se rechaza',         verificar(ejS,{n:'3',d:'0'}).ok === false);
  const ejT = { tipo:'texto', respuesta:{2:2, 3:2} };
  chk('4*9 rechazado (no son primos)',    verificar(ejT,'4*9').ok === false);
  chk('2^2*3^2 aceptado',                 verificar(ejT,'2^2*3^2').ok === true);
  chk('2*2*3*3 aceptado',                 verificar(ejT,'2*2*3*3').ok === true);
  const ejM = { tipo:'mixto', respuesta:{e:2, n:3, d:4} };
  chk('mixto 1 7/4 → incompleto',         verificar(ejM,{e:'1',n:'7',d:'4'}).incompleto === true);
  chk('mixto 2 3/4 → ok',                 verificar(ejM,{e:'2',n:'3',d:'4'}).ok === true);

  lineas.push('', '── modo clase ──');
  const a1 = analizarTexto('Homework on 3.1 - 3.3 due Friday');
  chk('rango 3.1-3.3 → 3 secciones',      eq(a1.secciones, ['3.1','3.2','3.3']));
  chk('rango 3.1-3.3 incluye primos',     a1.detectados.some(m => m.id === 'primos'));
  const a2 = analizarTexto('Section 3.6: Comparing and Ordering Fractions');
  chk('3.6 detecta comparar',             a2.detectados[0].id === 'comparar');
  const a3 = analizarTexto('Least Common Multiple and Greatest Common Factor');
  chk('claves en inglés (LCM/GCF)',       a3.detectados.some(m=>m.id==='mcd') && a3.detectados.some(m=>m.id.indexOf('mcm')===0));
  chk('3.14 no se cuela como sección',    analizarTexto('pi vale 3.14').secciones.length === 0);
  chk('texto vacío no detecta nada',      analizarTexto('').detectados.length === 0);

  const total = lineas.filter(l => /^(  ok  |FALLA)/.test(l)).length;
  main.innerHTML = `<div class="card">
    <h2>${fallos.length ? `${fallos.length} de ${total} comprobaciones FALLAN` : `Las ${total} comprobaciones PASAN`}</h2>
    <pre class="test">${lineas.join('\n')}</pre>
    <button class="btn amar" onclick="location.search=''">Ir a la app</button></div>`;
}

else if(!restaurarSesion()) pantallaInicio();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => {
    const checkForUpdate = () => reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') checkForUpdate();
    });
    checkForUpdate();
  }).catch(()=>{});
  let _swWasControlled = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!_swWasControlled){ _swWasControlled = true; return; }  // primera instalación
    window.location.reload();
  });
}
