      const d = R(3, porNivel(nv,8,12,16)); let n; do { n = R(1,d-1); } while(mcd(n,d)!==1);
      const m = R(1, porNivel(nv,4,7,10)), E = m + R(2, porNivel(nv,4,6,9));
      const e = E - m - 1;
      return { enunciado:`Resta mentalmente el número mixto del entero:<br><b>${E} − ${mixS(m,n,d)}</b>`, tipo:'mixto', respuesta:{e, n:d-n, d},
        explicacion: receta({ pide:`${E} − ${m} ${n}/${d}.`,
          pasos:[{ t:'Resta primero los enteros', l:[`${E} − ${m} = ${cb(E-m)}`, `Pero todavía falta restar ${n}/${d}.`] },
            { t:'Préstate un entero y pártelo en pedazos', l:[`${E-m} = ${e} + ${cb(d + '/' + d)}`, `Quedan ${e} enteros y ${d}/${d}.`] },
            { t:'Resta las fracciones', l:[`${d}/${d} − ${n}/${d}: ${d} − ${n} = ${d-n} → ${cb((d-n) + '/' + d)}`] },
            { t:'Junta el entero y la fracción', l:[`→ ${cb(`${e} ${d-n}/${d}`)}`] }],
          resp:`${e} ${d-n}/${d}`, comp:`${e} ${d-n}/${d} + ${m} ${n}/${d} = ${E} ✓`,
          error:`olvidar prestar un entero: la parte entera del resultado es ${E} − ${m} − 1 = ${e}, no ${E-m}.`, ejemplo:`${E} − ${m} = ${E-m}, prestas 1 → ${e} y ${d-n}/${d}.` }) };
    }
    // "resta a/b de c/d" → c/d − a/b (el orden importa)
    const a = { n:R(1,7), d:pick([3,4,5,6,8]) }, c = { n:R(1,9), d:pick([4,6,8,9,10,12]) };
    const r = sumarF([c, {n:-a.n, d:a.d}]);
    return { enunciado:`Resta ${fr(a.n,a.d)} de ${fr(c.n,c.d)}. Escribe la respuesta en su forma más simple.`,
      tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true,
      explicacion: receta({ pide:`"Resta ${tf(a.n,a.d)} de ${tf(c.n,c.d)}": lo que se resta es ${tf(a.n,a.d)}.`,
        pasos:[{ t:'"Restar A de B" es B − A', l:[`Lo que se resta va DESPUÉS del menos: ${cb(tf(c.n,c.d) + ' − ' + tf(a.n,a.d))}`] },
          { t:'Cambia la resta por "más el opuesto"', l:[`${tf(c.n,c.d)} − ${tf(a.n,a.d)} = ${tf(c.n,c.d)} + ${tfP(-a.n,a.d)}`] },
          ...lineasAPasos(pasosSumaF(c, {n:-a.n, d:a.d}).lineas)],
        resp: tf(r.n,r.d), error:`restar al revés (${tf(a.n,a.d)} − ${tf(c.n,c.d)}): daría ${tf(-r.n,r.d)}. "Resta X de Y" es Y − X.`,
        ejemplo:`${tf(c.n,c.d)} − ${tf(a.n,a.d)} = ${tf(r.n,r.d)}.` }) };
  }
},
{

    const a = f(), b = f(), c = f();
    const A = frP(a.n,a.d), B = frP(b.n,b.d), C = frP(c.n,c.d), Af = frS(a.n,a.d);
    const rec = (cs, def, error) => receta({ pide:'qué propiedad muestra la igualdad.',
      pasos:[{ t:'Compara los dos lados del =: ¿qué fue lo ÚNICO que cambió?', l:[cs.cambio] }, { t:'Ponle el nombre', l:[`${def} → ${cb(cs.cat)}`] }],
      resp: cs.cat, error, ejemplo:`${cs.cambio.replace(/<[^>]+>/g, '')} → ${cs.cat}.` });
    if(Math.random()<0.5){                                           // 4.2 C — propiedades de la multiplicación
      const p = pick(['conmutativa','asociativa','identidad','inverso','cero']);
      const Bf = frS(b.n,b.d);
      const casosM = {
        conmutativa: { enun:`${Af} × ${B} = ${Bf} × ${A}`, cat:'Conmutativa', cambio:`${tf(a.n,a.d)} y ${tf(b.n,b.d)} solo ${cb('cambiaron de lugar (el ORDEN)')}`, def:'Conmutativa: cambiar el orden de los factores no cambia el producto', err:'confundirla con Asociativa: aquí cambió el ORDEN, no los paréntesis.' },
        asociativa:  { enun:`(${Af} × ${B}) × ${C} = ${Af} × (${Bf} × ${C})`, cat:'Asociativa', cambio:`Los factores siguen en el mismo orden; solo ${cb('se movieron los paréntesis')}`, def:'Asociativa: con tres factores, da igual cuáles se agrupan primero', err:'confundirla con Conmutativa: el orden es el mismo, solo cambiaron los paréntesis.' },
        identidad:   { enun: Math.random()<0.5 ? `${Af} × 1 = ${Af}` : `1 × ${A} = ${Af}`, cat:'Identidad', cambio:`Se multiplicó por ${cb('1')} y la fracción ${cb('quedó igual')}`, def:'Identidad: multiplicar por 1 deja el número igual', err:'confundirla con Inverso: aquí la fracción queda igual, no da 1.' },
        inverso:     { enun:`${Af} × ${frP(a.n<0?-a.d:a.d, Math.abs(a.n))} = 1`, cat:'Inverso', cambio:`${tf(a.n,a.d)} se multiplicó por su volteada (${tf(a.n<0?-a.d:a.d, Math.abs(a.n))}) y ${cb('dio 1')}`, def:'Inverso: una fracción por su volteada (recíproco) da 1', err:'confundirla con Identidad: aquí el resultado es 1 porque se multiplicó por la volteada.' },
        cero:        { enun: Math.random()<0.5 ? `${Af} × 0 = 0` : `0 × ${A} = 0`, cat:'Cero como factor', cambio:`Se multiplicó por ${cb('0')} y todo ${cb('dio 0')}`, def:'Cero como factor: cualquier número por 0 da 0', err:'confundirla con Identidad: la identidad es el 1; con el 0 el resultado es 0.' }

        respuesta: cs.cat, explicacion: rec(cs, cs.def, cs.err) };
    }
    const p = pick(['conmutativa','asociativa','identidad','inverso']);
    const casos = {
      conmutativa: { enun:`${Af} + ${B} = ${frS(b.n,b.d)} + ${frP(a.n,a.d)}`, cat:'Conmutativa', cambio:`${tf(a.n,a.d)} y ${tf(b.n,b.d)} solo ${cb('cambiaron de lugar (el ORDEN)')}`, def:'Conmutativa: cambiar el orden de los sumandos no cambia la suma', err:'confundirla con Asociativa: aquí cambió el ORDEN, no los paréntesis.' },
      asociativa:  { enun:`(${Af} + ${B}) + ${C} = ${Af} + (${frS(b.n,b.d)} + ${C})`, cat:'Asociativa', cambio:`Los números están en el mismo orden; lo único que cambió es ${cb('dónde están los paréntesis')}`, def:'Asociativa: con tres sumandos, da igual cuáles se agrupan primero', err:'confundirla con Conmutativa: el orden es el mismo, solo se movieron los paréntesis.' },
      identidad:   { enun: Math.random()<0.5 ? `${Af} + 0 = ${Af}` : `0 + ${Af} = ${Af}`, cat:'Identidad', cambio:`Se sumó ${cb('0')} y la fracción ${cb('quedó igual')}`, def:'Identidad: sumar 0 deja el número igual', err:'confundirla con Inverso: aquí la fracción queda igual, no da 0.' },
      inverso:     { enun:`${Af} + ${frP(-a.n,a.d)} = 0`, cat:'Inverso', cambio:`Se sumó ${tf(a.n,a.d)} con ${tf(-a.n,a.d)} (la misma con el signo contrario) y ${cb('dio 0')}`, def:'Inverso: un número más su opuesto da 0', err:'confundirla con Identidad: aquí el resultado es 0 porque se sumaron opuestos.' }
    };
    const cs = casos[p];
    return { enunciado:`¿Qué propiedad de la suma se ilustra?<br><b>${cs.enun}</b>`,
      tipo:'opciones', opciones: shuffle(['Conmutativa','Asociativa','Identidad','Inverso']),
      respuesta: cs.cat, explicacion: rec(cs, cs.def, cs.err) };
  }
},

    }
    if(tipo==='entero'){
      let k = R(2, porNivel(nv,12,30,99)); if(nv!=='facil' && Math.random()<0.4) k = -k;
      const rn = k<0 ? -1 : 1, rd = Math.abs(k);
      return { enunciado:`Escribe el recíproco de <b>${mm(k)}</b>.`, tipo:'frac', respuesta:{n:rn, d:rd}, pedirSimple:true, signo:k<0,

          pasos:[{ t:'Escribe el entero como fracción (con 1 abajo)', l:[`${mm(k)} = ${cb(tf(k,1))}`] },
            { t:'Voltea la fracción', l:[diagRec(k, 1, rn, rd), k<0 ? 'El signo se queda.' : ''] }],
          resp: tf(rn, rd), comp:`${k<0?`(${mm(k)})`:k} × ${tfP(rn, rd)} = ${rd}/${rd} = 1 ✓`, error: k<0 ? 'cambiarle el signo: el recíproco de un negativo es negativo.' : `contestar ${-k}: eso es el opuesto, no el recíproco.`,
          ejemplo:`${mm(k)} = ${tf(k,1)} → ${tf(rn, rd)}.` }) };
    }
    const d = R(2, porNivel(nv,9,15,30)); let n = R(1, porNivel(nv,9,15,30)); if(n===d) n++;

    const err = s<0 ? 'cambiarle el signo: el recíproco de un negativo es negativo.' : 'cambiarle el signo: el recíproco solo voltea la fracción, el signo no cambia.';

      ayuda: rec.d===1 ? 'Si sale un entero, escríbelo con denominador 1.' : '',

        resp: tf(rec.n,rec.d), comp:`${tfP(rn,dd)} × ${tfP(rec.n,rec.d)} = ${n*dd}/${n*dd} = 1 ✓`, error:err, ejemplo:`el ${Math.abs(rn)} baja y el ${dd} sube → ${tf(rec.n,rec.d)}.` }) };

{
  id:'orden-op-frac', nombre:'Orden de operaciones con fracciones', secciones:['4.3'],
  gen(nv){
    const dens = nv==='facil' ? [2,3,4,5,6,8] : [2,3,4,5,6,8,9,10,12];
    const neg = nv==='dificil' ? 0.3 : 0;
    const F = () => { const d = pick(dens); let n = R(1,d-1); if(Math.random()<neg) n=-n; return {n,d}; };
    const A = F(), B = F(), C = F(), D = F();
    const pat = pick(nv==='facil' ? ['sumaMult','restaDiv','multDiv'] : nv==='medio' ? ['sumaMult','restaDiv','multDiv','parDiv','divSuma'] : ['restaDiv','parDiv','divSuma','cuadrado','restaMultPar']);
    // cada paso del orden de operaciones: título (QUÉ va primero) y debajo la operación desglosada
    const pasos = [];
    const paso = (titulo, r) => { pasos.push({ t:titulo, l:r.lineas }); return r.res; };
    const suma = (x,y) => pasosSumaF(x,y);
    const resta = (x,y) => { const r = pasosSumaF(x, {n:-y.n, d:y.d}); return { res:r.res, lineas:[`${opT(x)} − ${opTP(y)} = ${opT(x)} + ${tfP(-y.n,y.d)}`, ...r.lineas] }; };
    let enun, enunT, res, primero, error;
    switch(pat){
      case 'sumaMult':                                                // A + B × C
        enun = `${opS(A)} + ${opP(B)} × ${opP(C)}`; enunT = `${opT(A)} + ${opTP(B)} × ${opTP(C)}`;
        primero = `la multiplicación ${opT(B)} × ${opTP(C)} va antes que la suma`; error = 'sumar primero porque la suma está escrita primero: la multiplicación va antes.';
        { const p = paso(`Primero la multiplicación (va antes que la suma)`, pasosMultF(B,C));
          res = paso(`Ahora la suma: ${opT(A)} + ${opTP(p)}`, suma(A,p)); }
        break;
      case 'restaDiv':                                                // A ÷ B − C
        enun = `${opS(A)} ÷ ${opP(B)} − ${opP(C)}`; enunT = `${opT(A)} ÷ ${opTP(B)} − ${opTP(C)}`;
        primero = `la división ${opT(A)} ÷ ${opTP(B)} va antes que la resta`; error = 'restar primero: la división va antes que la resta.';
        { const p = paso(`Primero la división (va antes que la resta)`, pasosDivF(A,B));
          res = paso(`Ahora la resta: ${opT(p)} − ${opTP(C)}`, resta(p,C)); }
        break;
      case 'multDiv':                                                 // A × B ÷ C  (izquierda a derecha)
        enun = `${opS(A)} × ${opP(B)} ÷ ${opP(C)}`; enunT = `${opT(A)} × ${opTP(B)} ÷ ${opTP(C)}`;
        primero = `multiplicar y dividir empatan: se hace lo que esté más a la izquierda`; error = 'hacer la división primero: × y ÷ empatan, se va de izquierda a derecha.';
        { const p = paso(`Primero la multiplicación (× y ÷ van de izquierda a derecha)`, pasosMultF(A,B));
          res = paso(`Luego la división: ${opT(p)} ÷ ${opTP(C)}`, pasosDivF(p,C)); }
        break;
      case 'parDiv':                                                  // (A + B) ÷ C
        enun = `(${opS(A)} + ${opP(B)}) ÷ ${opP(C)}`; enunT = `(${opT(A)} + ${opTP(B)}) ÷ ${opTP(C)}`;
        primero = `el paréntesis va antes que todo lo demás`; error = 'dividir primero: lo que está dentro del paréntesis se resuelve antes.';
        { const p = paso(`Primero el paréntesis`, suma(A,B));
          res = paso(`Ahora la división: ${opT(p)} ÷ ${opTP(C)}`, pasosDivF(p,C)); }
        break;
      case 'divSuma':                                                 // A ÷ B + C × D
        enun = `${opS(A)} ÷ ${opP(B)} + ${opP(C)} × ${opP(D)}`; enunT = `${opT(A)} ÷ ${opTP(B)} + ${opTP(C)} × ${opTP(D)}`;
        primero = `la división y la multiplicación van las dos antes que la suma`; error = 'sumar en medio primero: la división y la multiplicación van antes.';
        { const p1 = paso(`Primero la división (la de más a la izquierda)`, pasosDivF(A,B));
          const p2 = paso(`Luego la multiplicación`, pasosMultF(C,D));
          res = paso(`Al final la suma: ${opT(p1)} + ${opTP(p2)}`, suma(p1,p2)); }
        break;
      case 'cuadrado':                                                // A + (B)² × C
        enun = `${opS(A)} + (${frS(B.n,B.d)})<sup>2</sup> × ${opP(C)}`; enunT = `${opT(A)} + (${opT(B)})² × ${opTP(C)}`;
        primero = `el exponente va antes que la multiplicación y la suma`; error = 'multiplicar la fracción por 2: el exponente 2 es multiplicarla POR SÍ MISMA.';
        { const p1 = paso(`Primero el exponente (la fracción por sí misma)`, pasosMultF(B,B));
          const p2 = paso(`Luego la multiplicación: ${opT(p1)} × ${opTP(C)}`, pasosMultF(p1,C));
          res = paso(`Al final la suma: ${opT(A)} + ${opTP(p2)}`, suma(A,p2)); }
        break;
      default:                                                        // A − B × (C + D)
        enun = `${opS(A)} − ${opP(B)} × (${opS(C)} + ${opP(D)})`; enunT = `${opT(A)} − ${opTP(B)} × (${opT(C)} + ${opTP(D)})`;
        primero = `paréntesis, luego multiplicación y al final la resta`; error = 'restar primero: el paréntesis, luego la multiplicación y al final la resta.';
        { const p1 = paso(`Primero el paréntesis`, suma(C,D));
          const p2 = paso(`Luego la multiplicación: ${opT(B)} × ${opTP(p1)}`, pasosMultF(B,p1));
          res = paso(`Al final la resta: ${opT(A)} − ${opTP(p2)}`, resta(A,p2)); }
    }
    return { enunciado:`Simplifica usando el orden de operaciones:<br><b>${enun}</b>`,
      tipo:'frac', respuesta:res, pedirSimple:true, signo:true, ayuda:'Escribe la respuesta como fracción simplificada (puede ser impropia).',
      explicacion: receta({ pide:'el valor final, haciendo las operaciones en el orden correcto.',
        pasos:[{ t:'Recuerda el orden', l:['Paréntesis → exponentes → × y ÷ (de izquierda a derecha) → + y −.', `Aquí: ${primero}.`] }, ...pasos],
        resp: tf(res.n,res.d), error, ejemplo:`en ${enunT.replace(/<[^>]+>/g, '')}: ${primero}.` }) };
  }
},
{
  id:'frac-compleja', nombre:'Fracciones complejas', secciones:['4.3'],
  gen(nv){
    const dens = nv==='facil' ? [2,3,4,5,6,8] : [2,3,4,5,6,8,9,10,12];
    const neg = nv==='dificil' ? 0.3 : 0;
    const F = () => { const d = pick(dens); let n = R(1,d-1); if(Math.random()<neg) n=-n; return {n,d}; };
    const sub = (x,y) => addF(x, {n:-y.n, d:y.d});
    const pat = pick(nv==='facil' ? ['simple','simple','arriba'] : nv==='medio' ? ['arriba','abajo','ambas'] : ['ambas','ambas','verbal']);
    let A = F(), B = F(), C = F(), D = F();
    const pasos = [];
    let num, den, enun, arribaT, abajoT;
    const pasoArriba = () => { const p = pasosSumaF(A,B); pasos.push({ t:`Resuelve lo de ARRIBA: ${opT(A)} + ${opTP(B)}`, l:p.lineas }); return p.res; };
    const pasoAbajo = () => { const p = pasosSumaF(C, {n:-D.n, d:D.d}); pasos.push({ t:`Resuelve lo de ABAJO: ${opT(C)} − ${opTP(D)}`, l:[`${opT(C)} − ${opTP(D)} = ${opT(C)} + ${tfP(-D.n,D.d)}`, ...p.lineas] }); return p.res; };
    if(pat==='simple'){
      num = A; den = C; enun = fr(frS(A.n,A.d), frS(C.n,C.d)); arribaT = opT(A); abajoT = opT(C);
    } else if(pat==='arriba'){
      enun = fr(`${frS(A.n,A.d)} + ${frP(B.n,B.d)}`, frS(C.n,C.d)); arribaT = `(${opT(A)} + ${opTP(B)})`; abajoT = opT(C);
      num = pasoArriba(); den = C;
    } else if(pat==='abajo'){
      den = sub(C,D); while(den.n===0){ D = F(); den = sub(C,D); }
      enun = fr(frS(A.n,A.d), `${frS(C.n,C.d)} − ${frP(D.n,D.d)}`); arribaT = opT(A); abajoT = `(${opT(C)} − ${opTP(D)})`;
      num = A; den = pasoAbajo();
    } else {
      den = sub(C,D); while(den.n===0){ D = F(); den = sub(C,D); }
      enun = fr(`${frS(A.n,A.d)} + ${frP(B.n,B.d)}`, `${frS(C.n,C.d)} − ${frP(D.n,D.d)}`); arribaT = `(${opT(A)} + ${opTP(B)})`; abajoT = `(${opT(C)} − ${opTP(D)})`;
      num = pasoArriba(); den = pasoAbajo();
    }
    const dv = pasosDivF(num, den);
    const r = dv.res;
    const enunciado = pat==='verbal'
      ? `La suma de ${frS(A.n,A.d)} y ${frP(B.n,B.d)} se va a dividir por la diferencia entre ${frS(C.n,C.d)} y ${frP(D.n,D.d)}. Escribe la expresión como fracción compleja y simplifícala.`
      : `Simplifica la fracción compleja:<br><b style="font-size:1.15em">${enun}</b>`;
    return { enunciado, tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true, ayuda:'Escribe la respuesta como fracción simplificada (puede ser impropia).',
      explicacion: receta({ pide:'una sola fracción simplificada.',
        pasos:[{ t: pat==='verbal' ? 'Traduce la frase' : 'La raya larga es una división (÷)', l:[pat==='verbal' ? `"suma" va arriba y "diferencia" abajo → ${cb(arribaT + ' ÷ ' + abajoT)}` : `${arribaT} ÷ ${abajoT}`] },
          ...pasos,
          { t:`Divide: ${opT(num)} ÷ ${opTP(den)}`, l: dv.lineas }],
        resp: tf(r.n,r.d), error:'dividir sin resolver antes lo de arriba y lo de abajo: primero cada pedazo se vuelve UNA fracción.',
        ejemplo:`arriba queda ${opT(num)}, abajo queda ${opT(den)}, y ${opT(num)} × ${opTP(recipF(den))} = ${tf(r.n,r.d)}.` }) };
  }
},

{
  id:'ecuaciones-frac', nombre:'Ecuaciones con fracciones', secciones:['5.1'],
  gen(nv){
    const L = pick(['x','x','y','t','m']);
    const dens = nv==='facil' ? [2,3,4,5,6,8,10] : [2,3,4,5,6,7,8,9,10,12,15];
    const neg = nv==='facil' ? 0 : nv==='medio' ? 0.3 : 0.45;
    const F = () => { const f = fracR(dens); if(Math.random()<neg) f.n = -f.n; return f; };
    const tipo = pick(nv==='facil' ? ['suma','suma','mult'] : nv==='medio' ? ['suma','mult','mult','dos'] : ['suma','mult','dos','dos']);
    const signoT = f => `${f.n<0 ? '−' : '+'} ${fr(Math.abs(f.n), f.d)}`;           // "+ 2/3" / "− 2/3" en el enunciado
    const signoTt = f => `${f.n<0 ? '−' : '+'} ${tf(Math.abs(f.n), f.d)}`;
    const opuesto = f => ({n:-f.n, d:f.d});
    const pasos = []; let enun, sol, comp, error, ejemplo;
    // multiplicar ambos lados por el recíproco del coeficiente (k·L = c)
    const pasoRecip = (k, c) => {
      const rec = recipF(k), p = pasosMultF(rec, c);
      pasos.push({ t:'Multiplica los DOS lados por el recíproco (la fracción volteada)', l:[`El recíproco de ${tf(k.n,k.d)} es ${tf(rec.n,rec.d)}.`, diagAmbosLados(`(${tf(k.n,k.d)})${L}`, opT(c), `× ${tf(rec.n,rec.d)}`, L, `${tf(rec.n,rec.d)} × ${opTP(c)}`), ...p.lineas] });
      return p.res;
    };
    if(tipo==='suma'){
      const a = F(), b = F();
      sol = addF(b, opuesto(a));
      if(sol.n===0) return this.gen(nv);
      enun = `${L} ${signoT(a)} = ${frS(b.n,b.d)}`;
      pasos.push({ t:`Mira qué le hacen a la ${L}`, l:[`Le están ${a.n<0 ? cb('restando') : cb('sumando')} ${tf(Math.abs(a.n), a.d)}.`] });
      const p = pasosSumaF(b, opuesto(a));
      pasos.push({ t:'Haz lo contrario en los DOS lados', l:[diagAmbosLados(`${L} ${signoTt(a)}`, tf(b.n,b.d), `${a.n<0?'+':'−'} ${tf(Math.abs(a.n),a.d)}`, L, `${tf(b.n,b.d)} ${a.n<0?'+':'−'} ${tf(Math.abs(a.n),a.d)}`)] },
        { t:'Haz la cuenta del lado derecho', l:p.lineas }, { t:'Escribe la respuesta', l:[`${L} = ${cb(tf(sol.n,sol.d))}`] });
      comp = `${tfP(sol.n,sol.d)} ${signoTt(a)} = ${tf(addF(sol,a).n, addF(sol,a).d)} = ${tf(b.n,b.d)} ✓`;
      error = `${a.n<0 ? 'restar' : 'sumar'} en vez de hacer lo contrario: lo que suma se quita RESTANDO, y lo que resta se quita SUMANDO.`;
      ejemplo = `${L} ${signoTt(a)} = ${tf(b.n,b.d)} → ${L} = ${tf(b.n,b.d)} ${a.n<0?'+':'−'} ${tf(Math.abs(a.n),a.d)} = ${tf(sol.n,sol.d)}.`;
    } else if(tipo==='mult'){
      const k = F(); let x = F(); if(nv!=='facil' && Math.random()<0.3) x = {n:R(1,9)*(Math.random()<neg?-1:1), d:1};
      const c = multF([k,x]); const cF = {n:c.n, d:c.d}; sol = x;
      const vuelta = Math.random()<0.3;
      enun = vuelta ? `${opS(cF)} = ${frS(k.n,k.d)}${L}` : `${frS(k.n,k.d)}${L} = ${opS(cF)}`;
      if(vuelta) pasos.push({ t:`Pon la ${L} a la izquierda`, l:[`Se intercambian los lados: (${tf(k.n,k.d)})${L} = ${opT(cF)}.`] });
      pasos.push({ t:`Mira qué le hacen a la ${L}`, l:[`La ${L} está ${cb('multiplicada por ' + tf(k.n,k.d))}.`] });
      const r = pasoRecip(k, cF);
      pasos.push({ t:'Escribe la respuesta', l:[`${L} = ${cb(tf(r.n,r.d))}`] });
      comp = `${tfP(k.n,k.d)} × ${opTP(sol)} = ${opT(cF)} ✓`;
      error = `dividir entre el número de arriba solamente: hay que multiplicar por la fracción COMPLETA volteada (${tf(recipF(k).n,recipF(k).d)}).`;
      ejemplo = `el coeficiente es ${tf(k.n,k.d)}, se multiplica por ${tf(recipF(k).n,recipF(k).d)} y queda ${L} = ${tf(sol.n,sol.d)}.`;
    } else {
      const k = F(), x = F(), cc = F();
      const kx = multF([k,x]); const d = addF({n:kx.n,d:kx.d}, cc); sol = x;
      if(d.n===0) return this.gen(nv);
      enun = `${frS(k.n,k.d)}${L} ${signoT(cc)} = ${opS(d)}`;
      const p = pasosSumaF(d, opuesto(cc));
      pasos.push({ t:`Mira qué le hacen a la ${L}`, l:[`La ${L} está ${cb('multiplicada por ' + tf(k.n,k.d))} y después le ${cc.n<0 ? cb('restan') : cb('suman')} ${tf(Math.abs(cc.n),cc.d)}.`] },
        { t:`Quita primero lo que suma o resta (el ${signoTt(cc)})`, l:[diagAmbosLados(`(${tf(k.n,k.d)})${L} ${signoTt(cc)}`, opT(d), `${cc.n<0?'+':'−'} ${tf(Math.abs(cc.n),cc.d)}`, `(${tf(k.n,k.d)})${L}`, `${opT(d)} ${cc.n<0?'+':'−'} ${tf(Math.abs(cc.n),cc.d)}`), ...p.lineas, `Queda: (${tf(k.n,k.d)})${L} = ${cb(opT(p.res))}`] });
      const r = pasoRecip(k, p.res);
      pasos.push({ t:'Escribe la respuesta', l:[`${L} = ${cb(tf(r.n,r.d))}`] });
      comp = `${tfP(k.n,k.d)} × ${tfP(sol.n,sol.d)} = ${tf(kx.n,kx.d)}; ${tf(kx.n,kx.d)} ${signoTt(cc)} = ${opT(d)} ✓`;
      error = 'quitar primero el número que multiplica: se quita primero lo que suma o resta, y de último lo que multiplica.';
      ejemplo = `se quita el ${signoTt(cc)}, queda (${tf(k.n,k.d)})${L} = ${opT(p.res)}, y × ${tf(recipF(k).n,recipF(k).d)} → ${L} = ${tf(sol.n,sol.d)}.`;
    }
    return { enunciado:`${pick(['Resuelve la ecuación y verifica la respuesta:','Resuelve la ecuación:',`Resuelve para ${L}:`])}<br><b>${enun}</b>`,
      tipo:'frac', respuesta:{n:sol.n, d:sol.d}, pedirSimple:true, signo:true,
      ayuda:`${L} = ___ (si sale un entero, escríbelo con denominador 1; puede quedar como fracción impropia)`,
      explicacion: receta({ pide:`el valor de ${L} (y comprobar que sirve).`, pasos, resp:`${L} = ${tf(sol.n,sol.d)}`, comp, error, ejemplo }) };
  }
},
{
  id:'proporciones', nombre:'Proporciones (cierta o falsa, término que falta)', secciones:['5.1'],
  gen(nv){
    const tipo = pick(nv==='facil' ? ['cf','falta','falta'] : nv==='medio' ? ['cf','falta','falta','expr'] : ['cf','falta','expr','expr']);
    const errCruz = 'multiplicar en paralelo (arriba con arriba): en una proporción se multiplica en X, en cruz.';
    if(tipo==='cf'){
      const a = R(2,12), b = R(2,15), k = R(2, porNivel(nv,4,6,9));
      let c = a*k, d = b*k;
      if(Math.random()<0.5){ if(Math.random()<0.5) c += R(1,3); else d += R(1,3); }
      const p1 = a*d, p2 = b*c, es = p1===p2;
      return { enunciado:`Determina si la proporción es cierta o falsa:<br><b>${fr(a,b)} = ${fr(c,d)}</b>`,
        tipo:'opciones', opciones:['Cierta','Falsa'], respuesta: es ? 'Cierta' : 'Falsa',
        explicacion: receta({ pide:'si las dos fracciones valen lo mismo (si es una proporción cierta).',
          pasos:[{ t:'Multiplica en cruz (en X)', l:[diagCruzados(a, b, c, d)] },
            { t:'Haz las dos multiplicaciones', l:[porPedazos(a, d), porPedazos(b, c)] },
            { t:'Compara los dos resultados', l:[es ? `${p1} = ${p2}: son iguales → ${cb('Cierta')}` : `${p1} ≠ ${p2}: son distintos → ${cb('Falsa')}`] }],
          resp: es ? 'Cierta' : 'Falsa', error:errCruz, ejemplo:`${a} × ${d} = ${p1} y ${b} × ${c} = ${p2} → ${es ? 'iguales, cierta' : 'distintos, falsa'}.` }) };
    }
    if(tipo==='falta'){
      // A/B = C/D con uno de los cuatro desconocido
      let V;
      if(nv==='facil'){ const a = R(2,9), b = R(2,12), m = R(2,6); V = [a, b, a*m, b*m]; }
      else V = [R(2,15), R(2,20), R(2,20), R(2,25)];
      // productos cruzados: V0·V3 = V1·V2 — la x queda multiplicada por su pareja de producto
      const u = R(0,3);
      const coef = u===0 ? V[3] : u===3 ? V[0] : u===1 ? V[2] : V[1];
      const sinX = (u===0 || u===3) ? [V[1],V[2]] : [V[0],V[3]];
      const prod = sinX[0]*sinX[1], x = Fq(prod, coef);
      const S = V.map((v,i) => i===u ? 'x' : String(v));
      const H = V.map((v,i) => i===u ? '<i>x</i>' : String(v));
      const izq = `${S[0]} × ${S[3]}`, der = `${S[1]} × ${S[2]}`;
      const lasti = [diagAmbosLados(`${coef}x`, prod, `÷ ${coef}`, 'x', `${prod} ÷ ${coef}`), `x = ${tf(prod,coef)}`];
      if(x.d !== coef || x.n !== prod) lasti.push(explSimplif(prod, coef));
      const pasos = [{ t:'Multiplica en cruz (en X)', l:[diagCruzados(S[0], S[1], S[2], S[3]), `Los productos cruzados son iguales: ${izq} = ${der}`] },
        { t:'Haz la multiplicación que no tiene x', l:[porPedazos(sinX[0], sinX[1]), `${coef}x = ${cb(prod)}`] },
        { t:`Divide los DOS lados entre ${coef} (el número que acompaña a la x)`, l:lasti }];
      const mx = lineaMixto(x); if(mx.length) pasos.push({ t:'Pásalo a número mixto', l:mx });
      return { enunciado:`${pick(['Resuelve la proporción:','Halla el término que falta:'])}<br><b>${fr(H[0],H[1])} = ${fr(H[2],H[3])}</b>`,
        ...respPos(x), ayuda: x.d===1 ? '' : 'Si no sale entero, escríbelo como número mixto (o fracción si es menor que 1).',
        explicacion: receta({ pide:'el número que falta para que la proporción sea cierta.', pasos, resp:`x = ${tMix(x)}`,
          comp:'pon tu x y multiplica en cruz: los dos productos tienen que dar igual.', error:errCruz, ejemplo:`${izq} = ${der} → ${coef}x = ${prod} → x = ${tMix(x)}.` }) };
    }
    // (a·x ± k)/b = c/d → d(a·x ± k) = b·c
    const a = nv==='dificil' && Math.random()<0.5 ? R(2,3) : 1;
    const k = R(1,9) * (Math.random()<0.5 ? -1 : 1), b = R(2,9), c = R(1,9), d = R(2,9);
    const bc = b*c, dk = d*k, x = Fq(bc - dk, d*a);
    const ax = a===1 ? 'x' : `${a}x`;

    const sg = dk<0 ? '−' : '+', sgInv = dk<0 ? '+' : '−', izq = `${d*a}x ${sg} ${Math.abs(dk)}`;

          { t:'Haz la multiplicación del lado derecho', l:[`${b} × ${c} = ${cb(bc)}`, `La ecuación queda: ${izq} = ${bc}`, `El ${bc} es lo que vale TODO el lado izquierdo, no la x.`] },
          { t:`Quita el número que acompaña a la x (${sg} ${Math.abs(dk)})`, l:[diagAmbosLados(izq, bc, `${sgInv} ${Math.abs(dk)}`, `${d*a}x`, `${bc} ${sgInv} ${Math.abs(dk)}`), `${d*a}x = ${cb(bc-dk)}`] },
          { t:`Divide los DOS lados entre ${d*a}`, l:fin }],
        resp:`x = ${opT(x)}`, comp:'pon tu x y multiplica en cruz: los dos productos tienen que dar igual.', error:errCruz,
        ejemplo:`${d}(${numH}) = ${bc} → ${d*a}x = ${bc-dk} → x = ${opT(x)}.` }) };
  }

{

    const lista = xs.map(hMix), listaT = xs.map(tMix);

    else { u = 'millas'; enun = `El doctor de Roberto le recomendó que camine por las mañanas. Durante ${k} días caminó ${yJ(lista.map(v=>v+' millas'))}. Halla el promedio de millas que Roberto caminó por día.`; }

        error:`dividir entre otro número: se divide entre CUÁNTOS números hay (${k}).`, ejemplo:`la suma da ${tf(S.res.n,S.res.d)}, y ${tf(S.res.n,S.res.d)} ÷ ${k} = ${tf(r.n,r.d)}.` }) };

{
  id:'razon-unitaria-prop', nombre:'Razones unitarias y problemas de proporciones', secciones:['5.2'],
  gen(nv){
    const tipo = pick(nv==='facil' ? ['unit','unit','prop'] : nv==='medio' ? ['unit','unitFr','prop','prop'] : ['unitFr','prop','prop','prop']);
    if(tipo==='unit'){
      const casos = [
        () => { const k = R(4,9), q = R(150,450); return { t:`Si los boletos de avión para una familia de ${k} cuestan $${miles(k*q)}, ¿cuál es el costo por persona?`, a:k*q, b:k, r:q, ua:'$', ub:'personas', res:`$${q} por persona` }; },
        () => { const g = R(12,45), m = R(22,38); return { t:`Un automóvil usa ${g} galones de gasolina para viajar ${miles(g*m)} millas. ¿Cuántas millas viaja por galón?`, a:g*m, b:g, r:m, ua:'millas', ub:'galones', res:`${m} millas por galón` }; },
        () => { const k = R(20,40), q = R(40,99); return { t:`Una clase de ${k} estudiantes gastó $${miles(k*q)} en un viaje de campo. ¿Qué parte le corresponde pagar a cada estudiante?`, a:k*q, b:k, r:q, ua:'$', ub:'estudiantes', res:`$${q} por estudiante` }; }
      ];
      const c = pick(casos)();
      return { enunciado:c.t, tipo:'num', respuesta:c.r,
        explicacion: receta({ pide:`cuánto le toca a UNO (${c.res.replace(/^\$?\d+ /, '')}).`,
          pasos:[{ t:'Escribe la razón con lo que te dan', l:[`${cb(miles(c.a) + ' ' + c.ua)} entre ${cb(c.b + ' ' + c.ub)}`] },
            { t:'Divide para que abajo quede 1', l:[`${miles(c.a)} ÷ ${c.b} = ${cb(c.r)} (porque ${c.b} × ${c.r} = ${miles(c.a)})`] }],
          resp:c.res, comp:`${c.r} × ${c.b} = ${miles(c.a)} ✓`, error:`dividir al revés (${c.b} ÷ ${miles(c.a)}): se divide el total entre cuántos son.`, ejemplo:`${miles(c.a)} ÷ ${c.b} = ${c.r}.` }) };
    }
    if(tipo==='unitFr'){
      const casos = [
        () => { const k = R(5,15), carne = mixR(3,8,[2,3,4]); return { t:`Si se utilizan ${hMix(carne)} libras de carne molida para hacer ${k} hamburguesas, ¿cuánta carne se usó en cada hamburguesa?`, tot:carne, k, u:'libras' }; },
        () => { const k = R(3,9), mn = mixR(40,90,[2,3,4]); return { t:`A un maquinista le toma ${hMix(mn)} minutos hacer ${k} broches. ¿Cuánto tiempo le tomará hacer un broche?`, tot:mn, k, u:'minutos' }; },
        () => { const k = R(4,7), g = {n:R(9,20), d:1}; return { t:`Una familia de ${k} miembros consume ${g.n} galones de leche cada semana. Expresa el consumo semanal de cada miembro de la familia como un número mixto, asumiendo que cada miembro consume la misma cantidad.`, tot:g, k, u:'galones' }; }
      ];
      const c = pick(casos)();
      const D = pasosMultF({n:c.tot.n, d:c.tot.d}, {n:1, d:c.k});
      if(D.res.d===1) return this.gen(nv);
      const mx = lineaMixto(D.res);
      return { enunciado:c.t, ...respPos(D.res), ayuda:`Respuesta en ${c.u}.`,
        explicacion: receta({ pide:`cuánto le toca a UNO: se divide entre ${c.k}.`,
          pasos:[{ t:'Escribe la división', l:[`${tMix(c.tot)} ÷ ${c.k}`] },
            ...(esMixto(c.tot) ? [{ t:'Pasa el mixto a fracción impropia', l:[explImpropia(c.tot)] }] : []),
            { t:`Dividir entre ${c.k} es multiplicar por ${tf(1,c.k)}`, l:D.lineas },
            ...(mx.length ? [{ t:'Pásalo a número mixto', l:mx }] : [])],
          resp:`${tMix(D.res)} ${c.u}`, comp:`${tMix(D.res)} × ${c.k} = ${tMix(c.tot)} ✓`, error:`multiplicar por ${c.k}: para saber cuánto toca a UNO se DIVIDE.`, ejemplo:`${tMix(c.tot)} ÷ ${c.k} = ${tMix(D.res)}.` }) };
    }
    // proporción con tabla Caso I / Caso II:  A1/A2 = B1/x  →  x = A2·B1 / A1
    const casos = [
      () => { const a = R(25,45), b = R(1,3), c = R(60,120); return { t:`Si un auto recorre ${a} millas con ${b} galones de gasolina, halla el número de galones que se necesitan para recorrer ${c} millas.`, f1:'Millas', f2:'Galones', A1:{n:a,d:1}, A2:{n:b,d:1}, B1:{n:c,d:1}, u:'galones' }; },
      () => { const a = R(25,40), b = pick([30,40,45,60]), c = R(100,250); return { t:`Una máquina puede producir ${a} bombillas en ${b} minutos. ¿Cuánto tiempo tardará en producir ${c} bombillas?`, f1:'Bombillas', f2:'Minutos', A1:{n:a,d:1}, A2:{n:b,d:1}, B1:{n:c,d:1}, u:'minutos' }; },
      () => { const b = mixR(3,9,[2,4]), a = R(150,400), c = R(2,6); return { t:`Un auto recorre ${a} millas en ${hMix(b)} horas. ¿Cuántas millas recorrerá en ${c} horas?`, f1:'Horas', f2:'Millas', A1:b, A2:{n:a,d:1}, B1:{n:c,d:1}, u:'millas' }; },
      () => { const a = pick([24,36,48,60]), az = mixR(1,2,[2,3,4]), c = pick([18,30,72,90]); return { t:`Una receta para ${a} galletas requiere ${hMix(az)} tazas de azúcar. ¿Cuánta azúcar se necesita para hacer ${c} galletas?`, f1:'Galletas', f2:'Tazas', A1:{n:a,d:1}, A2:az, B1:{n:c,d:1}, u:'tazas' }; },
      () => { const b = R(2,5), q = R(30,60), c = R(6,12); return { t:`Juan gana $${b*q} en ${b} días. A esa razón, ¿cuánto ganará en ${c} días?`, f1:'Días', f2:'Dólares', A1:{n:b,d:1}, A2:{n:b*q,d:1}, B1:{n:c,d:1}, u:'dólares' }; },
      () => { const a = R(2,4), b = R(15,30), c = mixR(5,9,[2,3,5]); return { t:`En un mapa ${a} cm representan ${b} millas. Si la distancia entre dos ciudades en el mapa es ${hMix(c)} cm, ¿cuántas millas de separación hay entre las ciudades?`, f1:'Centímetros', f2:'Millas', A1:{n:a,d:1}, A2:{n:b,d:1}, B1:c, u:'millas' }; }
    ];
    const c = pick(nv==='facil' ? [casos[0],casos[1],casos[4]] : casos)();
    const pm = f => esMixto(f) ? `(${tMix(f)})` : tMix(f);
    // con enteros se escribe la cuenta directa ("30 × 151 = 4530"), sin el "/1" de las fracciones
    const enteros = [c.A1, c.A2, c.B1].every(f => f.d===1);
    const num = enteros ? { res:{n:c.A2.n*c.B1.n, d:1}, lineas:[porPedazos(c.A2.n, c.B1.n)] } : pasosMultF(c.A2, c.B1);
    const div = enteros
      ? { res:Fq(num.res.n, c.A1.n), lineas:[`x = ${num.res.n} ÷ ${c.A1.n} = ${tf(num.res.n, c.A1.n)}`, ...(mcd(num.res.n, c.A1.n)>1 ? [explSimplif(num.res.n, c.A1.n)] : [])] }
      : pasosDivF(num.res, c.A1);
    const x = div.res, mx = lineaMixto(x), imp = [c.A1, c.A2, c.B1].filter(esMixto);
    return { enunciado:c.t, ...respPos(x), ayuda:`Respuesta en ${c.u}${x.d===1 ? '' : ' (como número mixto si no sale entero)'}.`,
      explicacion: receta({ pide:`${c.u} (lo que se busca), con una proporción.`,
        pasos:[{ t:'Ponle x a lo que te preguntan', l:[`x = ${c.u}`] },
          { t:'Arma la tabla (Caso I y Caso II, cada fila con la misma unidad)', l:[`${c.f1}: Caso I = ${tMix(c.A1)}, Caso II = ${tMix(c.B1)}`, `${c.f2}: Caso I = ${tMix(c.A2)}, Caso II = x`] },
          { t:'Arma la proporción con la tabla', l:[`Arriba ${c.f1.toLowerCase()}, abajo ${c.f2.toLowerCase()}, en los dos lados: ${cb(`${pm(c.A1)}/${pm(c.A2)} = ${pm(c.B1)}/x`)}`] },
          { t:'Multiplica en cruz', l:[`${pm(c.A1)} · x = ${pm(c.A2)} · ${pm(c.B1)}`] },
          ...(imp.length ? [{ t:'Pasa los mixtos a fracción impropia', l: imp.map(f => explImpropia(f)) }] : []),
          { t:'Haz la multiplicación del lado derecho', l:num.lineas },
          { t:`Despeja x: divide los DOS lados entre ${tMix(c.A1)}`, l:div.lineas },
          ...(mx.length ? [{ t:'Pásalo a número mixto', l:mx }] : [])],
        resp:`${tMix(x)} ${c.u}`, comp:'pon tu x en la proporción y multiplica en cruz: los dos productos tienen que dar igual.',
        error:'poner las unidades en distinto orden en cada lado: cada fila de la tabla lleva la misma unidad (arriba una, abajo la otra).', ejemplo:`${tMix(c.A1)} · x = ${tMix(c.A2)} · ${tMix(c.B1)} → x = ${tMix(x)}.` }) };
  }
},
{
  id:'geometria-frac', nombre:'Perímetro, área y volumen con fracciones', secciones:['5.3'],
  gen(nv){

    let r;

      formula = 'A = l × a'; sust = `A = ${t(l)} × ${t(a)}`; unid = u+'²'; pasos.push(formula, sust); r = mult([l,a]); }

      formula = 'P = 2l + 2a'; sust = `P = 2(${t(l)}) + 2(${t(a)})`; pasos.push(formula, sust);
      const p1 = pasosMultF({n:2,d:1}, l), p2 = pasosMultF({n:2,d:1}, a); pasos.push(...lineasImpropias([l,a]), '▸ Haz 2 × el largo', ...p1.lineas, '▸ Haz 2 × el ancho', ...p2.lineas);
      const s = pasosSumaVarias([p1.res, p2.res]); pasos.push(...s.lineas); r = s.res; }
    else if(tipo==='perim-cuad' || tipo==='area-cuad'){ const s0 = M(2,9);
      if(tipo==='perim-cuad'){ enun = `Halla el perímetro de un cuadrado si un lado mide ${h(s0)} ${u}.`; formula = 'P = 4 × lado'; sust = `P = 4 × ${t(s0)}`; pasos.push(formula, sust); r = mult([{n:4,d:1}, s0]); }
      else { enun = `Halla el área de un cuadrado con lado de ${h(s0)} ${u}.`; formula = 'A = lado × lado'; sust = `A = ${t(s0)} × ${t(s0)}`; unid = u+'²'; pasos.push(formula, sust); r = mult([s0,s0]); } }
    else if(tipo==='area-tri'){ const b = M(2,12), hh = M(2,9); enun = `Halla el área de un triángulo cuya base mide ${h(b)} ${u} y su altura ${h(hh)} ${u}.`;
      formula = 'A = ½ × b × h'; sust = `A = ${tf(1,2)} × ${t(b)} × ${t(hh)}`; unid = u+'²'; pasos.push(formula, sust); r = mult([{n:1,d:2}, b, hh]); }
    else if(tipo==='area-paral'){ const b = M(3,10), hh = M(2,7); enun = `Halla el área de un paralelogramo que tiene base de ${h(b)} ${u} y altura de ${h(hh)} ${u}.`;
      formula = 'A = b × h'; sust = `A = ${t(b)} × ${t(hh)}`; unid = u+'²'; pasos.push(formula, sust); r = mult([b,hh]); }
    else if(tipo==='altura-paral'){ const b = M(3,10), hh = M(1,6); const A = multF([b,hh]); const Af = {n:A.n,d:A.d};
      enun = `El paralelogramo tiene base de ${h(b)} ${u} y área de ${h(Af)} ${u}². Halla su altura.`;
      formula = 'A = b × h'; sust = `${t(Af)} = ${t(b)} × h`; pasos.push(formula, sust, `▸ Despeja h: divide el área entre la base`, `h = ${t(Af)} ÷ ${t(b)}`, ...lineasImpropias([Af,b]));
      const d = pasosDivF(Af, b); pasos.push(...d.lineas); r = d.res; }
    else if(tipo==='area-trap'){ const b1 = M(4,10), b2 = M(2,7), hh = M(2,6); enun = `Halla el área de un trapecio cuyas bases paralelas miden ${h(b1)} ${u} y ${h(b2)} ${u}, y su altura es ${h(hh)} ${u}.`;
      formula = 'A = ½ (b₁ + b₂) × h'; sust = `A = ${tf(1,2)} (${t(b1)} + ${t(b2)}) × ${t(hh)}`; unid = u+'²'; pasos.push(formula, sust, '▸ Primero lo del paréntesis (suma las bases)', ...lineasImpropias([b1,b2]));
      const s = pasosSumaVarias([b1,b2]); pasos.push(...s.lineas, '▸ Ahora multiplica', `${tf(1,2)} × ${tf(s.res.n,s.res.d)} × ${t(hh)}`); r = mult([{n:1,d:2}, s.res, hh]); }
    else if(tipo==='vol-caja'){ const l = M(2,8), a = M(1,5), hh = M(1,5); enun = `Halla el volumen de un sólido rectangular cuyo largo es ${h(l)} ${u}, ancho ${h(a)} ${u} y altura ${h(hh)} ${u}.`;

    else if(tipo==='vol-cubo'){ const s0 = M(1,5); enun = `Halla el volumen de un cubo cuya arista mide ${h(s0)} ${u}.`;

      const dos = pasosMultF({n:2,d:1}, a); pasos.push('▸ Haz 2 × el ancho', ...dos.lineas, `▸ Quita ese ${t(dos.res)} en los DOS lados`, `2l = ${t(P)} − ${t(dos.res)}`);
      const res = pasosSumaF(P, {n:-dos.res.n, d:dos.res.d}); pasos.push(...res.lineas, `▸ Divide entre 2`, `l = ${tf(res.res.n,res.res.d)} ÷ 2`);
      const d = pasosDivF(res.res, {n:2,d:1}); pasos.push(...d.lineas); r = d.res; }
    const mx = lineaMixto(r);
    return { enunciado:enun, ...respPos(r), ayuda:`Respuesta en ${unid}${r.d===1 ? '' : ' (como número mixto si es mayor que 1)'}.`,

ito en paralelo, la suma de las corrientes individuales es igual a la corriente total"},{"q":"¿Qué establece la ley de las polaridades de Benjamín Franklin?","a":"Cargas iguales se repelen; cargas diferentes se atraen"},{"q":"¿Qué es electrodinámica?","a":"El estudio de la electricidad en movimiento"},{"q":"¿Cuál es la fórmula de la caída de voltaje (voltage drop)?","a":"VD = (2 × R × L × I) ÷ 1,000"},{"q":"¿De qué depende la caída de voltaje en un conductor?","a":"Del largo del conductor, de la corriente y de la resistencia (todas)"},{"q":"¿Qué nombre recibe el dispositivo y qué nombre recibe el efecto?","a":"El dispositivo es el resistor; el efecto es la resistencia"}],"quiz":[{"p":"Si un circuito tiene 2.5 amperes y una resistencia de 10 ohms, ¿cuál es el voltaje?","o":["25 voltios","12.5 voltios","4 voltios","250 voltios"],"c":0,"f":"E = I × R","e":"E = I × R = 2.5 × 10 = 25 voltios."},{"p":"Una resistencia de 8 Ω deja pasar una corriente de 6 amperes. ¿Cuál es el voltaje?","o":["1.3 voltios","48 voltios","14 voltios","2 voltios"],"c":1,"f":"E = I × R","e":"E = I × R = 6 × 8 = 48 voltios."},{"p":"Hay una fuente de 50 V y una carga de 250 Watts. ¿Cuál es la corriente?","o":["5 amperes","200 amperes","0.2 amperes","300 amperes"],"c":0,"f":"I = W ÷ E","e":"I = W ÷ E = 250 ÷ 50 = 5 amperes."},{"p":"El voltaje es 240 V y la corriente 16 A. ¿Cuál es la carga en Watts?","o":["15 W","256 W","3,840 W","224 W"],"c":2,"f":"W = E × I","e":"W = E × I = 240 × 16 = 3,840 Watts."},{"p":"Una corriente de 3 A bajo 80 V pasa por una resistencia de:","o":["240 Ω","26.6 Ω","83 Ω","0.0375 Ω"],"c":1,"f":"R = E ÷ I","e":"R = E ÷ I = 80 ÷ 3 = 26.6 Ω."},{"p":"En un circuito SERIE con resistencias de 23, 34, 12 y 77 Ω, ¿cuál es la resistencia total?","o":["77 Ω","146 Ω","36.5 Ω","12 Ω"],"c":1,"f":"Serie: Rt = R1 + R2 + R3…","e":"En serie se suman: Rt = 23+34+12+77 = 146 Ω."},{"p":"En un circuito en serie, ¿qué es igual en cualquier punto del circuito?","o":["El voltaje","La resistencia","La corriente","Los watts"],"c":2,"e":"En serie la corriente es la misma en cualquier punto; el voltaje se divide."},{"p":"En un circuito en paralelo, ¿qué es igual en todas las cargas?","o":["La corriente","El voltaje","La resistencia","Nada"],"c":1,"e":"En paralelo el voltaje es el mismo en todas las cargas; la corriente se divide."},{"p":"Dos resistencias en paralelo, R1 = 4 Ω y R2 = 8 Ω. ¿Resistencia total?","o":["12 Ω","2.66 Ω","6 Ω","32 Ω"],"c":1,"f":"Paralelo: Rt = (R1 × R2) ÷ (R1 + R2)","e":"Rt = (R1×R2)/(R1+R2) = (4×8)/(4+8) = 32/12 = 2.66 Ω."},{"p":"¿Qué es 'Potencia Eléctrica'?","o":["La resistencia del circuito","Energía consumida producida por el calor","El voltaje de la fuente","La cantidad de electrones"],"c":1,"e":"Pregunta de examen: la potencia eléctrica es energía consumida producida por el calor."},{"p":"Tres resistencias iguales de 10 Ω en paralelo. ¿Resistencia total?","o":["30 Ω","10 Ω","3.33 Ω","1 Ω"],"c":2,"f":"Iguales en paralelo: Rt = R ÷ n","e":"Iguales en paralelo: se divide una entre la cantidad → 10 ÷ 3 = 3.33 Ω."},{"p":"En un circuito en serie con I = 2 A y resistencias de 4, 10 y 20 Ω, ¿cuál es el voltaje total?","o":["68 voltios","34 voltios","17 voltios","136 voltios"],"c":0,"f":"E = I × R","e":"Caídas: 2×4=8, 2×10=20, 2×20=40. Et = 8+20+40 = 68 voltios."},{"p":"Un motor monofásico consume 20 A conectado a 120 V. ¿Cuál es su resistencia interna?","o":["6 Ω","2,400 Ω","100 Ω","0.16 Ω"],"c":0,"f":"R = E ÷ I","e":"R = E ÷ I = 120 ÷ 20 = 6 Ω."},{"p":"¿Qué fórmula calcula la potencia con la corriente y la resistencia?","o":["P = E ÷ R","P = I² × R","P = I ÷ R","P = E × R"],"c":1,"e":"P = I² × R (también P = E² ÷ R con voltaje y resistencia)."},{"p":"Según la Ley de voltaje de Kirchhoff, en un circuito en serie la suma de las caídas de voltaje es igual a:","o":["La corriente total","El voltaje de la fuente","La resistencia total","Cero"],"c":1,"e":"LVK: la suma de las caídas de voltaje = voltaje de la fuente."},{"p":"Según la Ley de corriente de Kirchhoff, en un circuito en paralelo la corriente total es igual a:","o":["La suma de las corrientes de cada ramal","La corriente más pequeña","El voltaje ÷ watts","La misma en cada ramal"],"c":0,"e":"LCK: la corriente total = suma de las corrientes individuales de cada ramal."},{"p":"Una carga de 40 Watts deja fluir una corriente de 1.5 amperes. ¿Cuál es el voltaje?","o":["26.67 voltios","60 voltios","41.5 voltios","16 voltios"],"c":0,"f":"E = W ÷ I","e":"E = W ÷ I = 40 ÷ 1.5 = 26.67 voltios."},{"p":"Una corriente de 9 amperes bajo 100 voltios vence una resistencia de:","o":["11.11 Ω","900 Ω","91 Ω","9 Ω"],"c":0,"f":"R = E ÷ I","e":"R = E ÷ I = 100 ÷ 9 = 11.11 Ω."},{"p":"La resistencia es de 26 Ω y la corriente de 2 A. ¿Cuál es el voltaje?","o":["52 voltios","13 voltios","28 voltios","104 voltios"],"c":0,"f":"E = I × R","e":"E = I × R = 2 × 26 = 52 voltios. (Y la carga: W = 52×2 = 104 W.)"},{"p":"Un circuito consume 120 A y tiene una resistencia de 4 Ω. ¿Qué voltaje suple la AEE?","o":["480 voltios","30 voltios","124 voltios","240 voltios"],"c":0,"f":"E = I × R","e":"E = I × R = 120 × 4 = 480 voltios."},{"p":"Un transformador tiene 36 Ω en su bobina primaria y 2,400 V en H1-H2. ¿Cuál es la corriente máxima?","o":["66.67 amperes","86,400 amperes","36 amperes","666.7 amperes"],"c":0,"f":"I = E ÷ R","e":"I = E ÷ R = 2,400 ÷ 36 = 66.67 amperes."},{"p":"Una carga de 100 W conectada a 48 V deja fluir una corriente de:","o":["2.083 amperes","4,800 amperes","0.48 amperes","48 amperes"],"c":0,"f":"I = W ÷ E","e":"I = W ÷ E = 100 ÷ 48 = 2.083 amperes."},{"p":"Tres resistencias en serie suman Rt = 15 Ω. Si R1 = 5 Ω y R3 = 7 Ω, ¿cuánto es R2?","o":["3 Ω","12 Ω","2 Ω","15 Ω"],"c":0,"f":"Serie: Rt = R1 + R2 + R3","e":"R2 = Rt − (R1+R3) = 15 − 12 = 3 Ω."},{"p":"Un motor a 240 V con una resistencia de 6 Ω tiene una carga de:","o":["40 amperes","24 amperes","36 amperes","48.5 amperes"],"c":0,"f":"I = E ÷ R","e":"I = E ÷ R = 240 ÷ 6 = 40 amperes."},{"p":"En un circuito serie de tres resistencias Rt = 45 Ω. Si R1 = 12 Ω y R3 = 20 Ω, ¿cuánto es Rx?","o":["13 Ω","23 Ω","1.3 Ω","2.3 Ω"],"c":0,"f":"Serie: Rt = R1 + R2 + R3","e":"Rx = 45 − (12+20) = 13 Ω."},{"p":"Dos resistencias en paralelo, R1 = 30 Ω y R2 = 15 Ω. ¿Cuánto es Rt?","o":["10 Ω","45 Ω","11 Ω","1.0 Ω"],"c":0,"f":"Paralelo: Rt = (R1 × R2) ÷ (R1 + R2)","e":"Rt = (30×15)/(30+15) = 450/45 = 10 Ω."},{"p":"¿Cuáles son las manifestaciones de la electricidad?","o":["Luz, calor y magnetismo","Químicos, fisiológicos y mecánicos","Voltaje, corriente y resistencia","Serie, paralelo y mixto"],"c":0,"e":"Las manifestaciones son luz, calor y magnetismo. (Los efectos son químicos, fisiológicos y mecánicos.)"},{"p":"¿Cuáles son los efectos de la electricidad?","o":["Luz, calor y magnetismo","Químicos, fisiológicos y mecánicos","Sólido, líquido y gas","Positivo y negativo"],"c":1,"e":"Los efectos son químicos, fisiológicos y mecánicos."},{"p":"La ley de las polaridades de Benjamín Franklin establece que:","o":["Polos del mismo signo se atraen","Todos los polos son iguales","Polos diferentes se atraen e iguales se repelen","Todos los polos son diferentes"],"c":2,"e":"Cargas diferentes se atraen; cargas iguales se repelen."},{"p":"¿Qué significa Hertz?","o":["Voltios por segundo","Ciclos por segundo","Amperes por hora","Watts por minuto"],"c":1,"e":"Hertz = ciclos por segundo."},{"p":"Un circuito de 110 V consume 10 A y el KWH cuesta 10¢. ¿Cuánto se paga por 25 horas?","o":["$2.75","$27.50","$275.00","$0.27"],"c":0,"f":"W = E × I  →  $ = KWH × tarifa","e":"110×10 = 1,100 W = 1.1 KW × 25 h = 27.5 KWH × $0.10 = $2.75."},{"p":"La caída de voltaje en un conductor eléctrico depende de:","o":["El largo del conductor","La corriente del circuito","La resistencia del conductor","Todas las anteriores"],"c":3,"e":"Depende del largo, la corriente y la resistencia — todas las anteriores."}],"leer":"\n      <span class=\"pill\">Materia 1 de 3</span>\n      <h2>🔢 Ley de Ohm</h2>\n\n      <h3>Fundamentos básicos</h3>\n      <ul>\n        <li>Las <b>manifestaciones</b> de la electricidad son: <b>luz, calor y magnetismo</b>.</li>\n        <li>Los <b>efectos</b> de la electricidad son: <b>químicos, fisiológicos y mecánicos</b>.</li>\n        <li><b>Ley de las polaridades</b> (Benjamín Franklin): cargas <b>iguales se repelen</b>,\n        cargas <b>diferentes se atraen</b>.</li>\n        <li>El <b>electrón</b> tiene carga negativa y es la única partícula del átomo en movimiento.</li>\n        <li><b>Electrodinámica</b> = el estudio de la electricidad en movimiento.</li>\n        <li><b>Hertz</b> = ciclos por segundo.</li>\n      </ul>\n\n      <h3>Las tres magnitudes básicas</h3>\n      <table>\n        <tr><th>Magnitud</th><th>Letra</th><th>Unidad</th><th>Qué es</th></tr>\n        <tr><td>Voltaje</td><td>E</td><td>Voltios (V)</td><td>Diferencia de potencial o \"presión\" eléctrica</td></tr>\n        <tr><td>Corriente</td><td>I</td><td>Amperes (A)</td><td>Flujo de electrones en una sola dirección</td></tr>\n        <tr><td>Resistencia</td><td>R</td><td>Ohmios (Ω)</td><td>Oposición al paso de los electrones</td></tr>\n      </table>\n      <div class=\"nota\">El dispositivo se llama <b>resistor</b>; el efecto que produce se llama <b>resistencia</b>.</div>\n\n      <h3>La fórmula de Ohm (Georg Simon Ohm, 1826)</h3>\n      <div class=\"formula\">E = I × R</div>\n      <p>Despejando se obtiene:</p>\n      <div class=\"formula\">I = E ÷ R&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;R = E ÷ I</div>\n      <div class=\"nota\">💡 <b>Truco del triángulo:</b> escribe E arriba, I y R abajo.\n      Tapa con el dedo la que buscas y lo que queda es la fórmula.</div>\n\n      <h3>Ejemplos resueltos (del libro)</h3>\n      <ul>\n        <li>R = 10 Ω, E = 90 V → I = 90 ÷ 10 = <b>9 amperes</b></li>\n        <li>R = 30 Ω, E = 120 V → I = 120 ÷ 30 = <b>4 amperes</b></li>\n        <li>E = 28 V, I = 6 A → R = 28 ÷ 6 = <b>4.666 Ω</b></li>\n        <li>R = 8 Ω, I = 6 A → E = 6 × 8 = <b>48 voltios</b></li>\n        <li>Motor que consume 20 A a 120 V → R = 120 ÷ 20 = <b>6 Ω</b></li>\n      </ul>\n\n      <h3>Ley de Watt (potencia)</h3>\n      <p>La potencia es un indicador de cuánto trabajo se ha realizado. Se mide en <b>Watts (W)</b>.</p>\n      <div class=\"formula\">W = E × I</div>\n      <p>Despejando: E = W ÷ I&nbsp;&nbsp;·&nbsp;&nbsp;I = W ÷ E</p>\n      <div class=\"nota\">Ejemplo: E = 60 V, I = 2 A → W = 60 × 2 = <b>120 Watts</b></div>\n\n      <h3>Fórmulas combinadas (Ohm + Watt)</h3>\n      <div class=\"formula\">P = I² × R&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;P = E² ÷ R</div>\n\n      <h3>Circuitos en SERIE</h3>\n      <ul>\n        <li>Hay un <b>solo camino</b> para la corriente.</li>\n        <li>Resistencia total: <b>Rt = R1 + R2 + R3 …</b></li>\n        <li>La <b>corriente es la misma</b> en cualquier punto.</li>\n        <li>El <b>voltaje se divide</b> (suma de las caídas de voltaje).</li>\n        <li>Watts: la suma de todas las cargas conectadas.</li>\n      </ul>\n\n      <h3>Circuitos en PARALELO</h3>\n      <ul>\n        <li>Hay <b>más de un camino</b> para la corriente.</li>\n        <li>El <b>voltaje es el mismo</b> en todas las cargas.</li>\n        <li>La <b>corriente se divide</b> (se suman las corrientes de cada ramal).</li>\n        <li>La resistencia total es <b>menor que la resistencia más pequeña</b> conectada.</li>\n      </ul>\n      <div class=\"nota\">Dos resistencias en paralelo: Rt = (R1 × R2) ÷ (R1 + R2)<br>\n      Si todas son iguales: Rt = R ÷ N (el valor de una entre cuántas hay)<br>\n      Más de dos diferentes: ecuación del recíproco → Rt = 1 ÷ (1/R1 + 1/R2 + 1/R3…)</div>\n\n      <h3>Leyes de Kirchhoff</h3>\n      <p><b>Ley de voltaje de Kirchhoff (LVK):</b> en un circuito en serie, la suma de\n      todas las caídas de voltaje es igual al voltaje de la fuente.</p>\n      <div class=\"nota\">Ejemplo serie: VR1 + VR2 + VR3 = 20 + 40 + 60 = 120 V (igual a la fuente)</div>\n      <p><b>Ley de corriente de Kirchhoff (LCK):</b> en un circuito en paralelo, la suma de\n      las corrientes individuales de cada ramal es igual a la corriente total.</p>\n      <div class=\"nota\">Ejemplo paralelo: IT = IR1 + IR2 = 2 A + 4 A = 6 A</div>\n\n      <h3>Caída de voltaje (Voltage Drop)</h3>\n      <p>La caída de voltaje en un conductor depende del <b>largo</b> del conductor, la\n      <b>corriente</b> del circuito y la <b>resistencia</b> del conductor (todas).</p>\n      <div class=\"formula\">VD = (2 × R × L × I) ÷ 1,000</div>\n      <div class=\"nota\">El 2 es porque la corriente va a la carga por un conductor y\n      regresa por otro: 30 pies de distancia = 60 pies de conductor.</div>\n    "},"materiales":{"fc":[{"q":"¿Cuántos electrones en la órbita exterior tiene un buen conductor?","a":"1 ó 2 electrones"},{"q":"¿Cuántos electrones en la órbita exterior tiene un aislante?","a":"7 u 8 electrones"},{"q":"¿Cuáles son los dos conductores más usados en electricidad?","a":"El cobre y el aluminio"},{"q":"¿Cuál es el mejor conductor, pero no el más usado por su precio?","a":"La plata (el cobre es #1 por su costo razonable)"},{"q":"Nombra cuatro materiales aislantes","a":"Plástico, cerámica, goma, vidrio (también baquelita)"},{"q":"¿Cuál es la resistencia específica del cobre?","a":"10.37 Ω (apréndela de memoria: plata 9.60, aluminio 17.01, hierro 60.09)"},{"q":"¿Qué significan las siglas AWG?","a":"American Wire Gage — indica el GRUESO del conductor"},{"q":"¿Para qué se usan los sellos EYS y EZS?","a":"Para sellar el conduit en áreas peligrosas"},{"q":"¿Qué cable se usa para calentadores (heater)?","a":"El cable HPD"},{"q":"¿Qué cable se usa para cordones portátiles?","a":"El SJO (neoprene)"},{"q":"¿Qué cable se usa soterrado?","a":"El UF (underground feeder); también RHW/USE para tomas soterradas"},{"q":"¿Qué conductor se usa en acometidas de contadores y lugares mojados?","a":"El THWN"},{"q":"¿Qué tubería se usa para conectar un motor donde hay alta humedad?","a":"La tubería Sealtight (liquidtight)"},{"q":" ","Plata"],"c":1,"e":"La goma es aislante (también plástico, cerámica, vidrio, baquelita)."},{"p":"¿Cuál es el mejor conductor a temperatura constante?","o":["Cobre","Hierro","Aluminio","Plata"],"c":3,"e":"La plata (Rs = 9.60 Ω); el cobre le sigue con 10.37 Ω."},{"p":"¿Cuánto es la resistencia específica del cobre?","o":["10.37 Ω","1.037 Ω","103.7 Ω","0.1037 Ω"],"c":0,"e":"Cobre = 10.37 Ω. Apréndelas: plata 9.60, aluminio 17.01, hierro 60.09."},{"p":"En un conductor eléctrico, las letras AWG significan:","o":["El código de colores","El grueso del conductor","El largo del conductor","La resistencia del conductor"],"c":1,"e":"AWG (American Wire Gage) indica el grueso del conductor."},{"p":"La fórmula para calcular el área de un conductor redondo es:","o":["Área = diámetro²","Área = 2 × diámetro","Área = diámetro ÷ 2","Área = radio × 2"],"c":0,"e":"El área en milésimas circulares = diámetro al cuadrado (CM = D²)."},{"p":"El calibre máximo en AWG es:","o":["4/0","3/0","5/0","6/0"],"c":0,"e":"El calibre máximo AWG es 4/0; de ahí en adelante se usa kcmil (250,000 CM+)."},{"p":"La conductividad de un material se determina por:","o":["El grueso del cable","Su corriente","Su resistencia","Su color"],"c":2,"e":"La conductividad se determina por su resistencia (G = 1/R)."},{"p":"¿Cuál de estos conductores se usa en acometidas de contadores?","o":["THHN","UF","THWN","Super Service"],"c":2,"e":"El THWN soporta lugares mojados — se usa en acometidas de contadores."},{"p":"¿Cuál de estos conductores se usa para tomas soterradas?","o":["THHN","Super Service","RHW o USE","TW"],"c":2,"e":"Para tomas soterradas se usa RHW o USE (también el cable UF)."},{"p":"El conducto utilizado para conectar un motor donde hay alto porciento de humedad es:","o":["EMT","Tubería Sealtight","PVC schedule 40","Tubo rígido"],"c":1,"e":"La tubería Sealtight (liquidtight) se usa donde hay alta humedad."},{"p":"¿De qué color es el cable de puesta a tierra de una instalación?","o":["Blanco","Negro","Verde","Gris claro"],"c":2,"e":"El cable de puesta a tierra se identifica con el color verde."},{"p":"Los electrones tienen una carga eléctrica:","o":["Positiva","Negativa","Neutral","Variable"],"c":1,"e":"Los electrones tienen carga negativa; los protones, positiva."},{"p":"Una mezcla de dos o más metales se llama:","o":["Compuesto","Solución","Aleación","Amalgama"],"c":2,"e":"Una aleación es una mezcla de metales. (Amalgama es específicamente con mercurio.)"},{"p":"¿Para qué se usa un conduleto?","o":["Para medir corriente","Para dar acceso y cambiar dirección en tubería rígida","Para sellar el techo","Para empalmar cables gruesos"],"c":1,"e":"El conduleto da acceso a los conductores y permite cambios de dirección en la tubería rígida."}],"leer":"\n      <span class=\"pill\">Materia 2 de 3</span>\n      <h2>🧲 Materiales y su uso</h2>\n      <div class=\"nota\">📌 En el examen te muestran la <b>FOTO</b> del material y tú lo\n      <b>identificas</b> y dices su <b>uso</b>. Estudia la <b>🖼️ Galería</b> hasta reconocerlos\n      todos, y practica con los quizzes de identificación.</div>\n\n      <h3>Conductores vs. Aislantes</h3>\n      <ul>\n        <li><b>Conductor</b> — 1 ó 2 electrones en órbita exterior; deja pasar la corriente.\n        Más usados: <b>cobre</b> y <b>aluminio</b>. Mejor conductor: <b>plata</b> (cara).</li>\n        <li><b>Aislante</b> — 7 u 8 electrones; se opone a la corriente.\n        Ejemplos: plástico, goma, cerámica, vidrio, baquelita.</li>\n        <li><b>Aleación</b> = mezcla de dos o más metales.</li>\n        <li><b>Electrones:</b> carga negativa · <b>Protones:</b> carga positiva.</li>\n      </ul>\n\n      <h3>Datos técnicos clave</h3>\n      <ul>\n        <li><b>Resistencias específicas (Rs):</b> Plata <b>9.60</b> · Cobre <b>10.37</b> · Aluminio <b>17.01</b> · Hierro <b>60.09</b> Ω</li>\n        <li><b>Conductividad</b> = 1/R (inverso de la resistencia).</li>\n        <li><b>AWG</b> (American Wire Gage) = grueso del conductor. Número menor = más grueso. Máximo: <b>4/0</b>.</li>\n        <li><b>Área</b> de conductor redondo = diámetro² (en milésimas circulares).</li>\n      </ul>\n\n      <h3>Materiales y su uso</h3>\n      <table>\n        <tr><th>Material</th><th>Para qué se usa</th></tr>\n        <tr><td>Conector EMT (insulado, a NM, compresión, a flex, 2 piezas)</td><td>Unir tubería EMT a cajas, cable NM o tubería flexible</td></tr>\n        <tr><td>BX-FLEX connector</td><td>Conectar cable armado BX / tubería flexible</td></tr>\n        <tr><td>Unión tipo Erison</td><td>Unir dos tubos rígidos que no pueden girarse</td></tr>\n        <tr><td>Locknut</td><td>Asegurar el conector a la caja</td></tr>\n        <tr><td>Grounding bushing</td><td>Terminal del tubo con conexión a tierra</td></tr>\n        <tr><td>Capped bushing</td><td>Tapar y proteger el extremo del tubo</td></tr>\n        <tr><td>Reducing bushing / reducido washer</td><td>Reducir de un diámetro a otro menor</td></tr>\n        <tr><td>Knock out bushing</td><td>Tapar huecos (knockouts) de las cajas</td></tr>\n        <tr><td>Terminal lugs</td><td>Terminar el extremo de un cable para conectarlo</td></tr>\n        <tr><td>Split bolt</td><td>Empalmar dos cables gruesos con un perno</td></tr>\n        <tr><td>Conduletos (LB, LL, LR, C, T, TA, TB, X, serie GUA…)</td><td>Dar acceso a los conductores y cambiar dirección en tubería rígida</td></tr>\n        <tr><td>Sellos EYS / EZS</td><td>Sellar el conduit en áreas peligrosas</td></tr>\n        <tr><td>Receptáculo G.F.C.I.</td><td>Protección contra fallo a tierra (baños, piscinas, exteriores)</td></tr>\n        <tr><td>Receptáculo hospital grade</td><td>Uso hospitalario (más resistente)</td></tr>\n        <tr><td>Tapa weatherproof</td><td>Receptáculos en exteriores / intemperie</td></tr>\n        <tr><td>Receptáculo locking</td><td>Resistente a corrosión; el enchufe no se zafa</td></tr>\n        <tr><td>Cable HPD</td><td>Calentadores (heater cord)</td></tr>\n        <tr><td>Cable SJO (neoprene)</td><td>Cordones portátiles (portable cords)</td></tr>\n        <tr><td>Cable UF</td><td>Soterrado (underground feeder)</td></tr>\n        <tr><td>Cable MC</td><td>Cable con armadura metálica (metal clad)</td></tr>\n        <tr><td>Welding cable</td><td>Cable para soldar</td></tr>\n        <tr><td>Alambre 5,000V Shielded / Non-Shielded</td><td>Alta tensión con o sin blindaje</td></tr>\n        <tr><td>THWN</td><td>Lugares mojados; acometidas de contadores</td></tr>\n        <tr><td>RHW / USE</td><td>Tomas soterradas</td></tr>\n        <tr><td>Tubería Sealtight (liquidtight)</td><td>Conectar motores donde hay alta humedad</td></tr>\n        <tr><td>Conector 90° liquidtight</td><td>Conectar tubería flexible sealtight</td></tr>\n        <tr><td>Pipe hanger / grapa unistrut / C-clamp</td><td>Sujetar y colgar la tubería</td></tr>\n        <tr><td>Spring nut</td><td>Tuerca de resorte para canal unistrut</td></tr>\n        <tr><td>Canopy</td><td>Cubrir la base de una lámpara en el techo</td></tr>\n        <tr><td>Roof flashing</td><td>Sellar la entrada del tubo de servicio en el techo</td></tr>\n        <tr><td>Fustat</td><td>Fusible de rosca (plug fuse)</td></tr>\n        <tr><td>Cuña de tierra / grounding clip</td><td>Hacer la conexión a tierra</td></tr>\n        <tr><td>O ring / junta de goma</td><td>Sellar (por ejemplo en conduletos)</td></tr>\n        <tr><td>CT (current transformer)</td><td>Medir corriente</td></tr>\n        <tr><td>Codo de entrada de servicio tipo SLB</td><td>Entrada del servicio eléctrico</td></tr>\n        <tr><td>Lámpara explosion proof</td><td>Áreas peligrosas / riesgo de explosión</td></tr>\n        <tr><td>Porta lámpara fluorescente 1 ó 2 pins</td><td>Sujetar tubos fluorescentes</td></tr>\n        <tr><td>Empalmes: Western Union, Pigtail, Tap, Fixture</td><td>Unir conductores (tipos de empalme)</td></tr>\n      </table>\n\n      <h3>Colores que debes memorizar</h3>\n      <ul>\n        <li>Cable de <b>puesta a tierra</b>: <b>verde</b>.</li>\n        <li>Conductor <b>neutral</b>: <b>blanco</b> (gris claro en sistemas de mayor voltaje).</li>\n        <li>Tubería: <b>azul</b> = electricidad · <b>gris</b> = comunicaciones · <b>amarillo</b> = señales de seguridad.</li>\n        <li>Interruptor sencillo: <b>15 A = azul · 20 A = rojo · 30 A = verde</b>.</li>\n      </ul>\n    "},"leyes":{"fc":[{"q":"¿Cuál es la enmienda a la Ley 115 que crea la clase de Ayudante?","a":"La Ley 86 del 6 de noviembre de 1992"},{"q":"¿Qué ley protege a los trabajadores contra riesgos de generadores eléctricos?","a":"La Ley 83 del 1 de septiembre de 1990 (Ley Hugo)"},{"q":"¿Cómo se conoce popularmente la Ley 83 del 1990?","a":"La 'Ley Hugo'"},{"q":"¿Qué hizo la Ley 122 del 12 de junio de 1980?","a":"Enmendó la Ley 131: subió el sello de $1 a $3 y estableció suspensión por falta de pago"},{"q":"¿Qué hizo la Ley 123 del 12 de junio de 1980?","a":"Enmendó la Ley 115: la Junta pasó a ser de 9 Peritos Electricistas"},{"q":"¿Qué hizo la Ley 90 del 6 de noviembre de 1992?","a":"Subió el sello de certificación de $3 a $5"},{"q":"¿Qué estableció la Ley 273 del 31 de agosto de 2000?","a":"El término de 2 años para pasar ambas partes del examen y la sustitución de miembros de la Junta"},{"q":"¿De qué trata la Ley 301 del 1 de noviembre de 2003?","a":"De la cancelación de sellos en las certificaciones eléctricas"},{"q":"¿Qué hizo la Ley 147 del 19 de agosto de 1996?","a":"Aumentó de 12 a 20 las reuniones de la Junta con pago de dieta y millaje"},{"q":"¿Qué requisito estableció la Ley 84 del 27 de julio de 1996?","a":"Para perito: haber ejercido como ayudante por lo menos 1 año"},{"q":"¿De qué 3 materias consta el examen de Ayudante?","a":"a) Ley de Ohm's, b) materiales usados en instalaciones eléctricas, c) las leyes de la profesión"},{"q":"¿Quién emite la certificación eléctrica?","a":"El Colegio de Peritos Electricistas"},{"q":"¿Qué vigencia tiene una certificación eléctrica aprobada por la AEE?","a":"1 año"},{"q":"¿Cuánto cuesta el sello de certi a Examinadora."},{"p":"¿Qué ley creó el Colegio de Peritos Electricistas de P.R.?","o":["Ley 115 de 1976","Ley 131 del 28 de junio de 1969","Ley 83 de 1990","Ley 86 de 1992"],"c":1,"e":"La Ley 131 del 28 de junio de 1969 crea el Colegio de Peritos Electricistas."},{"p":"¿Qué ley protege a los trabajadores contra riesgos de generadores eléctricos y la energización inversa de líneas?","o":["Ley 86 de 1992","Ley 131 de 1969","Ley 83 del 1 de septiembre de 1990","Ley 115 de 1976"],"c":2,"e":"La Ley 83 del 1 de septiembre de 1990 (Ley Hugo)."},{"p":"Una certificación eléctrica es un documento oficial que emite:","o":["La AEE","El Departamento de Estado","El Colegio de Peritos Electricistas","La Junta Examinadora"],"c":2,"e":"La emite el Colegio de Peritos Electricistas."},{"p":"Después que la AEE aprueba una certificación eléctrica, ¿qué vigencia tiene antes de dar servicio?","o":["6 meses","1 año","2 años","30 días"],"c":1,"e":"La certificación tiene una vigencia de 1 año."},{"p":"El examen de Ayudante de Perito NO incluye cuál de estas materias:","o":["Ley de Ohm's","Identificación de materiales","Motores trifásicos","Las leyes de la profesión"],"c":2,"e":"El examen de Ayudante solo cubre 3 materias: Ohm, materiales y leyes."},{"p":"¿Cuál es la edad mínima para solicitar la licencia de Ayudante de Perito?","o":["16 años","18 años","21 años","No hay mínimo"],"c":1,"e":"Debe haber cumplido 18 años al radicar la solicitud."},{"p":"¿Qué escolaridad mínima se requiere para Ayudante de Perito Electricista?","o":["Noveno grado","Cuarto año de escuela superior","Grado universitario","Sexto grado"],"c":1,"e":"Haber cursado hasta cuarto año de escuela superior."},{"p":"El programa de educación continua exige un mínimo de:","o":["4 horas al año","8 horas al año","20 horas al año","40 horas al año"],"c":1,"e":"Un mínimo de 8 horas al año."},{"p":"La multa por ejercer la profesión sin licencia es de:","o":["$50 a $100","$100 a $500","$500 a $1,000","Solo reclusión"],"c":1,"e":"Multa de $100 a $500 y/o hasta 6 meses de reclusión. Reincidencia: $200 a $500."},{"p":"¿Por cuántos Peritos Electricistas está compuesta la Junta Examinadora?","o":["5","7","9","11"],"c":2,"e":"La Junta está compuesta por 9 Peritos Electricistas (Ley 123 de 1980)."},{"p":"La Ley 83 del 1 de septiembre de 1990 se conoce popularmente como:","o":["La Ley nueva","La Ley Hugo","La Ley del sello","La Ley del Colegio"],"c":1,"e":"La Ley 83 (protección de trabajadores) se conoce como la 'Ley Hugo'."},{"p":"¿Qué ley subió el costo del sello de $1 a $3 y enmendó la Ley 131?","o":["Ley 122 de 1980","Ley 273 de 2000","Ley 301 de 2003","Ley 86 de 1992"],"c":0,"e":"La Ley 122 del 12 de junio de 1980."},{"p":"¿Qué ley trata sobre la cancelación de sellos en las certificaciones eléctricas?","o":["Ley 131 de 1969","Ley 301 del 1 de noviembre de 2003","Ley 115 de 1976","Ley 83 de 1990"],"c":1,"e":"La Ley 301 del 1 de noviembre de 2003."},{"p":"¿A qué departamento está adscrita la Junta Examinadora?","o":["Departamento de Educación","Departamento de Estado","Departamento del Trabajo","Departamento de Hacienda"],"c":1,"e":"Adscrita a la División de Juntas Examinadoras del Departamento de Estado."},{"p":"Los miembros de la Junta son nombrados por:","o":["El presidente del Senado","El Gobernador, con consejo y consentimiento del Senado","La Legislatura","El Colegio de Peritos"],"c":1,"e":"El Gobernador los nombra con el consejo y consentimiento del Senado."},{"p":"¿Cuánto tiempo estarán los miembros de la Junta en su cargo?","o":["2 años","8 años","4 años","5 años"],"c":2,"e":"Término de 4 años (máximo 2 términos consecutivos)."},{"p":"¿Cuál es el quórum de la Junta Examinadora?","o":["3 miembros","5 miembros","7 miembros","9 miembros"],"c":1,"e":"Quórum: 5 miembros; las decisiones se toman por mayoría."},{"p":"¿Qué ley aumentó el costo del sello a $5?","o":["Ley 90 del 6 de noviembre de 1992","Ley 122 de 1980","Ley 86 de 1992","Ley 301 de 2003"],"c":0,"e":"La Ley 90 del 6 de noviembre de 1992 subió el sello de $3 a $5."},{"p":"¿Qué ley aumentó de 12 a 20 las reuniones de la Junta con pago de dieta?","o":["Ley 59 de 1995","Ley 147 del 19 de agosto de 1996","Ley 84 de 1996","Ley 273 de 2000"],"c":1,"e":"La Ley 147 del 19 de agosto de 1996."},{"p":"Para solicitar examen de perito electricista, entre otros requisitos, debe:","o":["Haber trabajado como ayudante 1 año","Haber trabajado como ayudante 3 años","Haber trabajado 6 meses","Haber trabajado en la construcción"],"c":0,"e":"Haber ejercido como ayudante por lo menos 1 año (Ley 84 de 1996)."},{"p":"¿Cuántos ayudantes y aprendices puede tener un perito bajo su supervisión?","o":["12","10","9","6"],"c":2,"e":"Máximo 9 aprendices o ayudantes (Ley 86 de 1992, Art. 12)."},{"p":"Si fracasa una parte del examen, ¿qué tiempo tiene antes que expire la parte aprobada?","o":["2 años","1 año","6 meses","3 años"],"c":0,"e":"La parte aprobada expira a los 2 años; luego se reexamina en ambas."},{"p":"¿Quién tiene la capacidad legal para otorgar licencias a los aspirantes?","o":["La Junta Examinadora","El Colegio de Peritos","El Departamento de Educación","Los colegios vocacionales"],"c":0,"e":"La Junta Examinadora otorga las licencias."},{"p":"Según la Ley 122, ¿quién recibe e investiga las quejas sobre la conducta de los peritos?","o":["La Policía de P.R.","El Colegio de Peritos Electricistas","El Departamento de Estado","ARPE"],"c":1,"e":"El Colegio recibe e investiga las quejas contra sus miembros."},{"p":"¿Qué escolaridad estableció la Ley 86 de 1996 para la licencia de aprendiz?","o":["Cuarto año de escuela superior","Noveno grado de escuela intermedia","Octavo grado","Sexto grado"],"c":1,"e":"Noveno grado de escuela intermedia."},{"p":"En caso de reincidencia por ejercer sin licencia, la multa será:","o":["No menor de $200 ni mayor de $500","No menor de $100 ni mayor de $500","No menor de $50 ni mayor de $100","$1,000 fijos"],"c":0,"e":"Reincidencia: no menor de $200 ni mayor de $500."},{"p":"¿Qué vigencia tiene la licencia de Aprendiz?","o":["1 año","2 años","4 años","Vitalicia"],"c":1,"e":"La licencia de Aprendiz tiene vigencia de 2 años."},{"p":"La Ley 59 del 29 de junio de 1995 trata sobre:","o":["Las dietas de los miembros de la Junta ($50; presidente 133%)","El costo del sello","La educación continua","Los requisitos de aprendiz"],"c":0,"e":"Fija las dietas en $50; el presidente recibe el 133%."}],"leer":"\n      <span class=\"pill\">Materia 3 de 3</span>\n      <h2>⚖️ Leyes que regulan la profesión</h2>\n\n      <h3>Las leyes principales</h3>\n      <table>\n        <tr><th>Ley</th><th>Fecha</th><th>Qué hace</th></tr>\n        <tr><td><b>Ley 131</b></td><td>28 jun 1969</td><td>Crea el Colegio de Peritos Electricistas de P.R.</td></tr>\n        <tr><td><b>Ley 115</b></td><td>2 jun 1976</td><td>Crea la Junta Examinadora (adscrita al Departamento de Estado)</td></tr>\n        <tr><td><b>Ley 122</b></td><td>12 jun 1980</td><td>Enmienda la Ley 131: sube el sello de $1 a $3; suspensión por falta de pago</td></tr>\n        <tr><td><b>Ley 123</b></td><td>12 jun 1980</td><td>Enmienda la Ley 115: la Junta pasa a ser de 9 Peritos (antes 2 ingenieros y 3 peritos)</td></tr>\n        <tr><td><b>Ley 83</b> (<b>Ley Hugo</b>)</td><td>1 sep 1990</td><td>Protege a trabajadores contra riesgos de generadores eléctricos y energización inversa; reglamenta la instalación de plantas eléctricas</td></tr>\n        <tr><td><b>Ley 86</b></td><td>6 nov 1992</td><td>\"Ley nueva\": crea la estructura de licencias (aprendiz, ayudante y perito)</td></tr>\n        <tr><td><b>Ley 90</b></td><td>6 nov 1992</td><td>Sube el sello de certificación de $3 a $5</td></tr>\n        <tr><td><b>Ley 59</b></td><td>29 jun 1995</td><td>Dietas de la Junta: $50; el presidente cobra 133%</td></tr>\n        <tr><td><b>Ley 84</b></td><td>27 jul 1996</td><td>Requisito para perito: haber ejercido 1 año como ayudante</td></tr>\n        <tr><td><b>Ley 86</b></td><td>27 jul 1996</td><td>Requisitos de escolaridad para las licencias</td></tr>\n        <tr><td><b>Ley 147</b></td><td>19 ago 1996</td><td>Aumenta de 12 a 20 las reuniones con pago de dieta y millaje</td></tr>\n        <tr><td><b>Ley 273</b></td><td>31 ago 2000</td><td>Término de 2 años para pasar ambas partes del examen; sustitución de miembros de la Junta</td></tr>\n        <tr><td><b>Ley 301</b></td><td>1 nov 2003</td><td>Cancelación de sellos en las certificaciones eléctricas</td></tr>\n      </table>\n\n      <h3>La Junta Examinadora — datos clave</h3>\n      <ul>\n        <li>Compuesta por <b>9 Peritos Electricistas</b> licenciados y colegiados.</li>\n        <li>Adscrita al <b>Departamento de Estado</b>.</li>\n        <li>Nombrados por el <b>Gobernador</b> con el consejo y consentimiento del <b>Senado</b>.</li>\n        <li>Término de <b>4 años</b>; máximo <b>2 términos consecutivos</b>.</li>\n        <li><b>Quórum: 5 miembros</b>; decisiones por mayoría.</li>\n        <li>Es quien <b>otorga las licencias</b> y examina a los aspirantes.</li>\n        <li>Máximo <b>20 reuniones</b> al año con pago de dieta y millaje (Ley 147).</li>\n      </ul>\n\n      <h3>Las 3 clases de licencia</h3>\n      <table>\n        <tr><th>Clase</th><th>Edad mín.</th><th>Escolaridad</th><th>Vigencia</th></tr>\n        <tr><td>Aprendiz</td><td>16 años</td><td>Noveno grado</td><td>2 años</td></tr>\n        <tr><td>Ayudante</td><td>18 años</td><td>Cuarto año de escuela superior</td><td>2 años</td></tr>\n        <tr><td>Perito</td><td>18 años</td><td>Cuarto año + 1,000 horas de estudio</td><td>—</td></tr>\n      </table>\n      <div class=\"nota\">Para <b>perito</b> además: haber ejercido <b>1 año como ayudante</b>,\n      ser <b>residente de P.R.</b>, y aprobar ambas partes del examen en <b>2 años o menos</b>.\n      Un perito puede supervisar máximo <b>9</b> ayudantes/aprendices.</div>\n\n      <h3>El examen de AYUDANTE (Ley 115, Art. 8)</h3>\n      <p>Consta de tres materias:</p>\n      <ul>\n        <li><b>a.</b> Ley de Ohm's</li>\n        <li><b>b.</b> Conocimiento e identificación de materiales usados en instalaciones eléctricas</li>\n        <li><b>c.</b> Las leyes que regulan la profesión de Perito Electricista en P.R.</li>\n      </ul>\n\n      <h3>Certificaciones, sellos y penalidades</h3>\n      <ul>\n        <li>La <b>certificación eléctrica</b> la emite el <b>Colegio de Peritos Electricistas</b>.</li>\n        <li>Aprobada por la AEE, tiene vigencia de <b>1 año</b> para dar servicio.</li>\n        <li>El sello cuesta <b>$5</b> (Ley 90 de 1992; antes $3, originalmente $1).</li>\n        <li>Educación continua: mínimo <b>8 horas al año</b> (la exige el Colegio).</li>\n        <li>Ejercer sin licencia: multa de <b>$100 a $500</b> y/o hasta 6 meses de cárcel.\n        Reincidencia: <b>$200 a $500</b>.</li>\n        <li>El <b>Colegio</b> recibe e investiga las quejas contra sus miembros (Ley 122).</li>\n        <li>Si fracasas una parte del examen, tienes <b>2 años</b> antes de que expire la parte aprobada.</li>\n      </ul>\n    "},"idQuiz":[{"p":"La aislación de un conductor eléctrico se escoge de acuerdo a:","o":["El voltaje y el calor","El color del cable","El largo del tubo","El precio"],"c":0,"e":"La aislación se escoge según el voltaje y el calor (temperatura)."},{"p":"El voltaje máximo permitido en lámparas sumergidas en piscinas y fuentes es:","o":["120 V","150 V","277 V","48 V"],"c":1,"e":"No debe exceder de 150 voltios."},{"p":"El cable que se utiliza para calentadores (heater) es el tipo:","o":["THHN","HPD","NM","SJO"],"c":1,"e":"El cable para calentadores (heater cord) es el HPD."},{"p":"¿Cuál es el mejor conductor a temperatura constante?","o":["Cobre","Aluminio","Plata","Oro"],"c":2,"e":"La plata es el mejor conductor a temperatura constante."},{"p":"El interruptor sencillo de 15 amperios es de color:","o":["Azul","Rojo","Verde","Negro"],"c":0,"e":"15 amp = Azul. (20 amp = Rojo, 30 amp = Verde.)"},{"p":"El interruptor sencillo de 20 amperios es de color:","o":["Azul","Rojo","Verde", :"ayudante/mat-125-buje-integral.png"},{"name":"Fusible","src":"ayudante/mat-126-fusible.png"},{"name":"Codo convencional","src":"ayudante/mat-127-codo-convencional.png"},{"name":"Codo tipo T","src":"ayudante/mat-128-codo-tipo-t.png"},{"name":"Buje de parqueo","src":"ayudante/mat-129-buje-de-parqueo.png"},{"name":"Cable Welding","src":"ayudante/mat-130-cable-welding.png"},{"name":"Cable UF","src":"ayudante/mat-131-cable-uf.png"},{"name":"Adaptador de pantalla","src":"ayudante/mat-132-adaptador-de-pantalla.png"},{"name":"Cable TFFN","src":"ayudante/mat-133-cable-tffn.png"},{"name":"Cable XLP-USE","src":"ayudante/mat-134-cable-xlp-use.png"},{"name":"Cable URD","src":"ayudante/mat-135-cable-urd.png"},{"name":"Cable MC","src":"ayudante/mat-136-cable-mc.png"},{"name":"Cable SJ","src":"ayudante/mat-137-cable-sj.png"},{"name":"Potencial Transformador","src":"ayudante/mat-138-potencial-transformador.png"},{"name":"Cable SJOOW","src":"ayudante/mat-139-cable-sjoow.png"}]};
// ninguna pregunta se repite hasta que ya salieron todas las del banco (25-139 preguntas):
// así una ronda de tema trae el banco completo, cada una una sola vez
const _ayRecientes = {};
function _ayElegir(id, lista){
  let rec = _ayRecientes[id] || (_ayRecientes[id] = []);
  if(rec.length >= lista.length) rec = _ayRecientes[id] = [rec[rec.length - 1]];   // vuelta nueva: solo evita repetir la última
  const libres = lista.map((_, i) => i).filter(i => !rec.includes(i));
  const i = libres[Math.floor(Math.random() * libres.length)];
  rec.push(i);
  return lista[i];
}
// 4 opciones: la correcta + 3 distintas de la bolsa de respuestas del mismo banco
const _ayOpciones = (correcta, bolsa) => shuffle([correcta, ...shuffle([...new Set(bolsa)].filter(x => x !== correcta)).slice(0, 3)]);
// "Todas las anteriores", "Ninguna…", "Ambas" dependen del orden: esas preguntas no se barajan
const _ayBarajar = ops => ops.some(o => /anteriores|^ninguna|^ambas|^todas/i.test(o)) ? [...ops] : shuffle([...ops]);
const _ayTrucoFicha = (q, a) => `TRUCO: lee la pregunta y su respuesta juntas, en voz alta, como una sola frase; luego tapa la respuesta y repítela de memoria. Ejemplo con este mismo: "${q}" → ${a}.`;
const _ayTrucoQuiz = (q) => q.f
  ? `TRUCO: la fórmula que se usa aquí es ${q.f}. Ejemplo con este mismo: ${q.e}`
  : `TRUCO: busca la palabra clave de la pregunta y únela a su respuesta. Ejemplo con este mismo: ${q.e}`;
const _ayFoto = src => `<br><img class="ayFoto" src="${src}" alt="Foto para identificar" loading="lazy">`;

// tarjetas (pregunta/respuesta) → opción múltiple
function _ayFicha(id, nombre, sec, fichas){
  const resp = fichas.map(f => f.a);
  return { id, nombre, clase:'ayud', secciones:[sec], banco:fichas.length, gen(){
    const f = _ayElegir(id, fichas);
    return { enunciado:f.q, tipo:'opciones', opciones:_ayOpciones(f.a, resp), respuesta:f.a,
      explicacion:[`La respuesta es: ${f.a}.`, _ayTrucoFicha(f.q, f.a)] };
  } };
}
// preguntas con 4 opciones ya escritas ({p, o, c, e, f?})
function _ayPregunta(id, nombre, sec, preguntas){
  return { id, nombre, clase:'ayud', secciones:[sec], banco:preguntas.length, gen(){
    const q = _ayElegir(id, preguntas);
    return { enunciado:q.p, tipo:'opciones', opciones:_ayBarajar(q.o), respuesta:q.o[q.c],
      explicacion:[q.e, `→ ${q.o[q.c]}.`, _ayTrucoQuiz(q)] };
  } };
}
// foto → nombre
// foto → nombre: materiales (139) y tipos de conduleto (18) en UN solo tema, una ronda las trae todas.
// Las opciones salen del mismo grupo de la foto (a un material no le tocan letras de conduleto).
function _ayFotosTodas(){
  const id = 'ayud-fotos';
  const todas = [...AYUD.fotos.map(f => ({ src:f.src, r:f.name, mat:true })), ...AYUD.condQuiz.map(c => ({ src:c.src, r:c.code, mat:false }))];
  const nomMat = AYUD.fotos.map(f => f.name), nomCond = AYUD.condQuiz.map(c => c.code);
  return { id, nombre:'Identificar con foto (materiales y conduletos)', clase:'ayud', secciones:['2.3'], banco:todas.length, gen(){
    const f = _ayElegir(id, todas);
    return { enunciado:(f.mat ? '¿Qué material eléctrico es este?' : '¿Qué tipo de conduleto es este?') + _ayFoto(f.src),
      tipo:'opciones', opciones:_ayOpciones(f.r, f.mat ? nomMat : nomCond), respuesta:f.r,
      explicacion:[f.mat ? `En la foto está: ${f.r}.` : `Es el conduleto tipo ${f.r}.`, `→ ${f.r}.`,
        f.mat ? `TRUCO: fíjate en la forma y en dónde se conecta, y repasa la Galería de materiales hasta reconocerlo sin leer las opciones. Ejemplo con este mismo: la foto es ${f.r}.`
              : `TRUCO: cada tipo de conduleto se reconoce por la forma del cuerpo y por dónde tiene las entradas; memoriza la letra junto a su foto en la Galería. Ejemplo con este mismo: es el tipo ${f.r}.`] };
  } };
}
MODULOS.push(
  _ayFicha('ayud-ohm-conceptos', 'Ley de Ohm: conceptos y fórmulas', '1.1', AYUD.ohm.fc),

  _ayFicha('ayud-mat-conceptos', 'Materiales: conceptos', '2.1', AYUD.materiales.fc),
  _ayPregunta('ayud-mat-preguntas', 'Materiales: preguntas de práctica', '2.2', [...AYUD.materiales.quiz, ...AYUD.idQuiz]),
  _ayFotosTodas(),
  _ayFicha('ayud-leyes-conceptos', 'Las Leyes: conceptos', '3.1', AYUD.leyes.fc),
  _ayPregunta('ayud-leyes-preguntas', 'Las Leyes: preguntas de práctica', '3.2', AYUD.leyes.quiz)
);

const MOD_POR_ID = {}; MODULOS.forEach(m => MOD_POR_ID[m.id] = m);
// Álgebra: los temas que todavía arman la explicación con líneas sueltas salen igual en forma de receta (aReceta)
MODULOS.filter(m => !m.clase || m.clase === 'mate').forEach(m => { const g = m.gen;
  m.gen = function(nv){ const e = g.call(this, nv);
    if(e && Array.isArray(e.explicacion) && !e.explicacion.some(l => typeof l === 'string' && l.startsWith('§'))) e.explicacion = aReceta(e.explicacion, e.enunciado);
    return e; }; });
