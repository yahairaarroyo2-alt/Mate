<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d2d2da">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<title>Práctica de Matemáticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- media="print" + onload: no bloquea el primer pintado esperando a Google Fonts (mismo
     truco que Fit-F); el <noscript> es el respaldo si el JS no corre. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --acento:#ffc93c;
    --verde:#2ecc71; --verde-bg:#e8f9f0;
    --rojo:#e74c3c; --rojo-bg:#fdeceb;
    --ambar:#f39c12; --ambar-bg:#fef6e7;
    --gris:rgba(255,255,255,.30); --gris2:rgba(255,255,255,.45);
    --texto:#1a1a2e; --muted:#5a6275;
    /* Liquid Glass — mismos valores que Fit-F, para que las dos apps se vean iguales */
    --card:rgba(255,255,255,.28);
    --lg-blur:blur(40px) saturate(180%);
    --lg-border:1px solid rgba(255,255,255,.55);
    --lg-shadow:0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.08),
                inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(0,0,0,.04);
    --titulo:var(--texto); --titulo2:var(--muted);
    --superficie:var(--card);   /* fondo de tarjeta/chip — ahora vidrio, no blanco sólido */
    /* superficie SÓLIDA de contraste (enunciado, chip elegido, insignias). Va aparte de
       --texto a propósito: si se usa --texto como fondo, en modo oscuro queda blanco sobre
       blanco — es la misma trampa del doble papel que ya documentamos con --azul. */
    --contraste:#1a1a2e; --contraste-texto:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* quita el zoom por doble-toque en iOS/Android sin bloquear el pellizco (pinch-zoom) de accesibilidad */
  html,body{touch-action:manipulation}
  /* oculta la barra de scroll de la página (look de app nativa) — el scroll sigue funcionando
     igual, solo no se dibuja la barra; en el teléfono ya se oculta sola, esto es para navegadores
     de escritorio donde queda visible */
  html{scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar{display:none}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(145deg,#c8c8d0 0%,#d8d8e0 50%,#c8c8d0 100%);
    background-attachment:fixed;
    color:var(--texto);min-height:100vh;padding:14px;line-height:1.55;
  }
  /* textura de ruido muy sutil, igual que Fit-F — le quita el look plano al degradado */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:200px 200px;
  }
  /* padding-bottom cubre la barra Y el botón de la calculadora: el botón mide 52px y su
     borde inferior queda a 76+52=128px del fondo — con menos que eso, su mitad superior
     tapaba el último elemento visible de cualquier pantalla (ej. la fila de estadísticas
     de práctica), incluso con la barra oculta, porque este padding no depende de ella */
  .app{max-width:720px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  /* barra flotante de navegación, abajo — copiada tal cual de Fit-F (pastilla vidrio +
     lente Liquid Glass que se desliza sobre la pestaña activa), sin los emoji de sus iconos */
  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:400;display:flex;gap:2px;max-width:calc(100% - 24px);
    background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:28px;
    padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .bottom-nav.oculta{display:none}
  .bn-item{position:relative;z-index:1;font-family:inherit;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 13px;border-radius:22px;min-width:62px;
    color:var(--muted);transition:color .25s,transform .15s}
  .bn-item:active{transform:scale(.9)}
  .bn-lbl{font-size:13px;font-weight:700;letter-spacing:.2px;transition:font-weight .2s}
  .bn-item.active{color:var(--texto)}
  .bn-item.active .bn-lbl{font-weight:800}
  /* lente Liquid Glass (iOS 26) — se desliza sobre la pestaña activa */
  .bn-lens{position:absolute;z-index:0;top:8px;left:0;width:0;height:0;
    border-radius:21px;opacity:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,255,255,.35),rgba(255,255,255,0));
    backdrop-filter:blur(1px) saturate(210%) brightness(1.14);
    -webkit-backdrop-filter:blur(1px) saturate(210%) brightness(1.14);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -3px 6px rgba(255,255,255,.15),
      inset 3px 0 7px rgba(0,190,255,.03),inset -3px 0 7px rgba(255,40,150,.03),
      0 3px 10px rgba(0,0,0,.14);
    transition:left .5s cubic-bezier(.32,1.45,.5,1),width .5s cubic-bezier(.32,1.45,.5,1),
      top .5s cubic-bezier(.32,1.45,.5,1),height .5s cubic-bezier(.32,1.45,.5,1),opacity .3s}
  .card{background:var(--card);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
    border:var(--lg-border);border-radius:24px;box-shadow:var(--lg-shadow);padding:20px;margin-bottom:14px}
  h2{color:var(--titulo);font-size:1.18rem;margin-bottom:12px;font-weight:800;letter-spacing:-.3px}
  h3{color:var(--titulo2);font-size:.78rem;margin:16px 0 8px;font-weight:700;
    text-transform:uppercase;letter-spacing:.8px}
  /* pastillas de vidrio, como los botones de Fit-F.
     Sin backdrop-filter propio: viven siempre dentro de una .card/.ajCard ya esmerilada,
     así que el blur no aportaba nada visible y sí un costo real de batería/GPU — cada
     capa con backdrop-filter es una recomposición aparte, y llegaban a coexistir 30+ a
     la vez en pantallas como "Temas". Ya aplicado también a .calcGrid button (2026-09-18,
     se sentía como lag al usar la calculadora). Confirmar visualmente antes de quitarlo
     también de .chip (mismo motivo, no aplicado todavía). */
  .btn{display:block;width:100%;border:1.5px solid rgba(255,255,255,.45);border-radius:22px;
    cursor:pointer;padding:15px;font-size:1.02rem;font-weight:700;margin-bottom:10px;
    font-family:inherit;transition:transform .15s,box-shadow .2s;
    background:rgba(255,255,255,.42);
    color:var(--texto);box-shadow:0 4px 18px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,.75)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.85)}
  .btn:active{transform:scale(.98)}
  /* el botón principal de cada pantalla: vidrio más sólido, para que destaque sin gritar */
  .btn.amar{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.85)}
  .btn.sec{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:var(--muted)}
  .btn.chico{padding:11px;font-size:.92rem;border-radius:18px}
  .btn small{display:block;font-weight:500;font-size:.79rem;opacity:.6;margin-top:2px}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:120px}
  .back{background:none;border:none;color:var(--texto);cursor:pointer;font-size:.94rem;
    padding:5px 2px;margin-bottom:6px;opacity:.65;font-family:inherit;font-weight:600}
  .back:hover{opacity:1}
  .pill{display:inline-block;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);
    color:var(--texto);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;
    padding:5px 13px;border-radius:20px;margin-bottom:9px}
  /* Repaso de ayudante: lecturas y fotos (colores neutros, sirven en claro y en oscuro) */
  .ayLeer h3{font-size:1.02rem;text-transform:none;letter-spacing:0;color:var(--titulo)}
  .ayLeer ul{margin:8px 0 10px 20px}
  .ayLeer li{margin-bottom:5px}
  .ayLeer p{margin-bottom:10px}
  .ayLeer table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem}
  .ayLeer th,.ayLeer td{border:1px solid rgba(128,128,128,.35);padding:7px 9px;text-align:left}
  .ayLeer th{background:rgba(128,128,128,.22)}
  .ayLeer .formula{text-align:center;font-weight:700;padding:12px;border-radius:12px;margin:12px 0;font-size:1.12rem;background:rgba(128,128,128,.18)}
  .cabEj{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .cabEj .pill{flex:0 1 auto;min-width:0}
  .irPreg{flex:none;display:flex;align-items:center;gap:6px;margin:0 0 9px;font-weight:700;font-size:.8rem}
  .irPreg select{flex:none;width:auto;min-width:64px;margin:0;padding:6px 8px}
  .ayFoto{display:block;width:100%;max-width:300px;margin:12px auto 0;border-radius:12px;background:#fff;border:1px solid rgba(128,128,128,.3)}
  .nota{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);padding:11px 14px;
    border-radius:14px;margin:10px 0;font-size:.9rem;color:var(--muted)}
  /* confirmación propia en vez de confirm() nativo — ver confirmarAccion() */
  /* z-index arriba del de .bottom-nav (400, copiado tal cual de Fit-F) — si no, un diálogo
     en una pantalla con la barra visible queda tapado por ella */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:450}
  .overlay .card{max-width:360px;margin:0;width:100%}
  /* la calculadora se abre pegada abajo y a la derecha, no en el centro, para no tapar el
     ejercicio que está arriba (en pantallas angostas .overlay .card ya ocupa casi todo el
     ancho, así que justify-content no cambia nada ahí — solo se nota con espacio de sobra) */
  #calcOv{align-items:flex-end;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  /* chips de nivel / tema */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .chip{border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.3);color:var(--muted);
    border-radius:20px;padding:7px 15px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;
    backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur)}
  /* mismo color que el botón principal (.btn.amar) — pedido explícito, para que "elegido"
     se vea igual en toda la app */
  .chip.on{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.85);color:var(--texto)}
  /* flechita para plegar/desplegar listas de temas */
  details{margin:2px 0 10px}
  summary{cursor:pointer;color:var(--titulo2);font-weight:600;font-size:.85rem;
    padding:6px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▶';display:inline-block;margin-right:6px;font-size:.65rem;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  /* resumen de capítulo — mismo look que h3, pero es el propio interruptor de abrir/cerrar */
  .temaCap > summary{color:var(--titulo2);font-size:.78rem;margin:16px 0 8px;font-weight:700;
    text-transform:uppercase;letter-spacing:.8px;padding:0}
  /* enunciado */
  .enunciado{background:var(--contraste);color:var(--contraste-texto);border-radius:20px;padding:22px 18px;
    font-size:1.22rem;text-align:center;margin-bottom:16px;line-height:1.6}
  .enunciado .fr{color:rgba(255,255,255,.72)}
  /* fracción apilada */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
    margin:0 4px;line-height:1.15;font-weight:700}
  .fr b{display:block;padding:0 5px}
  .fr i{display:block;padding:0 5px;border-top:2px solid currentColor;font-style:normal}
  /* entradas */
  .campo{width:100%;border:1.5px solid rgba(255,255,255,.5);border-radius:16px;padding:13px;
    font-size:1.15rem;text-align:center;font-family:inherit;color:var(--texto);background:var(--superficie)}
  .campo:focus{outline:none;border-color:var(--texto)}
  .numRow{display:flex;gap:8px}
  .numRow .campo{flex:1;min-width:0}
  .signo{flex:none;width:52px;padding:0;font-size:1.3rem;font-weight:700;margin-bottom:0}
  .fracIn{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:150px;margin:0 auto}
  .fracIn .campo{width:110px}
  .fracIn .barra{width:110px;height:3px;background:var(--titulo);border-radius:2px}
  .mixIn{display:flex;align-items:center;justify-content:center;gap:12px}
  .mixIn .campo{width:80px}
  .multiIn{display:grid;gap:8px}
  .procesoCaja{margin-bottom:12px}
  .procesoTit{font-weight:700;margin-bottom:6px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .procesoOcultar{flex:none;background:none;border:0;color:var(--texto);text-decoration:underline;font-family:inherit;font-size:.85rem;cursor:pointer;padding:4px 2px;white-space:nowrap}
  .procesoTit small{font-weight:400;opacity:.7}
  .dgNota{font-size:.92em;opacity:.85;margin:0 0 10px;line-height:1.35}
  .pasoFila{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pasoFila > span{min-width:18px;font-weight:700;opacity:.7;text-align:center}
  .pasoFila .campo{flex:1;min-width:0;margin:0;text-align:left}
  .pasoPartes{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .pasoPartes .pt{flex:1 1 90px;min-width:70px}
  .pfr{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
  .pasoFila .pfr .campo{flex:none;width:68px;padding:7px 6px;font-size:1rem;text-align:center}
  .pfa{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding:4px 0;max-width:100%}
  .pfaFila{display:flex;align-items:center;gap:6px}
  .pfaFila b{font-size:1.2rem}
  .pbarra{display:block;width:100%;height:2px;background:var(--titulo);border-radius:2px}
  .pfrX{position:absolute;top:-9px;right:-9px;width:22px;height:22px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:var(--texto);font-size:.9rem;line-height:1;cursor:pointer}
  .pasoFrBtn{flex:none;width:52px;height:46px;border-radius:14px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:var(--muted);font-weight:700;font-size:.62rem;padding:0;font-family:inherit;cursor:pointer}
  .multiFila{display:flex;align-items:center;gap:10px}
  .multiFila > span{min-width:96px;font-weight:700}
  .multiFila .campo{flex:1;min-width:0;margin:0}
  .multiBloque{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--borde,rgba(128,128,128,.25))}
  .multiBloque:first-child{border-top:0;padding-top:0}
  .multiEt{font-weight:700}
  .opt{display:flex;gap:10px}
  .opt .btn{flex:1;font-size:1.25rem;padding:18px}
  .ordenCaja{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .ordenChip{position:relative;border:1.5px solid rgba(255,255,255,.5);background:var(--superficie);
    border-radius:14px;padding:14px 20px;font-size:1.25rem;cursor:pointer;font-family:inherit;color:var(--texto)}
  .ordenChip.on{border-color:var(--texto);background:rgba(255,255,255,.55)}
  .ordenChip .num{position:absolute;top:-9px;right:-9px;background:var(--contraste);color:var(--contraste-texto);
    width:24px;height:24px;border-radius:50%;font-size:.8rem;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  /* feedback */
  .fb{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-weight:600}
  .fb.ok{background:var(--verde-bg);color:#1e7a48;border-left:5px solid var(--verde)}
  .fb.mal{background:var(--rojo-bg);color:#b03a2e;border-left:5px solid var(--rojo)}
  .fb.medio{background:var(--ambar-bg);color:#9c6410;border-left:5px solid var(--ambar)}
  .fb small{display:block;font-weight:400;margin-top:4px}
  .expl{background:var(--gris);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .expl h3{margin-top:0}
  .expl ol{margin:0;padding-left:20px}
  .expl li{margin-bottom:6px;font-size:.95rem}
  .expl li:last-child{margin-bottom:0;font-weight:600;color:var(--titulo)}
  .pasosLibres .pasoTit{font-weight:700;color:var(--titulo);margin-top:12px;font-size:.95rem}
  .pasosLibres .pasoTit:first-child{margin-top:0}
  .pasosLibres .pasoLin{padding-left:18px;margin-top:4px;font-size:.95rem}
  .receta .rPide{font-size:.95rem;margin-bottom:10px}
  .receta .rPaso{margin-bottom:12px}
  .receta .rTit{font-weight:700;color:var(--titulo);font-size:.97rem}
  .receta .rLin{font-size:.95rem;margin-top:5px;padding-left:10px}
  .receta .rSub{font-weight:600;font-size:.92rem;margin-top:8px;opacity:.95}
  .receta .rFin{font-size:.95rem;margin-top:7px}
  .receta .oculto{display:none}
  .receta .rNav{margin-top:6px}
  .receta .rBtns{display:flex;gap:8px}
  .receta .rBtns .btn{flex:1}
  .receta .rBtns .btn:disabled{opacity:.35;cursor:default}
  .receta .rPie{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:.85rem;opacity:.85}
  .receta .rModo{background:none;border:0;color:var(--texto);text-decoration:underline;font-family:inherit;font-size:.85rem;cursor:pointer;padding:6px 2px}
  .cambia{color:#e8a23a;font-weight:700}
  /* atajo para resolverlo más rápido — sale del <ol> y se pinta aparte (ver explPasos) */
  .truco{background:var(--superficie);border-left:4px solid var(--acento);border-radius:8px;
    padding:9px 12px;margin-top:11px;font-size:.9rem;line-height:1.5}
  .truco b{display:block;color:var(--titulo2);font-size:.8rem;letter-spacing:.3px;margin-bottom:2px}
  /* IA (Gemini): etiqueta "AI" azul suave en la esquina de lo que usa IA (.ai-tagged), mini-etiqueta dentro de los botones (.aiB) y tarjeta de respuesta (.aiCaja) */
  .ai-tagged{position:relative}
  .ai-tagged::after{content:'AI';position:absolute;top:var(--ai-top,8px);right:10px;font-size:10px;font-weight:900;letter-spacing:.8px;line-height:1;padding:3px 7px;border-radius:8px;background:rgba(21,101,192,.12);border:1px solid rgba(21,101,192,.22);color:#000;pointer-events:none}
  .aiB{display:inline-block;margin-left:6px;vertical-align:middle;font-size:10px;font-weight:900;letter-spacing:.8px;line-height:1;padding:3px 7px;border-radius:8px;background:rgba(21,101,192,.12);border:1px solid rgba(21,101,192,.22);color:#000}
  body.night .ai-tagged::after, body.night .aiB{color:#fff;background:rgba(100,160,255,.12);border-color:rgba(100,160,255,.24)}
  .aiCaja{background:var(--superficie);border:var(--lg-border);border-radius:14px;padding:30px 14px 8px;margin:10px 0;font-size:.93rem;line-height:1.5;color:var(--texto)}
  .aiCaja b{color:var(--titulo)}
  .aiCaja p{margin:0 0 8px}
  .aiCerrar{display:block;margin:2px 0 0 auto;background:none;border:none;color:var(--muted);font-weight:700;font-size:.82rem;font-family:inherit;cursor:pointer;padding:6px 0}
  .aiFila{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .aiFila .btn{flex:1;min-width:140px;margin:0;cursor:pointer;text-align:center}
  .aiTema{padding:10px 0;border-top:1px solid var(--gris2)}
  .aiTema span{display:block;font-size:.88rem;color:var(--titulo2);margin:2px 0 8px}
  .aiTema .btn{margin:0}
  /* Chat de IA (burbuja AI → hoja tipo chat). Mismo motor que Fit-F/Fit-M. --aiborde = borde suave de claro/noche */
  :root{--aiborde:rgba(0,0,0,.14)}
  body.night{--aiborde:rgba(255,255,255,.16)}
    /* Chat de IA ("Adaptar el entreno de hoy"): en la portada solo se ve la burbuja AI; al tocarla se abre una hoja tipo chat */

    .aic-in { display:flex; align-items:center; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--aiborde); }

    /* Botones de IA: --bg es transparente en este tema, así que fondo y letra van fijos (claro: oscuro/blanco; noche: blanco/oscuro) */

  /* stats */

  .racha button{border:2px solid transparent;cursor:pointer;font-family:inherit}

  /* modo oscuro: antes seguía el sistema solo (media query), ahora es elegible a mano
     (Ajustes → Tema) — por eso vive en la clase body.night, no en @media, igual que en
     Fit-F/Fit-M (ver aplicarTema()/resolverNoche()). "Automático (celular)" sigue
     poniendo/quitando esta misma clase según el sistema, así que se ve idéntico a antes. */
  body.night{
    --acento:#ffc93c;
    --verde:#2ecc71; --verde-bg:#123322;
    --rojo:#e74c3c; --rojo-bg:#3a1c1c;
    --ambar:#f39c12; --ambar-bg:#3a2c10;
    --gris:rgba(255,255,255,.06); --gris2:rgba(255,255,255,.14);
    --texto:#f5f5f7; --muted:#9a9aa4;
    --card:rgba(28,28,30,.72);
    --lg-border:1px solid rgba(255,255,255,.12);
    --lg-shadow:0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4),
                inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3);
    --titulo:var(--texto); --titulo2:var(--muted);
    --superficie:var(--card);
    --contraste:rgba(255,255,255,.14); --contraste-texto:#f5f5f7;
  }
  body.night{background:#000}
  body.night::before{opacity:.05}
  body.night .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--texto);
    box-shadow:0 4px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
  body.night .btn.amar{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
  body.night .btn.sec{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.10);color:var(--muted)}
  body.night .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:var(--texto)}
  body.night .nota{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
  body.night .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--muted)}

  body.night .modCheck{border-color:rgba(255,255,255,.18)}
  body.night .modCheck.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32)}
  /* mismo blanco translúcido que .btn.amar, pero con más opacidad — en oscuro el amar

  body.night .calcBtn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);
    box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
  .calcCard{max-width:300px}
  .calcPantalla{background:var(--contraste);color:var(--contraste-texto);border-radius:16px;
    padding:18px 16px;text-align:right;font-size:1.9rem;font-weight:700;margin-bottom:14px;
    overflow-x:auto;white-space:nowrap}
  /* historial de cuentas del ejercicio actual — oculto (display:none inline) cuando está vacío,
     así no roba espacio en la mayoría de las aperturas */
  .calcHist{max-height:98px;overflow-y:auto;margin:-6px 0 14px}
  .calcHistFila{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    width:100%;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.14);
    padding:6px 2px;font-family:inherit;cursor:pointer;color:var(--muted);font-size:.82rem;text-align:left}
  .calcHistFila:last-child{border-bottom:none}
  .calcHistFila b{color:var(--texto);font-weight:800;flex:none}
  body.night .calcHistFila{border-bottom-color:rgba(255,255,255,.1)}
  .calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  /* sin backdrop-filter propio (mismo motivo que .btn, ver comentario junto a .btn arriba):
     estos botones viven siempre dentro de .calcCard, que ya está esmerilada — un blur por
     cada uno de los 16 botones era puro costo de GPU repetido, y se sentía como lag al tocar */
  .calcGrid button{border:1.5px solid rgba(255,255,255,.45);border-radius:14px;padding:16px 0;
    font-size:1.15rem;font-weight:700;cursor:pointer;font-family:inherit;color:var(--texto);
    background:rgba(255,255,255,.42)}
  .calcGrid button:active{transform:scale(.95)}
  .calcGrid .calcOp{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.75)}
  .calcGrid .calcCero{grid-column:span 2}
  body.night .calcGrid button{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
  body.night .calcGrid .calcOp{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.26)}
  /* tarjeta flotante anclada a un botón (ej. "Grupos de examen" desde Inicio) —
     mismo vidrio que .card, pero angosta y con las filas de .ajRow adentro */
  .menuFlot{position:fixed;z-index:60;padding:6px;max-height:60vh;overflow-y:auto;margin:0}
</style>

<body>

<!-- calculadora — botón flotante visible en toda la app, incluso practicando -->
<button class="calcBtn" onclick="abrirCalc()" aria-label="Calculadora">=</button>
<div class="overlay" id="calcOv" style="display:none" onclick="if(event.target===this) cerrarCalc()">
  <div class="card calcCard">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">Calculadora</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="calcUsar()" id="calcUsarBtn" aria-label="Usar este resultado como respuesta"
          style="background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;
          padding:5px 11px;font-size:.76rem;font-weight:700;cursor:pointer;color:var(--texto);font-family:inherit;
          flex:none;width:auto;white-space:nowrap">↵ Usar</button>
        <button onclick="cerrarCalc()" aria-label="Cerrar"
          style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--texto);font-family:inherit;flex:none;width:auto">✕</button>
      </div>
    </div>
    <div class="calcPantalla" id="calcPantalla">0</div>
    <div class="calcHist" id="calcHist" style="display:none"></div>
    <div class="calcGrid">
      <button onclick="calcClear()">C</button>
      <button onclick="calcSigno()">±</button>
      <button onclick="calcPorcentaje()">%</button>
      <button class="calcOp" onclick="calcOp('÷')">÷</button>
      <button onclick="calcDigito('7')">7</button>
      <button onclick="calcDigito('8')">8</button>
      <button onclick="calcDigito('9')">9</button>
      <button class="calcOp" onclick="calcOp('×')">×</button>
      <button onclick="calcDigito('4')">4</button>
      <button onclick="calcDigito('5')">5</button>
      <button onclick="calcDigito('6')">6</button>
      <button class="calcOp" onclick="calcOp('-')">−</button>
      <button onclick="calcDigito('1')">1</button>
      <button onclick="calcDigito('2')">2</button>
      <button onclick="calcDigito('3')">3</button>
      <button class="calcOp" onclick="calcOp('+')">+</button>
      <button class="calcCero" onclick="calcDigito('0')">0</button>
      <button onclick="calcPunto()">.</button>
      <button class="calcOp" onclick="calcIgual()">=</button>
    </div>
  </div>

<script>
/* ══════════════════════════════════════════════════════════
   1. HELPERS MATEMÁTICOS  (funciones puras, sin dependencias)
   ══════════════════════════════════════════════════════════ */
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a; }
function mcm(a,b){ return Math.abs(a*b)/mcd(a,b); }
function esPrimo(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  for(let d=3; d*d<=n; d+=2) if(n%d===0) return false;
  return true;
}
function factorizar(n){
  const f={}; let d=2;
  while(d*d<=n){ while(n%d===0){ f[d]=(f[d]||0)+1; n/=d; } d++; }
  if(n>1) f[n]=(f[n]||0)+1;
  return f;
}
function simplificar(n,d){ const g=mcd(n,d)||1; return [n/g, d/g]; }
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup = n => String(n).split('').map(c=>SUP[c]).join('');
function fmtFactores(f){
  const ps = Object.keys(f).map(Number).sort((a,b)=>a-b);
  if(!ps.length) return '1';
  return ps.map(p => f[p]>1 ? p+sup(f[p]) : ''+p).join(' × ');
}
// dos rectas cruzadas: ∠1 = g (dado, en dorado), ∠2 = 180-g (adyacente), ∠3 = g (opuesto por el vértice)
function svgCruce(g, uid){
  const cx=150, cy=110, R=90, rArc=40, rTxt=60;
  const rad = a => a*Math.PI/180;
  const pt = (a,r) => ({ x:(cx + r*Math.cos(rad(a))).toFixed(1), y:(cy - r*Math.sin(rad(a))).toFixed(1) });
  const p0=pt(0,R), p180=pt(180,R), pg=pt(g,R), pgOp=pt(g+180,R);
  const t1=pt(g/2,rTxt), t2=pt((g+180)/2,rTxt), t3=pt(180+g/2,rTxt);
  const arc = (a1,a2) => { const q1=pt(a1,rArc), q2=pt(a2,rArc); return `M ${q1.x} ${q1.y} A ${rArc} ${rArc} 0 0 1 ${q2.x} ${q2.y}`; };
  return `<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="fe${uid}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker>
      <marker id="fs${uid}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker>
    </defs>
    <line x1="${p180.x}" y1="${p180.y}" x2="${p0.x}" y2="${p0.y}" stroke="currentColor" stroke-width="2" marker-start="url(#fs${uid})" marker-end="url(#fe${uid})"/>
    <line x1="${pgOp.x}" y1="${pgOp.y}" x2="${pg.x}" y2="${pg.y}" stroke="currentColor" stroke-width="2" marker-start="url(#fs${uid})" marker-end="url(#fe${uid})"/>
    <path d="${arc(0,g)}" fill="none" stroke="var(--acento)" stroke-width="2"/>
    <path d="${arc(g,180)}" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
    <path d="${arc(180,180+g)}" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
    <text x="${t1.x}" y="${t1.y}" fill="var(--acento)" font-size="16" font-weight="800" text-anchor="middle" dominant-baseline="middle">${g}°</text>
    <text x="${t2.x}" y="${t2.y}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">∠2</text>
    <text x="${t3.x}" y="${t3.y}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">∠3</text>
  </svg>`;
}
// cuatro puntos que arman cometa / rectángulo / paralelogramo / trapecio, siempre dentro del mismo viewBox
function svgCuadrilatero(tipo, uid){
  const RR = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const pick2 = arr => arr[Math.floor(Math.random()*arr.length)];
  let pts;
  if(tipo==='rectangulo'){
    // a veces bien ancho, a veces bien alto, a veces casi cuadrado — todas son "Rectángulo" igual
    const w = RR(90,190), h = RR(60,150);
    const x0 = 150-w/2, y0 = 100-h/2;
    pts = [[x0,y0],[x0+w,y0],[x0+w,y0+h],[x0,y0+h]];
  } else if(tipo==='paralelogramo'){
    const w = RR(100,150), h = RR(70,110), skew = pick2([1,-1]) * RR(25,55);
    const x0 = 150 - w/2 - Math.max(skew,0)/2, y0 = 100-h/2;
    pts = [[x0+Math.max(-skew,0),y0],[x0+Math.max(-skew,0)+w,y0],[x0+Math.max(-skew,0)+w+skew,y0+h],[x0+Math.max(-skew,0)+skew,y0+h]];
  } else if(tipo==='trapecio'){
    const baseM = RR(140,190), baseCh = RR(50,90), h = RR(70,110);
    const offset = pick2(['centrado','izquierda']);
    const dx = offset==='centrado' ? (baseM-baseCh)/2 : RR(10,baseM-baseCh-10);
    const x0 = 150-baseM/2, y0 = 100-h/2;
    pts = [[x0+dx,y0],[x0+dx+baseCh,y0],[x0+baseM,y0+h],[x0,y0+h]];
  } else {   // cometa — a veces vertical (alta), a veces acostada de lado (misma figura, ejes cambiados)
    const alaX = RR(45,70), alaY = RR(40,60), colaY = RR(80,110);
    const vertical = Math.random()<0.6;
    const rel = [[0,-(alaY+15)],[alaX,0],[0,colaY-15],[-alaX,0]];   // relativo al centro (150,100)
    pts = rel.map(([dx,dy]) => vertical ? [150+dx,100+dy] : [150+dy,100+dx]);
  }
  const puntos = pts.map(p=>p.join(',')).join(' ');
  return `<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${puntos}" fill="none" stroke="var(--acento)" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>`;
}
// dos rectas paralelas cortadas por una transversal — para "el siguiente diagrama representa___"
function svgParalelasTransversal(uid){
  return `<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <line x1="30" y1="60" x2="270" y2="60" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="140" x2="270" y2="140" stroke="currentColor" stroke-width="2"/>
    <line x1="90" y1="15" x2="210" y2="185" stroke="var(--acento)" stroke-width="2"/>
  </svg>`;
}
// varias rectas saliendo del mismo punto, dentro de un mismo semiplano (para que TODOS los
// ángulos que se formen entre ellas sean, sin excepción, menores que 180°)
function svgRayos(angulos, uid){
  const ox=60, oy=180, len=170, rad = a=>a*Math.PI/180;
  const lines = angulos.map(a => {
    const x = (ox + len*Math.cos(rad(a))).toFixed(1), y = (oy - len*Math.sin(rad(a))).toFixed(1);
    return `<line x1="${ox}" y1="${oy}" x2="${x}" y2="${y}" stroke="currentColor" stroke-width="2"/>`;
  }).join('');
  return `<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${ox}" cy="${oy}" r="3.5" fill="var(--acento)"/>${lines}
  </svg>`;
}
// símbolo de resistor (zigzag de 3 picos) entre dos puntos — horizontal o vertical según el eje
function zigzagV(x, y1, y2){
  const amp=9, lead=(y2-y1)*0.15, y0=y1+lead, y5=y2-lead, step=(y5-y0)/4;
  return `M ${x} ${y1} L ${x} ${y0.toFixed(1)} `+
    `L ${(x+amp).toFixed(1)} ${(y0+step).toFixed(1)} `+
    `L ${(x-amp).toFixed(1)} ${(y0+2*step).toFixed(1)} `+
    `L ${(x+amp).toFixed(1)} ${(y0+3*step).toFixed(1)} `+
    `L ${x} ${y5.toFixed(1)} L ${x} ${y2}`;
}
function zigzagH(x1, x2, y){
  const amp=9, lead=(x2-x1)*0.15, x0=x1+lead, x5=x2-lead, step=(x5-x0)/4;
  return `M ${x1} ${y} L ${x0.toFixed(1)} ${y} `+
    `L ${(x0+step).toFixed(1)} ${(y+amp).toFixed(1)} `+
    `L ${(x0+2*step).toFixed(1)} ${(y-amp).toFixed(1)} `+
    `L ${(x0+3*step).toFixed(1)} ${(y+amp).toFixed(1)} `+
    `L ${x5.toFixed(1)} ${y} L ${x2} ${y}`;
}
// símbolo de batería (pila): barra larga y delgada (+) arriba, barra corta y gruesa (−) abajo,
// insertada en el punto medio de un tramo vertical de alambre entre y1 y y2
function bateriaV(x, y1, y2){
  const midY=(y1+y2)/2;
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${midY-8}" stroke="currentColor" stroke-width="2"/>
    <line x1="${x-12}" y1="${midY-8}" x2="${x+12}" y2="${midY-8}" stroke="currentColor" stroke-width="2"/>
    <line x1="${x-7}" y1="${midY+8}" x2="${x+7}" y2="${midY+8}" stroke="currentColor" stroke-width="5"/>
    <line x1="${x}" y1="${midY+8}" x2="${x}" y2="${y2}" stroke="currentColor" stroke-width="2"/>`;
}
// circuito de una sola malla (fuente + un resistor) — para Ley de Ohm y Ley de Watt. Cada
// etiqueta (V/R/I/P) es el texto a mostrar, o null para no dibujarla (cuando ese dato no
// aplica a la pregunta); "?" se usa para la incógnita que hay que hallar.
function svgCircuitoSimple(V, R, I, P, uid){
  const L=80, Rd=220, T=50, B=150;
  return `<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="fa${uid}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--acento)"/></marker></defs>
    <line x1="${L}" y1="${T}" x2="${Rd}" y2="${T}" stroke="currentColor" stroke-width="2"/>
    <line x1="${L}" y1="${B}" x2="${Rd}" y2="${B}" stroke="currentColor" stroke-width="2"/>
    ${bateriaV(L,T,B)}
    <path d="${zigzagV(Rd,T,B)}" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="${L+25}" y1="${T}" x2="${L+70}" y2="${T}" stroke="var(--acento)" stroke-width="2.5" marker-end="url(#fa${uid})"/>
    ${I!=null?`<text x="${(L+Rd)/2}" y="${T-12}" fill="var(--acento)" font-size="14" font-weight="800" text-anchor="middle">I = ${I}</text>`:''}
    ${V!=null?`<text x="${L}" y="${B+26}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle">V = ${V}</text>`:''}
    ${R!=null?`<text x="${Rd}" y="${B+26}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle">R = ${R}</text>`:''}
    ${P!=null?`<text x="${(L+Rd)/2}" y="${B+26}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle">P = ${P}</text>`:''}
  </svg>`;
}
// circuito en serie: fuente + n resistores en línea sobre el alambre de arriba. opts:
// {E, It, marca} — It es el texto de la flecha de corriente (null = no mostrarla todavía,
// como cuando aún no se sabe It); marca:{idx,tipo:'V'|'P'} anota V(Ri)=? o P(Ri)=? bajo un
// resistor puntual, o marca:{tipo:'Rt'|'Pt'} anota esa incógnita cerca de la fuente.
function svgCircuitoSerie(Rs, opts, uid){
  const {E, It, marca, rIncognita} = opts;
  const nm = i => (opts.nombres||[])[i] || 'R'+(i+1);
  const n = Rs.length, L=45, Rd=335, T=55, B=170, midY=(T+B)/2;
  const topL=125, topR=325, segW=(topR-topL)/n;
  let zz='', rlabels='', extra='';
  for(let i=0;i<n;i++){
    const x1=topL+segW*i+10, x2=topL+segW*(i+1)-10, cx=(x1+x2)/2;
    zz += `<path d="${zigzagH(x1,x2,T)}" fill="none" stroke="currentColor" stroke-width="2"/>`;
    const rTxt = rIncognita===i ? `${nm(i)}=?` : `${nm(i)}=${Rs[i]}Ω`;
    // alturas alternadas: con 4-5 resistores las etiquetas vecinas ("R1=15KΩ") no caben en una sola fila
    rlabels += `<text x="${cx}" y="${T-12-(i%2)*15}" fill="${rIncognita===i?'var(--acento)':'currentColor'}" font-size="11" font-weight="700" text-anchor="middle">${rTxt}</text>`;
    if(marca && marca.idx===i) extra += `<text x="${cx}" y="${T+24}" fill="var(--acento)" font-size="12" font-weight="800" text-anchor="middle">${marca.tipo}(${nm(i)})=?</text>`;
  }
  if(marca && (marca.tipo==='Rt'||marca.tipo==='Pt'||marca.tipo==='Vt')) extra += `<text x="${(L+Rd)/2}" y="${B+40}" fill="var(--acento)" font-size="13" font-weight="800" text-anchor="middle">${marca.tipo} = ?</text>`;
  const flechaI = It!=null ? `<line x1="${L+15}" y1="${T}" x2="${topL-15}" y2="${T}" stroke="var(--acento)" stroke-width="2.5" marker-end="url(#fa${uid})"/>
    <text x="${(L+topL)/2}" y="${T-10}" fill="var(--acento)" font-size="12" font-weight="800" text-anchor="middle">It=${It}</text>` : '';
  const eLabel = E!=null ? `E=${E}` : '';
  return `<svg viewBox="0 0 360 220" style="width:100%;max-width:340px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="fa${uid}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--acento)"/></marker></defs>
    <line x1="${L}" y1="${T}" x2="${topL}" y2="${T}" stroke="currentColor" stroke-width="2"/>
    <line x1="${topR}" y1="${T}" x2="${Rd}" y2="${T}" stroke="currentColor" stroke-width="2"/>
    <line x1="${L}" y1="${B}" x2="${Rd}" y2="${B}" stroke="currentColor" stroke-width="2"/>
    <line x1="${Rd}" y1="${T}" x2="${Rd}" y2="${B}" stroke="currentColor" stroke-width="2"/>
    ${bateriaV(L,T,B)}
    ${zz}
    ${flechaI}
    ${rlabels}
    ${extra}
    <text x="${L}" y="${B+26}" fill="currentColor" font-size="12" font-weight="700" text-anchor="middle">${eLabel}</text>
  </svg>`;
}
// circuito en paralelo: fuente + n resistores como ramas verticales entre dos rieles
// horizontales. opts: {V, It, marca} — mismo esquema que svgCircuitoSerie; marca:{idx,tipo:'I'}
// anota I(Ri)=? bajo una rama puntual, marca:{tipo:'Rt'} lo anota al centro.
function svgCircuitoParalelo(Rs, opts, uid){
  const {V, It, marca} = opts;
  const nm = i => (opts.nombres||[])[i] || 'R'+(i+1);
  const n = Rs.length, L=45, Rd=335, T=55, B=175, midY=(T+B)/2;
  const branchL=130, branchR=325, segW = n>1 ? (branchR-branchL)/(n-1) : 0;
  let branches='', labels='', extra='';
  for(let i=0;i<n;i++){
    const x = n>1 ? branchL+segW*i : (branchL+branchR)/2;
    branches += `<path d="${zigzagV(x,T,B)}" fill="none" stroke="currentColor" stroke-width="2"/>`;
    labels += `<text x="${x}" y="${B+22}" fill="currentColor" font-size="11" font-weight="700" text-anchor="middle">${nm(i)}=${Rs[i]}Ω</text>`;

function anguloVertice(p, i){
  const a = p[(i+p.length-1)%p.length], b = p[i], c = p[(i+1)%p.length];
  const v1 = [a[0]-b[0], a[1]-b[1]], v2 = [c[0]-b[0], c[1]-b[1]];
  return Math.acos((v1[0]*v2[0] + v1[1]*v2[1]) / (Math.hypot(...v1)*Math.hypot(...v2))) * 180/Math.PI;
}

  return primero ? (c<0 ? '−' : '') + cuerpo : (c<0 ? ' − ' : ' + ') + cuerpo; };
// teclado numérico del teléfono a veces no trae signo "-" (iOS, sobre todo) — botón ± como atajo
function toggleSigno(id){
  const el = $(id);
  el.value = el.value.startsWith('-') ? el.value.slice(1) : '-' + el.value;
  el.focus();
}

// tema con un banco fijo de preguntas que salen EN ORDEN (una práctica de examen copiada tal cual)
function _modExamen(id, nombre, banco, cual){
  return { id, nombre, secciones:['5.9'], banco:banco.length, _sig:0,
    nuevaRonda(){ this._sig = 0; },
    gen(){
      const C = (n,d=1) => ({n,d}), i = this._sig % banco.length; this._sig++;
      const ej = banco[i](C);
      // una cuenta por renglón: "a → b → c" y "…, y …" se separan para que no quede todo pegado
      ej.explicacion = ej.explicacion.map(l => typeof l !== 'string' || /^§|^TRUCO:/.test(l) || l.includes('<svg') ? l
        : l.replace(/(= −?[\d.,/]+) → (?=−?[\d(][\d.,/)]* [+−×÷] )/g, '$1<br>').replace(/, y (?=[\d−(])/g, '<br>y '));
      ej.enunciado =`<small>Pregunta ${i+1} de ${banco.length} · ${cual} del Examen Departamental</small><br>` + ej.enunciado;
      ej.__n = i;
      return ej;
    } };
}

// El ejemplo del truco se arma con el MISMO número del ejercicio, no con uno inventado.
// ── capítulo 3 con forma de RECETA (ver receta()) ──
const _resto = (n, d) => n % d === 0 ? `${n} ÷ ${d} = ${n/d}, exacto` : `${n} ÷ ${d} = ${Math.floor(n/d)} y sobra${n%d > 1 ? 'n' : ''} ${n%d}`;
const _veces = e => e === 1 ? '1 vez' : `${e} veces`;
const _supE1 = e => e > 1 ? sup(e) : '';
// multiplicación de varios números de dos en dos: 2 × 3 = 6 → 6 × 5 = 30 → …
const multLista = xs => { if(xs.length < 2) return String(xs[0]); let s = xs[0]; const p = []; for(let i = 1; i < xs.length; i++){ p.push(`${s} × ${xs[i]} = ${s * xs[i]}`); s *= xs[i]; } return p.join(' → '); };
function explDivisibilidad(n, d, nota){
  const s = String(n), ult = +s[s.length-1], sd = sumaDig(n), dos = n%100, tres = n%1000, ok = n%d === 0;
  const sumaTxt = sd > 9 ? `${s.split('').join(' + ')} = ${sd}, y ${String(sd).split('').join(' + ')} = ${sumaDig(sd)}` : `${s.split('').join(' + ')} = ${sd}`;
  const mitades = (x, veces) => { const p = [x]; for(let i = 0; i < veces; i++){ if(x % 2) return { ok:false, t:`${p.join(' → ')}, y ${x} ya no se parte exacto a la mitad` }; x /= 2; p.push(x); } return { ok:true, t:`${p.join(' → ')} (salió exacto las ${veces} veces)` }; };
  const r2 = `La última cifra es ${ult} → ${ult%2 === 0 ? cb('par, sí') : cb('impar, no')}`;
  const r3 = `${sumaTxt} → ${sd%3 === 0 ? cb('múltiplo de 3, sí') : cb('no es múltiplo de 3, no')}`;
  const r4 = dos === 0 ? `Las dos últimas cifras son 00 → ${cb('sí')}` : (m => `Las dos últimas cifras: ${m.t} → ${cb(m.ok ? 'sí' : 'no')}`)(mitades(dos, 2));
  const reg = {
    2:{ regla:'Para el 2 solo se mira la ÚLTIMA cifra: si es par (0, 2, 4, 6, 8), sí.', aplica:[r2], error:'sumar las cifras: para el 2 solo se mira la última.' },
    5:{ regla:'Para el 5 solo se mira la ÚLTIMA cifra: tiene que ser 0 o 5.', aplica:[`La última cifra es ${ult} → ${cb(ult === 0 || ult === 5 ? 'sí' : 'no')}`], error:'pensar que solo sirve terminar en 5: terminar en 0 también sirve.' },
    10:{ regla:'Para el 10 la ÚLTIMA cifra tiene que ser 0.', aplica:[`La última cifra es ${ult} → ${cb(ult === 0 ? 'sí' : 'no')}`], error:'pensar que terminar en 5 sirve: para el 10 tiene que ser 0.' },
    3:{ regla:'Para el 3 se SUMAN todas las cifras: si la suma es múltiplo de 3 (3, 6, 9, 12…), sí.', aplica:[r3], error:'mirar si termina en 3: para el 3 se suman las cifras.' },
    9:{ regla:'Para el 9 se SUMAN todas las cifras: si la suma es múltiplo de 9 (9, 18, 27…), sí.', aplica:[`${sumaTxt} → ${sd%9 === 0 ? cb('múltiplo de 9, sí') : cb('no es múltiplo de 9, no')}`], error:'confundirla con la del 3: para el 9 la suma tiene que ser múltiplo de 9.' },
    4:{ regla:'Para el 4 solo importan las DOS últimas cifras: pártelas a la mitad dos veces; si las dos veces sale exacto, sí.', aplica:[r4], error:'mirar solo si es par: para el 4 hay que partir a la mitad DOS veces.' },
    8:{ regla:'Para el 8 solo importan las TRES últimas cifras: pártelas a la mitad tres veces; si las tres veces sale exacto, sí.',
      aplica:[tres === 0 ? `Las tres últimas cifras son 000 → ${cb('sí')}` : (m => `Las tres últimas cifras: ${m.t} → ${cb(m.ok ? 'sí' : 'no')}`)(mitades(tres, 3))], error:'partir a la mitad solo una o dos veces: para el 8 son TRES.' },
    6:{ regla:'6 = 2 × 3: tiene que cumplir LAS DOS reglas, la del 2 y la del 3.', aplica:[`¿Entre 2? ${r2}`, `¿Entre 3? ${r3}`], error:'revisar solo una regla: tienen que cumplirse las DOS.' },
    12:{ regla:'12 = 3 × 4: tiene que cumplir LAS DOS reglas, la del 3 y la del 4.', aplica:[`¿Entre 3? ${r3}`, `¿Entre 4? ${r4}`], error:'revisar solo una regla: la del 3 Y la del 4.' }
  }[d];
  return receta({ pide:`si ${n} ÷ ${d} sale exacto, sin que sobre nada.`,
    pasos:[{ t:`Usa la regla del ${d}`, l:[reg.regla] }, { t:`Aplícala a ${n}`, l:reg.aplica }, { t:'Decide', l:[`${n} ${cb(ok ? 'SÍ' : 'NO')} es divisible por ${d}.`, ...(nota ? [nota] : [])] }],
    resp: ok ? 'Sí' : 'No', comp:`${_resto(n, d)} ✓`, error:reg.error, ejemplo:`${n} y el ${d} → ${ok ? 'sí' : 'no'}.` });
}

const TRAMPAS = [51,57,87,91,111,119,133,143,161,187,203,209,217,221,247,253,289,299];
function explPrimo(n){
  const primo = esPrimo(n), lim = Math.floor(Math.sqrt(n)), sd = sumaDig(n);
  let d = 2; while(n % d) d++;                       // el divisor más chico (n mismo si es primo)
  const pide = `si ${n} solo se divide exacto entre 1 y entre sí mismo (PRIMO) o tiene otros divisores (COMPUESTO).`;
  const fin = primo ? `Ninguno entró exacto → ${n} solo se divide entre 1 y ${n} → ${cb('PRIMO')}` : `${n} = ${d} × ${n/d} → tiene otro divisor → ${cb('COMPUESTO')}`;
  const error = TRAMPAS.includes(n) ? `decir primo porque "se ve" primo: ${n} = ${d} × ${n/d}.` : primo ? `seguir probando más allá de ${lim}: basta llegar a la raíz de ${n} (≈ ${lim}).` : 'decir primo solo porque es impar: muchos impares son compuestos (9, 15, 21…).';
  const resp = primo ? 'Número primo' : 'Número Compuesto', comp = primo ? '' : `${d} × ${n/d} = ${n} ✓`;
  if([2,3,5,7].includes(n)) return receta({ pide, pasos:[{ t:'Revisa si es de los primos de memoria', l:[`2, 3, 5 y 7 son primos → ${cb('PRIMO')}`] }], resp, error:'pensar que el 2 es compuesto porque es par: el 2 es el único primo par.', ejemplo:`${n} → primo.` });
  const facil = [], checks = [[2, `¿Es par (termina en 0, 2, 4, 6, 8)?`], [3, `¿Sus cifras suman múltiplo de 3? (${String(n).split('').join(' + ')} = ${sd})`], [5, '¿Termina en 0 o 5?']];
  let hallado = false;
  for(const [p, q] of checks){ if(hallado) break; const si = n % p === 0; facil.push(`${q} → ${si ? cb('Sí') + `: se divide entre ${p}` : 'No'}`); hallado = si; }
  const pasos = [{ t:'Descarta lo fácil: ¿entra el 2, el 3 o el 5?', l:facil }];
  if(!hallado){
    const prueba = [7, 11, 13, 17, 19].filter(p => p <= lim), li = [];
    for(const p of prueba){ li.push(_resto(n, p)); if(n % p === 0) break; }
    pasos.push({ t:`Prueba los primos que siguen, hasta ${lim} (la raíz de ${n})`, l: li.length ? li : [`No hace falta probar más: el próximo primo (7) ya pasa de ${lim}.`] });
  }
  pasos.push({ t:'Decide', l:[fin] });
  return receta({ pide, pasos, resp, comp, error, ejemplo:`${n} → ${primo ? 'primo' : `${d} × ${n/d}, compuesto`}.` });
}

// lista los primos repetidos (2 × 2 × 3) para poder comprobar multiplicando
function planosDe(n){
  const f = factorizar(n), out = [];
  Object.keys(f).map(Number).sort((a,b)=>a-b).forEach(p => { for(let i=0;i<f[p];i++) out.push(p); });
  return out.join(' × ');
}
// la "escalerita": dividir entre el primo más chico que entre, avisando cuando se pasa al siguiente
function pasosFactorizar(n){
  const li = []; let m = n, d = 2, ult = 0;
  while(m > 1){ if(m % d === 0){ if(ult && ult !== d) li.push(`El ${ult} ya no entra exacto en ${m} → se pasa al ${d}`); li.push(`${m} ÷ ${d} = ${m/d}`); ult = d; m /= d; } else d++; }
  return li;
}
function explFactorizar(n){
  const fmt = fmtFactores(factorizar(n)), planos = planosDe(n).split(' × ').map(Number);
  return receta({ pide:`escribir ${n} como una multiplicación de puros números primos (2, 3, 5, 7, 11…).`,
    pasos:[{ t:'Divide entre el primo más chico que entre exacto; repite hasta llegar a 1', l:pasosFactorizar(n) },
      { t:'Junta todos los primos entre los que dividiste', l:[`${n} = ${planosDe(n)}`, `Con exponentes: ${cb(n + ' = ' + fmt)}`] }],
    resp:`${n} = ${fmt}`, comp:`${multLista(planos)} ✓`, error:'parar antes de llegar a 1, o dejar un número que no es primo (como 4, 6 o 9).',
    ejemplo:`${n} = ${fmt}.` });
}

function explMcmListado(a, b){
  const m = mcm(a,b), la = [], lb = [];
  for(let k=1; a*k<=m; k++) la.push(a*k);
  for(let k=1; b*k<=m; k++) lb.push(b*k);
  return receta({ pide:`el número más chico que está en la tabla del ${a} y en la del ${b}.`,
    pasos:[{ t:`Escribe la tabla del ${a}`, l:[la.join(', ')] }, { t:`Escribe la tabla del ${b}`, l:[lb.join(', ')] },
      { t:'El primero que está en las dos tablas es el MCM', l:[`→ ${cb(m)}`] }],
    resp:String(m), comp:`${m} ÷ ${a} = ${m/a} y ${m} ÷ ${b} = ${m/b}, los dos exactos ✓`,
    error: m === a*b ? 'escoger un múltiplo común más grande: piden el más CHICO.' : `multiplicar ${a} × ${b} = ${a*b}: está en las dos tablas, pero no es el más chico (${m}).`,
    ejemplo:`tabla del ${a} y del ${b} → se encuentran en ${m}.` });
}

// factores y potencias que se usan en MCM y FCM
function _primosDe(ns){ const fs = ns.map(factorizar); return { fs, primos:[...new Set(fs.flatMap(f => Object.keys(f).map(Number)))].sort((a,b)=>a-b) }; }
const _potLinea = (p, e) => `${p}${sup(e)} = ${Array(e).fill(p).join(' × ')} = ${Math.pow(p, e)}`;
function explMcmFactores(ns){
  const { fs, primos } = _primosDe(ns), m = ns.reduce(mcm), mx = p => Math.max(...fs.map(f => f[p]||0));
  const lin = primos.map(p => `El ${p}: ${ns.map((n,i) => fs[i][p] ? `en el ${n} está ${_veces(fs[i][p])}` : `en el ${n} no está`).join('; ')} → va ${cb(p + _supE1(mx(p)))}`);
  return receta({ pide:`el número más chico que está en la tabla de ${ns.join(', ')} a la vez.`,
    pasos:[{ t:'Factoriza cada número', l:['A cada número se le divide entre el primo más chico que entre exacto, y se repite hasta llegar a 1:', ...ns.flatMap((n,i) => { const exp = fmtFactores(fs[i]), planos = planosDe(n);
        return [`${n}: ${pasosFactorizar(n).filter(x => /^\d+ ÷/.test(x)).join(' → ')}`, `→ ${n} = ${planos === exp ? exp : planos + ' = ' + exp}`]; })] },
      { t:'Toma TODOS los primos que aparecen, cada uno con las MÁS veces que salga', l: lin },
      { t:'Multiplícalos', l:[...primos.filter(p => mx(p) > 1).map(p => _potLinea(p, mx(p))), multLista(primos.map(p => Math.pow(p, mx(p)))), `MCM = ${cb(m)}`] }],
    resp:String(m), comp: ns.map(n => `${m} ÷ ${n} = ${m/n}`).join(', ') + ' — todos exactos ✓',
    error:'tomar las MENOS veces: eso es para el FCM. Para el MCM, las MÁS veces.', ejemplo:`${ns.join(', ')} → MCM = ${m}.` });
}
// pasos del FCM como líneas sueltas (los usan otros temas dentro de su propia receta)
function _fcmPartes(ns){
  const { fs, primos } = _primosDe(ns), g = ns.reduce(mcd), mn = p => Math.min(...fs.map(f => f[p]||0)), comunes = primos.filter(p => mn(p) > 0);
  return { fact: ns.map((n,i) => `${n} = ${n === 1 ? '1' : fmtFactores(fs[i])}`),
    sel: primos.map(p => mn(p) ? `El ${p}: está en todos (${ns.map((n,i) => `${n}: ${_veces(fs[i][p])}`).join(', ')}) → va ${cb(p + _supE1(mn(p)))}` : `El ${p}: no está en todos → ${cb('no va')}`),
    mult: [...comunes.filter(p => mn(p) > 1).map(p => _potLinea(p, mn(p))),
      comunes.length ? `${comunes.length > 1 ? multLista(comunes.map(p => Math.pow(p, mn(p)))) + ' → ' : ''}FCM = ${cb(g)}` : `Ningún primo está en todos → FCM = ${cb(1)}`] };
}
const pasosFcm = ns => { const p = _fcmPartes(ns); return [...p.fact, ...p.sel, ...p.mult]; };
function explFcm(ns, error){
  const g = ns.reduce(mcd), P = _fcmPartes(ns);
  return receta({ pide:`el número más grande que entra exacto en ${ns.join(', ')} (el FCM; en tu examen "MCD" es otra cosa).`,
    pasos:[{ t:'Factoriza cada número', l: P.fact }, { t:'Quédate SOLO con los primos que están en TODOS, con las MENOS veces que salgan', l: P.sel }, { t:'Multiplícalos', l: P.mult }],
    resp:String(g), comp: ns.map(n => `${n} ÷ ${g} = ${n/g}`).join(', ') + ' — todos exactos ✓',
    error: error || 'tomar todos los primos o las MÁS veces: eso es el MCM. El FCM usa solo los que están en TODOS, con las MENOS veces.',
    ejemplo:`${ns.join(', ')} → FCM = ${g}.` });
}
// simplificar una fracción como un paso de receta (si no se puede, lo dice)
const cadenaSimplif = (n, d) => { let x = Math.abs(n), y = d; const p = [`${x}/${y}`]; for(let q = 2; q <= y; q++) while(x % q === 0 && y % q === 0){ x /= q; y /= q; p.push(`÷ ${q} → ${x}/${y}`); } return p; };
function pasoSimplif(n, d){
  const g = mcd(n, d);
  if(g === 1) return { t:'Revisa si se puede simplificar', l:[`Ningún número (aparte del 1) entra exacto en ${Math.abs(n)} y en ${d} → ${cb('ya está simplificada')}`] };
  const ch = cadenaSimplif(n, d);
  return { t:`Simplifica: divide arriba y abajo entre ${g}`, l:[explSimplif(n, d), ...(ch.length > 2 ? [`Si no ves el ${g} de una vez, ve de a poco: ${ch.join(' ')}`] : [])] };
}

// suma (o resta ya convertida en suma) de fracciones como pasos de receta: MCM → convertir → arriba → simplificar
function recetaSuma(ts){
  const m = ts.reduce((a,f) => mcm(a,f.d), 1), nums = ts.map(f => f.n*(m/f.d)), tot = nums.reduce((a,b) => a+b, 0), P = [];
  if(ts.some(f => f.d !== m)){
    const ds = [...new Set(ts.map(f => f.d))];
    P.push({ t:'Busca el MCM de los de abajo', l:[`Los de abajo (${ds.join(', ')}) son distintos; para sumar o restar tienen que ser iguales. MCM = ${cb(m)} (el más chico que está en ${ds.length > 2 ? 'todas las tablas' : `la tabla del ${ds[0]} y en la del ${ds[1]}`}).`] });
    P.push({ t:'Pasa cada fracción a ese denominador', l: ts.map((f,i) => f.d === m ? `${tf(f.n,f.d)} ya tiene ${m} abajo.` : diagConvertir(f, nums[i], m)) });
  }
  let s = nums[0]; const c = [];
  nums.slice(1).forEach(v => { c.push(nums.length === 2 ? sumaArriba(s, v) : `${mm(s)} ${v<0 ? '−' : '+'} ${Math.abs(v)} = ${mm(s+v)}`); s += v; });
  P.push({ t:`Suma los de arriba; el de abajo (${m}) se queda igual`, l:[...c, `→ ${cb(tf(tot, m))}`] });
  P.push(pasoSimplif(tot, m));
  return { pasos:P, res:Fq(tot, m) };
}
function explComparar(a, b){
  const m = mcm(a.d,b.d), ka = m/a.d, kb = m/b.d, na = a.n*ka, nb = b.n*kb, s = cmpSigno(na,nb);
  const pasos = a.d === b.d ? [] : [{ t:'Busca el MCM de los de abajo', l:[`Los de abajo (${a.d} y ${b.d}) son distintos: hay que igualarlos. MCM de ${a.d} y ${b.d} = ${cb(m)} (el más chico que está en las dos tablas).`] },
    { t:'Pasa las dos fracciones a ese denominador', l:[ka > 1 ? diagConvertir(a, na, m) : `${a.n}/${a.d} ya tiene ${m} abajo.`, kb > 1 ? diagConvertir(b, nb, m) : `${b.n}/${b.d} ya tiene ${m} abajo.`] }];
  pasos.push({ t:'Con el mismo de abajo, compara los de arriba', l:[`${na}/${m} y ${nb}/${m} → ${na} ${s} ${nb}`, `→ ${cb(`${a.n}/${a.d} ${s} ${b.n}/${b.d}`)}`] });
  return receta({ pide:'cuál fracción es más grande (o si son iguales).', pasos, resp:`${a.n}/${a.d} ${s} ${b.n}/${b.d}`,
    comp:`en cruz: ${a.n} × ${b.d} = ${a.n*b.d} y ${b.n} × ${a.d} = ${b.n*a.d} → ${a.n*b.d} ${s} ${b.n*a.d} ✓`,
    error:'comparar los de abajo: con el número de abajo más grande, los pedazos son MÁS chicos.', ejemplo:`${a.n}/${a.d} = ${na}/${m}, ${b.n}/${b.d} = ${nb}/${m} → ${s}.` });
}

// banco de "declaraciones" cortas (cierta o falsa) para el módulo P/Q — cada una calcula su
// propio valor de verdad `v` a partir de los números que genera, nunca lo afirma por su cuenta
const bancoPQ = [
  (alto) => { const a=R(1,alto), b=R(1,alto), real=a+b, ok=Math.random()<0.5;
    const valor = ok ? real : real + pick([1,-1])*R(1,4);
    return { texto:`La suma de ${a} y ${b} es ${valor}.`, v: valor===real, por:`${a} + ${b} = ${real}${valor===real ? '' : `, no ${valor}`}` }; },
  (alto) => { const a=-R(1,alto), b=-R(1,alto);
    return { texto:`La suma de ${mm(a)} y ${mm(b)} es un número positivo.`, v:false, por:`${mm(a)} + (${mm(b)}): mismo signo, se suman ${-a} + ${-b} = ${-a-b} y se queda el menos → ${mm(a+b)}, que es NEGATIVO` }; },
  (alto) => { const a=-R(1,alto), b=-R(1,alto);
    return { texto:`El producto de ${mm(a)} y ${mm(b)} es un número positivo.`, v:true, por:`(${mm(a)}) × (${mm(b)}): dos menos (par) → positivo: ${a*b}` }; },
  (alto) => { const n=R(2,alto), divisores=[2,3,5,7].filter(d=>n%d===0), d=divisores.length?pick(divisores):pick([3,7]);
    return { texto:`${n} es divisible por ${d}.`, v: n%d===0, por: n%d===0 ? `${n} ÷ ${d} = ${n/d}, exacto` : `${n} ÷ ${d} = ${Math.floor(n/d)} y sobra${n%d>1?'n':''} ${n%d}, no es exacto` }; },
  (alto) => { const n=R(2, Math.min(alto,150));
    let p = 2; while(n % p) p++;
    return { texto:`${n} es un número primo.`, v: esPrimo(n), por: esPrimo(n) ? `${n} solo se divide exacto entre 1 y entre ${n}` : `${n} = ${p} × ${n/p}, tiene otros divisores` }; },
  (alto) => { const n=R(1,alto), ok=Math.random()<0.5, valor = ok? -n : n;
    return { texto:`El opuesto de ${n} es ${valor}.`, v: valor===-n, por:`el opuesto se saca cambiando el signo: ${n} → ${mm(-n)}` }; },
  (alto) => { const n=R(1,alto), ok=Math.random()<0.5, valor = ok? n : -n;
    return { texto:`|${mm(-n)}| es igual a ${valor}.`, v: valor===n, por:`las barras borran el signo: |${mm(-n)}| = ${n}` }; },
  (alto) => { const a=R(2,alto), b=R(2,alto);
    return { texto:`${a} × ${b} es lo mismo que ${b} × ${a}.`, v:true, por:`cambiar el orden al multiplicar no cambia el resultado: los dos dan ${a*b}` }; },
  (alto) => { const n=R(1,alto), ok=Math.random()<0.5, valor = ok? n : n+R(1,4);
    return { texto:`${n} + 0 es igual a ${valor}.`, v: valor===n, por:`sumar 0 no cambia el número: ${n} + 0 = ${n}` }; }
];

        { t:'Multiplicación', l:[porPedazos(b, pot), `${a} + ${cb(prod)}`] },

{
  id:'promedio', nombre:'Media aritmética (promedio)', secciones:['2.1'],

      const cuantos = R(3, porNivel(nv,4,5,6));

      const total = media*cuantos;
      const spread = porNivel(nv,6,12,20);
      let conocidos, falta;
      do {
        conocidos = []; for(let i=0;i<cuantos-1;i++) conocidos.push(R(Math.max(1,media-spread), media+spread));

      } while(falta < 1 || falta > media*3);

      return { enunciado:`El promedio de estos ${cuantos} números es <b>${media}</b>: ${conocidos.join('; ')}, y <b>x</b>. Halla x.`, tipo:'num', respuesta:falta,
        explicacion: receta({ pide:'el número que falta para que el promedio dé ' + media + '.',
          pasos:[{ t:'La suma de TODOS = promedio × cuántos son', l:[`${media} × ${cuantos} = ${cb(total)}`, '(El promedio es suma ÷ cantidad; al revés, se multiplica.)'] },
            { t:'Suma los que ya conoces, de dos en dos', l:[sumaLista(conocidos)] },
            { t:'Lo que falta para llegar a la suma total es x', l:[cuentaMenos(total, sc), `x = ${cb(falta)}`] }],
          resp:`x = ${falta}`, comp:`${sc} + ${falta} = ${total}, y ${total} ÷ ${cuantos} = ${media} ✓`,
          error:`restarle al promedio (${media}) en vez de a la suma total (${total}).`, ejemplo:`${media} × ${cuantos} = ${total}, ${total} − ${sc} = ${falta}.` }) };
    }
    const cuantos = Math.random()<0.25 ? 2 : R(3, porNivel(nv,4,5,6));
    const esPaciente = cuantos>2 && Math.random()<0.3;
    const alto = porNivel(nv, 20, 100, 200);
    const vals = []; for(let i=0;i<cuantos;i++) vals.push(esPaciente ? R(97,104) : R(1,alto));

    const media = Math.round((suma/cuantos)*100)/100;
    const unidad = esPaciente ? '°F' : '';

    const enunciado = esPaciente
      ? `La temperatura de un paciente se tomó ${cuantos} veces en un día: <b>${vals.join('; ')}</b>°F. Halla la temperatura promedio.`
      : cuantos===2

    return { enunciado, tipo:'num', respuesta:media,

        pasos:[{ t:'Suma todos, de dos en dos', l:[sumaLista(vals)] },

        resp: media + unidad, comp:`${media} cae entre el más chico (${Math.min(...vals)}) y el más grande (${Math.max(...vals)}) ✓ (el promedio siempre cae ahí)`,
        error:`dividir entre otro número: se divide entre CUÁNTOS datos hay (${cuantos}).`, ejemplo:`suma ${suma} ÷ ${cuantos} = ${media}.` }) };
  }

        f:'"Cercar" es poner verja alrededor = PERÍMETRO: P = 2 × largo + 2 × ancho', s:`P = 2 × ${l} + 2 × ${w}`, c:[`2 × ${l} = ${2*l} y 2 × ${w} = ${2*w}`, cuentaMas(2*l, 2*w)] };
      const costoTotal = Math.round(perim*costoM*100)/100;
      return { enunciado:`Un campo rectangular mide ${l} metros de largo y ${w} metros de ancho. Halla el costo total de cercarlo si la verja cuesta $${costoM} el metro.`, tipo:'num', respuesta:costoTotal,
        explicacion: receta({ pide:'cuánto cuesta toda la verja.',
          pasos:[{ t:'Halla cuánta verja hace falta: el PERÍMETRO', l:['P = 2 × largo + 2 × ancho', `P = 2 × ${l} + 2 × ${w} = ${2*l} + ${2*w} = ${cb(perim)} metros`] },
            { t:'Multiplica los metros por el precio de cada metro', l:[`${perim} × $${costoM} = ${cb('$' + costoTotal)}`] }],
          resp:`$${costoTotal}`, error:'multiplicar el precio por el área: la verja va alrededor, no cubre el campo.',
          ejemplo:`perímetro ${perim} m × $${costoM} = $${costoTotal}.` }) };
    }
    const forma = pick(['cuadrado','rectangulo','triangulo','circulo','trapecio','rombo','romboide']);
    const medida = pick(['perimetro','area']);
    if(forma==='cuadrado'){
      const l = R2();
      return medida==='perimetro'
        ? { enunciado:`Halla el <b>perímetro</b> de un cuadrado de lado ${l}.`, tipo:'num', respuesta:4*l,
            f:'P = 4 × lado (los 4 lados del cuadrado miden lo mismo)', s:`P = 4 × ${l}`, c:[`4 × ${l} = ${4*l}`] }
        : { enunciado:`Halla el <b>área</b> de un cuadrado de lado ${l}.`, tipo:'num', respuesta:l*l,
            f:'A = lado × lado', s:`A = ${l} × ${l}`, c:[porPedazos(l, l)] };
    }
    if(forma==='rectangulo'){
      const l=R2(), w=R2();
      return medida==='perimetro'
        ? { enunciado:`Halla el <b>perímetro</b> de un rectángulo de ${l} por ${w}.`, tipo:'num', respuesta:2*l+2*w,
            f:'P = 2 × largo + 2 × ancho (2 lados largos y 2 anchos)', s:`P = 2 × ${l} + 2 × ${w}`, c:[`2 × ${l} = ${2*l} y 2 × ${w} = ${2*w}`, cuentaMas(2*l, 2*w)] }
        : { enunciado:`Halla el <b>área</b> de un rectángulo de ${l} por ${w}.`, tipo:'num', respuesta:l*w,
            f:'A = largo × ancho', s:`A = ${l} × ${w}`, c:[porPedazos(l, w)] };
    }
    if(forma==='triangulo'){
      if(medida==='area'){
        const b=R2(), h=R2(), bb=(b*h)%2===0?b:b+1, a=(bb*h)/2;
        return { enunciado:`Halla el <b>área</b> de un triángulo con base ${bb} y altura ${h}.`, tipo:'num', respuesta:a,
          f:'A = (base × altura) ÷ 2 (un triángulo es la mitad de un rectángulo)', s:`A = (${bb} × ${h}) ÷ 2`, c:[porPedazos(bb, h), `${bb*h} ÷ 2 = ${a}`] };
      }
      const l1=R2(), l2=R2();
      // un lado al azar podía violar la desigualdad triangular (cada lado < suma de los
      // otros dos) — l3 se acota al rango que sí forma un triángulo real; si ese rango
      // queda vacío (alto muy chico), el lado más largo repetido siempre es válido
      const _lo = Math.max(3, Math.abs(l1-l2)+1), _hi = Math.min(alto, l1+l2-1);
      const l3 = _lo<=_hi ? R(_lo,_hi) : Math.max(l1,l2);
      return { enunciado:`Halla el <b>perímetro</b> de un triángulo con lados ${l1}, ${l2} y ${l3}.`, tipo:'num', respuesta:l1+l2+l3,
        f:'P = lado + lado + lado (se suman los 3)', s:`P = ${l1} + ${l2} + ${l3}`, c:[sumaLista([l1, l2, l3])] };
    }
    if(forma==='circulo'){
      const r = R(2,15);
      if(medida==='perimetro'){ const c = Math.round(2*3.14*r*100)/100;
        return { enunciado:`Halla la <b>circunferencia</b> de un círculo con radio ${r} (usa π ≈ 3.14).`, tipo:'num', respuesta:c,
          f:'C = 2 × π × radio (π ≈ 3.14; el radio va del centro al borde)', s:`C = 2 × 3.14 × ${r}`, c:[`2 × ${r} = ${2*r}`, por314(2*r)] }; }
      const a = Math.round(3.14*r*r*100)/100;
      return { enunciado:`Halla el <b>área</b> de un círculo con radio ${r} (usa π ≈ 3.14).`, tipo:'num', respuesta:a,
        f:'A = π × radio × radio (π ≈ 3.14)', s:`A = 3.14 × ${r} × ${r}`, c:[`${r} × ${r} = ${r*r}`, por314(r*r)] };
    }
    if(forma==='trapecio'){
      const B=R2(), b2=R(2,B-1);
      if(medida==='area'){ const h=R2();
        let b3=((B+b2)*h)%2===0?b2:b2+1;
        if(b3>=B) b3=B-1;   // el +1 de arriba podía igualar a la base mayor — "bases X y X" no es un trapecio
        const a=((B+b3)*h)/2;
        return { enunciado:`Halla el <b>área</b> de un trapecio con bases ${B} y ${b3}, y altura ${h}.`, tipo:'num', respuesta:a,
          f:'A = (base mayor + base menor) × altura ÷ 2', s:`A = (${B} + ${b3}) × ${h} ÷ 2`, c:[`${B} + ${b3} = ${B+b3}`, porPedazos(B+b3, h), `${(B+b3)*h} ÷ 2 = ${a}`] }; }
      let l1=R2(), l2=R2();
      // los dos lados no paralelos tienen que alcanzar a cerrar la diferencia entre las dos
      // bases (B−b2) — si no, ninguna figura real los conecta; se ajusta l2 cuando hace falta
      const _offset = B-b2;
      if(l1+l2 <= _offset) l2 = Math.min(alto, _offset-l1+R(1,3));
      return { enunciado:`Halla el <b>perímetro</b> de un trapecio con lados ${B}, ${b2}, ${l1} y ${l2}.`, tipo:'num', respuesta:B+b2+l1+l2,
        f:'P = la suma de los 4 lados', s:`P = ${B} + ${b2} + ${l1} + ${l2}`, c:[sumaLista([B, b2, l1, l2])] };
    }
    if(forma==='rombo'){
      const l = R2();
      if(medida==='perimetro') return { enunciado:`Halla el <b>perímetro</b> de un rombo de lado ${l}.`, tipo:'num', respuesta:4*l,
        f:'P = 4 × lado (los 4 lados del rombo son iguales)', s:`P = 4 × ${l}`, c:[`4 × ${l} = ${4*l}`] };
      const D=R(4,alto), d0=R(2,D-1), d=(D*d0)%2===0?d0:d0+1, a=(D*d)/2;
      return { enunciado:`Halla el <b>área</b> de un rombo con diagonales ${D} y ${d}.`, tipo:'num', respuesta:a,
        f:'A = (diagonal mayor × diagonal menor) ÷ 2', s:`A = (${D} × ${d}) ÷ 2`, c:[porPedazos(D, d), `${D*d} ÷ 2 = ${a}`] };
    }
    const b=R2(), h=R2(), l=R2();
    return medida==='area'
      ? { enunciado:`Halla el <b>área</b> de un romboide con base ${b} y altura ${h}.`, tipo:'num', respuesta:b*h,
          f:'A = base × altura (la altura es la derechita, no el lado inclinado)', s:`A = ${b} × ${h}`, c:[porPedazos(b, h)] }
      : { enunciado:`Halla el <b>perímetro</b> de un romboide con lados ${b} y ${l}.`, tipo:'num', respuesta:2*b+2*l,
          f:'P = 2 × lado a + 2 × lado b (2 pares de lados iguales)', s:`P = 2 × ${b} + 2 × ${l}`, c:[`2 × ${b} = ${2*b} y 2 × ${l} = ${2*l}`, cuentaMas(2*b, 2*l)] };
  }
},

{

      const alto2 = porNivel(nv,30,80,200);
      const ns2 = []; for(let i=0;i<cuantos2;i++) ns2.push(R(8,alto2));
      const correcto = ns2.reduce(mcd), mcmVal = ns2.reduce(mcm);
      const candidatos = new Set([correcto, mcmVal, Math.min.apply(null,ns2), correcto+R(1,5)].filter(v=>v>0));
      const opciones2 = [...candidatos];
      while(opciones2.length<4){ const extra=correcto+R(2,15); if(!opciones2.includes(extra)) opciones2.push(extra); }
      return { enunciado:`Halla el factor común mayor de <b>${ns2.join(', ')}</b>.`,
        tipo:'opciones', opciones: shuffle(opciones2.slice(0,4).map(String)), respuesta: String(correcto),
        explicacion: explFcm(ns2, mcmVal!==correcto ? `escoger ${mcmVal}: ese es el MCM (el más chico que está en todas las tablas), no el FCM.` : '') };
    }
    if(Math.random()<0.25){
      const letra2 = pick(['r','x','y','a','m']);
      const supV = e => e===1 ? '' : sup(e);
      const e2 = R(1,3), e1 = e2 + R(1,3);
      const g2 = R(2,9); let m1=R(2,6), m2; do { m2=R(2,6); } while(m2===m1 || mcd(m1,m2)!==1);   // m1 y m2 coprimos entre sí, si no g2 dejaría de ser el FCM completo
      const c1 = g2*m1, c2 = g2*m2;
      const expr2 = `${c1}${letra2}${supV(e1)} − ${c2}${letra2}${supV(e2)}`;
      const afuera = `${g2}${letra2}${supV(e2)}`;
      const correcta2 = `${afuera}(${m1}${letra2}${supV(e1-e2)} − ${m2})`;
      const mal1 = `${afuera}(${m1}${letra2}${supV(e1)} − ${m2}${letra2}${supV(e2)})`;
      const mal2 = `${letra2}${supV(e2)}(${c1}${letra2}${supV(e1-e2)} − ${c2})`;
      const mal3 = `${afuera}(${m1}${letra2}${supV(e1-e2)} + ${m2})`;
      return { enunciado:`Factoriza completamente: <b>${expr2}</b>`,
        tipo:'opciones', opciones: shuffle([correcta2,mal1,mal2,mal3]), respuesta: correcta2,
        explicacion: receta({ pide:'sacar afuera de un paréntesis todo lo que tienen en común los dos términos.',
          pasos:[{ t:'FCM de los números', l:[`${c1} = ${g2} × ${m1} y ${c2} = ${g2} × ${m2} → el más grande que entra en los dos es ${cb(g2)}`] },
            { t:'De la letra, saca la que tenga MENOS exponente', l:[`${letra2}${supV(e1)} y ${letra2}${supV(e2)}: la menor es ${cb(letra2 + supV(e2))}`, `Afuera va: ${cb(afuera)}`] },
            { t:'Divide cada término entre lo que sacaste', l:[`${c1}${letra2}${supV(e1)} ÷ ${afuera} = ${cb(m1 + letra2 + supV(e1-e2))} (${c1} ÷ ${g2} = ${m1}; exponentes ${e1} − ${e2} = ${e1-e2})`,
              `${c2}${letra2}${supV(e2)} ÷ ${afuera} = ${cb(m2)} (${c2} ÷ ${g2} = ${m2}; la letra se va completa)`] },
            { t:'Escribe: lo de afuera por lo que quedó (el signo del medio se queda)', l:[`→ ${cb(correcta2)}`] }],
          resp: correcta2, comp:`${afuera} × ${m1}${letra2}${supV(e1-e2)} = ${c1}${letra2}${supV(e1)} y ${afuera} × ${m2} = ${c2}${letra2}${supV(e2)} → ${expr2} ✓`,
          error:`dejar las letras adentro sin dividir (${mal1}), o cambiar el signo del medio.`, ejemplo:`${expr2} → ${correcta2}.` }) };
    }
    const cuantos = porNivel(nv, 2, Math.random()<0.35?3:2, 3);
    const alto = porNivel(nv, 40, 120, 300);
    const ns = []; for(let i=0;i<cuantos;i++) ns.push(R(8,alto));
    let enunciado = `Halla el <b>FCM</b> de <b>${ns.join(', ')}</b>.`;
    if(cuantos===2 && Math.random()<0.4)
      enunciado = `Una hoja mide <b>${ns[0]}</b> cm por <b>${ns[1]}</b> cm. ¿Cuál es el lado del cuadrado `+
                  `más grande con el que se puede cortar toda la hoja sin que sobre nada?`;
    return { enunciado, tipo:'num', respuesta: ns.reduce(mcd), explicacion: explFcm(ns) };
  }
},

{
  id:'comparar', nombre:'Comparar y ordenar', secciones:['3.5','3.6'],
  gen(nv){
    const alto = porNivel(nv, 9, 14, 22);
    const nueva = () => { const d = R(2,alto); return { n:R(1,d-1), d }; };
    if(Math.random()<0.2){
      const propias = []; while(propias.length<3){ const f = nueva(); if(!propias.some(x=>x.n===f.n&&x.d===f.d)) propias.push(f); }
      const dImp = R(2,alto), nImp = dImp + R(1, Math.max(1,Math.floor(alto/3)));
      const todas = shuffle([...propias, {n:nImp,d:dImp}]);
      return { enunciado:`¿Cuál de las siguientes fracciones es una fracción impropia?`,
        tipo:'opciones', opciones: todas.map(f=>`${f.n}/${f.d}`), respuesta:`${nImp}/${dImp}`,
        explicacion: receta({ pide:'la fracción que vale 1 entero o más (la de arriba igual o más grande que la de abajo).',
          pasos:[{ t:'En cada opción, compara el de arriba con el de abajo', l: todas.map(f => `${f.n}/${f.d}: ${f.n} ${f.n >= f.d ? '≥' : '&lt;'} ${f.d} → ${f.n >= f.d ? cb('impropia') : 'propia'}`) }],
          resp:`${nImp}/${dImp}`, error:'escoger la de números más grandes: lo que importa es si el de arriba es igual o mayor que el de abajo.',
          ejemplo:`${nImp} ≥ ${dImp} → ${nImp}/${dImp}.` }) };
    }
    if(Math.random() < 0.65){                            // comparar dos
      const a = nueva();
      const b = Math.random()<0.2 ? {n:a.n*2, d:a.d*2} : nueva();   // a veces iguales
      const m = mcm(a.d,b.d);
      return { enunciado:`¿Qué signo va en el medio?<br>${fr(a.n,a.d)} &nbsp;___&nbsp; ${fr(b.n,b.d)}`,
        tipo:'cmp', respuesta: cmpSigno(a.n*(m/a.d), b.n*(m/b.d)), explicacion: explComparar(a,b) };
    }
    // ordenar tres
    const fs = []; while(fs.length<3){ const f = nueva();
      if(!fs.some(x => x.n*f.d === f.n*x.d)) fs.push(f); }
    const asc = Math.random()<0.5;
    const m = fs.reduce((ac,f)=>mcm(ac,f.d), 1);
    const conv = fs.map((f,i)=>({i, v:f.n*(m/f.d), f}));
    const orden = conv.slice().sort((a,b)=> asc ? a.v-b.v : b.v-a.v);
    const sentido = asc ? 'menor a mayor' : 'mayor a menor';
    return {
      enunciado:`Ordena estas fracciones de <b>${sentido}</b>.<br>`+
                `<small style="opacity:.75">Tócalas en orden.</small>`,
      tipo:'orden', opciones: fs, respuesta: orden.map(o=>o.i),
      explicacion: receta({ pide:`las tres fracciones en orden de ${sentido}.`,
        pasos:[{ t:'Busca el MCM de los de abajo', l:[`MCM de ${fs.map(f=>f.d).join(', ')} = ${cb(m)} (el más chico que está en todas las tablas)`] },
          { t:'Pasa todas a ese denominador', l: conv.map(c => c.f.d === m ? `${c.f.n}/${c.f.d} ya tiene ${m} abajo.` : diagConvertir(c.f, c.v, m)) },
          { t:`Ordena los de arriba de ${sentido}`, l:[`${orden.map(o => o.v + '/' + m).join(' , ')}`] },
          { t:'Regresa a las fracciones originales', l:[`→ ${cb(orden.map(o => `${o.f.n}/${o.f.d}`).join(' , '))}`] }],
        resp: orden.map(o => `${o.f.n}/${o.f.d}`).join(' , '), error:'ordenar por el número de abajo: más grande abajo = pedazos más CHICOS.',
        ejemplo:`${orden.map(o => `${o.f.n}/${o.f.d} = ${o.v}/${m}`).join(', ')}.` }) };
  }

      const oper2 = restaMC ? {n:-b1.n, d:b1.d} : b1;
      const r2 = sumarF([a1, oper2]);
      const correcta = `${tf(r2.n,r2.d)}`;
      const sinSimplificar = `${r2.tot}/${r2.m}`;
      // error clásico: sumar/restar numeradores Y denominadores directo, sin buscar denominador común
      const malDirecto = restaMC ? `${a1.n-b1.n}/${a1.d-b1.d}` : `${a1.n+b1.n}/${a1.d+b1.d}`;
      const malSigno = tf(-r2.n,r2.d);
      const listaOpc = [correcta];
      [sinSimplificar, malDirecto, malSigno].forEach(o=>{ if(!listaOpc.includes(o)) listaOpc.push(o); });
      while(listaOpc.length<4){ const extra = tf(r2.n + R(1,3)*pick([1,-1]), r2.d); if(!listaOpc.includes(extra)) listaOpc.push(extra); }
      const S = recetaSuma([a1, oper2]);
      return { enunciado:`${restaMC?'Resta':'Halla la suma'} :<br><b>${frS(a1.n,a1.d)} ${restaMC?'−':'+'} ${frP(b1.n,b1.d)}</b>`,
        tipo:'opciones', opciones: shuffle(listaOpc.slice(0,4)), respuesta: correcta,
        explicacion: receta({ pide:`el resultado de ${restaMC ? 'restar' : 'sumar'}, en su forma más simple.`,
          pasos:[...(restaMC ? [{ t:'Cambia la resta por "más el opuesto"', l:[`${tf(a1.n,a1.d)} − ${tf(b1.n,b1.d)} = ${tf(a1.n,a1.d)} + (${tf(-b1.n,b1.d)})`] }] : []), ...S.pasos],
          resp: correcta, error:`${restaMC ? 'restar' : 'sumar'} también los de abajo (daría ${malDirecto}), o escoger ${sinSimplificar}, que no está simplificada.`,
          ejemplo:`${tf(a1.n,a1.d)} ${restaMC?'−':'+'} ${tf(b1.n,b1.d)} = ${correcta}.` }) };
    }
    const dens = nv==='facil' ? [2,3,4,5,6,8,10,12] : DENS_FRAC;
    const neg = nv==='facil' ? 0 : nv==='medio' ? 0.35 : 0.6;
    const nueva = (d) => { d = d || pick(dens); let n = R(1, d-1); if(Math.random()<neg) n = -n; return {n, d}; };
    const tipo = pick(nv==='facil' ? ['mismo','mismo','distinto','distinto'] :
                      nv==='medio' ? ['distinto','distinto','entero','mixto'] :
                                     ['distinto','entero','mixto','tres']);
    const resta = Math.random()<0.5;
    let fs;
    if(tipo==='mismo'){
      const d = pick(dens); fs = [nueva(d), nueva(d)];
    } else if(tipo==='distinto' || tipo==='tres'){
      fs = [nueva(), nueva()]; if(tipo==='tres') fs.push(nueva());
      while(fs[1].d===fs[0].d) fs[1] = nueva();
    } else if(tipo==='entero'){
      const e = R(1, porNivel(nv,3,6,12)) * (Math.random()<neg ? -1 : 1);
      fs = Math.random()<0.5 ? [{n:e, d:1, entero:true}, nueva()] : [nueva(), {n:e, d:1, entero:true}];
    } else { // mixto
      const mk = () => { const d = pick([2,3,4,5,6,8]), n = R(1,d-1), e = R(1,porNivel(nv,3,5,9));
        const s = Math.random()<neg ? -1 : 1; return { e:s*e, pn:n, d, n:s*(e*d+n), mixto:true }; };
      fs = [mk(), mk()];
    }
    // solo el 2º operando se resta — es el único que lleva "−" en pantalla; antes se negaban
    // TODOS los que seguían al primero, y en la variante de 3 fracciones el tercero salía con
    // el signo cambiado (la respuesta guardada no coincidía con lo que se veía)
    const oper = fs.map((f,i) => (i===1 && resta) ? {...f, n:-f.n} : f);
    const ver = f => f.entero ? mm(f.n) : f.mixto ? mixS(f.e, f.pn, f.d) : frS(f.n, f.d);
    const verP = f => f.entero ? (f.n<0?`(${mm(f.n)})`:f.n) : f.mixto ? (f.e<0?`(${mixS(f.e,f.pn,f.d)})`:mixS(f.e,f.pn,f.d)) : frP(f.n, f.d);
    const signos = fs.map((f,i)=> i===0 ? ver(f) : (resta && i===1 ? ' − ' : ' + ') + verP(f)).join('');
    const r = sumarF(oper), S = recetaSuma(oper);
    const pasos = [];
    if(fs.some(f=>f.mixto)) pasos.push({ t:'Pasa los mixtos a fracción impropia', l: fs.filter(f=>f.mixto).map(f => explImpropia({n:f.n, d:f.d})) });
    if(fs.some(f=>f.entero)) pasos.push({ t:'Escribe el entero como fracción (con 1 abajo)', l:[fs.filter(f=>f.entero).map(f=>`${mm(f.n)} = ${tf(f.n,1)}`).join(',  ')] });
    if(resta) pasos.push({ t:'Cambia la resta por "más el opuesto"', l:[`${tf(oper[0].n,oper[0].d)} − ${tfP(fs[1].n,fs[1].d)} = ${tf(oper[0].n,oper[0].d)} + ${tfP(oper[1].n,oper[1].d)}`, 'Restar es sumar el número con el signo cambiado.'] });
    pasos.push(...S.pasos);
    const verbo = resta ? pick(['Resta:','Resta y simplifica:','Halla la diferencia y escribe la respuesta en su forma más simple:'])
                        : pick(['Suma las siguientes fracciones:','Suma y simplifica:','Halla la suma y escribe la respuesta en su forma más simple:']);
    return { enunciado:`${verbo}<br><b>${signos}</b>`,
      tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true,
      ayuda: fs.some(f=>f.mixto) ? 'Puedes dejar el resultado como fracción impropia.' : (r.d===1 ? 'Si sale un entero, escríbelo con denominador 1.' : ''),
      explicacion: receta({ pide:`el resultado de ${resta ? 'restar' : 'sumar'}, en su forma más simple.`, pasos,
        resp: tf(r.n, r.d), error:`${resta ? 'restar' : 'sumar'} también los de abajo: el de abajo NO se suma ni se resta, solo se iguala con el MCM.`,
        ejemplo:`denominador común ${r.m}, arriba ${r.nums.map((n,i)=> i>0 && n<0 ? `(${mm(n)})` : mm(n)).join(' + ')} = ${mm(r.tot)} → ${tf(r.n,r.d)}.` }) };
  }
},
{

    }
