<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e2a52">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<title>Práctica de Matemáticas</title>
<style>
  :root{
    --azul:#1e2a52; --azul2:#2b3c72; --azul3:#3b52a0;
    --acento:#ffc93c; --acento2:#ffe08a;
    --verde:#2ecc71; --verde-bg:#e8f9f0;
    --rojo:#e74c3c; --rojo-bg:#fdeceb;
    --ambar:#f39c12; --ambar-bg:#fef6e7;
    --blanco:#fff; --gris:#eef1f7; --gris2:#d7dee9;
    --texto:#1a2438; --muted:#5f6b85;
    --sombra:0 6px 20px rgba(0,0,0,.16);
    /* --azul/--azul2 hacen doble papel: fondo de marca (header, enunciado, chip.on) Y texto de
       título sobre tarjeta blanca (h2, h3, chip...). En modo oscuro esos dos papeles necesitan
       colores distintos, así que el texto de título vive en variables propias. */
    --titulo:var(--azul); --titulo2:var(--azul2);
    --superficie:var(--blanco);   /* fondo de tarjeta/chip — separado de --blanco-como-texto-claro */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:linear-gradient(160deg,var(--azul),var(--azul2));
    color:var(--texto);min-height:100vh;padding:14px;line-height:1.55;
  }
  .app{max-width:720px;margin:0 auto;padding-bottom:30px}
  header.top{text-align:center;color:var(--blanco);padding:10px 6px 18px}
  header.top h1{font-size:1.35rem;letter-spacing:.2px}
  header.top p{opacity:.8;font-size:.87rem;margin-top:3px}
  .card{background:var(--superficie);border-radius:18px;box-shadow:var(--sombra);padding:20px;margin-bottom:14px}
  h2{color:var(--titulo);font-size:1.18rem;margin-bottom:12px}
  h3{color:var(--titulo2);font-size:1rem;margin:14px 0 7px}
  .btn{display:block;width:100%;border:none;border-radius:14px;cursor:pointer;padding:15px;
    font-size:1.02rem;font-weight:600;margin-bottom:10px;font-family:inherit;
    transition:transform .08s,box-shadow .15s;background:var(--azul3);color:var(--blanco)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,42,82,.28)}
  .btn:active{transform:translateY(0)}
  .btn.amar{background:var(--acento);color:var(--azul)}
  .btn.sec{background:var(--gris);color:var(--titulo);border:2px solid var(--gris2)}
  .btn.chico{padding:11px;font-size:.92rem}
  .btn small{display:block;font-weight:400;font-size:.79rem;opacity:.85;margin-top:2px}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:120px}
  .back{background:none;border:none;color:var(--blanco);cursor:pointer;font-size:.94rem;
    padding:5px 2px;margin-bottom:6px;opacity:.9;font-family:inherit}
  .back:hover{opacity:1;text-decoration:underline}
  .pill{display:inline-block;background:var(--acento);color:var(--azul);font-weight:700;
    font-size:.75rem;padding:4px 12px;border-radius:20px;margin-bottom:9px}
  .nota{background:var(--gris);border-left:4px solid var(--acento);padding:10px 13px;
    border-radius:8px;margin:10px 0;font-size:.9rem;color:var(--muted)}
  /* chips de nivel / tema */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .chip{border:2px solid var(--gris2);background:var(--superficie);color:var(--titulo2);
    border-radius:20px;padding:7px 15px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--azul3);border-color:var(--azul3);color:var(--blanco)}
  /* flechita para plegar/desplegar listas de temas */
  details{margin:2px 0 10px}
  summary{cursor:pointer;color:var(--titulo2);font-weight:600;font-size:.85rem;
    padding:6px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▶';display:inline-block;margin-right:6px;font-size:.65rem;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  /* enunciado */
  .enunciado{background:var(--azul);color:var(--blanco);border-radius:14px;padding:20px 18px;
    font-size:1.22rem;text-align:center;margin-bottom:16px;line-height:1.6}
  .enunciado .fr{color:var(--acento2)}
  /* fracción apilada */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
    margin:0 4px;line-height:1.15;font-weight:700}
  .fr b{display:block;padding:0 5px}
  .fr i{display:block;padding:0 5px;border-top:2px solid currentColor;font-style:normal}
  /* entradas */
  .campo{width:100%;border:2px solid var(--gris2);border-radius:12px;padding:13px;
    font-size:1.15rem;text-align:center;font-family:inherit;color:var(--texto);background:var(--superficie)}
  .campo:focus{outline:none;border-color:var(--azul3)}
  .numRow{display:flex;gap:8px}
  .numRow .campo{flex:1;min-width:0}
  .signo{flex:none;width:52px;padding:0;font-size:1.3rem;font-weight:700;margin-bottom:0}
  .fracIn{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:150px;margin:0 auto}
  .fracIn .campo{width:110px}
  .fracIn .barra{width:110px;height:3px;background:var(--titulo);border-radius:2px}
  .mixIn{display:flex;align-items:center;justify-content:center;gap:12px}
  .mixIn .campo{width:80px}
  .opt{display:flex;gap:10px}
  .opt .btn{flex:1;font-size:1.25rem;padding:18px}
  .ordenCaja{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .ordenChip{position:relative;border:2px solid var(--gris2);background:var(--superficie);
    border-radius:14px;padding:14px 20px;font-size:1.25rem;cursor:pointer;font-family:inherit;color:var(--texto)}
  .ordenChip.on{border-color:var(--azul3);background:var(--gris)}
  .ordenChip .num{position:absolute;top:-9px;right:-9px;background:var(--azul3);color:var(--blanco);
    width:24px;height:24px;border-radius:50%;font-size:.8rem;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  /* feedback */
  .fb{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-weight:600}
  .fb.ok{background:var(--verde-bg);color:#1e7a48;border-left:5px solid var(--verde)}
  .fb.mal{background:var(--rojo-bg);color:#b03a2e;border-left:5px solid var(--rojo)}
  .fb.medio{background:var(--ambar-bg);color:#9c6410;border-left:5px solid var(--ambar)}
  .fb small{display:block;font-weight:400;margin-top:4px}
  .expl{background:var(--gris);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .expl h3{margin-top:0}
  .expl ol{margin:0;padding-left:20px}
  .expl li{margin-bottom:6px;font-size:.95rem}
  .expl li:last-child{margin-bottom:0;font-weight:600;color:var(--titulo)}
  /* atajo para resolverlo más rápido — sale del <ol> y se pinta aparte (ver explPasos) */
  .truco{background:var(--superficie);border-left:4px solid var(--acento);border-radius:8px;
    padding:9px 12px;margin-top:11px;font-size:.9rem;line-height:1.5}
  .truco b{display:block;color:var(--titulo2);font-size:.8rem;letter-spacing:.3px;margin-bottom:2px}
  /* stats */
  .barra-ext{height:10px;background:var(--gris);border-radius:6px;overflow:hidden;margin-top:5px}
  .barra-int{height:100%;border-radius:6px;background:var(--verde);transition:width .4s}
  .stat{margin-bottom:13px}
  .stat .lbl{display:flex;justify-content:space-between;font-size:.9rem}
  .stat .lbl b{color:var(--titulo)}
  .racha{display:flex;gap:10px;text-align:center;margin-bottom:6px}
  .racha div{flex:1;background:var(--gris);border-radius:12px;padding:12px 6px}
  .racha b{display:block;font-size:1.6rem;color:var(--azul3);line-height:1.2}
  .racha span{font-size:.78rem;color:var(--muted)}
  /* clase */
  .banner{background:var(--acento2);border-radius:12px;padding:11px 14px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;font-weight:600;color:var(--azul)}
  .banner button{background:var(--azul);color:var(--blanco);border:none;border-radius:8px;
    padding:6px 11px;font-size:.8rem;cursor:pointer;font-family:inherit}
  textarea.campo{text-align:left;font-size:.92rem;min-height:130px;resize:vertical}
  .modCheck{display:flex;align-items:center;gap:10px;padding:9px 11px;border:2px solid var(--gris2);
    border-radius:11px;margin-bottom:7px;cursor:pointer}
  .modCheck.on{border-color:var(--azul3);background:var(--gris)}
  .modCheck input{width:19px;height:19px;accent-color:var(--azul3)}
  .modCheck .sc{margin-left:auto;font-size:.76rem;color:var(--muted)}
  .drop{border:2px dashed var(--gris2);border-radius:12px;padding:18px;text-align:center;
    color:var(--muted);font-size:.9rem;cursor:pointer;margin-bottom:10px}
  .drop.hover{border-color:var(--azul3);background:var(--gris)}
  .cargando{text-align:center;color:var(--muted);font-size:.9rem;padding:10px}
  /* test */
  pre.test{background:var(--azul);color:#d6f5c8;padding:14px;border-radius:12px;
    font-size:.82rem;overflow-x:auto;white-space:pre-wrap}
  /* modo oscuro automático — sigue el sistema, sin botón propio.
     Ojo: --azul/--azul2/--blanco NO se redefinen aquí a propósito — siguen sirviendo de fondo
     de marca (header, enunciado, chip.on) y de texto claro sobre esos fondos oscuros, y esos
     dos papeles ya funcionan bien tal cual. Lo que sí cambia es la SUPERFICIE de las tarjetas
     (antes literalmente blanca) y el TÍTULO que se lee encima de ella. */
  @media (prefers-color-scheme: dark){
    :root{
      --acento:#ffc93c; --acento2:#ffe08a;
      --verde:#2ecc71; --verde-bg:#123322;
      --rojo:#e74c3c; --rojo-bg:#3a1c1c;
      --ambar:#f39c12; --ambar-bg:#3a2c10;
      --gris:#2a3358; --gris2:#3a4470;
      --texto:#e8ecf7; --muted:#aab2d0;
      --sombra:0 6px 20px rgba(0,0,0,.45);
      --superficie:#1c2340;               /* antes --blanco: fondo de tarjeta/chip */
      --titulo:#c9d3f5; --titulo2:#a9b7ec; /* antes --azul/--azul2 como texto de título */
    }
    body{background:linear-gradient(160deg,#070c1c,#0f1730)}
    .fb.ok{color:#7be3a8} .fb.mal{color:#f19c92} .fb.medio{color:#f5c877}
    pre.test{background:#070c1c}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Práctica de Matemáticas</h1>
    <p>Números · Álgebra · Geometría · Fracciones</p>
  </header>
  <main id="main"></main>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   1. HELPERS MATEMÁTICOS  (funciones puras, sin dependencias)
   ══════════════════════════════════════════════════════════ */
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a; }
function mcm(a,b){ return Math.abs(a*b)/mcd(a,b); }
function esPrimo(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  for(let d=3; d*d<=n; d+=2) if(n%d===0) return false;
  return true;
}
function factorizar(n){
  const f={}; let d=2;
  while(d*d<=n){ while(n%d===0){ f[d]=(f[d]||0)+1; n/=d; } d++; }
  if(n>1) f[n]=(f[n]||0)+1;
  return f;
}
function simplificar(n,d){ const g=mcd(n,d)||1; return [n/g, d/g]; }
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup = n => String(n).split('').map(c=>SUP[c]).join('');
function fmtFactores(f){
  const ps = Object.keys(f).map(Number).sort((a,b)=>a-b);
  if(!ps.length) return '1';
  return ps.map(p => f[p]>1 ? p+sup(f[p]) : ''+p).join(' × ');
}
function fmtFactoresPlano(f){
  const ps = Object.keys(f).map(Number).sort((a,b)=>a-b);
  if(!ps.length) return '1';
  return ps.map(p => f[p]>1 ? p+'^'+f[p] : ''+p).join(' * ');
}
const sumaDig = n => String(n).split('').reduce((s,c)=>s + (+c), 0);
const porNivel = (nv,f,m,d) => nv==='facil' ? f : nv==='medio' ? m : d;
// fracción apilada para el enunciado
const fr = (n,d) => `<span class="fr"><b>${n}</b><i>${d}</i></span>`;
const cmpSigno = (a,b) => a<b ? '<' : a>b ? '>' : '=';
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// teclado numérico del teléfono a veces no trae signo "-" (iOS, sobre todo) — botón ± como atajo
function toggleSigno(id){
  const el = $(id);
  el.value = el.value.startsWith('-') ? el.value.slice(1) : '-' + el.value;
  el.focus();
}

/* ══════════════════════════════════════════════════════════
   2. EXPLICACIONES  (salen de las mismas variables que la respuesta)
   ══════════════════════════════════════════════════════════ */
// El ejemplo del truco se arma con el MISMO número del ejercicio, no con uno inventado.
function trucoDiv(n, d){
  const s = String(n), ult = +s[s.length-1], sd = sumaDig(n), dos = n%100;
  const corta = sd > 9 ? sumaDig(sd) : sd;
  const suma = sd > 9 ? `${s.split('').join('+')} = ${sd} → ${String(sd).split('').join('+')} = ${corta}`
                      : `${s.split('').join('+')} = ${sd}`;
  const m4 = dos===0     ? 'un 00, y cualquier centena completa ya es múltiplo de 4 → sí'
           : dos%4===0 ? `${dos} → ${dos/2} → ${dos/4}, exacto las dos veces → sí`
           : dos%2===0 ? `${dos} → ${dos/2}, y ${dos/2} ya no se parte exacto a la mitad → no`
           : `${dos} ni siquiera es par → no`;
  switch(d){
    case 2: return `Ni mires el resto del número: tapa todo con la mano menos la última cifra. Si esa cifra es 0, 2, 4, 6 u 8, es divisible entre 2 — da igual si el número tiene cuatro cifras o veinte. Ejemplo con este mismo: tapas ${n} y queda el ${ult}, que es ${ult%2===0?'par → sí':'impar → no'}.`;
    case 5: return `Igual que con el 2, solo cuenta la última cifra: 0 o 5 → sí, cualquier otra → no. Ni sumes ni dividas nada. Ejemplo con este mismo: ${n} termina en ${ult}, que ${(ult===0||ult===5)?'sí es 0 o 5 → sí':'no es 0 ni 5 → no'}.`;
    case 10: return `La más rápida de todas: ¿termina en 0? Sí. ¿No termina en 0? No. Ejemplo con este mismo: ${n} termina en ${ult} → ${ult===0?'sí':'no'}.`;
    case 3: return `Si al sumar los dígitos te queda un número grande, vuelve a sumar SUS dígitos y repite hasta quedarte con una sola cifra; si esa cifra es 3, 6 o 9, el número es divisible entre 3. Ejemplo con este mismo: ${suma}, y ${corta} ${sd%3===0?'sí es múltiplo de 3 → sí':'no es múltiplo de 3 → no'}.`;
    case 9: return `El mismo atajo del 3: suma los dígitos y, si te queda grande, vuelve a sumarlos hasta tener una sola cifra. Solo si esa cifra final es 9 el número es divisible entre 9. Ejemplo con este mismo: ${suma}, y ${corta} ${sd%9===0?'sí es 9 (o múltiplo de 9) → sí':'no llega a 9 → no'}.`;
    case 4: return `Toma las dos últimas cifras y pártelas a la mitad dos veces seguidas: si las dos veces sale exacto, es divisible entre 4. Ejemplo con este mismo: las dos últimas de ${n} son ${m4}.`;
    case 6: return `Empieza siempre por lo más barato: ¿es par? Si NO es par ya puedes contestar "no" sin sumar ni un dígito. Ejemplo con este mismo: ${n} ${ult%2===0 ? `sí es par, así que toca revisar el 3: ${suma}, que ${sd%3===0?'sí es múltiplo de 3 → sí':'no es múltiplo de 3 → no'}` : 'no es par → no, y ahí terminaste sin sumar nada'}.`;
    case 12: return `Empieza por la regla del 4 (solo dos cifras que mirar). Si falla, la respuesta ya es "no" y te ahorras sumar todos los dígitos. Ejemplo con este mismo: las dos últimas de ${n} son ${dos}, que ${dos%4===0 ? `sí se divide entre 4, así que toca el 3: ${suma}, y ${corta} ${sd%3===0?'sí es múltiplo de 3 → sí':'no es múltiplo de 3 → no'}` : 'no se divide exacto entre 4 → no, sin sumar ni un dígito'}.`;
  }
  return null;
}
function explDivisibilidad(n,d){
  const t = trucoDiv(n, d);
  return _pasosDivisibilidad(n,d).concat(t ? 'TRUCO: '+t : []);
}
function _pasosDivisibilidad(n,d){
  const s = String(n), ult = +s[s.length-1], sd = sumaDig(n), dos = n%100;
  const ok = n%d===0, si = ok?'sí':'no';
  const intro = 'Que un número sea "divisible" entre otro significa que, al dividirlos, el resultado es exacto — no sobra nada (el residuo es 0).';
  const final = `→ Por eso, ${n} ${si} es divisible por ${d}.`;
  const sumaTxt = `Sumamos sus dígitos: ${s.split('').join(' + ')} = ${sd}.`;
  switch(d){
    case 2: return [intro,
      'Para el 2 basta con mirar el último dígito (las demás cifras no importan): si es 0, 2, 4, 6 u 8 — un número par — sí es divisible entre 2.',
      `El último dígito de ${n} es ${ult}.`, `${ult} ${ult%2===0?'es par':'es impar (no par)'}. ${final}`];
    case 5: return [intro,
      'Para el 5 basta con mirar el último dígito: solo es divisible entre 5 si termina en 0 o en 5.',
      `El último dígito de ${n} es ${ult}.`, `${ult} ${(ult===0||ult===5)?'sí es 0 o 5':'no es ni 0 ni 5'}. ${final}`];
    case 10:return [intro,
      'Para el 10 basta con mirar el último dígito: solo es divisible entre 10 si termina exactamente en 0.',
      `El último dígito de ${n} es ${ult}.`, `${ult} ${ult===0?'sí es 0':'no es 0'}. ${final}`];
    case 3: return [intro,
      'Para el 3 hay un atajo: se suman todos los dígitos, y si esa suma es múltiplo de 3 (0, 3, 6, 9, 12...), el número completo también lo es.',
      sumaTxt, `${sd} ${sd%3===0?'sí es':'no es'} múltiplo de 3. ${final}`];
    case 9: return [intro,
      'Para el 9 el atajo es parecido: se suman todos los dígitos, y si esa suma es múltiplo de 9 (0, 9, 18, 27...), el número completo también lo es.',
      sumaTxt, `${sd} ${sd%9===0?'sí es':'no es'} múltiplo de 9. ${final}`];
    case 4: return [intro,
      'Para el 4 no hace falta mirar el número entero: solo importan sus dos últimos dígitos, porque cualquier "centena completa" ya es múltiplo de 4 por sí sola.',
      `Los dos últimos dígitos de ${n} forman el número ${dos}.`,
      `${dos} ÷ 4 ${dos%4===0?`= ${dos/4}, división exacta`:'no da exacta (sobra residuo)'}. ${final}`];
    case 6: return [intro,
      '6 = 2 × 3, así que un número es divisible entre 6 solo si cumple LAS DOS reglas a la vez: la del 2 y la del 3.',
      `¿Entre 2? El último dígito es ${ult}, que ${ult%2===0?'sí es par → sí':'no es par → no'}.`,
      `¿Entre 3? ${sumaTxt} ${sd%3===0?'Sí es múltiplo de 3 → sí':'No es múltiplo de 3 → no'}.`,
      `${ok?'Cumple las dos condiciones':'Falla al menos una de las dos condiciones'}. ${final}`];
    case 12:return [intro,
      '12 = 3 × 4, así que un número es divisible entre 12 solo si cumple LAS DOS reglas a la vez: la del 3 y la del 4.',
      `¿Entre 3? ${sumaTxt} ${sd%3===0?'Sí es múltiplo de 3 → sí':'No es múltiplo de 3 → no'}.`,
      `¿Entre 4? Los dos últimos dígitos forman ${dos}; ${dos%4===0?`${dos}÷4 es exacto → sí`:`${dos}÷4 no es exacto → no`}.`,
      `${ok?'Cumple las dos condiciones':'Falla al menos una de las dos condiciones'}. ${final}`];
  }
  return [`${n} ${si} es divisible por ${d}.`];
}

const TRAMPAS = [51,57,87,91,111,119,133,143,161,187,203,209,217,221,247,253,289,299];

function trucoPrimo(n){
  const sd = sumaDig(n), ult = n%10, lim = Math.floor(Math.sqrt(n));
  const par = n%2===0 && n!==2, cinco = ult===5 && n!==5, tres = sd%3===0 && n!==3;
  const revisa = `${n} ${par?'sí es par → compuesto':'no es par'}; ${cinco?'termina en 5 → compuesto':'no termina en 5'}; sus dígitos suman ${sd}, que ${tres?'sí es múltiplo de 3 → compuesto':'no es múltiplo de 3'}`;
  const cola = (par||cinco||tres) ? ' Con eso ya quedó resuelto, sin dividir nada.'
    : ` Como pasó las tres, no queda otra que dividir — pero basta probar hasta ${lim}, porque de ahí en adelante el primo por sí mismo ya pasa de ${n}.`;
  return `TRUCO: antes de ponerte a dividir, descarta lo fácil de un vistazo: ¿es par y no es el 2? ¿termina en 5 y no es el 5? ¿sus dígitos suman múltiplo de 3? Con que una sola diga que sí, ya es compuesto. Ejemplo con este mismo: ${revisa}.${cola}`;
}
function explPrimo(n){
  const intro = 'Un número "primo" es el que solo se puede dividir exacto entre 1 y entre sí mismo, sin ningún otro divisor. Si tiene algún otro divisor más, se llama "compuesto".';
  if(esPrimo(n)){
    const lim = Math.floor(Math.sqrt(n));
    const ps = [2,3,5,7,11,13,17].filter(x=>x<=lim);
    const li = [intro,
      `Para comprobarlo no hace falta probar todos los números: si ${n} tuviera un divisor mayor que √${n} (≈ ${lim}), tendría que existir otro divisor más pequeño que lo acompañe — así que basta con probar los primos hasta ${lim}.`];
    li.push(ps.length ? `Probamos dividir ${n} entre ${ps.join(', ')}: en ningún caso da una división exacta.`
                      : `Como √${n} es menor que 2, no hay ningún primo más pequeño que probar.`);
    li.push(`→ ${n} no tiene más divisores que 1 y él mismo, así que es PRIMO.`);
    li.push(trucoPrimo(n));
    return li;
  }
  let d = 2; while(n%d !== 0) d++;
  const li = [intro, 'Buscamos el divisor más pequeño de este número, distinto de 1.'];
  if(d>2) li.push(`${n} no es par, así que el 2 queda descartado; seguimos probando hacia arriba.`);
  li.push(`${n} ÷ ${d} = ${n/d}, y esa división sale exacta (sin residuo).`);
  li.push(`Como ${n} = ${d} × ${n/d}, ya tiene un divisor además de 1 y de sí mismo → es COMPUESTO, no primo.`);
  if(TRAMPAS.indexOf(n) >= 0) li.push(`Este es de los que engañan: ${n} no se ve tan obviamente compuesto a simple vista, por eso conviene probar varios primos antes de decidir.`);
  li.push(trucoPrimo(n));
  return li;
}

// lista los primos repetidos (2 × 2 × 3) para poder comprobar multiplicando
function planosDe(n){
  const f = factorizar(n), out = [];
  Object.keys(f).map(Number).sort((a,b)=>a-b).forEach(p => { for(let i=0;i<f[p];i++) out.push(p); });
  return out.join(' × ');
}
function explFactorizar(n){
  const li = ['"Factorizar" un número significa escribirlo como una multiplicación de números primos (números que solo se dividen entre 1 y entre sí mismos). Se hace dividiendo entre primos, empezando siempre por el más pequeño que quepa exacto:'];
  let m = n, d = 2;
  while(m > 1){
    if(m % d === 0){ li.push(`${m} ÷ ${d} = ${m/d} (${d} es primo y divide exacto)`); m = m/d; }
    else d++;
  }
  li.push(`Llegamos a 1, así que ya no hay más que dividir. Juntando todos los primos que usamos: ${n} = ${fmtFactores(factorizar(n))}`);
  li.push(`TRUCO: hazlo en "escalerita" — el número a la izquierda, el primo entre el que divides a la derecha, y NO subas al siguiente primo mientras el de ahora siga entrando exacto. Al final multiplica toda la columna de la derecha: tiene que darte el número original. Ejemplo con este mismo: multiplica ${planosDe(n)} y te vuelve a dar ${n}; si no diera, habría un error en algún renglón.`);
  return li;
}

function explMcmListado(a,b){
  const m = mcm(a,b), la = [], lb = [];
  for(let k=1; a*k<=m; k++) la.push(a*k);
  for(let k=1; b*k<=m; k++) lb.push(b*k);
  return [`El "MCM" (mínimo común múltiplo) es el número más pequeño que aparece en la tabla de multiplicar tanto de ${a} como de ${b} — el primer punto de encuentro entre las dos listas de múltiplos.`,
          `Múltiplos de ${a} (${a}, ${a}×2, ${a}×3...): ${la.join(', ')}`,
          `Múltiplos de ${b} (${b}, ${b}×2, ${b}×3...): ${lb.join(', ')}`,
          `El primer número que aparece en las dos listas es ${m} → MCM(${a}, ${b}) = ${m}`,
          `TRUCO: no hace falta escribir las dos listas. Ve nombrando solo los múltiplos del número MÁS GRANDE y en cada uno pregúntate si se divide exacto entre el chico; el primero que sí, es el MCM. Ejemplo con estos mismos: ${(()=>{ const G=Math.max(a,b), C=Math.min(a,b), ps=[]; for(let k=1; G*k<=m; k++) ps.push(`${G*k}${(G*k)%C===0?` sí se divide entre ${C}`:' no'}`); return ps.join(', '); })()} → MCM = ${m}, y te ahorraste escribir la lista de ${Math.min(a,b)}.`];
}

function explMcmFactores(ns){
  const fs = ns.map(factorizar);
  const li = ['Otra forma de hallar el MCM es a partir de la factorización prima de cada número:',
    ...ns.map((n,i)=>`${n} = ${fmtFactores(fs[i])}`)];
  const primos = [...new Set(fs.reduce((ac,f)=>ac.concat(Object.keys(f).map(Number)),[]))].sort((a,b)=>a-b);
  li.push('Para que el resultado sea múltiplo de todos ellos a la vez, se toma cada primo que aparezca con su MAYOR exponente, sin importar en cuál de los números apareció:');
  primos.forEach(p=>{
    const es = fs.map(f => f[p]||0);
    li.push(`Primo ${p}: aparece con exponente ${es.join(', ')} en cada número → se toma el mayor, ${Math.max.apply(null,es)}`);
  });
  const partes = primos.map(p=>{ const e = Math.max.apply(null, fs.map(f=>f[p]||0)); return e>1 ? p+sup(e) : ''+p; });
  li.push(`Multiplicando esos primos con sus mayores exponentes: MCM = ${partes.join(' × ')} = ${ns.reduce(mcm)}`);
  li.push(`TRUCO: antes de factorizar nada, revisa dos atajos. Si el número más grande ya se divide exacto entre los otros, el MCM es ese grande y terminaste. Y si los números no comparten ningún factor, el MCM es simplemente multiplicarlos. Ejemplo con estos mismos: ${(()=>{ const M=Math.max.apply(null,ns), prod=ns.reduce((x,y)=>x*y,1), r=ns.reduce(mcm); if(ns.every(x=>M%x===0)) return `${M} ya se divide exacto entre ${ns.filter(x=>x!==M).join(' y ')}, así que el MCM es ${M} sin factorizar nada`; if(r===prod) return `${ns.join(', ')} no comparten ningún factor, así que el MCM es ${ns.join(' × ')} = ${r}`; return `no aplica ninguno de los dos atajos (${M} no se divide exacto entre los otros, y sí comparten factores), así que toca factorizar como arriba`; })()}.`);
  return li;
}

function trucoMcd(ns){
  let a = Math.max.apply(null, ns), b = Math.min.apply(null, ns);
  const ps = [];
  while(b){ ps.push(`${a} entre ${b} sobra ${a%b}`); const r = a%b; a = b; b = r; }
  const extra = ns.length > 2 ? ` Con tres números, repites lo mismo entre ese resultado y el que falta.` : '';
  return `TRUCO: dos cosas que ahorran mucho tiempo. (1) El MCD nunca puede ser mayor que el número más chico, así que si el chico divide exacto al grande, el MCD ES el chico. (2) Si no lo ves, no factorices: divide el grande entre el chico y quédate con el RESIDUO; después divide el chico entre ese residuo, y sigue hasta que sobre 0 — el último número entre el que dividiste es el MCD. Ejemplo con estos mismos: ${ps.join('; ')} → el MCD es ${a}.${extra}`;
}
function explMcd(ns){
  const fs = ns.map(factorizar);
  const li = ['El "MCD" (máximo común divisor) es el número más grande que divide exacto a todos los números a la vez. Con factorización prima:',
    ...ns.map((n,i)=>`${n} = ${fmtFactores(fs[i])}`)];
  const comunes = Object.keys(fs[0]).map(Number).filter(p => fs.every(f=>f[p])).sort((a,b)=>a-b);
  if(!comunes.length){
    li.push('Ningún primo se repite en TODAS las factorizaciones a la vez.');
    li.push(`Sin ningún factor primo en común, el MCD es 1 — se dice que estos números son "primos entre sí".`);
    li.push(trucoMcd(ns));
    return li;
  }
  li.push('El MCD se arma con SOLO los primos que aparecen en TODAS las factorizaciones, tomando el MENOR exponente en que aparecen:');
  comunes.forEach(p=>{
    const es = fs.map(f=>f[p]);
    li.push(`Primo ${p}: aparece con exponente ${es.join(', ')} en cada número → se toma el menor, ${Math.min.apply(null,es)}`);
  });
  const partes = comunes.map(p=>{ const e = Math.min.apply(null, fs.map(f=>f[p])); return e>1 ? p+sup(e) : ''+p; });
  li.push(`Multiplicando esos primos comunes con sus menores exponentes: MCD = ${partes.join(' × ')} = ${ns.reduce(mcd)}`);
  li.push(trucoMcd(ns));
  return li;
}

function explComparar(a,b){
  const m = mcm(a.d,b.d), ka = m/a.d, kb = m/b.d;
  const na = a.n*ka, nb = b.n*kb, s = cmpSigno(na,nb);
  return [`No se pueden comparar directamente dos fracciones con denominadores distintos — primero hay que convertirlas para que tengan el MISMO denominador.`,
    `El denominador común más chico es el MCM de ${a.d} y ${b.d}: MCM(${a.d}, ${b.d}) = ${m}`,
    `${a.n}/${a.d} → se multiplica arriba y abajo por ${ka} (porque ${a.d}×${ka}=${m}) → ${na}/${m}`,
    `${b.n}/${b.d} → se multiplica arriba y abajo por ${kb} (porque ${b.d}×${kb}=${m}) → ${nb}/${m}`,
    `Con el mismo denominador, ya se pueden comparar solo los numeradores: ${na} ${s} ${nb}`,
    `→ ${a.n}/${a.d} ${s} ${b.n}/${b.d}`,
    `TRUCO: cuando son SOLO DOS fracciones, ni busques el MCM — multiplica en cruz: numerador de una por denominador de la otra, en los dos sentidos, y gana el lado más grande. Ejemplo con estas mismas: ${a.n} × ${b.d} = ${a.n*b.d} contra ${b.n} × ${a.d} = ${b.n*a.d}; como ${a.n*b.d} ${s} ${b.n*a.d}, queda ${a.n}/${a.d} ${s} ${b.n}/${b.d} — lo mismo que por el camino largo, en dos multiplicaciones.`];
}

            `El orden de operaciones dice: primero lo que está entre paréntesis, luego exponentes, luego multiplicación/división, y al final suma/resta.`,
            `Agrupación: ${c} − ${d} = ${agr}`, `Exponente: ${agr}² significa ${agr} × ${agr} = ${pot}`,
            `Multiplicación: ${b} × ${pot} = ${prod}`, `Suma (lo último): ${x} + ${prod} = ${resp}`,
            `TRUCO: al sustituir, escribe el valor entre paréntesis — parece tontería, pero es lo que evita que se pierda un signo o que el número se pegue con el de al lado. Y sustituye en TODA la expresión antes de calcular nada: no empieces mientras quede una letra. Ejemplo con este mismo: x vale ${x}, así que queda (${x}) + ${b}(${c} − ${d})², y recién ahí se empieza por el paréntesis.`] };
      }
      const a = R(1,chico), resp = a + prod;
      return { enunciado:`${a} + ${b}(${c} − ${d})²`, tipo:'num', respuesta:resp,
        explicacion:[`El orden de operaciones dice que siempre hay que resolver en este orden: 1) paréntesis, 2) exponentes, 3) multiplicación y división, 4) suma y resta — sin importar en qué orden aparezcan escritos.`,
          `Paréntesis primero: ${c} − ${d} = ${agr}`,
          `Exponente: ${agr}² significa ${agr} × ${agr} = ${pot}`,
          `Multiplicación: ${b} × ${pot} = ${prod}`,
          `Suma (lo último que queda): ${a} + ${prod} = ${resp}`,
          `TRUCO: vuelve a escribir la operación ENTERA en cada renglón, cambiando solo el pedacito que acabas de resolver; casi todos los errores salen de hacer dos pasos de cabeza a la vez. Y un número pegado a un paréntesis significa multiplicar. Ejemplo con este mismo, renglón por renglón: ${a} + ${b}(${c} − ${d})² → ${a} + ${b}(${agr})² → ${a} + ${b} × ${pot} → ${a} + ${prod} = ${resp}.`] };
    }
    if(plantilla==='trampa-div'){
      const c = R(2,chico), a = R(2,chico*3), d = R(1,chico), q = R(1,chico), bb = c*q;
      const resp = a - q + d;
      return { enunciado:`${a} − ${bb} ÷ ${c} + ${d}`, tipo:'num', respuesta:resp,
        explicacion:[`Aunque la resta aparezca primero de izquierda a derecha, la división tiene MAYOR prioridad y se resuelve antes.`,
          `División primero: ${bb} ÷ ${c} = ${q}`,
          `Ahora solo quedan suma y resta, que tienen la MISMA prioridad — se resuelven de izquierda a derecha: ${a} − ${q} + ${d}`,
          `${a} − ${q} = ${a-q}`, `${a-q} + ${d} = ${resp}`,
          `TRUCO: antes de calcular, pásale el lápiz por encima a las multiplicaciones y divisiones de toda la línea — esas van primero. Lo que sobra (sumas y restas) se resuelve de izquierda a derecha, como se lee. Ojo: multiplicar y dividir EMPATAN entre sí, manda el que esté más a la izquierda. Ejemplo con este mismo: subrayas ${bb} ÷ ${c} = ${q}, queda ${a} − ${q} + ${d} = ${resp}. Si hubieras restado primero, ${a} − ${bb} = ${a-bb}, y de ahí ya no salía.`] };
    }
    const b2 = R(1,chico), a2 = b2 + R(1,chico), c2 = R(2,chico), agr2 = a2-b2, resp2 = agr2*c2;
    return { enunciado:`(${a2} − ${b2}) × ${c2}`, tipo:'num', respuesta:resp2,
      explicacion:[`Lo que está dentro de un paréntesis siempre se resuelve primero, antes que cualquier multiplicación de afuera.`,
        `Paréntesis: ${a2} − ${b2} = ${agr2}`,
        `Ahora sí la multiplicación: ${agr2} × ${c2} = ${resp2}`,
        `TRUCO: el paréntesis es una "cajita cerrada": nada de afuera entra hasta que adentro quede un solo número. Resuélvelo, reemplázalo por ese número, y recién entonces sigue. Ejemplo con este mismo: (${a2} − ${b2}) × ${c2} → la cajita da ${agr2} → ${agr2} × ${c2} = ${resp2}. Multiplicando primero daría ${a2} − ${b2*c2}, que está mal.`] };
  }
},
{

        `→ El coeficiente es ${coef}.`,

        `→ La constante es ${respConst}.`,
        `TRUCO: el signo viaja SIEMPRE con el número que tiene a la derecha. Si delante hay un −, la constante es negativa; no lo dejes afuera al contestar. Ese es el error que más se repite en este tema. Ejemplo con este mismo: en ${expr} la constante es ${respConst}${signoConst==='−'?`, con el menos incluido — no ${cons}`:''}.`] };

{
  id:'propiedades', nombre:'Propiedades de los números', secciones:['2.2'],

    const alto = porNivel(nv, 12, 25, 60);

    const casos = {
      'conmutativa-suma': { enun:`${a} + ${b} = ${b} + ${a}`, cat:'Conmutativa',
        expl:[`La propiedad "conmutativa" dice que se puede cambiar el ORDEN de los números en una suma (o en una multiplicación) sin que el resultado cambie.`,
          `Aquí ${a} y ${b} solo intercambiaron su posición, y el resultado sigue siendo el mismo.`,
          `Esa es la propiedad conmutativa.`] },
      'conmutativa-mult': { enun:`${a} × ${b} = ${b} × ${a}`, cat:'Conmutativa',
        expl:[`La propiedad "conmutativa" dice que se puede cambiar el ORDEN de los números en una multiplicación (o en una suma) sin que el resultado cambie.`,
          `Aquí ${a} y ${b} solo intercambiaron su posición.`,
          `Esa es la propiedad conmutativa.`] },
      'asociativa-suma': { enun:`(${a} + ${b}) + ${c} = ${a} + (${b} + ${c})`, cat:'Asociativa',
        expl:[`La propiedad "asociativa" dice que, al sumar tres o más números, se puede cambiar cuáles se AGRUPAN primero con paréntesis, sin que el resultado cambie — el orden de los números no cambia, solo la agrupación.`,
          `A la izquierda se agrupan primero ${a} y ${b}; a la derecha se agrupan primero ${b} y ${c}. El resultado final es igual en ambos casos.`,
          `Esa es la propiedad asociativa.`] },
      'asociativa-mult': { enun:`(${a} × ${b}) × ${c} = ${a} × (${b} × ${c})`, cat:'Asociativa',
        expl:[`La propiedad "asociativa" dice que, al multiplicar tres o más números, se puede cambiar cuáles se AGRUPAN primero con paréntesis, sin que el resultado cambie.`,
          `A la izquierda se agrupan primero ${a} y ${b}; a la derecha se agrupan primero ${b} y ${c}. El resultado final es igual en ambos casos.`,
          `Esa es la propiedad asociativa.`] },
      'identidad-suma': { enun:`${a} + 0 = ${a}`, cat:'Identidad',
        expl:[`Una "identidad" es un valor especial que, al combinarse con cualquier número, lo deja sin cambiar.`,
          `Sumar 0 a cualquier número da ese mismo número — por eso el 0 es la "identidad aditiva" (de la suma).`] },
      'identidad-mult': { enun:`${a} × 1 = ${a}`, cat:'Identidad',
        expl:[`Una "identidad" es un valor especial que, al combinarse con cualquier número, lo deja sin cambiar.`,

      'distributiva': { enun:`${a}(${b} + ${c}) = ${a}×${b} + ${a}×${c}`, cat:'Distributiva',

          `${a} multiplica a todo (${b} + ${c}), así que se reparte: ${a} veces ${b}, más ${a} veces ${c}.`,

  }
},
{

          `Para sumar términos semejantes, se suman solo los coeficientes (los números) y la letra se queda igual, sin sumarse a sí misma.`,
          `${c1} + ${c2} = ${c1+c2}`, `→ ${c1+c2}${letra}`,
          `TRUCO: cambia la letra por una fruta. Ejemplo: ${c1}${letra} + ${c2}${letra} es lo mismo que ${c1} manzanas + ${c2} manzanas = ${c1+c2} manzanas, o sea ${c1+c2}${letra}. Nadie diría "${c1+c2} manzanas al cuadrado" — por eso al SUMAR la letra nunca cambia, solo se suman los números de adelante.`] };
    }
    if(variante==='restar'){
      const c2=R(2,alto), c1=c2+R(1,alto);
      return { enunciado:`${c1}${letra} − ${c2}${letra} = ___${letra}`, tipo:'num', respuesta:c1-c2,
        explicacion:[`Son términos semejantes (los dos tienen la letra ${letra}), así que se pueden combinar en uno solo.`,
          `Para restarlos, se restan solo los coeficientes y la letra se queda igual.`,
          `${c1} − ${c2} = ${c1-c2}`, `→ ${c1-c2}${letra}`,
          `TRUCO: el mismo de las frutas. Ejemplo: ${c1}${letra} − ${c2}${letra} es tener ${c1} manzanas y que te quiten ${c2}: quedan ${c1-c2} manzanas, o sea ${c1-c2}${letra}. La letra solo va de acompañante, no entra en la resta.`] };
    }
    if(variante==='multiplicar'){
      const c1=R(2,porNivel(nv,8,12,18)), c2=R(2,porNivel(nv,8,12,18));
      return { enunciado:`(${c1}${letra})(${c2}${letra}) = ___${letra}²`, tipo:'num', respuesta:c1*c2,
        explicacion:[`Multiplicar es distinto de sumar: aquí SÍ se multiplican tanto los coeficientes como las letras entre sí.`,
          `Coeficientes: ${c1} × ${c2} = ${c1*c2}`,
          `Letras: ${letra} × ${letra} = ${letra}² (multiplicar una letra por sí misma sube su exponente).`,
          `→ ${c1*c2}${letra}²`,
          `TRUCO: aquí NO vale el truco de las frutas — ese solo sirve para sumar y restar. Al multiplicar se junta todo con todo: números por números, letras por letras, y la letra por sí misma sube el exponente. Ejemplo con este mismo: (${c1}${letra})(${c2}${letra}) = ${c1*c2}${letra}², mientras que ${c1}${letra} + ${c2}${letra} sería solo ${c1+c2}${letra}.`] };
    }

        `Aquí un término tiene ${letra} y el otro tiene ${letra2} — son letras distintas, así que NO son semejantes.`,
        `→ No se pueden combinar; la expresión se queda tal cual, ${c1}${letra} + ${c2}${letra2}.`,
        `TRUCO: el de las frutas otra vez. Ejemplo: ${c1}${letra} + ${c2}${letra2} es ${c1} manzanas + ${c2} peras — no se puede escribir como un solo número de nada, se queda así. Para poder juntar dos términos, la parte de la letra tiene que ser idéntica, letra Y exponente (${letra} no se junta con ${letra2}, y ${letra} tampoco se junta con ${letra}²).`] };
  }
},
{

    const T = (ecu, val) => `TRUCO: mira qué le están haciendo a ${letra} y hazle lo CONTRARIO en los dos lados: si suma, restas; si resta, sumas; si multiplica, divides; si divide, multiplicas. Y la comprobación es gratis: mete tu respuesta en la ecuación original. Ejemplo con este mismo: la ecuación era ${ecu}; pones ${letra} = ${val}, haces la cuenta, y si los dos lados dan igual está bien seguro, sin esperar a que te la corrijan.`;
    if(pasos===1){
      const tipoOp = pick(['suma','resta','mult','div']);
      if(tipoOp==='suma'){ const c=R(1,alto), r=x+c;
        return { enunciado:`${letra} + ${c} = ${r}`, tipo:'num', respuesta:x,
          explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad, para saber cuánto vale.`,
            `Aquí le están sumando ${c} a ${letra}. Para deshacer esa suma se hace la operación contraria — restar ${c} — en LOS DOS lados de la igualdad, así se mantiene el equilibrio.`,
            `${letra} = ${r} − ${c} = ${x}`, T(`${letra} + ${c} = ${r}`, x)] }; }
      if(tipoOp==='resta'){ const c=R(1,alto), r=x-c;
        return { enunciado:`${letra} − ${c} = ${r}`, tipo:'num', respuesta:x,
          explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad.`,
            `Aquí le están restando ${c} a ${letra}. La operación contraria de restar es sumar, así que se suma ${c} en los dos lados.`,
            `${letra} = ${r} + ${c} = ${x}`, T(`${letra} − ${c} = ${r}`, x)] }; }
      if(tipoOp==='mult'){ const c=R(2,10), r=x*c;
        return { enunciado:`${c}${letra} = ${r}`, tipo:'num', respuesta:x,
          explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad.`,
            `Aquí ${letra} está multiplicada por ${c}. La operación contraria de multiplicar es dividir, así que se divide entre ${c} en los dos lados.`,
            `${letra} = ${r} ÷ ${c} = ${x}`, T(`${c}${letra} = ${r}`, x)] }; }
      const c=R(2,10), k=R(1,alto), sol=k*c;
      return { enunciado:`${letra} ÷ ${c} = ${k}`, tipo:'num', respuesta:sol,
        explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad.`,
          `Aquí ${letra} está dividida entre ${c}. La operación contraria de dividir es multiplicar, así que se multiplica por ${c} en los dos lados.`,
          `${letra} = ${k} × ${c} = ${sol}`, T(`${letra} ÷ ${c} = ${k}`, sol)] };
    }
    const c1 = R(2,10), c2 = R(1,alto), sig = pick(['+','−']);
    const r = sig==='+' ? c1*x + c2 : c1*x - c2;
    return { enunciado:`${c1}${letra} ${sig} ${c2} = ${r}`, tipo:'num', respuesta:x,
      explicacion:[`Esta ecuación necesita dos pasos porque a ${letra} le están haciendo dos cosas a la vez: multiplicarla por ${c1} y ${sig==='+'?'sumarle':'restarle'} ${c2}.`,
        `Paso 1 — deshacer la suma/resta primero (fue lo último que se le hizo a ${letra}, así que se deshace primero): ${sig==='+'?`${r} − ${c2}`:`${r} + ${c2}`} = ${c1*x}`,
        `Paso 2 — deshacer la multiplicación: ${c1*x} ÷ ${c1} = ${x}`, `→ ${letra} = ${x}`,
        `TRUCO: deshazlo en orden inverso, como quitarte la ropa: primero lo que está más LEJOS de ${letra} (el número que suma o resta) y de último lo que está pegado a ella (el que la multiplica). Nunca al revés. Ejemplo con este mismo: ${r} ${sig==='+'?'−':'+'} ${c2} = ${c1*x}, y ${c1*x} ÷ ${c1} = ${x}; para comprobar, ${c1}×${x} ${sig} ${c2} tiene que dar ${r}.`] };
  }
},

{
  id:'perimetro-area', nombre:'Perímetro y área', secciones:['2.7'],
  // El truco depende de si piden perímetro o área, no de la figura — se pega aquí
  // en vez de repetirlo en los 14 returns de _gen.
  gen(nv){
    const e = this._gen(nv);
    const esArea = /área/.test(e.enunciado);
    e.explicacion = e.explicacion.concat((esArea ? TRUCO_AREA : TRUCO_PERIM) + (esArea
      ? ` Ejemplo con este mismo: te dio ${e.respuesta} multiplicando las medidas; si en vez de eso sumaras los lados saldría otro número, y ese sería el perímetro.`
      : ` Ejemplo con este mismo: te dio ${e.respuesta} sumando lo que rodea la figura; si multiplicaras las medidas saldría otro número, y ese sería el área.`));
    return e;
  },
  _gen(nv){
    const alto = porNivel(nv, 12, 20, 35);
    const R2 = () => R(3,alto);
    const forma = pick(['cuadrado','rectangulo','triangulo','circulo','trapecio','rombo','romboide']);
    const medida = pick(['perimetro','area']);
    if(forma==='cuadrado'){
      const l = R2();
      return medida==='perimetro'
        ? { enunciado:`Halla el <b>perímetro</b> de un cuadrado de lado ${l}.`, tipo:'num', respuesta:4*l,
            explicacion:[`El perímetro es la distancia total alrededor de una figura — la suma de todos sus lados.`,
              `Un cuadrado tiene 4 lados, y los 4 miden lo mismo, así que el perímetro es 4 veces el lado: P = 4 × lado`,
              `P = 4 × ${l} = ${4*l}`] }
        : { enunciado:`Halla el <b>área</b> de un cuadrado de lado ${l}.`, tipo:'num', respuesta:l*l,
            explicacion:[`El área es la cantidad de superficie que cubre una figura por dentro, medida en unidades cuadradas.`,
              `En un cuadrado, el área es el lado multiplicado por sí mismo: A = lado²`,
              `A = ${l}² = ${l} × ${l} = ${l*l}`] };
    }
    if(forma==='rectangulo'){
      const l=R2(), w=R2();
      return medida==='perimetro'
        ? { enunciado:`Halla el <b>perímetro</b> de un rectángulo de ${l} por ${w}.`, tipo:'num', respuesta:2*l+2*w,
            explicacion:[`El perímetro es la distancia total alrededor de la figura — la suma de sus 4 lados.`,
              `Un rectángulo tiene 2 lados largos iguales y 2 lados anchos iguales: P = 2×largo + 2×ancho`,
              `P = 2×${l} + 2×${w} = ${2*l+2*w}`] }
        : { enunciado:`Halla el <b>área</b> de un rectángulo de ${l} por ${w}.`, tipo:'num', respuesta:l*w,
            explicacion:[`El área es la superficie que cubre la figura por dentro.`,
              `En un rectángulo, el área es largo por ancho: A = largo × ancho`,
              `A = ${l} × ${w} = ${l*w}`] };
    }
    if(forma==='triangulo'){
      if(medida==='area'){
        const b=R2(), h=R2(), bb=(b*h)%2===0?b:b+1, a=(bb*h)/2;
        return { enunciado:`Halla el <b>área</b> de un triángulo con base ${bb} y altura ${h}.`, tipo:'num', respuesta:a,
          explicacion:[`El área de un triángulo es la mitad de "base por altura" — la altura es la distancia perpendicular (en ángulo recto) desde la base hasta el vértice de enfrente.`,
            `A = (base × altura) ÷ 2`, `A = (${bb} × ${h}) ÷ 2 = ${bb*h} ÷ 2 = ${a}`] };
      }
      const l1=R2(),l2=R2(),l3=R2();
      return { enunciado:`Halla el <b>perímetro</b> de un triángulo con lados ${l1}, ${l2} y ${l3}.`, tipo:'num', respuesta:l1+l2+l3,
        explicacion:[`El perímetro es la distancia total alrededor de la figura — simplemente se suman los 3 lados.`,
          `P = ${l1} + ${l2} + ${l3} = ${l1+l2+l3}`] };
    }
    if(forma==='circulo'){
      const r = R(2,15);
      if(medida==='perimetro'){ const c = Math.round(2*3.14*r*100)/100;
        return { enunciado:`Halla la <b>circunferencia</b> de un círculo con radio ${r} (usa π ≈ 3.14).`, tipo:'num', respuesta:c,
          explicacion:[`En un círculo, el "perímetro" se llama circunferencia — la distancia alrededor de todo el borde curvo.`,
            `π (pi) es un número especial, siempre el mismo para cualquier círculo, aproximadamente 3.14. Fórmula: C = 2πr, donde r es el radio (del centro al borde).`,
            `C = 2 × 3.14 × ${r} = ${c}`] }; }
      const a = Math.round(3.14*r*r*100)/100;
      return { enunciado:`Halla el <b>área</b> de un círculo con radio ${r} (usa π ≈ 3.14).`, tipo:'num', respuesta:a,
        explicacion:[`El área es la superficie que cubre el círculo por dentro.`,
          `La fórmula es A = πr² (pi por el radio, al cuadrado).`,
          `A = 3.14 × ${r}² = 3.14 × ${r*r} = ${a}`] };
    }
    if(forma==='trapecio'){
      const B=R2(), b2=R(2,B-1), l1=R2(), l2=R2();
      if(medida==='area'){ const h=R2(), b3=((B+b2)*h)%2===0?b2:b2+1, a=((B+b3)*h)/2;
        return { enunciado:`Halla el <b>área</b> de un trapecio con bases ${B} y ${b3}, y altura ${h}.`, tipo:'num', respuesta:a,
          explicacion:[`Un trapecio tiene dos lados paralelos de distinto tamaño, llamados "base mayor" y "base menor". Su área es el promedio de esas dos bases, multiplicado por la altura.`,
            `A = ((base mayor + base menor) × altura) ÷ 2`, `A = ((${B} + ${b3}) × ${h}) ÷ 2 = ${(B+b3)*h} ÷ 2 = ${a}`] }; }
      return { enunciado:`Halla el <b>perímetro</b> de un trapecio con lados ${B}, ${b2}, ${l1} y ${l2}.`, tipo:'num', respuesta:B+b2+l1+l2,
        explicacion:[`El perímetro es la distancia total alrededor de la figura — se suman los 4 lados.`,
          `P = ${B} + ${b2} + ${l1} + ${l2} = ${B+b2+l1+l2}`] };
    }
    if(forma==='rombo'){
      const l = R2();
      if(medida==='perimetro') return { enunciado:`Halla el <b>perímetro</b> de un rombo de lado ${l}.`, tipo:'num', respuesta:4*l,
        explicacion:[`Un rombo tiene sus 4 lados iguales (como un cuadrado "inclinado"), así que el perímetro es 4 veces ese lado.`,
          `P = 4 × lado`, `P = 4 × ${l} = ${4*l}`] };
      const D=R(4,alto), d0=R(2,D-1), d=(D*d0)%2===0?d0:d0+1, a=(D*d)/2;
      return { enunciado:`Halla el <b>área</b> de un rombo con diagonales ${D} y ${d}.`, tipo:'num', respuesta:a,
        explicacion:[`Las "diagonales" van de una esquina a la opuesta, cruzando por dentro. El área de un rombo es la mitad del producto de sus dos diagonales.`,
          `A = (diagonal mayor × diagonal menor) ÷ 2`, `A = (${D} × ${d}) ÷ 2 = ${D*d} ÷ 2 = ${a}`] };
    }
    const b=R2(), h=R2(), l=R2();
    return medida==='area'
      ? { enunciado:`Halla el <b>área</b> de un romboide con base ${b} y altura ${h}.`, tipo:'num', respuesta:b*h,
          explicacion:[`Un romboide (paralelogramo) es como un rectángulo "inclinado". Su área se calcula igual: base por altura (la altura es la distancia perpendicular entre las dos bases, no el lado inclinado).`,
            `A = base × altura`, `A = ${b} × ${h} = ${b*h}`] }
      : { enunciado:`Halla el <b>perímetro</b> de un romboide con lados ${b} y ${l}.`, tipo:'num', respuesta:2*b+2*l,
          explicacion:[`El perímetro es la distancia alrededor de la figura. Un romboide tiene 2 pares de lados iguales, así que se duplica cada uno y se suman.`,
            `P = 2×lado a + 2×lado b`, `P = 2×${b} + 2×${l} = ${2*b+2*l}`] };
  }
},

        `TRUCO: da igual si lo que falta está arriba o abajo, el método es el mismo: mira el lado COMPLETO (aquí los numeradores), averigua por cuánto se multiplicó y hazle eso mismo al otro lado. Ejemplo con este mismo: ${n} × ${k} = ${n*k}, entonces abajo ${d} × ${k} = ${d*k}. Comprobación en cruz: ${n} × ${d*k} y ${n*k} × ${d} dan ${n*(d*k)} las dos.`] };

{
  id:'simplificar', nombre:'Simplificar fracciones', secciones:['3.4','3.5'],
  gen(nv){

    const g = mcd(bn,bd); bn/=g; bd/=g;                 // base ya simplificada
    const k = R(2, porNivel(nv, 6, 10, 16));

    return { enunciado, tipo:'frac', respuesta:{n:bn, d:bd}, pedirSimple:true,

{
  id:'comparar', nombre:'Comparar y ordenar', secciones:['3.5','3.6'],
  gen(nv){
    const alto = porNivel(nv, 9, 14, 22);
    const nueva = () => { const d = R(2,alto); return { n:R(1,d-1), d }; };
    if(Math.random() < 0.65){                            // comparar dos
      const a = nueva();

      const m = mcm(a.d,b.d);

    }

      if(!fs.some(x => x.n*f.d === f.n*x.d)) fs.push(f); }

        `TRUCO: es una división de toda la vida, la de la casita: el cociente sale afuera como entero y el residuo se queda arriba. Ejemplo con este mismo: ${imp} ÷ ${d} da ${e} y sobran ${n} → ${e} ${n}/${d}. Comprobación instantánea: ${n} tiene que ser menor que ${d}; si te queda igual o mayor, es que todavía cabía otro entero.`] };

/* ══════════════════════════════════════════════════════════
   4. VERIFICACIÓN  — una función para los 6 tipos de entrada
   ══════════════════════════════════════════════════════════ */
function parseFactores(s){
  s = String(s).toLowerCase().replace(/[×·]/g,'*').replace(/\s+/g,'').replace(/x/g,'*');
  if(!s) return null;
  const out = {};
  for(const t of s.split('*')){
    if(!t) return null;
    const m = t.match(/^(\d+)(?:\^(\d+))?$/);
    if(!m) return null;
    const p = +m[1], e = m[2] ? +m[2] : 1;
    if(p < 2) return null;
    out[p] = (out[p]||0) + e;
  }
  return out;
}
const numLimpio = s => Number(String(s).trim().replace(/\s+/g,'').replace(',','.'));

function verificar(ej, ent){
  switch(ej.tipo){
    case 'sino': return { ok: ent === ej.respuesta };
    case 'cmp':  return { ok: ent === ej.respuesta };
    case 'num': {
      const v = numLimpio(ent);
      if(!isFinite(v) || ent === '') return { ok:false, vacio:true };
      return { ok: Math.abs(v - ej.respuesta) < 0.01 };   // tolerancia: promedio/círculo redondean a 2 decimales
    }
    case 'opciones': return { ok: ent === ej.respuesta };
    case 'orden': return { ok: ent.length===ej.respuesta.length && ent.every((v,i)=>v===ej.respuesta[i]) };
    case 'frac': {
      let n = numLimpio(ent.n), d = numLimpio(ent.d);
      if(!isFinite(n) || !isFinite(d) || ent.n==='' || ent.d==='') return { ok:false, vacio:true };
      if(d === 0) return { ok:false, msg:'El denominador no puede ser 0.' };
      if(d < 0){ n = -n; d = -d; }                       // signo delante = signo arriba
      const Rp = ej.respuesta;
      if(n*Rp.d !== Rp.n*d) return { ok:false };
      if(ej.pedirSimple && mcd(Math.abs(n), d) !== 1)
        return { ok:false, incompleto:true,
                 msg:`${n}/${d} vale lo mismo, pero el ejercicio pedía la mínima expresión.` };
      return { ok:true };
    }
    case 'mixto': {
      const e = numLimpio(ent.e), n = numLimpio(ent.n), d = numLimpio(ent.d);
      if(![e,n,d].every(isFinite) || ent.e==='' || ent.n==='' || ent.d==='') return { ok:false, vacio:true };
      if(d <= 0) return { ok:false, msg:'El denominador tiene que ser mayor que 0.' };
      const Rp = ej.respuesta;
      if((e*d + n)*Rp.d !== (Rp.e*Rp.d + Rp.n)*d) return { ok:false };
      if(n >= d) return { ok:false, incompleto:true,
        msg:'El valor es correcto, pero en un número mixto el numerador tiene que ser menor que el denominador.' };
      if(mcd(n,d) !== 1) return { ok:false, incompleto:true, msg:'Falta simplificar la parte fraccionaria.' };
      return { ok:true };
    }
    case 'texto': {
      const f = parseFactores(ent);
      if(!f) return { ok:false, msg:'No entendí lo que escribiste. Ejemplo: <b>2^3 * 5</b>' };
      const bases = Object.keys(f).map(Number);
      if(bases.some(p => !esPrimo(p)))
        return { ok:false, msg:`Todos los factores tienen que ser primos (${bases.filter(p=>!esPrimo(p)).join(', ')} no lo ${bases.filter(p=>!esPrimo(p)).length>1?'son':'es'}).` };
      const Rp = ej.respuesta, ks = Object.keys(Rp);
      const ok = bases.length===ks.length && ks.every(p => f[p] === Rp[p]);
      return { ok };
    }
  }
  return { ok:false };
}

// respuesta correcta con la forma que tendría escrita el usuario (lo usa autotest)
function respuestaComoEntrada(ej){
  switch(ej.tipo){
    case 'sino': case 'cmp': case 'orden': case 'opciones': return ej.respuesta;
    case 'num':   return String(ej.respuesta);
    case 'frac':  return { n:String(ej.respuesta.n), d:String(ej.respuesta.d) };
    case 'mixto': return { e:String(ej.respuesta.e), n:String(ej.respuesta.n), d:String(ej.respuesta.d) };
    case 'texto': return fmtFactoresPlano(ej.respuesta);
  }
}
function fmtRespuesta(ej){
  switch(ej.tipo){
    case 'sino':  return ej.respuesta ? 'Sí' : 'No';
    case 'cmp':   return ej.respuesta;
    case 'num':   return String(ej.respuesta);
    case 'frac':  return `${ej.respuesta.n}/${ej.respuesta.d}`;
    case 'mixto': return `${ej.respuesta.e} ${ej.respuesta.n}/${ej.respuesta.d}`;
    case 'texto': return fmtFactores(ej.respuesta);
    case 'orden': return ej.respuesta.map(i=>`${ej.opciones[i].n}/${ej.opciones[i].d}`).join(' , ');
    case 'opciones': return ej.respuesta;
  }
}

function analizarTexto(txt){
  const t = ' ' + String(txt).toLowerCase().replace(/\s+/g,' ') + ' ';
  const puntos = {}, secs = new Set();
  MODULOS.forEach(m => puntos[m.id] = 0);

  // (a) rangos "3.1 - 3.8" y "3.1 a 3.8"
  const rangos = t.match(/(\d+)\s*\.\s*(\d+)\s*(?:-|–|—|a|to)\s*(\d+)\s*\.\s*(\d+)/g) || [];
  rangos.forEach(r=>{
    const m = r.match(/(\d+)\s*\.\s*(\d+)\s*(?:-|–|—|a|to)\s*(\d+)\s*\.\s*(\d+)/);
    if(+m[1] !== +m[3]) return;                          // solo dentro del mismo capítulo
    for(let s = +m[2]; s <= +m[4]; s++) secs.add(`${+m[1]}.${s}`);
  });
  // (b) secciones sueltas — solo cuentan las que existen en el mapa
  (t.match(/\b\d+\s*\.\s*\d+\b/g) || []).forEach(s => {
    const k = s.replace(/\s+/g,'');
    if(SECMAP[k]) secs.add(k);
  });

  const secsValidas = [...secs].filter(s => SECMAP[s]).sort();
  secsValidas.forEach(s => SECMAP[s].forEach(id => puntos[id] += 5));

  // (c) palabras clave
  const encontradas = {};
  MODULOS.forEach(m=>{
    encontradas[m.id] = [];
    CLAVES[m.id].forEach(k=>{
      if(t.indexOf(' '+k) >= 0 || t.indexOf(k+' ') >= 0){
        puntos[m.id] += 1; encontradas[m.id].push(k);
      }
    });
  });

  const detectados = MODULOS.filter(m => puntos[m.id] > 0)
    .sort((a,b) => puntos[b.id] - puntos[a.id]);
  return { puntos, secciones: secsValidas, detectados, claves: encontradas };
}

/* --- lectura de archivos (las librerías se cargan solo si hacen falta) --- */
const URL_JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const URL_PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const URL_PDFWK = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function cargarScript(src){
  return new Promise((ok, err)=>{
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>ok();
    s.onerror = ()=>err(new Error('No se pudo cargar la librería. ¿Hay internet?'));
    document.head.appendChild(s);
  });
}
const desXml = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                     .replace(/&apos;/g,"'").replace(/&amp;/g,'&');

async function textoDePptx(file){
  await cargarScript(URL_JSZIP);
  const zip = await JSZip.loadAsync(file);
  const slides = Object.keys(zip.files)
    .filter(n => /^ppt\/(slides|notesSlides)\/\w+\d+\.xml$/.test(n))
    .sort((a,b) => (+a.replace(/\D/g,'')) - (+b.replace(/\D/g,'')));
  if(!slides.length) throw new Error('Ese .pptx no tiene diapositivas legibles.');
  const out = [];
  for(const n of slides){
    const xml = await zip.files[n].async('string');
    out.push((xml.match(/<a:t[^>]*>[\s\S]*?<\/a:t>/g) || [])
      .map(t => desXml(t.replace(/<[^>]+>/g,''))).join(' '));
  }
  return out.join('\n');
}
async function textoDePdf(file){
  await cargarScript(URL_PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL_PDFWK;
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for(let i=1; i<=doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    out.push(tc.items.map(it => it.str).join(' '));
  }
  return out.join('\n');
}
async function textoDeArchivo(file){
  const n = file.name.toLowerCase();
  if(n.endsWith('.pptx')) return textoDePptx(file);
  if(n.endsWith('.pdf'))  return textoDePdf(file);
  return file.text();
}

const guardar = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const leer = (k,d) => { try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } };

let nivel  = leer('mate_nivel_v1', 'medio');

let racha  = leer('mate_racha_v1', { actual:0, mejor:0 });
let errores = leer('mate_errores_v1', []);          // [{modId, ej}], más reciente primero, tope 30
let historial = leer('mate_historial_v1', {});      // { "YYYY-MM-DD": cantidad de ejercicios }
let rachaDias = leer('mate_racha_dias_v1', { actual:0, mejor:0, ultimoDia:null });

function anotar(modId, ok){
  const s = stats[modId] || (stats[modId] = { ok:0, fallo:0 });
  ok ? s.ok++ : s.fallo++;
  guardar('mate_stats_v1', stats);
  racha.actual = ok ? racha.actual + 1 : 0;
  if(racha.actual > racha.mejor) racha.mejor = racha.actual;
  guardar('mate_racha_v1', racha);
  _empujarSync(modId, ok);
  _registrarHistorialYRachaDias();
}
function _registrarHistorialYRachaDias(){
  const hoy = new Date().toISOString().slice(0,10);
  historial[hoy] = (historial[hoy]||0) + 1;
  guardar('mate_historial_v1', historial);
  if(rachaDias.ultimoDia !== hoy){
    const ayer = new Date(Date.now()-86400000).toISOString().slice(0,10);
    rachaDias.actual = (rachaDias.ultimoDia === ayer) ? rachaDias.actual+1 : 1;
    rachaDias.mejor = Math.max(rachaDias.mejor, rachaDias.actual);
    rachaDias.ultimoDia = hoy;
    guardar('mate_racha_dias_v1', rachaDias);
  }
}
function _registrarError(ej){
  errores.unshift({ modId: ej.__mod, ej });
  errores = errores.slice(0, 30);
  guardar('mate_errores_v1', errores);
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDrOButk_G90Qcrj3BB-tEHa9l2lJrVc-0",
  authDomain: "mate-practica-matematicas.firebaseapp.com",

  messagingSenderId: "511953502483",
  appId: "1:511953502483:web:8b0d98d48c1039d3f25ae6"
};
const URL_FB_APP = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js';
const URL_FB_FS  = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js';
const ALFABETO_CODIGO = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';  // sin 0/O/1/I/L, para no confundir al escribir

let syncCode = leer('mate_sync_code_v1', null);
let syncDoc = null;      // referencia Firestore, null hasta conectar
let syncListo = false;   // true cuando ya hay listener activo
let _syncUnsub = null;

function generarCodigo(){
  let s = '';
  for(let g=0; g<3; g++){
    for(let i=0; i<4; i++) s += ALFABETO_CODIGO[Math.floor(Math.random()*ALFABETO_CODIGO.length)];
    if(g<2) s += '-';
  }
  return s;
}
async function _hashCodigo(codigo){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codigo.trim().toUpperCase()));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function _initFirebase(){
  await cargarScript(URL_FB_APP);
  await cargarScript(URL_FB_FS);
  if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}  // offline: cachea y reintenta sola
  }
  return firebase.firestore();
}
function _fusionarStats(a, b){
  const ids = new Set([...Object.keys(a), ...Object.keys(b)]);
  const out = {};
  ids.forEach(id => {
    const x = a[id] || {ok:0, fallo:0}, y = b[id] || {ok:0, fallo:0};
    out[id] = { ok: (x.ok||0) + (y.ok||0), fallo: (x.fallo||0) + (y.fallo||0) };
  });
  return out;
}
async function conectarSync(codigo){           // se llama UNA vez, al vincular este aparato
  const db = await _initFirebase();
  const id = await _hashCodigo(codigo);
  const ref = db.collection('syncs').doc(id);
  const snap = await ref.get();
  const remoto = snap.exists ? snap.data() : {};
  await ref.set({
    stats: _fusionarStats(remoto.stats || {}, stats),
    racha: { actual: (remoto.racha && remoto.racha.actual) || racha.actual,
             mejor: Math.max((remoto.racha && remoto.racha.mejor) || 0, racha.mejor) },
    nivel: remoto.nivel || nivel,
    clase: remoto.clase !== undefined ? remoto.clase : (clase || null)
  }, { merge: true });
  syncDoc = ref;
  syncCode = codigo.trim().toUpperCase();
  guardar('mate_sync_code_v1', syncCode);
  _escucharSync();
}
async function _reengancharSync(){              // se llama en cada apertura, si ya había un código guardado
  if(!syncCode) return;
  const db = await _initFirebase();
  const id = await _hashCodigo(syncCode);
  syncDoc = db.collection('syncs').doc(id);
  _escucharSync();
}
function _escucharSync(){
  if(!syncDoc || syncListo) return;
  syncListo = true;
  _syncUnsub = syncDoc.onSnapshot(snap => {
    const d = snap.data();
    if(!d) return;
    // Firestore solo guarda el campo que se incrementó (ok o fallo) — un tema sin fallos
    // nunca queda con esa clave. Se normaliza al recibir para que pct() no dé NaN.
    if(d.stats){
      stats = {};
      Object.keys(d.stats).forEach(id => { stats[id] = { ok: d.stats[id].ok||0, fallo: d.stats[id].fallo||0 }; });
    }
    if(d.racha){ racha.actual = d.racha.actual||0; racha.mejor = Math.max(racha.mejor||0, d.racha.mejor||0); }
    if(d.nivel) nivel = d.nivel;
    if(d.clase !== undefined) clase = d.clase;
    guardar('mate_stats_v1', stats); guardar('mate_racha_v1', racha);
    guardar('mate_nivel_v1', nivel); guardar('mate_clase_v1', clase);
    // si estás mirando Inicio o Progreso cuando llega el cambio del otro aparato, refresca sola
    if(_pantallaActual === pantallaInicio || _pantallaActual === pantallaStats) _pantallaActual();
  }, err => console.warn('sync:', err.message));
}
// las escrituras se juntan unos segundos en vez de mandar una por cada respuesta — menos
// veces que se despierta la radio del teléfono para lo mismo
let _syncPendiente = null, _syncTimer = null;
function _empujarSync(modId, ok){
  if(!syncDoc) return;
  if(!_syncPendiente) _syncPendiente = { stats:{} };
  const p = _syncPendiente.stats[modId] || (_syncPendiente.stats[modId] = { ok:0, fallo:0 });
  p[ok ? 'ok' : 'fallo']++;
  _syncPendiente.racha = { actual: racha.actual, mejor: racha.mejor };
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(_flushSync, 4000);
}
function _flushSync(){
  clearTimeout(_syncTimer); _syncTimer = null;
  if(!syncDoc || !_syncPendiente) return;
  const p = _syncPendiente; _syncPendiente = null;
  const statsInc = {};
  Object.keys(p.stats).forEach(id => {
    statsInc[id] = {};
    if(p.stats[id].ok)    statsInc[id].ok    = firebase.firestore.FieldValue.increment(p.stats[id].ok);
    if(p.stats[id].fallo) statsInc[id].fallo = firebase.firestore.FieldValue.increment(p.stats[id].fallo);
  });
  syncDoc.set({ stats: statsInc, racha: p.racha }, { merge: true }).catch(()=>{});
}
function desconectarSync(){
  _flushSync();
  if(_syncUnsub) _syncUnsub();
  _syncUnsub = null; syncDoc = null; syncListo = false; syncCode = null;
  localStorage.removeItem('mate_sync_code_v1');
}
// suelta la conexión en vivo con Firestore cuando la app pasa a segundo plano (batería), y la
// vuelve a enganchar al regresar — antes se quedaba escuchando para siempre en background
document.addEventListener('visibilitychange', () => {
  if(!syncCode) return;
  if(document.visibilityState === 'hidden'){
    _flushSync();
    if(_syncUnsub){ _syncUnsub(); _syncUnsub = null; syncListo = false; }
  } else if(document.visibilityState === 'visible' && syncDoc && !syncListo){
    _escucharSync();
  }
});
const pct = s => { const t = s.ok + s.fallo; return t ? Math.round(s.ok*100/t) : null; };

/* módulos disponibles ahora mismo (según el modo clase) */
function modulosActivos(){
  if(clase && clase.mods && clase.mods.length){
    const ms = clase.mods.map(id => MOD_POR_ID[id]).filter(Boolean);
    if(ms.length) return ms;
  }
  return MODULOS;
}
/* elige módulo dando más peso a los que van peor; cap (1/2/3) limita la mezcla a ese capítulo */
function elegirModulo(cap){
  // "Mezcla del capítulo N" siempre usa TODOS los temas del capítulo, sin importar si hay una
  // mezcla personalizada activa — si no, pedir el capítulo 3 con una mezcla de solo cap.1 se
  // quedaba sin candidatos y tronaba.
  const ms = cap ? MODULOS.filter(m=>m.secciones[0][0]===String(cap)) : modulosActivos();
  const pesos = ms.map(m => {
    const s = stats[m.id] || { ok:0, fallo:0 };
    return 1 + s.fallo / (s.ok + s.fallo + 1);
  });
  let r = Math.random() * pesos.reduce((a,b)=>a+b, 0);
  for(let i=0; i<ms.length; i++){ r -= pesos[i]; if(r <= 0) return ms[i]; }
  return ms[ms.length-1];
}

function nuevoEjercicio(arg, continuar){
  if(!continuar || sesionHechos >= SESION_TOTAL) sesionHechos = 0;  // ronda nueva o recién completada

function tocarOrden(i){

}
function pintarOrden(){
  ejActual.opciones.forEach((_,i)=>{
    const el = $('oc'+i); if(!el) return;
    const p = ordenSel.indexOf(i);
    el.classList.toggle('on', p >= 0);

    if(p >= 0){
      if(badge) badge.textContent = p+1;

}

function leerEntrada(ej){
  switch(ej.tipo){
    case 'num':   return $('inNum').value;
    case 'texto': return $('inTexto').value;
    case 'frac':  return { n:$('inN').value, d:$('inD').value };
    case 'mixto': return { e:$('inE').value, n:$('inN').value, d:$('inD').value };
    case 'orden': return ordenSel.slice();
  }
}

function responder(valor){
  if(examen) return responderExamen(valor);
  if(respondido) return;
  const ent = (valor !== undefined) ? valor : leerEntrada(ejActual);
  if(ejActual.tipo === 'orden' && ent.length < ejActual.opciones.length){
    return mostrarFb({ ok:false, msg:'Toca las tres fracciones, en el orden que pide.' }, true);
  }
  const res = verificar(ejActual, ent);
  if(res.vacio) return mostrarFb({ ok:false, msg:'Te falta escribir la respuesta.' }, true);

  respondido = true;
  ultimoFeedback = res;
  ultimoProceso = ($('inProceso') || {}).value || '';
  if(modoErrores){
    if(res.ok){ errores.shift(); guardar('mate_errores_v1', errores); }
  } else {
    if(!vioExpl) anotar(ejActual.__mod, res.ok);
    if(!vioExpl && !res.ok) _registrarError(ejActual);
    guardarSesion();
  }
  mostrarFb(res, false);
}

const _feedbackHaptico = ok => { if(navigator.vibrate) navigator.vibrate(ok ? 30 : [30,50,30]); };

function mostrarFb(res, soloAviso){
  const zona = $('zonaFb');
  if(soloAviso){ zona.innerHTML = `<div class="fb medio">${res.msg}</div>`; return; }

  _feedbackHaptico(res.ok);
  const clase_ = res.ok ? 'ok' : res.incompleto ? 'medio' : 'mal';
  const titulo = res.ok ? '¡Correcto!' : res.incompleto ? 'Casi' : 'No es esa';
  const sigOnclick = modoErrores ? '_pintarSiguienteError()'
    : `ir('practica',${esTemaFijo ? `'${modActual.id}'` : capFijo ? capFijo : 'undefined'},true)`;
  zona.innerHTML = `
    <div class="fb ${clase_}">${titulo}

      ${vioExpl ? `<small>Este no cuenta para las estadísticas (viste la explicación antes).</small>` : ''}
    </div>
    ${explHTML()}
    <button class="btn amar" onclick="${sigOnclick}">Siguiente ejercicio</button>`;
  $('zonaEntrada').style.opacity = '.5';

// Una línea que empieza con "TRUCO:" no es un paso más: sale de la lista numerada y se
// pinta como recuadro aparte al final (atajo para resolverlo más rápido la próxima vez).
function explPasos(lista){
  const pasos = [], trucos = [];
  lista.forEach(l => {
    if(!/^TRUCO:/.test(l)) return pasos.push(l);
    const t = l.replace(/^TRUCO:\s*/,'');
    // el rótulo hace de título (la frase empieza en mayúscula) y los ejemplos van en su propio renglón
    trucos.push((t.charAt(0).toUpperCase() + t.slice(1))
      .replace(/ ((?:Otro )?Ejemplos?\b[^:]{0,40}:)/g, '<br>$1'));
  });
  return `<ol>${pasos.map(l=>`<li>${l}</li>`).join('')}</ol>` +
    trucos.map(t=>`<div class="truco"><b>TRUCO PARA QUE SEA MÁS FÁCIL</b>${t}</div>`).join('');
}

const explHTML = () => `
  <div class="expl"><h3>Por qué</h3>${explPasos(ejActual.explicacion)}</div>`;

/* ---------- modo examen ---------- */
const EXAMEN_TOTAL = 10, EXAMEN_SEGUNDOS = 60 * EXAMEN_TOTAL;   // 1 minuto por pregunta
let _examenTimerIv = null;
function iniciarExamen(){
  examen = { preguntas: [], idx: 0, finLimite: Date.now() + EXAMEN_SEGUNDOS*1000 };
  for(let i=0; i<EXAMEN_TOTAL; i++){
    const m = elegirModulo();
    const ej = m.gen(nivel); ej.__mod = m.id; ej.__modNombre = m.nombre;
    examen.preguntas.push({ ej, ok:null, completado:false });
  }
  pintarExamen();
}
function _abandonarExamen(){
  if(!confirm('¿Abandonar el examen? No se guarda ningún resultado.')) return;
  clearInterval(_examenTimerIv);
  examen = null;
  ir('inicio');
}
function pintarExamen(){
  const p = examen.preguntas[examen.idx];
  ordenSel = [];
  main.innerHTML = `
    <button class="back" onclick="_abandonarExamen()">← Abandonar examen</button>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="pill">Pregunta ${examen.idx+1} de ${examen.preguntas.length}</span>
        <span class="pill" id="examenReloj" style="background:var(--rojo-bg);color:#b03a2e">--:--</span>
      </div>
      <div class="enunciado">${p.ej.enunciado}</div>
      <div id="zonaEntrada">${entradaHTML(p.ej)}</div>
    </div>
    <div class="nota">Modo examen: sin explicaciones ni saltar — el repaso queda para el final.</div>`;
  const primero = $('inNum') || $('inTexto') || $('inE') || $('inN');
  if(primero && window.innerWidth > 640) primero.focus();
  _actualizarRelojExamen();
}
function _actualizarRelojExamen(){
  clearInterval(_examenTimerIv);
  const tick = () => {
    if(!examen) return clearInterval(_examenTimerIv);
    const restante = Math.max(0, Math.round((examen.finLimite - Date.now())/1000));
    const el = $('examenReloj');
    if(el) el.textContent = String(Math.floor(restante/60)).padStart(2,'0')+':'+String(restante%60).padStart(2,'0');
    if(restante <= 0){ clearInterval(_examenTimerIv); finalizarExamen(); }
  };
  tick();
  _examenTimerIv = setInterval(tick, 1000);
}
function responderExamen(valor){
  const p = examen.preguntas[examen.idx];
  const ent = (valor !== undefined) ? valor : leerEntrada(p.ej);
  if(p.ej.tipo === 'orden' && ent.length < p.ej.opciones.length) return;   // en examen se exige completar, sin aviso
  const res = verificar(p.ej, ent);
  if(res.vacio) return;
  p.ok = res.ok; p.completado = true;
  examen.idx++;
  if(examen.idx >= examen.preguntas.length) finalizarExamen();
  else pintarExamen();
}
function finalizarExamen(){
  clearInterval(_examenTimerIv);
  const total = examen.preguntas.length;
  const correctas = examen.preguntas.filter(p=>p.ok===true).length;
  const nota = Math.round(correctas*100/total);
  main.innerHTML = `
    <div class="card">
      <h2>Resultado del examen</h2>
      <div class="racha">
        <div><b>${correctas}/${total}</b><span>correctas</span></div>
        <div><b>${nota}%</b><span>nota</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Repaso</h2>
      ${examen.preguntas.map((p,i)=>`
        <div class="fb ${!p.completado?'medio':p.ok?'ok':'mal'}" style="margin-bottom:6px">
          ${i+1}. ${p.ej.enunciado}
          <small>${!p.completado ? 'Sin responder (se acabó el tiempo)' : p.ok?'Correcto':'Incorrecto — la respuesta es '+fmtRespuesta(p.ej)}</small>
        </div>
        <div class="expl" style="margin-bottom:14px">${explPasos(p.ej.explicacion)}</div>`).join('')}
      <button class="btn amar" onclick="examen=null; ir('inicio')">Volver a Inicio</button>
    </div>`;
  examen = null;
}

function _historialUltimosDias(n){
  const out = [];
  for(let i=n-1; i>=0; i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    out.push({ dia:d, n: historial[d]||0 });
  }
  return out;
}
function exportarRespaldo(){
  const datos = {};
  Object.keys(localStorage).filter(k=>k.startsWith('mate_')).forEach(k=>{ datos[k] = localStorage.getItem(k); });
  const blob = new Blob([JSON.stringify(datos)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mate-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importarRespaldo(file){
  const reader = new FileReader();
  reader.onload = () => {
    let datos;
    try{ datos = JSON.parse(reader.result); }catch(e){ datos = null; }
    // se valida ANTES de tocar nada — un JSON que solo "parsea" (null, un arreglo, un texto)
    // no debe borrar el progreso que ya había
    const claves = (datos && typeof datos === 'object' && !Array.isArray(datos))
      ? Object.keys(datos).filter(k => k.startsWith('mate_')) : [];
    if(!claves.length){ alert('Ese archivo no es un respaldo válido de esta app.'); return; }
    claves.forEach(k => localStorage.setItem(k, datos[k]));
    alert('Progreso restaurado. La app se va a recargar.');
    location.reload();
  };
  reader.readAsText(file);
}
