      tipo:'frac', respuesta:{n:imp, d}, pedirSimple:false,
      explicacion:[`Un "número mixto" combina un entero con una fracción, como ${e} ${n}/${d}. Una fracción "impropia" es la que tiene el numerador más grande que el denominador — es la misma cantidad, escrita de otra forma.`,
        `Se multiplica el entero por el denominador: ${e} × ${d} = ${e*d} (así se cuenta cuántas partes de tamaño 1/${d} hay en los ${e} enteros completos).`,
        `Se le suma el numerador de la fracción: ${e*d} + ${n} = ${imp}`,
        `El denominador se queda exactamente igual.`, `→ ${e} ${n}/${d} = ${imp}/${d}`,
        `TRUCO: hazlo en círculo, de abajo hacia arriba: el de abajo multiplica al entero, y a eso le sumas el de arriba. El denominador no se toca nunca. Ejemplo con este mismo: ${d} × ${e} = ${e*d}, y ${e*d} + ${n} = ${imp} → ${imp}/${d}. Comprobación rápida: ${imp} tiene que ser MAYOR que ${d}; si te hubiera quedado más chico, multiplicaste o sumaste al revés.`] };
    return {
      enunciado:`Convierte ${fr(imp,d)} en número mixto.`,
      tipo:'mixto', respuesta:{e, n, d},
      explicacion:[`Una fracción "impropia" (numerador mayor que el denominador) se puede reescribir como número mixto: un entero más una fracción más pequeña.`,
        `Se divide el numerador entre el denominador: ${imp} ÷ ${d}`,
        `${d} × ${e} = ${e*d}, y sobran ${imp} − ${e*d} = ${n} (ese sobrante es el residuo de la división).`,
        `El cociente (${e}) se convierte en la parte entera, y el residuo (${n}) es el nuevo numerador — el denominador no cambia.`,
        `→ ${imp}/${d} = ${e} ${n}/${d}`,
        `TRUCO: es una división de toda la vida, la de la casita: el cociente sale afuera como entero y el residuo se queda arriba. Ejemplo con este mismo: ${imp} ÷ ${d} da ${e} y sobran ${n} → ${e} ${n}/${d}. Comprobación instantánea: ${n} tiene que ser menor que ${d}; si te queda igual o mayor, es que todavía cabía otro entero.`] };
  }
},
{
  id:'razones', nombre:'Razones', secciones:['3.8'],
  gen(nv){
    const alto = porNivel(nv, 12, 30, 60);
    const k = R(2, porNivel(nv,4,7,11));
    let a = R(1,alto), b = R(1,alto);
    if(a===b) b = a+k;
    a *= k; b *= k;
    const [sn,sd] = simplificar(a,b);
    const casos = [
      `Una varilla mide <b>${a}</b> cm y otra mide <b>${b}</b> cm. Expresa la razón de <b>la primera a la segunda</b>, simplificada.`,
      `En un salón hay <b>${a}</b> niñas y <b>${b}</b> niños. Escribe la razón de <b>niñas a niños</b>, simplificada.`,
      `Escribe la razón de <b>${a} a ${b}</b> en su forma más simple.`
    ];
    return { enunciado: pick(casos), tipo:'frac', respuesta:{n:sn, d:sd}, pedirSimple:true,
      ayuda:'El orden importa: el primer número va arriba.',
      explicacion:[`Una "razón" compara dos cantidades mediante una división, y se puede escribir como fracción — el ORDEN en que se mencionan importa: lo primero va arriba (numerador), lo segundo va abajo (denominador).`,
        `"La razón de ${a} a ${b}" se escribe ${a}/${b}.`,
        `Igual que cualquier fracción, se simplifica dividiendo arriba y abajo entre su MCD: MCD(${a}, ${b}) = ${mcd(a,b)}`,
        `${a} ÷ ${mcd(a,b)} = ${sn}, y ${b} ÷ ${mcd(a,b)} = ${sd}`,
        `→ la razón simplificada es ${sn} : ${sd}`,
        `TRUCO: subraya en el enunciado las dos cosas que se comparan ANTES de calcular nada, en el orden en que aparecen: la primera va arriba y la segunda abajo. Cambiar el orden da otra respuesta distinta. Ejemplo con este mismo: ${a} a ${b} se escribe ${a}/${b}, que simplificado es ${sn} : ${sd}; al revés sería ${sd} : ${sn}, que ya no responde lo que preguntaban. Simplificar no cambia la razón: ${a} a ${b} y ${sn} a ${sd} significan lo mismo.`] };
  }
},
{
  id:'tasas-porciento', nombre:'Tasas y porciento', secciones:['3.8'],
  gen(nv){
    const tipo = pick(['tasa-unitaria','tasa-frac','porc-frac','frac-porc']);
    if(tipo==='tasa-unitaria'){
      const b = R(2, porNivel(nv,5,8,12)), k = R(porNivel(nv,5,10,15), porNivel(nv,30,60,90)), a = k*b;
      const casos = [
        { e:`Un carro recorre <b>${a} millas</b> en <b>${b} horas</b>. ¿Cuál es su tasa en millas por hora?`, u:'millas por hora', x:'millas', y:'horas' },
        { e:`Una bolsa de <b>${b} libras</b> de arroz cuesta <b>$${a}</b>. ¿Cuánto cuesta cada libra?`, u:'dólares por libra', x:'dólares', y:'libras' },
        { e:`Una máquina produce <b>${a} piezas</b> en <b>${b} minutos</b>. ¿Cuántas piezas produce por minuto?`, u:'piezas por minuto', x:'piezas', y:'minutos' }
      ];
      const c = pick(casos);
      return { enunciado:c.e, tipo:'num', respuesta:k,
        explicacion:[`Una "tasa" compara dos cantidades de DISTINTO tipo (${c.x} y ${c.y}). La tasa unitaria dice cuánto corresponde a UNA unidad del segundo: ${c.x} por cada 1 ${c.y.replace(/s$/,'')}.`,
          `Se divide la primera cantidad entre la segunda: ${a} ÷ ${b} = ${k}.`,
          `→ ${k} ${c.u}`,
          `TRUCO: la palabra "por" (por hora, por libra, por minuto) te dice qué va ABAJO en la división: siempre divides entre eso. "Millas por hora" = millas ÷ horas. Si el problema pregunta "cada una" o "por unidad", es lo mismo: divide hasta que abajo quede 1.`] };
    }
    if(tipo==='tasa-frac'){
      const k = R(2, porNivel(nv,4,6,9)); let a = R(2, porNivel(nv,9,15,25)), b = R(2, porNivel(nv,9,15,25)); if(a===b) b++;
      const [sn,sd] = simplificar(a,b); a *= k; b *= k;
      const casos = [
        { e:`Escribe como fracción simplificada la tasa de <b>${a} millas</b> a <b>${b} galones</b>.`, x:'millas', y:'galones' },
        { e:`En un salón hay <b>${a} estudiantes</b> y <b>${b} computadoras</b>. Escribe la tasa de estudiantes por computadora como fracción simplificada.`, x:'estudiantes', y:'computadoras' },
        { e:`Una receta usa <b>${a} tazas</b> de harina para <b>${b} huevos</b>. Escribe la tasa de tazas a huevos en su forma más simple.`, x:'tazas', y:'huevos' }
      ];
      const c = pick(casos);
      return { enunciado:c.e, tipo:'frac', respuesta:{n:sn, d:sd}, pedirSimple:true,
        ayuda:'El primero va arriba, el segundo abajo.',
        explicacion:[`Una tasa se escribe como fracción igual que una razón: lo primero arriba (${c.x}) y lo segundo abajo (${c.y}): ${a}/${b}.`,
          `Se simplifica dividiendo arriba y abajo entre MCD(${a}, ${b}) = ${mcd(a,b)}: ${a} ÷ ${mcd(a,b)} = ${sn}, ${b} ÷ ${mcd(a,b)} = ${sd}.`,
          `→ ${sn}/${sd}, es decir, ${sn} ${c.x} por cada ${sd} ${c.y}`,
          `TRUCO: la diferencia entre razón y tasa es solo que la tasa lleva UNIDADES distintas (${c.x} y ${c.y}), y esas unidades se quedan escritas en la respuesta; la aritmética es la misma: primero arriba, segundo abajo, y simplifica.`] };
    }
    if(tipo==='porc-frac'){
      const p = pick(nv==='facil' ? [10,20,25,50,75,40,60,80] : nv==='medio' ? [5,15,35,45,65,85,12,36,48,64] : [2,4,6,8,14,18,22,26,38,42,55,72,84,95]);
      const [sn,sd] = simplificar(p,100);
      return { enunciado:`Escribe <b>${p}%</b> como fracción en su forma más simple.`, tipo:'frac', respuesta:{n:sn, d:sd}, pedirSimple:true,
        explicacion:[`"Por ciento" significa "por cada 100": ${p}% = ${p}/100.`,
          `Se simplifica dividiendo arriba y abajo entre MCD(${p}, 100) = ${mcd(p,100)}: ${p} ÷ ${mcd(p,100)} = ${sn}, 100 ÷ ${mcd(p,100)} = ${sd}.`,
          `→ ${p}% = ${sn}/${sd}`,
          `TRUCO: el símbolo % es una fracción con 100 abajo, sin excepción. Escribe el número sobre 100 y simplifica como cualquier fracción: si termina en 0 divide entre 10 primero; si termina en 5, entre 5; y recuerda los fijos: 25% = 1/4, 50% = 1/2, 75% = 3/4, 20% = 1/5, 10% = 1/10.`] };
    }
    const d = pick(nv==='facil' ? [2,4,5,10] : nv==='medio' ? [4,5,10,20,25] : [20,25,50,10,4]);
    let n; do { n = R(1, d-1); } while(mcd(n,d)!==1);
    const k = 100/d;
    return { enunciado:`Escribe ${fr(n,d)} como porciento.`, tipo:'num', respuesta:n*k, ayuda:'Escribe solo el número, sin el símbolo %.',
      explicacion:[`Un porciento es una fracción con denominador 100, así que hay que convertir ${n}/${d} a una fracción equivalente con 100 abajo.`,
        `100 ÷ ${d} = ${k}, así que se multiplica arriba y abajo por ${k}: ${n}/${d} = ${n*k}/100.`,
        `→ ${n}/${d} = ${n*k}%`,
        `TRUCO: pregúntate "¿por cuánto multiplico el de abajo para llegar a 100?" y multiplica el de arriba por ese mismo número: ese resultado ya ES el porciento. Si el denominador no divide a 100 exacto, entonces divide arriba entre abajo y multiplica por 100 (${n} ÷ ${d} = ${n/d}, × 100 = ${n*k}).`] };
  }
},

{
  id:'suma-resta-frac', nombre:'Sumar y restar fracciones', secciones:['4.1'],
  gen(nv){
    const dens = nv==='facil' ? [2,3,4,5,6,8,10,12] : DENS_FRAC;
    const neg = nv==='facil' ? 0 : nv==='medio' ? 0.35 : 0.6;
    const nueva = (d) => { d = d || pick(dens); let n = R(1, d-1); if(Math.random()<neg) n = -n; return {n, d}; };
    const tipo = pick(nv==='facil' ? ['mismo','mismo','distinto','distinto'] :
                      nv==='medio' ? ['distinto','distinto','entero','mixto'] :
                                     ['distinto','entero','mixto','tres']);
    const resta = Math.random()<0.5;
    let fs, enun, intro = [];
    if(tipo==='mismo'){
      const d = pick(dens); fs = [nueva(d), nueva(d)];
    } else if(tipo==='distinto' || tipo==='tres'){
      fs = [nueva(), nueva()]; if(tipo==='tres') fs.push(nueva());
      while(fs[1].d===fs[0].d) fs[1] = nueva();
    } else if(tipo==='entero'){
      const e = R(1, porNivel(nv,3,6,12)) * (Math.random()<neg ? -1 : 1);
      fs = Math.random()<0.5 ? [{n:e, d:1, entero:true}, nueva()] : [nueva(), {n:e, d:1, entero:true}];
    } else { // mixto
      const mk = () => { const d = pick([2,3,4,5,6,8]), n = R(1,d-1), e = R(1,porNivel(nv,3,5,9));
        const s = Math.random()<neg ? -1 : 1; return { e:s*e, pn:n, d, n:s*(e*d+n), mixto:true }; };
      fs = [mk(), mk()];
    }
    // b se resta: el operando que se ve es b, la fracción que se suma es −b
    // solo el 2º operando se resta — es el único que lleva "−" en pantalla; antes se negaban
    // TODOS los que seguían al primero, y en la variante de 3 fracciones el tercero salía con
    // el signo cambiado (la respuesta guardada no coincidía con lo que se veía)
    const oper = fs.map((f,i) => (i===1 && resta) ? {...f, n:-f.n} : f);
    const ver = f => f.entero ? mm(f.n) : f.mixto ? mixS(f.e, f.pn, f.d) : frS(f.n, f.d);
    const verP = f => f.entero ? (f.n<0?`(${mm(f.n)})`:f.n) : f.mixto ? (f.e<0?`(${mixS(f.e,f.pn,f.d)})`:mixS(f.e,f.pn,f.d)) : frP(f.n, f.d);
    const signos = fs.map((f,i)=> i===0 ? ver(f) : (resta && i===1 ? ' − ' : ' + ') + verP(f)).join('');
    const r = sumarF(oper);
    const expl = [];
    if(fs.some(f=>f.mixto)){
      expl.push(`Primero se pasan los números mixtos a fracciones impropias, porque con mixtos no se puede operar directo. Regla: entero × denominador + numerador, y el denominador se queda; si el mixto es negativo, el signo se pone delante al final:`);
      fs.filter(f=>f.mixto).forEach(f => expl.push(`${mm(f.e)} ${f.pn}/${f.d} → ${Math.abs(f.e)} × ${f.d} = ${Math.abs(f.e)*f.d}, más ${f.pn} = ${Math.abs(f.n)} → ${tf(f.n,f.d)}`));
    }
    if(fs.some(f=>f.entero)) expl.push(`Un número entero también es una fracción: se le pone 1 abajo (${fs.filter(f=>f.entero).map(f=>`${mm(f.n)} = ${tf(f.n,1)}`).join(', ')}), porque cualquier número dividido entre 1 es él mismo.`);
    if(resta) expl.push(`Restar es sumar el opuesto: se le cambia el signo a lo que se resta y se convierte en suma. ${tf(oper[0].n,oper[0].d)} − ${tfP(fs[1].n,fs[1].d)} = ${tf(oper[0].n,oper[0].d)} + ${tfP(oper[1].n,oper[1].d)}.`);
    if(tipo==='mismo'){
      expl.push(`Las dos fracciones tienen el MISMO denominador (${fs[0].d}): son pedazos del mismo tamaño, así que se pueden juntar directo. Se suman solo los de arriba y el ${fs[0].d} se queda igual.`);
      expl.push(`Arriba: ${explSumaEnteros(oper[0].n, oper[1].n)} → ${tf(r.tot, r.m)}`);
    } else {
      expl.push(`Tienen denominadores distintos (${oper.map(f=>f.d).join(' y ')}): son pedazos de distinto tamaño y no se pueden juntar así. Hay que convertirlas a un mismo denominador — el más chico que sirve es el MCM (mínimo común múltiplo) de ${oper.map(f=>f.d).join(' y ')}, que es ${r.m}.`);
      oper.forEach((f,i) => expl.push(r.m === f.d
        ? `${tf(f.n,f.d)} ya tiene denominador ${r.m}, se queda igual.`
        : `${tf(f.n,f.d)} → para que abajo quede ${r.m} hay que multiplicar por ${r.m/f.d} (${f.d} × ${r.m/f.d} = ${r.m}); lo mismo se le hace arriba: ${mm(f.n)} × ${r.m/f.d} = ${mm(r.nums[i])} → ${tf(r.nums[i], r.m)}`));
      expl.push(oper.length === 2
        ? `Ya con el mismo denominador se suman los de arriba. ${explSumaEnteros(r.nums[0], r.nums[1])} Abajo se queda ${r.m} → ${tf(r.tot, r.m)}`
        : `Ya con el mismo denominador se suman los de arriba: ${r.nums.map(n=>n<0?`(${mm(n)})`:n).join(' + ')} = ${mm(r.tot)}. Abajo se queda ${r.m} → ${tf(r.tot, r.m)}`);
    }
    expl.push(explSimplif(r.tot, r.m));
    expl.push(`→ ${tf(r.n, r.d)}`);
    expl.push(`TRUCO: el signo de la fracción vive en el NUMERADOR. Antes de buscar denominador común, pon cada signo arriba (${oper.map(f=>tf(f.n,f.d)).join(', ')}) y convierte una resta en "más el opuesto"; a partir de ahí es una sola suma de enteros arriba y no te pierdes con los signos. Y el denominador común no es "multiplicar los de abajo": si uno es múltiplo del otro (o comparten factores) el MCM es más chico y los números salen manejables. Ejemplo con este mismo: ${tipo==='mismo' ? `los dos ya tenían ${fs[0].d} abajo, así que ni hubo que buscar nada — solo sumar arriba, ${r.nums.map(n=>mm(n)).join(' y ')}, y dejar el ${r.m}` : `de ${oper.map(f=>f.d).join(' y ')} el denominador común fue ${r.m}${r.m === Math.max(...oper.map(f=>f.d)) ? ' (el más grande ya servía, porque los otros lo dividen exacto)' : r.m === oper.reduce((a,f)=>a*f.d,1) ? ' (aquí sí tocó multiplicarlos, porque no comparten factores)' : ', más chico que multiplicarlos'}, y arriba quedó ${r.nums.map((n,i)=> i>0 && n<0 ? `(${mm(n)})` : mm(n)).join(' + ')} = ${mm(r.tot)}`}.`);
    return { enunciado:`${resta && !fs.some(f=>f.mixto||f.entero) ? 'Halla la diferencia' : 'Efectúa la operación'} y escribe la respuesta en su forma más simple:<br><b>${signos}</b>`,
      tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true,
      ayuda: fs.some(f=>f.mixto) ? 'Puedes dejar el resultado como fracción impropia.' : (r.d===1 ? 'Si sale un entero, escríbelo con denominador 1.' : ''),
      explicacion: expl };
  }
},
{
  id:'resta-mental-frac', nombre:'Resta mental de fracciones', secciones:['4.1'],
  gen(nv){
    const tipo = pick(nv==='facil' ? ['uno','uno','orden'] : ['uno','entero','entero','orden']);
    if(tipo==='uno'){                                                  // 1 − a/b
      const d = R(3, porNivel(nv,9,13,20)); let n; do { n = R(1,d-1); } while(mcd(n,d)!==1);
      return { enunciado:`Resta mentalmente:<br><b>1 − ${fr(n,d)}</b>`, tipo:'frac', respuesta:{n:d-n, d}, pedirSimple:true,
        explicacion:[`Para restar una fracción de 1, imagina el 1 partido en ${d} pedazos iguales: 1 = ${d}/${d}.`,
          `${d}/${d} − ${n}/${d} = ${d-n}/${d} (mismo denominador, se restan los numeradores).`,
          `→ ${d-n}/${d}`,
          `TRUCO: el denominador se queda y arriba haces "denominador menos numerador", sin escribir nada. Piensa en una pizza cortada en ${d} pedazos: si te comes ${n}, quedan ${d} − ${n} = ${d-n} pedazos, o sea ${d-n}/${d}. Comprobación: lo que comiste más lo que queda tiene que dar la pizza entera, ${n}/${d} + ${d-n}/${d} = ${d}/${d} = 1. Ejemplo con este mismo: 1 − ${n}/${d} → ${d} − ${n} = ${d-n} → ${d-n}/${d}.`] };
    }
    if(tipo==='entero'){                                               // E − m n/d
      const d = R(3, porNivel(nv,8,12,16)); let n; do { n = R(1,d-1); } while(mcd(n,d)!==1);
      const m = R(1, porNivel(nv,4,7,10)), E = m + R(2, porNivel(nv,4,6,9));
      const e = E - m - 1;
      return { enunciado:`Resta mentalmente el número mixto del entero:<br><b>${E} − ${mixS(m,n,d)}</b>`, tipo:'mixto', respuesta:{e, n:d-n, d},
        explicacion:[`Se resta primero la parte entera: ${E} − ${m} = ${E-m}.`,
          `Quedan ${E-m} enteros sin tocar, pero todavía hay que restar ${n}/${d}. Se parte UNO de esos enteros en ${d}/${d}: ${E-m} = ${e} + ${d}/${d}.`,
          `${d}/${d} − ${n}/${d} = ${d-n}/${d}.`,
          `→ ${e} ${d-n}/${d}`,
          `TRUCO: dos pasos y listo — (1) entero menos entero, (2) "préstate" un entero completo para restar la fracción. Por eso la parte entera del resultado es ${E} − ${m} − 1 = ${e}, y la fracción es "${d} − ${n}" sobre ${d}. Comprobación: ${e} ${d-n}/${d} + ${m} ${n}/${d} = ${E}.`] };
    }
    // "resta a/b de c/d" → c/d − a/b (el orden importa)
    const a = { n:R(1,7), d:pick([3,4,5,6,8]) }, c = { n:R(1,9), d:pick([4,6,8,9,10,12]) };
    const r = sumarF([c, {n:-a.n, d:a.d}]);
    return { enunciado:`Resta ${fr(a.n,a.d)} de ${fr(c.n,c.d)}. Escribe la respuesta en su forma más simple.`,
      tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true,
      explicacion:[`"Restar A de B" significa B − A: lo que se resta va DESPUÉS del signo menos, aunque en la frase se mencione primero. Aquí: ${tf(c.n,c.d)} − ${tf(a.n,a.d)}.`,
        `Restar es sumar el opuesto (se le cambia el signo al que se resta): ${tf(c.n,c.d)} + ${tfP(-a.n,a.d)}.`,
        ...pasosSumaF(c, {n:-a.n, d:a.d}).lineas,
        `→ ${tf(r.n,r.d)}`,
        `TRUCO: la resta NO es conmutativa, así que lee dos veces quién se resta a quién. "Resta X de Y" = Y − X; "X menos Y" = X − Y. Si te sale un signo distinto al esperado, casi seguro invertiste el orden. Ejemplo con este mismo: "resta ${tf(a.n,a.d)} de ${tf(c.n,c.d)}" → ${tf(c.n,c.d)} va primero y ${tf(a.n,a.d)} es lo que se le quita → ${tf(c.n,c.d)} − ${tf(a.n,a.d)} = ${tf(r.n,r.d)}; al revés daría ${tf(-r.n,r.d)}, que es otra respuesta.`] };
  }
},
{
  id:'propiedades-frac', nombre:'Propiedades con fracciones', secciones:['4.1','4.2'],
  gen(nv){
    const alto = porNivel(nv, 6, 9, 12);
    const f = () => { const d = R(2,alto); let n = R(1,d-1); if(nv!=='facil' && Math.random()<0.4) n=-n; return {n,d}; };
    const a = f(), b = f(), c = f();
    const A = frP(a.n,a.d), B = frP(b.n,b.d), C = frP(c.n,c.d), Af = frS(a.n,a.d);
    if(Math.random()<0.5){                                           // 4.2 C — propiedades de la multiplicación
      const p = pick(['conmutativa','asociativa','identidad','inverso','cero']);
      const Bf = frS(b.n,b.d);
      const casosM = {
        conmutativa: { enun:`${Af} × ${B} = ${Bf} × ${A}`, cat:'Conmutativa',
          expl:[`La propiedad conmutativa de la multiplicación dice que el ORDEN de los factores no cambia el producto: a · b = b · a.`,
            `Aquí ${tf(a.n,a.d)} y ${tf(b.n,b.d)} solo intercambiaron de lugar.`] },
        asociativa:  { enun:`(${Af} × ${B}) × ${C} = ${Af} × (${Bf} × ${C})`, cat:'Asociativa',
          expl:[`La propiedad asociativa dice que, con tres factores, da igual cuáles se AGRUPAN primero: (a · b) · c = a · (b · c).`,
            `Los factores siguen en el mismo orden; solo cambiaron de sitio los paréntesis.`] },

      };
      const cs = casosM[p];
      return { enunciado:`¿Qué propiedad de la multiplicación se ilustra?<br><b>${cs.enun}</b>`,
        tipo:'opciones', opciones: shuffle(['Conmutativa','Asociativa','Identidad','Inverso','Cero como factor']),
        respuesta: cs.cat, explicacion: cs.expl.concat(
          `TRUCO: mira qué fue lo ÚNICO que cambió entre los dos lados. ¿Cambió el orden? Conmutativa. ¿Solo se movieron los paréntesis? Asociativa. ¿Hay un 1 que no hace nada? Identidad. ¿Una fracción por su volteada da 1? Inverso. ¿Hay un 0 y el resultado es 0? Cero como factor. Ojo: "identidad" es el 1 en multiplicación pero el 0 en suma; "inverso" es la fracción volteada en multiplicación pero el signo contrario en suma. Ejemplo con este mismo: lo único que cambió fue ${({Conmutativa:'el orden de los factores',Asociativa:'dónde están los paréntesis (los números siguen en el mismo orden)',Identidad:'que aparece un 1 multiplicando, que no cambia nada','Inverso':'que la fracción se multiplica por su volteada y da 1','Cero como factor':'que hay un 0 multiplicando y todo da 0'})[cs.cat]} → ${cs.cat}.`) };

{

    const entero = () => { let n = R(2, porNivel(nv,6,9,12)); if(Math.random()<neg) n=-n; return {n, d:1}; };

      const s = Math.random()<neg ? -1 : 1; return { e:s*e, pn, d, n:s*(e*d+pn), mixto:true }; };

           : tipo==='fff' ? [nueva(), nueva(), nueva()] : [mixto(), Math.random()<0.5 ? mixto() : nueva()];

    const verOp = f => f.mixto ? (f.e<0 ? `(${mixS(f.e,f.pn,f.d)})` : mixS(f.e,f.pn,f.d)) : opP(f);
    const enun = fs.map((f,i) => (i===0 ? (f.mixto ? mixS(f.e,f.pn,f.d) : opS(f)) : (div ? ' ÷ ' : ' × ') + verOp(f))).join('');
    const expl = [];

      fs.filter(f=>f.mixto).forEach(f => expl.push(`${mm(f.e)} ${f.pn}/${f.d} → ${Math.abs(f.e)} × ${f.d} + ${f.pn} = ${Math.abs(f.n)} → ${tf(f.n,f.d)}`));
    }
    if(fs.some(f=>f.d===1)) expl.push(`Un entero se escribe con denominador 1: ${fs.filter(f=>f.d===1).map(f=>`${mm(f.n)} = ${tf(f.n,1)}`).join(', ')}.`);
    let r, factores;

      expl.push(`Dividir por una fracción es MULTIPLICAR por su recíproco (la fracción volteada): ${opT(fs[0])} ÷ ${opTP(fs[1])} = ${opT(fs[0])} × ${tfP(rec.n,rec.d)}.`);
      factores = [fs[0], rec];
    } else factores = fs;
    r = multF(factores);
    const negs = factores.filter(f=>f.n<0).length;
    const absN = factores.map(f=>Math.abs(f.n)), absD = factores.map(f=>f.d);
    expl.push(`Para multiplicar fracciones NO hace falta denominador común: se multiplica arriba con arriba y abajo con abajo, sin más.`);
    expl.push(`Arriba: ${absN.join(' × ')} = ${Math.abs(r.rawN)}. Abajo: ${absD.join(' × ')} = ${r.rawD}.`);
    if(negs) expl.push(`Signo: hay ${negs} número${negs>1?'s':''} negativo${negs>1?'s':''} entre los factores → cantidad ${negs%2 ? 'impar, así que el resultado es NEGATIVO' : 'par, así que los negativos se cancelan y el resultado es POSITIVO'}: ${tf(r.rawN, r.rawD)}`);
    else expl.push(`Todos son positivos, así que el resultado también: ${tf(r.rawN, r.rawD)}`);
    expl.push(explSimplif(r.rawN, r.rawD));
    expl.push(`→ ${tf(r.n,r.d)}`);
    // atajo con estos mismos números: qué se podía tachar antes de multiplicar
    const cruz = (() => { for(let i=0;i<absN.length;i++) for(let j=0;j<absD.length;j++){ const g = mcd(absN[i], absD[j]); if(g > 1) return `el ${absN[i]} de arriba y el ${absD[j]} de abajo se dividen los dos entre ${g} (quedan ${absN[i]/g} y ${absD[j]/g}) antes de multiplicar`; } return 'aquí no había nada que tachar, así que se multiplica directo'; })();
    expl.push(`TRUCO: cancela ANTES de multiplicar. Cualquier número de arriba se puede simplificar con cualquier número de abajo (aunque sean de fracciones distintas) porque al final todo termina en el mismo numerador y el mismo denominador; así trabajas con números chiquitos y el resultado ya sale simplificado. En la división, lo único que se voltea es la SEGUNDA fracción (el divisor), nunca la primera. Y no busques denominador común: eso es solo para sumar y restar. Ejemplo con este mismo: ${cruz}; el resultado final es el mismo, ${tf(r.n,r.d)}, pero con cuentas más chicas.`);
    return { enunciado:`${div ? 'Divide' : 'Multiplica'} y escribe el resultado en su forma más simple:<br><b>${enun}</b>`,
      tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true,
      ayuda: r.d===1 ? 'Si sale un entero, escríbelo con denominador 1.' : (fs.some(f=>f.mixto) ? 'Puedes dejar el resultado como fracción impropia.' : ''),
      explicacion: expl };
  }
},
{

    }
    const d = R(2, porNivel(nv,9,15,30)); let n = R(1, porNivel(nv,9,15,30)); if(n===d) n++;

        explicacion:[`${izq ? `1 ÷ (número)` : `1 sobre (número)`} es, por definición, el recíproco de ese número.`,
          `El recíproco de ${tf(rn,dd)} se obtiene volteando la fracción: ${tf(rec.n,rec.d)}${s<0?' (el signo se queda)':''}.`,
          `Comprobación: ${tfP(rn,dd)} × ${tfP(rec.n,rec.d)} = ${n*dd}/${n*dd} = 1 ✓.`, `→ ${tf(rec.n,rec.d)}`, TR + ` Ejemplo con este mismo: ${tf(rn,dd)} volteado es ${tf(rec.n,rec.d)}.`] };
    }
    const rn = s*n;
    return { enunciado:`Escribe el recíproco de <b>${frS(rn,dd)}</b>.`, tipo:'frac', respuesta:rec, pedirSimple:true, signo:s<0,
      ayuda: rec.d===1 ? 'Si sale un entero, escríbelo con denominador 1.' : '',
      explicacion:[`El recíproco (inverso multiplicativo) de una fracción se obtiene intercambiando numerador y denominador.`,
        `${tf(rn,dd)} → ${tf(rec.n,rec.d)}${s<0 ? ' — el signo negativo se conserva, un número y su recíproco tienen el mismo signo' : ''}.`,
        `Comprobación: ${tfP(rn,dd)} × ${tfP(rec.n,rec.d)} = ${n*dd}/${n*dd} = 1 ✓.`, `→ ${tf(rec.n,rec.d)}`, TR + ` Ejemplo con este mismo: ${tf(rn,dd)} volteado es ${tf(rec.n,rec.d)} — el ${Math.abs(rn)} bajó y el ${dd} subió${s<0?', y el menos se quedó':''}.`] };
  }

{

        { const p = paso(`Paso 1 — la multiplicación va ANTES que la suma, aunque aparezca después:`, pasosMultF(B,C));

        { const p = paso(`Paso 1 — la división va ANTES que la resta:`, pasosDivF(A,B));
          res = paso(`Paso 2 — ahora la resta, con el resultado ya puesto: ${opT(p)} − ${opTP(C)}`, resta(p,C)); }

        primero = `multiplicar y dividir empatan, así que se hace lo que esté más a la izquierda: ${opT(A)} × ${opTP(B)}`;
        { const p = paso(`Paso 1 — multiplicación y división tienen el MISMO rango, se resuelven de izquierda a derecha. Primero la de la izquierda:`, pasosMultF(A,B));

        break;
      case 'parDiv':                                                  // (A + B) ÷ C
        enun = `(${opS(A)} + ${opP(B)}) ÷ ${opP(C)}`; enunT = `(${opT(A)} + ${opTP(B)}) ÷ ${opTP(C)}`;
        primero = `el paréntesis (${opT(A)} + ${opTP(B)}) va antes que todo lo demás`;
        { const p = paso(`Paso 1 — lo que está dentro del paréntesis va siempre primero:`, suma(A,B));
          res = paso(`Paso 2 — el paréntesis ya es un solo número; ahora la división: ${opT(p)} ÷ ${opTP(C)}`, pasosDivF(p,C)); }
        break;

        enun = `${opS(A)} ÷ ${opP(B)} + ${opP(C)} × ${opP(D)}`; enunT = `${opT(A)} ÷ ${opTP(B)} + ${opTP(C)} × ${opTP(D)}`;
        primero = `la división y la multiplicación van las dos antes que la suma del medio`;
        { const p1 = paso(`Paso 1 — la división y la multiplicación van antes que la suma. Primero la división (está más a la izquierda):`, pasosDivF(A,B));
          const p2 = paso(`Paso 2 — luego la multiplicación:`, pasosMultF(C,D));
          res = paso(`Paso 3 — por último la suma de los dos resultados: ${opT(p1)} + ${opTP(p2)}`, suma(p1,p2)); }
        break;
      case 'cuadrado':                                                // A + (B)² × C
        enun = `${opS(A)} + (${frS(B.n,B.d)})<sup>2</sup> × ${opP(C)}`; enunT = `${opT(A)} + (${opT(B)})² × ${opTP(C)}`;
        primero = `el exponente (${opT(B)})² va antes que la multiplicación y que la suma`;
        { const p1 = paso(`Paso 1 — el exponente va primero. Elevar al cuadrado es multiplicar la fracción por sí misma:`, pasosMultF(B,B));

        enun = `${opS(A)} − ${opP(B)} × (${opS(C)} + ${opP(D)})`; enunT = `${opT(A)} − ${opTP(B)} × (${opT(C)} + ${opTP(D)})`;
        primero = `el paréntesis (${opT(C)} + ${opTP(D)}) va primero, después la multiplicación y al final la resta`;

    let num, den, enun, arribaT, abajoT;
    const pasoArriba = () => { const p = pasosSumaF(A,B); pasos.push(`Paso 1 — lo de ARRIBA, como si estuviera entre paréntesis:`, ...p.lineas); return p.res; };
    const pasoAbajo = n => { const p = pasosSumaF(C, {n:-D.n, d:D.d}); pasos.push(`Paso ${n} — lo de ABAJO, también entre paréntesis. Restar es sumar el opuesto: ${opT(C)} − ${opTP(D)} = ${opT(C)} + ${tfP(-D.n,D.d)}.`, ...p.lineas); return p.res; };
    if(pat==='simple'){
      num = A; den = C; enun = fr(frS(A.n,A.d), frS(C.n,C.d)); arribaT = opT(A); abajoT = opT(C);
    } else if(pat==='arriba'){
      enun = fr(`${frS(A.n,A.d)} + ${frP(B.n,B.d)}`, frS(C.n,C.d)); arribaT = `(${opT(A)} + ${opTP(B)})`; abajoT = opT(C);
      num = pasoArriba(); den = C;
    } else if(pat==='abajo'){
      den = sub(C,D); while(den.n===0){ D = F(); den = sub(C,D); }
      enun = fr(frS(A.n,A.d), `${frS(C.n,C.d)} − ${frP(D.n,D.d)}`); arribaT = opT(A); abajoT = `(${opT(C)} − ${opTP(D)})`;
      num = A; den = pasoAbajo(1);
    } else {
      den = sub(C,D); while(den.n===0){ D = F(); den = sub(C,D); }
      enun = fr(`${frS(A.n,A.d)} + ${frP(B.n,B.d)}`, `${frS(C.n,C.d)} − ${frP(D.n,D.d)}`); arribaT = `(${opT(A)} + ${opTP(B)})`; abajoT = `(${opT(C)} − ${opTP(D)})`;
      num = pasoArriba(); den = pasoAbajo(2);
    }
    const nPaso = pasos.filter(l => /^Paso \d/.test(l)).length + 1;
    const dv = pasosDivF(num, den);
    pasos.push(`Paso ${nPaso} — ya hay UNA sola fracción arriba y UNA abajo; la raya larga es una división:`, ...dv.lineas);
    const r = dv.res;
    const enunciado = pat==='verbal'
      ? `La suma de ${frS(A.n,A.d)} y ${frP(B.n,B.d)} se va a dividir por la diferencia entre ${frS(C.n,C.d)} y ${frP(D.n,D.d)}. Escribe la expresión como fracción compleja y simplifícala.`
      : `Simplifica la fracción compleja:<br><b style="font-size:1.15em">${enun}</b>`;
    return { enunciado, tipo:'frac', respuesta:{n:r.n, d:r.d}, pedirSimple:true, signo:true, ayuda:'Escribe la respuesta como fracción simplificada (puede ser impropia).',
      explicacion:[pat==='verbal'
          ? `Primero se traduce a símbolos: "la suma de A y B" es (A + B), "la diferencia entre C y D" es (C − D), y "se divide por" pone la primera arriba y la segunda abajo: ${arribaT} / ${abajoT}. Los paréntesis son obligatorios porque arriba y abajo hay operaciones.`
          : `Una fracción compleja es una fracción que tiene fracciones adentro. La raya grande del medio no es más que una división: ${arribaT} ÷ ${abajoT}. Se resuelve lo de arriba, se resuelve lo de abajo, y al final se dividen.`,
        ...pasos, `→ ${tf(r.n,r.d)}`,
        `TRUCO: la raya larga es un ÷ disfrazado. Escribe (arriba) ÷ (abajo) con paréntesis, resuelve cada paréntesis hasta dejar UNA fracción en cada uno, y al final voltea la de abajo y multiplica. Nunca "canceles" un número de arriba con uno de abajo mientras todavía haya sumas o restas sin hacer. Ejemplo con este mismo: ${arribaT} ÷ ${abajoT} → arriba queda ${opT(num)}, abajo queda ${opT(den)}, y ${opT(num)} ÷ ${opTP(den)} se convierte en ${opT(num)} × ${tfP(recipF(den).n,recipF(den).d)} = ${tf(r.n,r.d)}.`] };
  }
}
];

/* ══════════════════════════════════════════════════════════
   4. VERIFICACIÓN  — una función para los 8 tipos de entrada
   ══════════════════════════════════════════════════════════ */
function parseFactores(s){
  s = String(s).toLowerCase().replace(/[×·]/g,'*').replace(/\s+/g,'').replace(/x/g,'*');
  if(!s) return null;
  const out = {};
  for(const t of s.split('*')){
    if(!t) return null;
    const m = t.match(/^(\d+)(?:\^(\d+))?$/);
    if(!m) return null;
    const p = +m[1], e = m[2] ? +m[2] : 1;
    if(p < 2) return null;
    out[p] = (out[p]||0) + e;
  }
  return out;
}
const numLimpio = s => Number(String(s).trim().replace(/\s+/g,'').replace(',','.'));

function verificar(ej, ent){
  switch(ej.tipo){
    case 'sino': return { ok: ent === ej.respuesta };
    case 'cmp':  return { ok: ent === ej.respuesta };
    case 'num': {
      const v = numLimpio(ent);
      if(!isFinite(v) || ent === '') return { ok:false, vacio:true };
      return { ok: Math.abs(v - ej.respuesta) < 0.01 };   // tolerancia: promedio/círculo redondean a 2 decimales
    }
    case 'opciones': return { ok: ent === ej.respuesta };
    case 'orden': return { ok: ent.length===ej.respuesta.length && ent.every((v,i)=>v===ej.respuesta[i]) };
    case 'frac': {
      let n = numLimpio(ent.n), d = numLimpio(ent.d);
      if(!isFinite(n) || !isFinite(d) || ent.n==='' || ent.d==='') return { ok:false, vacio:true };
      if(d === 0) return { ok:false, msg:'El denominador no puede ser 0.' };
      if(d < 0){ n = -n; d = -d; }                       // signo delante = signo arriba
      const Rp = ej.respuesta;
      if(n*Rp.d !== Rp.n*d) return { ok:false };
      if(ej.pedirSimple && mcd(Math.abs(n), d) !== 1)
        return { ok:false, incompleto:true,
                 msg:`${n}/${d} vale lo mismo, pero el ejercicio pedía la mínima expresión.` };
      return { ok:true };
    }
    case 'mixto': {
      const e = numLimpio(ent.e), n = numLimpio(ent.n), d = numLimpio(ent.d);
      if(![e,n,d].every(isFinite) || ent.e==='' || ent.n==='' || ent.d==='') return { ok:false, vacio:true };
      if(d <= 0) return { ok:false, msg:'El denominador tiene que ser mayor que 0.' };
      const Rp = ej.respuesta;
      if((e*d + n)*Rp.d !== (Rp.e*Rp.d + Rp.n)*d) return { ok:false };
      if(n >= d) return { ok:false, incompleto:true,
        msg:'El valor es correcto, pero en un número mixto el numerador tiene que ser menor que el denominador.' };
      if(mcd(n,d) !== 1) return { ok:false, incompleto:true, msg:'Falta simplificar la parte fraccionaria.' };
      return { ok:true };
    }
    case 'angulo2': {
      const a = numLimpio(ent.a), b = numLimpio(ent.b);
      if(!isFinite(a) || !isFinite(b) || ent.a==='' || ent.b==='') return { ok:false, vacio:true };
      return { ok: a === ej.respuesta.a && b === ej.respuesta.b };
    }
    case 'texto': {
      const f = parseFactores(ent);
      if(!f) return { ok:false, msg:'No entendí lo que escribiste. Ejemplo: <b>2^3 * 5</b>' };
      const bases = Object.keys(f).map(Number);
      if(bases.some(p => !esPrimo(p)))
        return { ok:false, msg:`Todos los factores tienen que ser primos (${bases.filter(p=>!esPrimo(p)).join(', ')} no lo ${bases.filter(p=>!esPrimo(p)).length>1?'son':'es'}).` };
      const Rp = ej.respuesta, ks = Object.keys(Rp);
      const ok = bases.length===ks.length && ks.every(p => f[p] === Rp[p]);
      return { ok };
    }
  }
  return { ok:false };
}

// respuesta correcta con la forma que tendría escrita el usuario (lo usa autotest)
function respuestaComoEntrada(ej){
  switch(ej.tipo){
    case 'sino': case 'cmp': case 'orden': case 'opciones': return ej.respuesta;
    case 'num':   return String(ej.respuesta);
    case 'frac':  return { n:String(ej.respuesta.n), d:String(ej.respuesta.d) };
    case 'mixto': return { e:String(ej.respuesta.e), n:String(ej.respuesta.n), d:String(ej.respuesta.d) };
    case 'angulo2': return { a:String(ej.respuesta.a), b:String(ej.respuesta.b) };
    case 'texto': return fmtFactoresPlano(ej.respuesta);
  }
}
function fmtRespuesta(ej){
  switch(ej.tipo){
    case 'sino':  return ej.respuesta ? 'Sí' : 'No';
    case 'cmp':   return ej.respuesta;
    case 'num':   return String(ej.respuesta);
    case 'frac':  return `${ej.respuesta.n}/${ej.respuesta.d}`;
    case 'mixto': return `${ej.respuesta.e} ${ej.respuesta.n}/${ej.respuesta.d}`;
    case 'angulo2': return `∠2 = ${ej.respuesta.a}°, ∠3 = ${ej.respuesta.b}°`;
    case 'texto': return fmtFactores(ej.respuesta);
    case 'orden': return ej.respuesta.map(i=>`${ej.opciones[i].n}/${ej.opciones[i].d}`).join(' , ');
    case 'opciones': return ej.respuesta;
  }
}

function analizarTexto(txt){
  const t = ' ' + String(txt).toLowerCase().replace(/\s+/g,' ') + ' ';
  const puntos = {}, secs = new Set();
  MODULOS.forEach(m => puntos[m.id] = 0);

  // (a) rangos "3.1 - 3.8" y "3.1 a 3.8"
  const rangos = t.match(/(\d+)\s*\.\s*(\d+)\s*(?:-|–|—|a|to)\s*(\d+)\s*\.\s*(\d+)/g) || [];
  rangos.forEach(r=>{
    const m = r.match(/(\d+)\s*\.\s*(\d+)\s*(?:-|–|—|a|to)\s*(\d+)\s*\.\s*(\d+)/);
    if(+m[1] !== +m[3]) return;                          // solo dentro del mismo capítulo
    for(let s = +m[2]; s <= +m[4]; s++) secs.add(`${+m[1]}.${s}`);
  });
  // (b) secciones sueltas — solo cuentan las que existen en el mapa
  (t.match(/\b\d+\s*\.\s*\d+\b/g) || []).forEach(s => {
    const k = s.replace(/\s+/g,'');
    if(SECMAP[k]) secs.add(k);
  });

  const secsValidas = [...secs].filter(s => SECMAP[s]).sort();
  secsValidas.forEach(s => SECMAP[s].forEach(id => puntos[id] += 5));

  // (c) palabras clave — límite de palabra en LOS DOS lados, no solo uno. Con solo un lado
  // (como antes: " k" O "k "), una clave corta como "rate" hacía match dentro de "corporate ",
  // o "order" dentro de "disorder" — bastaba con que un solo extremo tuviera espacio.
  const encontradas = {};
  MODULOS.forEach(m=>{
    encontradas[m.id] = [];
    CLAVES[m.id].forEach(k=>{
      const re = new RegExp('(?:^|[^a-záéíóúñ0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?:$|[^a-záéíóúñ0-9])');
      if(re.test(t)){
        puntos[m.id] += 1; encontradas[m.id].push(k);
      }
    });
  });

  const detectados = MODULOS.filter(m => puntos[m.id] > 0)
    .sort((a,b) => puntos[b.id] - puntos[a.id]);
  return { puntos, secciones: secsValidas, detectados, claves: encontradas };
}

/* --- lectura de archivos (las librerías se cargan solo si hacen falta) --- */
const URL_JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const URL_PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const URL_PDFWK = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function cargarScript(src){
  return new Promise((ok, err)=>{
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>ok();
    s.onerror = ()=>err(new Error('No se pudo cargar la librería. ¿Hay internet?'));
    document.head.appendChild(s);
  });
}
const desXml = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                     .replace(/&apos;/g,"'").replace(/&amp;/g,'&');

async function textoDePptx(file){
  await cargarScript(URL_JSZIP);
  const zip = await JSZip.loadAsync(file);
  const slides = Object.keys(zip.files)
    .filter(n => /^ppt\/(slides|notesSlides)\/\w+\d+\.xml$/.test(n))
    .sort((a,b) => (+a.replace(/\D/g,'')) - (+b.replace(/\D/g,'')));
  if(!slides.length) throw new Error('Ese .pptx no tiene diapositivas legibles.');
  const out = [];
  for(const n of slides){
    const xml = await zip.files[n].async('string');
    out.push((xml.match(/<a:t[^>]*>[\s\S]*?<\/a:t>/g) || [])
      .map(t => desXml(t.replace(/<[^>]+>/g,''))).join(' '));
  }
  return out.join('\n');
}
async function textoDePdf(file){
  await cargarScript(URL_PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL_PDFWK;
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for(let i=1; i<=doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    out.push(tc.items.map(it => it.str).join(' '));
  }
  return out.join('\n');
}
async function textoDeArchivo(file){
  const n = file.name.toLowerCase();
  if(n.endsWith('.pptx')) return textoDePptx(file);
  if(n.endsWith('.pdf'))  return textoDePdf(file);
  return file.text();
}

function _registrarHistorialYRachaDias(){

  guardar('mate_historial_v1', historial);
  if(rachaDias.ultimoDia !== hoy){
    const ayer = fechaHaceDias(1);
    rachaDias.actual = (rachaDias.ultimoDia === ayer) ? rachaDias.actual+1 : 1;
    rachaDias.mejor = Math.max(rachaDias.mejor, rachaDias.actual);

const ALFABETO_CODIGO = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';  // sin 0/O/1/I/L, para no confundir al escribir

function generarCodigo(){
  let s = '';
  for(let g=0; g<3; g++){
    for(let i=0; i<4; i++) s += ALFABETO_CODIGO[Math.floor(Math.random()*ALFABETO_CODIGO.length)];
    if(g<2) s += '-';
  }
  return s;
}
async function _hashCodigo(codigo){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codigo.trim().toUpperCase()));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function _initFirebase(){
  await cargarScript(URL_FB_APP);
  await cargarScript(URL_FB_FS);
  if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}  // offline: cachea y reintenta sola
  }
  return firebase.firestore();
}
function _fusionarStats(a, b){
  const ids = new Set([...Object.keys(a), ...Object.keys(b)]);
  const out = {};
  ids.forEach(id => {
    const x = a[id] || {ok:0, fallo:0}, y = b[id] || {ok:0, fallo:0};
    out[id] = { ok: (x.ok||0) + (y.ok||0), fallo: (x.fallo||0) + (y.fallo||0) };
  });
  return out;
}
// junta los grupos de los dos aparatos por id, sin perder ninguno — los id son al azar
// (idGrupo()) así que una colisión entre dos aparatos distintos es prácticamente imposible
function _unirGrupos(a, b){
  const vistos = new Set(a.map(g=>g.id));
  return a.concat(b.filter(g=>!vistos.has(g.id)));
}
async function conectarSync(codigo){           // se llama UNA vez, al vincular este aparato
  const db = await _initFirebase();
  const id = await _hashCodigo(codigo);
  const ref = db.collection('syncs').doc(id);
  const snap = await ref.get();
  const remoto = snap.exists ? snap.data() : {};
  grupos = _unirGrupos(remoto.grupos || [], grupos);
  guardar('mate_grupos_v1', grupos);
  await ref.set({
    stats: _fusionarStats(remoto.stats || {}, stats),
    racha: { actual: (remoto.racha && remoto.racha.actual) || racha.actual,
             mejor: Math.max((remoto.racha && remoto.racha.mejor) || 0, racha.mejor) },
    nivel: remoto.nivel || nivel,
    clase: remoto.clase !== undefined ? remoto.clase : (clase || null),
    grupos
  }, { merge: true });
  syncDoc = ref;
  syncCode = codigo.trim().toUpperCase();
  guardar('mate_sync_code_v1', syncCode);
  _escucharSync();
}
async function _reengancharSync(){              // se llama en cada apertura, si ya había un código guardado
  if(!syncCode) return;
  const db = await _initFirebase();
  const id = await _hashCodigo(syncCode);
  syncDoc = db.collection('syncs').doc(id);
  _escucharSync();
}
function _escucharSync(){
  if(!syncDoc || syncListo) return;
  syncListo = true;
  _syncUnsub = syncDoc.onSnapshot(snap => {
    const d = snap.data();
    if(!d) return;
    // Firestore solo guarda el campo que se incrementó (ok o fallo) — un tema sin fallos
    // nunca queda con esa clave. Se normaliza al recibir para que pct() no dé NaN.
    if(d.stats){
      stats = {};
      Object.keys(d.stats).forEach(id => { stats[id] = { ok: d.stats[id].ok||0, fallo: d.stats[id].fallo||0 }; });
    }
    if(d.racha){ racha.actual = d.racha.actual||0; racha.mejor = Math.max(racha.mejor||0, d.racha.mejor||0); }
    if(d.nivel) nivel = d.nivel;
    if(d.clase !== undefined) clase = d.clase;
    if(d.grupos !== undefined) grupos = d.grupos;
    guardar('mate_stats_v1', stats); guardar('mate_racha_v1', racha);
    guardar('mate_nivel_v1', nivel); guardar('mate_clase_v1', clase);
    guardar('mate_grupos_v1', grupos);
    // si estás mirando Inicio o Progreso cuando llega el cambio del otro aparato, refresca sola
    if(_pantallaActual === pantallaInicio || _pantallaActual === pantallaStats) _pantallaActual();
  }, err => console.warn('sync:', err.message));
}
// las escrituras se juntan unos segundos en vez de mandar una por cada respuesta — menos
// veces que se despierta la radio del teléfono para lo mismo
let _syncPendiente = null, _syncTimer = null;
function _empujarSync(modId, ok){
  if(!syncDoc) return;
  if(!_syncPendiente) _syncPendiente = { stats:{} };
  const p = _syncPendiente.stats[modId] || (_syncPendiente.stats[modId] = { ok:0, fallo:0 });
  p[ok ? 'ok' : 'fallo']++;
  _syncPendiente.racha = { actual: racha.actual, mejor: racha.mejor };
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(_flushSync, 4000);
}
function _flushSync(){
  clearTimeout(_syncTimer); _syncTimer = null;
  if(!syncDoc || !_syncPendiente) return;
  const p = _syncPendiente; _syncPendiente = null;
  const statsInc = {};
  Object.keys(p.stats).forEach(id => {
    statsInc[id] = {};
    if(p.stats[id].ok)    statsInc[id].ok    = firebase.firestore.FieldValue.increment(p.stats[id].ok);
    if(p.stats[id].fallo) statsInc[id].fallo = firebase.firestore.FieldValue.increment(p.stats[id].fallo);
  });
  syncDoc.set({ stats: statsInc, racha: p.racha }, { merge: true }).catch(()=>{});
}
function desconectarSync(){
  _flushSync();
  if(_syncUnsub) _syncUnsub();
  _syncUnsub = null; syncDoc = null; syncListo = false; syncCode = null;
  localStorage.removeItem('mate_sync_code_v1');
}
// suelta la conexión en vivo con Firestore cuando la app pasa a segundo plano (batería), y la
// vuelve a enganchar al regresar — antes se quedaba escuchando para siempre en background
document.addEventListener('visibilitychange', () => {
  if(!syncCode) return;

    _flushSync();
    if(_syncUnsub){ _syncUnsub(); _syncUnsub = null; syncListo = false; }
  } else if(document.visibilityState === 'visible' && syncDoc && !syncListo){

// app se queda abierta cruzando las 7 pm/6 am, se quedaba en el tema de antes hasta reabrirla.

window.addEventListener('online', () => {

const pct = s => { const t = s.ok + s.fallo; return t ? Math.round(s.ok*100/t) : null; };

/* módulos disponibles ahora mismo (según el modo clase) */
function modulosActivos(){
  if(clase && clase.mods && clase.mods.length){
    const ms = clase.mods.map(id => MOD_POR_ID[id]).filter(Boolean);
    if(ms.length) return ms;
  }
  return MODULOS;
}
/* sortea uno de "ms" dando más peso a los que van peor — la usan elegirModulo() e iniciarExamen() */
function elegirDe(ms){
  const pesos = ms.map(m => {
    const s = stats[m.id] || { ok:0, fallo:0 };
    return 1 + s.fallo / (s.ok + s.fallo + 1);
  });
  let r = Math.random() * pesos.reduce((a,b)=>a+b, 0);
  for(let i=0; i<ms.length; i++){ r -= pesos[i]; if(r <= 0) return ms[i]; }
  return ms[ms.length-1];
}
/* elige módulo para la práctica normal; cap (1/2/3) limita la mezcla a ese capítulo */
function elegirModulo(cap){
  // "Mezcla del capítulo N" siempre usa TODOS los temas del capítulo, sin importar si hay una
  // mezcla personalizada activa — si no, pedir el capítulo 3 con una mezcla de solo cap.1 se
  // quedaba sin candidatos y tronaba.
  return elegirDe(cap ? MODULOS.filter(m=>m.secciones[0][0]===String(cap)) : modulosActivos());
}

}
function _calcRender(){
  // justo después de tocar un signo (calcNuevo true) calcVal todavía guarda el operando
  // anterior, que ya está en calcTokens — mostrarlo de nuevo lo duplicaba en pantalla
  // ("5 × 5 + 5" antes de escribir el segundo 5). Se oculta hasta que se escriba uno nuevo.
  const ocultarVal = calcNuevo && calcTokens.length;
  $('calcPantalla').textContent = calcTokens.length
    ? calcTokens.join(' ') + (ocultarVal ? '' : ' ' + calcVal)
    : calcVal;
}
function abrirCalc(){
  calcVal = '0'; calcNuevo = false; calcTokens = [];
  _calcRender();
  _calcRenderHist();
  // "Usar" aparece si hay al menos un campo de respuesta donde ponerlo (num, frac, mixto,
  // ángulos con figura...); el textarea de "Tu proceso" también es .campo pero es <textarea>,
  // no <input>, así que el selector de abajo ya lo deja afuera solo.
  $('calcUsarBtn').style.display = $('zonaEntrada').querySelector('input.campo') ? '' : 'none';
  $('calcOv').style.display = 'flex';
}
function cerrarCalc(){ $('calcOv').style.display = 'none'; }
// Llena el primer campo VACÍO (arriba antes que abajo, entero antes que la fracción...,
// según el orden en que aparecen en pantalla); si ya están todos llenos, empieza de nuevo
// por el primero — así una sola cuenta sirve para ir llenando numerador y denominador,
// las dos partes de un mixto, o los dos ángulos, con dos o tres toques de "Usar".
function calcUsar(){
  if(calcVal === 'Error') return;
  const campos = [...$('zonaEntrada').querySelectorAll('input.campo')];
  if(!campos.length) return;
  (campos.find(c => c.value === '') || campos[0]).value = calcVal;
  cerrarCalc();
}
function calcDigito(d){
  if(calcNuevo || calcVal === '0'){ calcVal = d; calcNuevo = false; }
  else if(calcVal.length < 12) calcVal += d;
  _calcRender();
}
function calcPunto(){
  if(calcNuevo){ calcVal = '0.'; calcNuevo = false; }
  else if(calcVal.indexOf('.') === -1) calcVal += '.';
  _calcRender();
}
function calcSigno(){
  calcVal = calcVal.startsWith('-') ? calcVal.slice(1) : (calcVal === '0' ? '0' : '-'+calcVal);
  _calcRender();
}
function calcPorcentaje(){
  calcVal = _calcFormato(parseFloat(calcVal) / 100);
  _calcRender();
}
function calcClear(){
  calcVal = '0'; calcNuevo = false; calcTokens = [];
  _calcRender();
}
function _calcOperar(a, b, op){
  if(op === '+') return a + b;
  if(op === '-') return a - b;
  if(op === '×') return a * b;
  if(op === '÷') return b === 0 ? NaN : a / b;
}
function _calcFormato(n){
  if(!isFinite(n)) return 'Error';
  return String(Math.round(n * 1e8) / 1e8);   // recorta el ruido de coma flotante
}
function calcOp(op){
  // si ya había un signo pendiente y no se escribió número nuevo, el usuario solo está
  // cambiando de opinión sobre el signo — se reemplaza, no se apila
  if(calcTokens.length && calcNuevo) calcTokens[calcTokens.length-1] = op;
  else calcTokens.push(calcVal, op);
  calcNuevo = true;
  _calcRender();
}
function calcIgual(){
  if(!calcTokens.length) return;
  const nums = calcTokens.filter((_,i)=>i%2===0).map(parseFloat).concat(parseFloat(calcVal));
  const ops = calcTokens.filter((_,i)=>i%2===1);
  let total = nums[0];
  for(let i=0; i<ops.length; i++) total = _calcOperar(total, nums[i+1], ops[i]);
  const expr = calcTokens.concat(calcVal).join(' ');
  calcVal = _calcFormato(total);
  calcHist.push({ expr, res: calcVal });
  calcNuevo = true; calcTokens = [];
  _calcRender();
  _calcRenderHist();
}
// teclado físico para la calculadora — antes solo funcionaba a clics, incómodo en la compu.
// Solo actúa mientras el overlay está abierto, así que no interfiere con Enter en los
// inputs de la práctica ni con ningún otro atajo de la página.
document.addEventListener('keydown', e => {
  if($('calcOv').style.display !== 'flex') return;
  if(/^[0-9]$/.test(e.key)) calcDigito(e.key);
  else if(e.key === '.' || e.key === ',') calcPunto();
  else if(e.key === '+') calcOp('+');
  else if(e.key === '-') calcOp('-');
  else if(e.key === '*') calcOp('×');
  else if(e.key === '/'){ e.preventDefault(); calcOp('÷'); }   // '/' abre la búsqueda rápida en Firefox
  else if(e.key === '%') calcPorcentaje();
  else if(e.key === 'Enter' || e.key === '=') calcIgual();
  else if(e.key === 'u' || e.key === 'U') calcUsar();
  else if(e.key === 'Escape') cerrarCalc();
  else if(e.key === 'Backspace'){ calcVal = calcVal.length>1 ? calcVal.slice(0,-1) : '0'; _calcRender(); }
  else return;
  e.preventDefault();
});

let _swReloadPendiente = false;   // ver el listener 'controllerchange' en ARRANQUE
function ir(pantalla, arg, continuar){
  if(_swReloadPendiente){ window.location.reload(); return; }
  cerrarMenuGrupos();   // cambiar de pantalla no debe dejar la tarjeta flotando encima
  cerrarCalc();         // ni la calculadora abierta
  window.scrollTo(0,0);
  if(pantalla !== 'practica') borrarSesion();   // salir de la práctica = ronda terminada
  // salir de examen/errores sin terminar no debe dejar el modo "pegado" — si no, el modo
  // práctica normal queda contaminado (responder() y el botón "Siguiente" siguen esas reglas)
  if(pantalla !== 'examen'){ examen = null; clearInterval(_examenTimerIv); }
  if(pantalla !== 'errores') modoErrores = false;
  modoRepasoRonda = false;   // no hay pantalla dedicada — cualquier ir() cancela el repaso de la ronda
  // _pantallaActual solo debe apuntar a Inicio/Progreso mientras de verdad estás ahí — si no,
  // queda "pegado" ahí y un cambio remoto de sync te saca de la práctica solo, a media ronda
  // (bug real: pasaba en cualquier pantalla a la que entraras después de haber visto Inicio).
  if(pantalla !== 'inicio' && pantalla !== 'stats') _pantallaActual = null;
  if(pantalla === 'inicio')   return pantallaInicio();
  if(pantalla === 'temas')    return pantallaTemas();
  if(pantalla === 'practica') return nuevoEjercicio(arg, continuar);
  if(pantalla === 'stats')    return pantallaStats();
  if(pantalla === 'ajustes')  return pantallaAjustes();
  if(pantalla === 'tema')     return pantallaTema();
  if(pantalla === 'clase')    return pantallaClase();
  if(pantalla === 'elegir')   return pantallaElegirTemas();
  if(pantalla === 'grupos')   return pantallaGrupos();
  if(pantalla === 'sync')     return pantallaSync();
  if(pantalla === 'examen')   return iniciarExamen();
  if(pantalla === 'errores')  return pantallaErrores();
}

function getTemaModo(){ return leer('mate_tema_v1', 'auto-system'); }
function resolverNoche(){
  const m = getTemaModo();
  if(m === 'dark') return true;
  if(m === 'light') return false;
  if(m === 'auto-hour'){ const h = new Date().getHours(); return h >= 19 || h < 6; }
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function aplicarTema(){
  const noche = resolverNoche();
  document.body.classList.toggle('night', noche);
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.content = noche ? '#000000' : '#d2d2da';
}

function nuevoEjercicio(arg, continuar){
  // límite real: al llegar al final de la ronda, no se sigue solo — hay que elegir "seguir" o "terminar"
  if(continuar && sesionHechos >= sesionTotal) return pantallaRondaCompleta();
  if(!continuar){                       // ronda nueva: arma la cola y fija el tamaño
    sesionHechos = 0; sesionCorrectos = 0; sesionPendientes = []; sesionFallos = [];
    esTemaFijo = typeof arg !== 'number' && !!arg;
    capFijo = typeof arg === 'number' ? arg : null;
    sesionCola = esTemaFijo ? [] : construirCola(capFijo);
    sesionTotal = esTemaFijo ? SESION_TEMA : sesionCola.length;
  }
  sesionHechos++;
  sesionPendientes.forEach(p => p.esperar--);
  const repite = sesionPendientes.find(p => p.esperar <= 0);
  if(repite){
    sesionPendientes.splice(sesionPendientes.indexOf(repite), 1);
    modActual = MOD_POR_ID[repite.modId] || modActual;
    ejActual = repite.ej;
  } else if(esTemaFijo){
    modActual = MOD_POR_ID[arg];
    ejActual = modActual.gen(nivel);
  } else {
    if(!sesionCola.length) sesionCola = construirCola(capFijo);   // red de seguridad, no debería pasar
    modActual = MOD_POR_ID[sesionCola.shift()];
    ejActual = modActual.gen(nivel);
  }
  ejActual.__mod = modActual.id;
  respondido = false; vioExpl = false; ordenSel = []; ultimoFeedback = null; ultimoProceso = ''; calcHist = [];
  pintarEjercicio();
  guardarSesion();
}

      <h2>¡Ronda completa!</h2>
      <div class="nota">Acertaste ${ok} de ${total} (${pct_}%)</div>
      ${sesionFallos.length ? `
        <div class="nota" style="margin-top:8px">Fallaste en: ${listaFallos}</div>
        <button class="btn amar" style="margin-top:14px" onclick="_repasarFallosRonda()">Repetir las que fallé (${sesionFallos.length})</button>
      ` : ''}
      <button class="btn ${sesionFallos.length?'sec':'amar'}" style="margin-top:10px" onclick="ir('practica',${seguirArg})">Seguir practicando</button>
      <button class="btn sec" onclick="ir('inicio')">Volver a inicio</button>
    </div>`;
}
// "Repetir las que fallé" — repasa sesionFallos una por una (acierto la saca de la cola, fallo
// la manda al final, igual que "Repasar mis errores") sin tocar `errores` ni las estadísticas:
// esto es solo para cerrar la ronda que se acaba de terminar, no un historial permanente.
function _repasarFallosRonda(){
  modoRepasoRonda = true;
  colaRepasoRonda = sesionFallos.slice();
  _pintarSiguienteRepasoRonda();
}
function _pintarSiguienteRepasoRonda(){
  if(!colaRepasoRonda.length){ modoRepasoRonda = false; return pantallaRondaCompleta(); }
  const item = colaRepasoRonda[0];
  modActual = MOD_POR_ID[item.modId] || { id:item.modId, nombre:'Repaso' };
  ejActual = item.ej;
  respondido = false; vioExpl = false; ordenSel = []; ultimoProceso = ''; calcHist = [];
  _barra(null);
  main.innerHTML = `
    <button class="back" onclick="ir('inicio')">← Inicio</button>
    <div class="card">
      <span class="pill">Repitiendo lo que fallaste · quedan ${colaRepasoRonda.length}</span>
      <div class="enunciado">${ejActual.enunciado}</div>
      <div id="zonaEntrada">${entradaHTML(ejActual)}</div>
      <div id="zonaFb"></div>
      <div class="row" id="accionesPre"></div>
    </div>`;
  const primero = $('inNum') || $('inTexto') || $('inE') || $('inN') || $('inA2');
  if(primero){
    if(window.innerWidth > 640) primero.focus();
    ['inNum','inTexto','inE','inN','inD','inA2','inA3'].forEach(id=>{
      const el = $(id); if(el) el.addEventListener('keydown', e => { if(e.key==='Enter') responder(); });
    });
  }
}

function tocarOrden(i){
  if(respondido) return;
  const p = ordenSel.indexOf(i);
  if(p >= 0) ordenSel.splice(p,1); else ordenSel.push(i);
  pintarOrden();
}
function pintarOrden(){
  ejActual.opciones.forEach((_,i)=>{
    const el = $('oc'+i); if(!el) return;
    const p = ordenSel.indexOf(i);
    el.classList.toggle('on', p >= 0);
    const badge = el.querySelector('.num');
    if(p >= 0){
      if(badge) badge.textContent = p+1;
      else el.insertAdjacentHTML('beforeend', `<span class="num">${p+1}</span>`);
    } else if(badge) badge.remove();
  });
}

function leerEntrada(ej){
  switch(ej.tipo){
    case 'num':   return $('inNum').value;
    case 'texto': return $('inTexto').value;
    case 'frac':  return { n:$('inN').value, d:$('inD').value };
    case 'mixto': return { e:$('inE').value, n:$('inN').value, d:$('inD').value };
    case 'orden': return ordenSel.slice();
    case 'angulo2': return { a:$('inA2').value, b:$('inA3').value };
  }
}

function responder(valor){
  if(examen) return responderExamen(valor);
  if(respondido) return;
  const ent = (valor !== undefined) ? valor : leerEntrada(ejActual);
  if(ejActual.tipo === 'orden' && ent.length < ejActual.opciones.length){
    return mostrarFb({ ok:false, msg:'Toca las tres fracciones, en el orden que pide.' }, true);
  }
  const res = verificar(ejActual, ent);
  if(res.vacio) return mostrarFb({ ok:false, msg:'Te falta escribir la respuesta.' }, true);

  respondido = true;
  ultimoFeedback = res;
  ultimoProceso = ($('inProceso') || {}).value || '';
  if(modoErrores){
    // acierto → sale de la lista. Fallo → se manda al final en vez de quedarse en el frente,
    // o "Siguiente ejercicio" volvía a mostrar EXACTAMENTE la misma pregunta que acabas de fallar
    if(res.ok){ errores.shift(); } else { errores.push(errores.shift()); }
    guardar('mate_errores_v1', errores);
  } else if(modoRepasoRonda){
    // mismo vaivén que modoErrores pero sobre la copia de trabajo de sesionFallos —
    // no toca `errores` ni las estadísticas, es solo repetir lo que ya se falló en esta ronda
    if(res.ok){ colaRepasoRonda.shift(); } else { colaRepasoRonda.push(colaRepasoRonda.shift()); }
  } else {
    if(!vioExpl) anotar(ejActual.__mod, res.ok);
    if(!vioExpl && res.ok) sesionCorrectos++;
    if(!vioExpl && !res.ok){
      _registrarError(ejActual);
      sesionFallos.push({ modId: ejActual.__mod, nombre: modActual.nombre, ej: ejActual });
      if(repetirFallo) _programarRepeticion();
    }
    guardarSesion();
  }
  mostrarFb(res, false);
}

const _feedbackHaptico = ok => { if(navigator.vibrate) navigator.vibrate(ok ? 30 : [30,50,30]); };

function mostrarFb(res, soloAviso){
  const zona = $('zonaFb');
  if(soloAviso){ zona.innerHTML = `<div class="fb medio">${res.msg}</div>`; return; }

  _feedbackHaptico(res.ok);
  const clase_ = res.ok ? 'ok' : res.incompleto ? 'medio' : 'mal';
  const titulo = res.ok ? '¡Correcto!' : res.incompleto ? 'Casi' : 'No es esa';
  const sigOnclick = modoErrores ? '_pintarSiguienteError()'
    : modoRepasoRonda ? '_pintarSiguienteRepasoRonda()'
    : `ir('practica',${esTemaFijo ? `'${modActual.id}'` : capFijo ? capFijo : 'undefined'},true)`;
  zona.innerHTML = `
    <div class="fb ${clase_}">${titulo}
      ${res.msg ? `<small>${res.msg}</small>` : ''}
      ${!res.ok ? `<small>La respuesta es <b>${fmtRespuesta(ejActual)}</b>.</small>` : ''}
      ${vioExpl ? `<small>Este no cuenta para las estadísticas (viste la explicación antes).</small>` : ''}
    </div>
    ${explHTML()}
    <button class="btn amar" onclick="${sigOnclick}">Siguiente ejercicio</button>
    ${(!modoErrores && !modoRepasoRonda) ? `<button class="btn sec chico" style="margin-top:8px" onclick="otroDelMismoTema()">Otro de este tema<small>no gasta tu ronda</small></button>` : ''}`;
  $('zonaEntrada').style.opacity = '.5';
  $('zonaEntrada').style.pointerEvents = 'none';
  $('accionesPre').style.display = 'none';
  zona.scrollIntoView({behavior:'smooth', block:'start'});
}

// Una línea que empieza con "TRUCO:" no es un paso más: sale de la lista numerada y se
// pinta como recuadro aparte al final (atajo para resolverlo más rápido la próxima vez).
function explPasos(lista){
  const pasos = [], trucos = [];
  lista.forEach(l => {
    if(!/^TRUCO:/.test(l)) return pasos.push(l);
    const t = l.replace(/^TRUCO:\s*/,'');
    // el rótulo hace de título (la frase empieza en mayúscula) y los ejemplos van en su propio renglón
    trucos.push((t.charAt(0).toUpperCase() + t.slice(1))
      .replace(/ ((?:Otro )?Ejemplos?\b[^:]{0,40}:)/g, '<br>$1'));
  });
  return `<ol>${pasos.map(l=>`<li>${l}</li>`).join('')}</ol>` +
    trucos.map(t=>`<div class="truco"><b>TRUCO PARA QUE SEA MÁS FÁCIL</b>${t}</div>`).join('');
}

const explHTML = () => `
  <div class="expl"><h3>Por qué</h3>${explPasos(ejActual.explicacion)}</div>`;

/* ---------- modo examen ---------- */
const EXAMEN_TOTAL = 10, EXAMEN_SEGUNDOS = 60 * EXAMEN_TOTAL;   // 1 minuto por pregunta
let _examenTimerIv = null;
function iniciarExamen(){
  _barra(null);
  examen = { preguntas: [], idx: 0, finLimite: Date.now() + EXAMEN_SEGUNDOS*1000 };
  for(let i=0; i<EXAMEN_TOTAL; i++){
    const m = elegirDe(MODULOS);   // siempre de TODOS los temas — no se limita a la mezcla/grupo activo
    const ej = m.gen(nivel); ej.__mod = m.id; ej.__modNombre = m.nombre;
    examen.preguntas.push({ ej, ok:null, completado:false });
  }
  pintarExamen();
}
function _abandonarExamen(){
  confirmarAccion('¿Abandonar el examen? No se guarda ningún resultado.', () => {
    clearInterval(_examenTimerIv);
    examen = null;
    ir('inicio');
  });
}
function pintarExamen(){
  const p = examen.preguntas[examen.idx];
  ordenSel = [];
  main.innerHTML = `
    <button class="back" onclick="_abandonarExamen()">← Abandonar examen</button>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <span class="pill">Pregunta ${examen.idx+1} de ${examen.preguntas.length}</span>
        <span class="pill" id="examenReloj" style="background:var(--rojo-bg);color:#b03a2e">--:--</span>
      </div>
      <div class="enunciado">${p.ej.enunciado}</div>
      <div id="zonaEntrada">${entradaHTML(p.ej)}</div>
    </div>
    <div class="nota">Modo examen: sin explicaciones ni saltar — el repaso queda para el final.</div>`;
  const primero = $('inNum') || $('inTexto') || $('inE') || $('inN');
  if(primero && window.innerWidth > 640) primero.focus();
  _actualizarRelojExamen();
}
function _actualizarRelojExamen(){
  clearInterval(_examenTimerIv);
  const tick = () => {
    if(!examen) return clearInterval(_examenTimerIv);
    const restante = Math.max(0, Math.round((examen.finLimite - Date.now())/1000));
    const el = $('examenReloj');
    if(el) el.textContent = String(Math.floor(restante/60)).padStart(2,'0')+':'+String(restante%60).padStart(2,'0');
    if(restante <= 0){ clearInterval(_examenTimerIv); finalizarExamen(); }
  };
  tick();
  _examenTimerIv = setInterval(tick, 1000);
}
function responderExamen(valor){
  const p = examen.preguntas[examen.idx];
  const ent = (valor !== undefined) ? valor : leerEntrada(p.ej);
  if(p.ej.tipo === 'orden' && ent.length < p.ej.opciones.length) return;   // en examen se exige completar, sin aviso
  const res = verificar(p.ej, ent);
  if(res.vacio) return;
  p.ok = res.ok; p.completado = true;
  examen.idx++;
  if(examen.idx >= examen.preguntas.length) finalizarExamen();
  else pintarExamen();
}
function finalizarExamen(){
  clearInterval(_examenTimerIv);
  const total = examen.preguntas.length;
  const correctas = examen.preguntas.filter(p=>p.ok===true).length;
  const nota = Math.round(correctas*100/total);
  examenes.unshift({ fecha: fechaLocal(), correctas, total });
  examenes = examenes.slice(0, 30);
  guardar('mate_examenes_v1', examenes);
  main.innerHTML = `
    <div class="card">
      <h2>Resultado del examen</h2>
      <div class="racha">
        <div><b>${correctas}/${total}</b><span>correctas</span></div>
        <div><b>${nota}%</b><span>nota</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Repaso</h2>
      ${examen.preguntas.map((p,i)=>`
        <div class="fb ${!p.completado?'medio':p.ok?'ok':'mal'}" style="margin-bottom:6px">
          ${i+1}. ${p.ej.enunciado}
          <small>${!p.completado ? 'Sin responder (se acabó el tiempo)' : p.ok?'Correcto':'Incorrecto — la respuesta es '+fmtRespuesta(p.ej)}</small>
        </div>
        <div class="expl" style="margin-bottom:14px">${explPasos(p.ej.explicacion)}</div>`).join('')}
      <button class="btn amar" onclick="examen=null; ir('inicio')">Volver a Inicio</button>
    </div>`;
  examen = null;
}

    </div>

function _historialUltimosDias(n){
  const out = [];
  for(let i=n-1; i>=0; i--){
    const d = fechaHaceDias(i);
    out.push({ dia:d, n: historial[d]||0 });
  }
  return out;
}
function exportarRespaldo(){
  const datos = {};
  Object.keys(localStorage).filter(k=>k.startsWith('mate_')).forEach(k=>{ datos[k] = localStorage.getItem(k); });
  const blob = new Blob([JSON.stringify(datos)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mate-respaldo-'+fechaLocal()+'.json';
  a.click();
}
function importarRespaldo(file){
  const reader = new FileReader();
  reader.onload = () => {
    let datos;
    try{ datos = JSON.parse(reader.result); }catch(e){ datos = null; }
    // se valida ANTES de tocar nada — un JSON que solo "parsea" (null, un arreglo, un texto)
    // no debe borrar el progreso que ya había
    const claves = (datos && typeof datos === 'object' && !Array.isArray(datos))
      ? Object.keys(datos).filter(k => k.startsWith('mate_')) : [];
    if(!claves.length){ avisar('Ese archivo no es un respaldo válido de esta app.'); return; }
    claves.forEach(k => localStorage.setItem(k, datos[k]));
    avisar('Progreso restaurado. La app se va a recargar.', () => location.reload());
  };
  reader.readAsText(file);
}
function practicarTema(id){ ir('practica', id); }
function borrarProgreso(){

    guardar('mate_stats_v1', stats); guardar('mate_racha_v1', racha);
    guardar('mate_historial_v1', historial); guardar('mate_racha_dias_v1', rachaDias); guardar('mate_errores_v1', errores);
    // sin {merge:true}: un merge con {} no borra nada en Firestore, hay que reemplazar el
    // documento entero — grupos va también ahora, o el próximo set() sin merge se lo llevaba
    // por delante en el otro aparato (bug real: "Borrar mi progreso" borraba tus grupos remotos)
    if(syncDoc) syncDoc.set({ stats, racha, nivel, clase: clase||null, grupos }).catch(()=>{});
    pantallaStats();
  });
}

/* ---------- elegir temas a mano (mezclar lo que quieras, ej. cap.1 con cap.2) ---------- */
let analisis = null, seleccion = [];

// bloque de checkboxes por capítulo, compartido entre "Elegir temas" y el editor de grupos —
// "repintar" es el nombre (sin comillas) de la función que hay que llamar tras marcar/desmarcar
const _bloquesCapitulos = repintar => [1,2,3,4].map(cap => { const ms = MODULOS.filter(m=>m.secciones[0][0]===String(cap));
  const n = ms.filter(m=>seleccion.indexOf(m.id)>=0).length; return `

    <span>Capítulo ${cap}</span>

      onclick="_marcarCapitulo(${cap}, ${repintar})">Marcar/quitar todo</button>
  </h3>
  <details ${n>0?'open':''}>
    <summary>${n} de ${ms.length} marcados</summary>
    ${listaCheckHTML(ms)}
  </details>
`; }).join('');
function _marcarCapitulo(cap, repintar){
  const ms = MODULOS.filter(m=>m.secciones[0][0]===String(cap));
  const todosMarcados = ms.every(m=>seleccion.indexOf(m.id)>=0);
  ms.forEach(m=>toggleMod(m.id, !todosMarcados));

}

function _pintarElegirTemas(){
  main.innerHTML = `

async function leerArchivoClase(file){
  $('zonaClase').innerHTML = `<div class="cargando">Leyendo ${file.name}…</div>`;
  try {
    const txt = await textoDeArchivo(file);
    if(!txt || !txt.trim()) throw new Error('No se pudo sacar texto de ese archivo. Prueba a copiar y pegar.');
    $('txtClase').value = txt.slice(0, 200000);
    mostrarAnalisis(analizarTexto(txt), file.name);

    $('zonaClase').innerHTML = `<div class="fb mal">${e.message}</div>`;
  }
}
function analizarPegado(){
  const txt = $('txtClase').value;
  if(!txt.trim()) return $('zonaClase').innerHTML = `<div class="fb medio">Pega algo primero.</div>`;
  mostrarAnalisis(analizarTexto(txt), 'el texto pegado');
}

function mostrarAnalisis(a, fuente){
  analisis = a;
  seleccion = a.detectados.map(m => m.id);
  if(!a.detectados.length){
    $('zonaClase').innerHTML = `
      <div class="fb medio">No reconocí ningún tema en ${fuente}.
        <small>Puedes elegirlos a mano abajo.</small></div>
      ${listaCheckHTML(MODULOS)}
      <div id="zonaClaseMsg"></div>
      <button class="btn amar" onclick="guardarClase()">Usar estos temas</button>`;
    seleccion = [];
    return;
  }
  const secs = a.secciones.length
    ? `<div class="fb ok">Secciones detectadas: <b>${a.secciones.join(', ')}</b></div>` : '';
  $('zonaClase').innerHTML = `
    ${secs}
    <h3>Esto es lo que detecté — corrígelo si hace falta</h3>
    ${listaCheckHTML(a.detectados, a)}
    <details style="margin:8px 0 12px">
      <summary style="cursor:pointer;font-size:.88rem;color:var(--muted)">Ver los demás temas</summary>
      <div style="margin-top:8px">${listaCheckHTML(MODULOS.filter(m => a.detectados.indexOf(m) < 0), a)}</div>
    </details>
    <div id="zonaClaseMsg"></div>
    <button class="btn amar" onclick="guardarClase()">Practicar solo estos temas</button>`;
}

function listaCheckHTML(mods, a){
  return mods.map(m=>{
    const on = seleccion.indexOf(m.id) >= 0;
    const razon = a ? (a.secciones.filter(s => SECMAP[s].indexOf(m.id) >= 0).join(', ')
                       || (a.claves[m.id] || []).slice(0,2).join(', ')) : '';
    return `<label class="modCheck ${on?'on':''}" id="mc_${m.id}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleMod('${m.id}', this.checked)">
      <span>${m.nombre}</span>
      ${razon ? `<span class="sc">${razon}</span>` : ''}
    </label>`;
  }).join('');
}
function toggleMod(id, on){
  const i = seleccion.indexOf(id);
  if(on && i < 0) seleccion.push(id);
  if(!on && i >= 0) seleccion.splice(i,1);
  const el = $('mc_'+id); if(el) el.classList.toggle('on', on);
  const cta = $('ctaMezclaCount'); if(cta) cta.textContent = tamanoMezcla(seleccion) + ' preguntas';
}
function guardarClase(){
  // innerHTML= en su propia zona (no insertAdjacentHTML en zonaClase entera) — si no, cada
  // toque de "Practicar solo estos temas" sin marcar nada apilaba otro aviso más debajo del anterior
  if(!seleccion.length) return $('zonaClaseMsg').innerHTML = `<div class="fb medio">Marca al menos un tema.</div>`;
  const secs = analisis && analisis.secciones.length ? analisis.secciones : null;
