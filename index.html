<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d2d2da">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<title>Práctica de Matemáticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- media="print" + onload: no bloquea el primer pintado esperando a Google Fonts (mismo
     truco que Fit-F); el <noscript> es el respaldo si el JS no corre. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --acento:#ffc93c;
    --verde:#2ecc71; --verde-bg:#e8f9f0;
    --rojo:#e74c3c; --rojo-bg:#fdeceb;
    --ambar:#f39c12; --ambar-bg:#fef6e7;
    --gris:rgba(255,255,255,.30); --gris2:rgba(255,255,255,.45);
    --texto:#1a1a2e; --muted:#5a6275;
    /* Liquid Glass — mismos valores que Fit-F, para que las dos apps se vean iguales */
    --card:rgba(255,255,255,.28);
    --lg-blur:blur(40px) saturate(180%);
    --lg-border:1px solid rgba(255,255,255,.55);
    --lg-shadow:0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.08),
                inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(0,0,0,.04);
    --titulo:var(--texto); --titulo2:var(--muted);
    --superficie:var(--card);   /* fondo de tarjeta/chip — ahora vidrio, no blanco sólido */
    /* superficie SÓLIDA de contraste (enunciado, chip elegido, insignias). Va aparte de
       --texto a propósito: si se usa --texto como fondo, en modo oscuro queda blanco sobre
       blanco — es la misma trampa del doble papel que ya documentamos con --azul. */
    --contraste:#1a1a2e; --contraste-texto:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* quita el zoom por doble-toque en iOS/Android sin bloquear el pellizco (pinch-zoom) de accesibilidad */
  html,body{touch-action:manipulation}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(145deg,#c8c8d0 0%,#d8d8e0 50%,#c8c8d0 100%);
    background-attachment:fixed;
    color:var(--texto);min-height:100vh;padding:14px;line-height:1.55;
  }
  /* textura de ruido muy sutil, igual que Fit-F — le quita el look plano al degradado */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:200px 200px;
  }
  /* padding-bottom cubre la barra Y el botón de la calculadora: el botón mide 52px y su
     borde inferior queda a 76+52=128px del fondo — con menos que eso, su mitad superior
     tapaba el último elemento visible de cualquier pantalla (ej. la fila de estadísticas
     de práctica), incluso con la barra oculta, porque este padding no depende de ella */
  .app{max-width:720px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  /* barra flotante de navegación, abajo — copiada tal cual de Fit-F (pastilla vidrio +
     lente Liquid Glass que se desliza sobre la pestaña activa), sin los emoji de sus iconos */
  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:400;display:flex;gap:2px;max-width:calc(100% - 24px);
    background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:28px;
    padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .bottom-nav.oculta{display:none}
  .bn-item{position:relative;z-index:1;font-family:inherit;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 13px;border-radius:22px;min-width:62px;
    color:var(--muted);transition:color .25s,transform .15s}
  .bn-item:active{transform:scale(.9)}
  .bn-lbl{font-size:13px;font-weight:700;letter-spacing:.2px;transition:font-weight .2s}
  .bn-item.active{color:var(--texto)}
  .bn-item.active .bn-lbl{font-weight:800}
  /* lente Liquid Glass (iOS 26) — se desliza sobre la pestaña activa */
  .bn-lens{position:absolute;z-index:0;top:8px;left:0;width:0;height:0;
    border-radius:21px;opacity:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,255,255,.35),rgba(255,255,255,0));
    backdrop-filter:blur(1px) saturate(210%) brightness(1.14);
    -webkit-backdrop-filter:blur(1px) saturate(210%) brightness(1.14);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -3px 6px rgba(255,255,255,.15),
      inset 3px 0 7px rgba(0,190,255,.03),inset -3px 0 7px rgba(255,40,150,.03),
      0 3px 10px rgba(0,0,0,.14);
    transition:left .5s cubic-bezier(.32,1.45,.5,1),width .5s cubic-bezier(.32,1.45,.5,1),
      top .5s cubic-bezier(.32,1.45,.5,1),height .5s cubic-bezier(.32,1.45,.5,1),opacity .3s}
  .card{background:var(--card);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
    border:var(--lg-border);border-radius:24px;box-shadow:var(--lg-shadow);padding:20px;margin-bottom:14px}
  h2{color:var(--titulo);font-size:1.18rem;margin-bottom:12px;font-weight:800;letter-spacing:-.3px}
  h3{color:var(--titulo2);font-size:.78rem;margin:16px 0 8px;font-weight:700;
    text-transform:uppercase;letter-spacing:.8px}
  /* pastillas de vidrio, como los botones de Fit-F.
     Sin backdrop-filter propio: viven siempre dentro de una .card/.ajCard ya esmerilada,
     así que el blur no aportaba nada visible y sí un costo real de batería/GPU — cada
     capa con backdrop-filter es una recomposición aparte, y llegaban a coexistir 30+ a
     la vez en pantallas como "Temas". Ya aplicado también a .calcGrid button (2026-09-18,
     se sentía como lag al usar la calculadora). Confirmar visualmente antes de quitarlo
     también de .chip (mismo motivo, no aplicado todavía). */
  .btn{display:block;width:100%;border:1.5px solid rgba(255,255,255,.45);border-radius:22px;
    cursor:pointer;padding:15px;font-size:1.02rem;font-weight:700;margin-bottom:10px;
    font-family:inherit;transition:transform .15s,box-shadow .2s;
    background:rgba(255,255,255,.42);
    color:var(--texto);box-shadow:0 4px 18px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,.75)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.85)}
  .btn:active{transform:scale(.98)}
  /* el botón principal de cada pantalla: vidrio más sólido, para que destaque sin gritar */
  .btn.amar{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.85)}
  .btn.sec{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:var(--muted)}
  .btn.chico{padding:11px;font-size:.92rem;border-radius:18px}
  .btn small{display:block;font-weight:500;font-size:.79rem;opacity:.6;margin-top:2px}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:120px}
  .back{background:none;border:none;color:var(--texto);cursor:pointer;font-size:.94rem;
    padding:5px 2px;margin-bottom:6px;opacity:.65;font-family:inherit;font-weight:600}
  .back:hover{opacity:1}
  .pill{display:inline-block;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);
    color:var(--texto);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;
    padding:5px 13px;border-radius:20px;margin-bottom:9px}
  .nota{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);padding:11px 14px;
    border-radius:14px;margin:10px 0;font-size:.9rem;color:var(--muted)}
  /* confirmación propia en vez de confirm() nativo — ver confirmarAccion() */
  /* z-index arriba del de .bottom-nav (400, copiado tal cual de Fit-F) — si no, un diálogo
     en una pantalla con la barra visible queda tapado por ella */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:450}
  .overlay .card{max-width:360px;margin:0;width:100%}
  /* la calculadora se abre pegada abajo y a la derecha, no en el centro, para no tapar el
     ejercicio que está arriba (en pantallas angostas .overlay .card ya ocupa casi todo el
     ancho, así que justify-content no cambia nada ahí — solo se nota con espacio de sobra) */
  #calcOv{align-items:flex-end;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  /* chips de nivel / tema */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .chip{border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.3);color:var(--muted);
    border-radius:20px;padding:7px 15px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;
    backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur)}
  /* mismo color que el botón principal (.btn.amar) — pedido explícito, para que "elegido"
     se vea igual en toda la app */
  .chip.on{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.85);color:var(--texto)}
  /* flechita para plegar/desplegar listas de temas */
  details{margin:2px 0 10px}
  summary{cursor:pointer;color:var(--titulo2);font-weight:600;font-size:.85rem;
    padding:6px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▶';display:inline-block;margin-right:6px;font-size:.65rem;transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  /* resumen de capítulo — mismo look que h3, pero es el propio interruptor de abrir/cerrar */
  .temaCap > summary{color:var(--titulo2);font-size:.78rem;margin:16px 0 8px;font-weight:700;
    text-transform:uppercase;letter-spacing:.8px;padding:0}
  /* enunciado */
  .enunciado{background:var(--contraste);color:var(--contraste-texto);border-radius:20px;padding:22px 18px;
    font-size:1.22rem;text-align:center;margin-bottom:16px;line-height:1.6}
  .enunciado .fr{color:rgba(255,255,255,.72)}
  /* fracción apilada */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
    margin:0 4px;line-height:1.15;font-weight:700}
  .fr b{display:block;padding:0 5px}
  .fr i{display:block;padding:0 5px;border-top:2px solid currentColor;font-style:normal}
  /* entradas */
  .campo{width:100%;border:1.5px solid rgba(255,255,255,.5);border-radius:16px;padding:13px;
    font-size:1.15rem;text-align:center;font-family:inherit;color:var(--texto);background:var(--superficie)}
  .campo:focus{outline:none;border-color:var(--texto)}
  .numRow{display:flex;gap:8px}
  .numRow .campo{flex:1;min-width:0}
  .signo{flex:none;width:52px;padding:0;font-size:1.3rem;font-weight:700;margin-bottom:0}
  .fracIn{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:150px;margin:0 auto}
  .fracIn .campo{width:110px}
  .fracIn .barra{width:110px;height:3px;background:var(--titulo);border-radius:2px}
  .mixIn{display:flex;align-items:center;justify-content:center;gap:12px}
  .mixIn .campo{width:80px}
  .opt{display:flex;gap:10px}
  .opt .btn{flex:1;font-size:1.25rem;padding:18px}
  .ordenCaja{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .ordenChip{position:relative;border:1.5px solid rgba(255,255,255,.5);background:var(--superficie);
    border-radius:14px;padding:14px 20px;font-size:1.25rem;cursor:pointer;font-family:inherit;color:var(--texto)}
  .ordenChip.on{border-color:var(--texto);background:rgba(255,255,255,.55)}
  .ordenChip .num{position:absolute;top:-9px;right:-9px;background:var(--contraste);color:var(--contraste-texto);
    width:24px;height:24px;border-radius:50%;font-size:.8rem;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  /* feedback */
  .fb{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-weight:600}
  .fb.ok{background:var(--verde-bg);color:#1e7a48;border-left:5px solid var(--verde)}
  .fb.mal{background:var(--rojo-bg);color:#b03a2e;border-left:5px solid var(--rojo)}
  .fb.medio{background:var(--ambar-bg);color:#9c6410;border-left:5px solid var(--ambar)}
  .fb small{display:block;font-weight:400;margin-top:4px}
  .expl{background:var(--gris);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .expl h3{margin-top:0}
  .expl ol{margin:0;padding-left:20px}
  .expl li{margin-bottom:6px;font-size:.95rem}
  .expl li:last-child{margin-bottom:0;font-weight:600;color:var(--titulo)}
  /* atajo para resolverlo más rápido — sale del <ol> y se pinta aparte (ver explPasos) */
  .truco{background:var(--superficie);border-left:4px solid var(--acento);border-radius:8px;
    padding:9px 12px;margin-top:11px;font-size:.9rem;line-height:1.5}
  .truco b{display:block;color:var(--titulo2);font-size:.8rem;letter-spacing:.3px;margin-bottom:2px}
  /* stats */
  .barra-ext{height:10px;background:var(--gris);border-radius:6px;overflow:hidden;margin-top:5px}
  .barra-int{height:100%;border-radius:6px;background:var(--verde);transition:width .4s}
  .stat{margin-bottom:13px}
  .stat .lbl{display:flex;justify-content:space-between;font-size:.9rem}
  .stat .lbl b{color:var(--titulo)}
  .racha{display:flex;gap:10px;text-align:center;margin-bottom:6px}
  .racha div,.racha button{flex:1;background:var(--gris);border-radius:12px;padding:12px 6px}
  .racha button{border:2px solid transparent;cursor:pointer;font-family:inherit}
  .racha button.on{border-color:var(--texto)}
  .racha b{display:block;font-size:1.6rem;color:var(--texto);line-height:1.2;font-weight:800}
  .racha span{font-size:.78rem;color:var(--muted)}
  /* clase */
  .banner{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:11px 14px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;font-weight:700;color:var(--texto)}
  .banner button{background:var(--contraste);color:var(--contraste-texto);border:none;border-radius:12px;
    padding:6px 11px;font-size:.8rem;cursor:pointer;font-family:inherit}
  textarea.campo{text-align:left;font-size:.92rem;min-height:130px;resize:vertical}
  .modCheck{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1.5px solid rgba(255,255,255,.45);
    border-radius:11px;margin-bottom:7px;cursor:pointer}
  .modCheck.on{border-color:var(--texto);background:rgba(255,255,255,.45)}
  .modCheck input{width:19px;height:19px;accent-color:var(--texto)}
  .modCheck .sc{margin-left:auto;font-size:.76rem;color:var(--muted)}
  .drop{border:2px dashed var(--gris2);border-radius:12px;padding:18px;text-align:center;
    color:var(--muted);font-size:.9rem;cursor:pointer;margin-bottom:10px}
  .drop.hover{border-color:var(--texto);background:rgba(255,255,255,.45)}
  .cargando{text-align:center;color:var(--muted);font-size:.9rem;padding:10px}
  /* test */
  pre.test{background:var(--contraste);color:#d6f5c8;padding:14px;border-radius:12px;
    font-size:.82rem;overflow-x:auto;white-space:pre-wrap}
  /* modo oscuro: antes seguía el sistema solo (media query), ahora es elegible a mano
     (Ajustes → Tema) — por eso vive en la clase body.night, no en @media, igual que en
     Fit-F/Fit-M (ver aplicarTema()/resolverNoche()). "Automático (celular)" sigue
     poniendo/quitando esta misma clase según el sistema, así que se ve idéntico a antes. */
  body.night{
    --acento:#ffc93c;
    --verde:#2ecc71; --verde-bg:#123322;
    --rojo:#e74c3c; --rojo-bg:#3a1c1c;
    --ambar:#f39c12; --ambar-bg:#3a2c10;
    --gris:rgba(255,255,255,.06); --gris2:rgba(255,255,255,.14);
    --texto:#f5f5f7; --muted:#9a9aa4;
    --card:rgba(28,28,30,.72);
    --lg-border:1px solid rgba(255,255,255,.12);
    --lg-shadow:0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4),
                inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3);
    --titulo:var(--texto); --titulo2:var(--muted);
    --superficie:var(--card);
    --contraste:rgba(255,255,255,.14); --contraste-texto:#f5f5f7;
  }
  body.night{background:#000}
  body.night::before{opacity:.05}
  body.night .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--texto);
    box-shadow:0 4px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
  body.night .btn.amar{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
  body.night .btn.sec{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.10);color:var(--muted)}
  body.night .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:var(--texto)}
  body.night .nota{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
  body.night .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--muted)}
  body.night .banner{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
  body.night .modCheck{border-color:rgba(255,255,255,.18)}
  body.night .modCheck.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32)}
  /* mismo blanco translúcido que .btn.amar, pero con más opacidad — en oscuro el amar
     está muy bajito (.06, casi igual al chip sin marcar en .07) y ahí sí hace falta que
     se note cuál está elegido */
  body.night .chip.on{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.45);color:var(--texto)}
  /* mismo motivo que .chip.on: en oscuro rgba(255,255,255,.55) fijo queda ilegible — el número
     insignia usa --contraste, que en body.night ya es un blanco translúcido, no el navy sólido
     de modo claro, así que también hacía falta redefinir el fondo del chip elegido */
  body.night .ordenChip.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
  body.night .fb.ok{color:#7be3a8} body.night .fb.mal{color:#f19c92} body.night .fb.medio{color:#f5c877}
  body.night .drop.hover{background:rgba(255,255,255,.10)}
  body.night .bottom-nav{background:rgba(28,28,30,.82);border-color:rgba(255,255,255,.12);
    box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
  body.night .bn-lens{background:linear-gradient(to bottom,rgba(255,255,255,.08),rgba(255,255,255,0));
    border-color:rgba(255,255,255,.15);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.12),inset 0 -3px 6px rgba(255,255,255,.04),
      0 3px 10px rgba(0,0,0,.4)}
  /* filas de Ajustes/Tema — tarjeta de vidrio con filas apiladas, igual que renderMas() de Fit-F */
  .ajCard{background:var(--card);backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
    border:var(--lg-border);border-radius:16px;overflow:hidden;box-shadow:var(--lg-shadow);margin-bottom:14px}
  .ajRow{width:100%;background:none;border:none;color:var(--texto);cursor:pointer;
    padding:14px;display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit}
  .ajRow + .ajRow{border-top:1px solid var(--gris2)}
  .ajTitulo{font-size:.95rem;font-weight:800;line-height:1.2}
  .ajSub{font-size:.78rem;color:var(--muted);margin-top:3px}
  .ajChevron{font-size:1.1rem;opacity:.5;flex-shrink:0;color:var(--texto)}
  .ajCheck{font-size:1rem;font-weight:900;color:var(--verde);flex-shrink:0}
  .flechita{display:inline-block;margin-left:4px;font-size:.75em;opacity:.7}
  /* botón flotante de la calculadora — visible en toda la app, incluso practicando */
  .calcBtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);
    z-index:70;width:52px;height:52px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.55);

<script>
/* ══════════════════════════════════════════════════════════
   1. HELPERS MATEMÁTICOS  (funciones puras, sin dependencias)
   ══════════════════════════════════════════════════════════ */
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a; }
function mcm(a,b){ return Math.abs(a*b)/mcd(a,b); }
function esPrimo(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  for(let d=3; d*d<=n; d+=2) if(n%d===0) return false;
  return true;
}
function factorizar(n){
  const f={}; let d=2;
  while(d*d<=n){ while(n%d===0){ f[d]=(f[d]||0)+1; n/=d; } d++; }
  if(n>1) f[n]=(f[n]||0)+1;
  return f;
}
function simplificar(n,d){ const g=mcd(n,d)||1; return [n/g, d/g]; }
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup = n => String(n).split('').map(c=>SUP[c]).join('');
function fmtFactores(f){
  const ps = Object.keys(f).map(Number).sort((a,b)=>a-b);
  if(!ps.length) return '1';
  return ps.map(p => f[p]>1 ? p+sup(f[p]) : ''+p).join(' × ');
}
// dos rectas cruzadas: ∠1 = g (dado, en dorado), ∠2 = 180-g (adyacente), ∠3 = g (opuesto por el vértice)
function svgCruce(g, uid){
  const cx=150, cy=110, R=90, rArc=40, rTxt=60;
  const rad = a => a*Math.PI/180;
  const pt = (a,r) => ({ x:(cx + r*Math.cos(rad(a))).toFixed(1), y:(cy - r*Math.sin(rad(a))).toFixed(1) });
  const p0=pt(0,R), p180=pt(180,R), pg=pt(g,R), pgOp=pt(g+180,R);
  const t1=pt(g/2,rTxt), t2=pt((g+180)/2,rTxt), t3=pt(180+g/2,rTxt);
  const arc = (a1,a2) => { const q1=pt(a1,rArc), q2=pt(a2,rArc); return `M ${q1.x} ${q1.y} A ${rArc} ${rArc} 0 0 1 ${q2.x} ${q2.y}`; };
  return `<svg viewBox="0 0 300 200" style="width:100%;max-width:300px;height:auto;color:var(--texto);display:block;margin:10px auto 0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="fe${uid}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker>
      <marker id="fs${uid}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker>
    </defs>
    <line x1="${p180.x}" y1="${p180.y}" x2="${p0.x}" y2="${p0.y}" stroke="currentColor" stroke-width="2" marker-start="url(#fs${uid})" marker-end="url(#fe${uid})"/>
    <line x1="${pgOp.x}" y1="${pgOp.y}" x2="${pg.x}" y2="${pg.y}" stroke="currentColor" stroke-width="2" marker-start="url(#fs${uid})" marker-end="url(#fe${uid})"/>
    <path d="${arc(0,g)}" fill="none" stroke="var(--acento)" stroke-width="2"/>
    <path d="${arc(g,180)}" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
    <path d="${arc(180,180+g)}" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
    <text x="${t1.x}" y="${t1.y}" fill="var(--acento)" font-size="16" font-weight="800" text-anchor="middle" dominant-baseline="middle">${g}°</text>
    <text x="${t2.x}" y="${t2.y}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">∠2</text>
    <text x="${t3.x}" y="${t3.y}" fill="currentColor" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">∠3</text>
  </svg>`;
}
function fmtFactoresPlano(f){
  const ps = Object.keys(f).map(Number).sort((a,b)=>a-b);
  if(!ps.length) return '1';
  return ps.map(p => f[p]>1 ? p+'^'+f[p] : ''+p).join(' * ');
}
const sumaDig = n => String(n).split('').reduce((s,c)=>s + (+c), 0);
const porNivel = (nv,f,m,d) => nv==='facil' ? f : nv==='medio' ? m : d;
// el resto de la app escribe el signo menos como '−' (U+2212), pero un número negativo
// interpolado en un template (${n} con n<0) sale con el guion ASCII '-' de JS — mm() lo
// pareja donde un enunciado muestra el número crudo (no ya envuelto en su propio "− ${n}")
const mm = n => String(n).replace('-','−');
// fracción apilada para el enunciado
const fr = (n,d) => `<span class="fr"><b>${n}</b><i>${d}</i></span>`;
const cmpSigno = (a,b) => a<b ? '<' : a>b ? '>' : '=';
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// ── fracciones con signo (capítulo 4) ──
const frS = (n,d) => (n<0 ? '−' : '') + fr(Math.abs(n), d);        // signo delante de la fracción apilada
const frP = (n,d) => n<0 ? `(${frS(n,d)})` : frS(n,d);             // entre paréntesis si va después de un operador
const tf  = (n,d) => `${mm(n)}/${d}`;                               // texto plano para las explicaciones
const tfP = (n,d) => n<0 ? `(${tf(n,d)})` : tf(n,d);
const mixS = (e,n,d) => `${e<0?'−':''}${Math.abs(e)} ${fr(n,d)}`;
// denominadores con factores en común, para que el MCD no sea siempre el producto
const DENS_FRAC = [2,3,4,5,6,8,9,10,12,15,16,18,20,24];
function sumarF(fs){                                                // fs = [{n,d},...] → suma simplificada + pasos
  const m = fs.reduce((ac,f)=>mcm(ac,f.d), 1);
  const nums = fs.map(f => f.n*(m/f.d));
  const tot = nums.reduce((a,b)=>a+b, 0);
  const [sn,sd] = simplificar(tot, m);
  return { m, nums, tot, n:sn, d:sd };
}
function multF(fs){                                                 // producto simplificado + producto "crudo"
  let rawN = 1, rawD = 1; fs.forEach(f => { rawN *= f.n; rawD *= f.d; });
  const [n,d] = simplificar(rawN, rawD);
  return { rawN, rawD, n, d };
}
const recipF = f => ({ n: f.n<0 ? -f.d : f.d, d: Math.abs(f.n) });  // recíproco, el signo se queda arriba
const divF = (a,b) => multF([a, recipF(b)]);
const addF = (a,b) => { const r = sumarF([a,b]); return { n:r.n, d:r.d }; };
// operando "bonito": entero sin barra, fracción apilada; con paréntesis si es negativo y va tras un operador
const opS = f => f.d===1 ? mm(f.n) : frS(f.n,f.d);
const opP = f => f.n<0 ? `(${opS(f)})` : opS(f);
const opT = f => f.d===1 ? mm(f.n) : tf(f.n,f.d);
// ── pasos desglosados, para quien no sabe nada: cada operación con fracciones explicada
//    renglón por renglón (los módulos de cap. 4 los usan dentro de "Por qué") ──
// suma de dos enteros con signo, explicada con la regla de signos (como en reglas-signos)
function explSumaEnteros(a, b){
  const r = a + b;
  if(a === 0 || b === 0) return `${mm(a)} + ${b<0?`(${mm(b)})`:b} = ${mm(r)} (sumar 0 no cambia nada).`;
  if((a<0) === (b<0)) return `${mm(a)} + ${b<0?`(${mm(b)})`:b}: mismo signo, se suman los valores (${Math.abs(a)} + ${Math.abs(b)} = ${Math.abs(r)}) y se conserva ese signo → ${mm(r)}.`;
  const g = Math.abs(a) >= Math.abs(b) ? a : b;
  return `${mm(a)} + ${b<0?`(${mm(b)})`:b}: signos distintos, se restan los valores (${Math.max(Math.abs(a),Math.abs(b))} − ${Math.min(Math.abs(a),Math.abs(b))} = ${Math.abs(r)}) y gana el signo del más grande, ${mm(g)} → ${mm(r)}.`;
}
// linea de simplificación (o aviso de que ya está simple)
function explSimplif(n, d){
  const g = mcd(n, d), [sn, sd] = simplificar(n, d);
  if(n === 0) return `Arriba quedó 0, y 0 sobre cualquier número es 0.`;
  if(g === 1) return `${tf(n,d)} ya está en su forma más simple (nada divide exacto a ${Math.abs(n)} y a ${d} a la vez).`;
  return `Se simplifica ${tf(n,d)} dividiendo arriba y abajo entre ${g} (el número más grande que divide a los dos): ${Math.abs(n)} ÷ ${g} = ${Math.abs(sn)}, ${d} ÷ ${g} = ${sd} → ${tf(sn,sd)}.`;
}
// a + b (b puede venir negativo = resta). Devuelve { res, lineas }
function pasosSumaF(a, b){
  const lineas = [];
  if(a.d === b.d){
    lineas.push(`${tfP(a.n,a.d)} + ${tfP(b.n,b.d)}: ya tienen el mismo denominador (${a.d}), así que solo se suman los de arriba y el ${a.d} se queda.`);
  } else {
    const m = mcm(a.d, b.d);
    lineas.push(`${tfP(a.n,a.d)} + ${tfP(b.n,b.d)}: tienen denominadores distintos, y solo se pueden sumar pedazos del mismo tamaño. El denominador común más chico es el MCM de ${a.d} y ${b.d} = ${m}.`);
    if(m !== a.d) lineas.push(`${tf(a.n,a.d)} → arriba y abajo por ${m/a.d} → ${tf(a.n*(m/a.d), m)}`);
    else lineas.push(`${tf(a.n,a.d)} ya tiene denominador ${m}, se queda igual.`);
    if(m !== b.d) lineas.push(`${tf(b.n,b.d)} → arriba y abajo por ${m/b.d} → ${tf(b.n*(m/b.d), m)}`);
    else lineas.push(`${tf(b.n,b.d)} ya tiene denominador ${m}, se queda igual.`);
  }
  const r = sumarF([a, b]);
  lineas.push(`Arriba: ${explSumaEnteros(r.nums[0], r.nums[1])} Abajo se queda ${r.m} → ${tf(r.tot, r.m)}`);
  if(r.d !== r.m || r.n !== r.tot) lineas.push(explSimplif(r.tot, r.m));
  return { res:{n:r.n, d:r.d}, lineas };
}
// a × b
function pasosMultF(a, b){
  const r = multF([a, b]);
  const negs = (a.n<0?1:0) + (b.n<0?1:0);
  const lineas = [`${tfP(a.n,a.d)} × ${tfP(b.n,b.d)}: arriba con arriba y abajo con abajo. Arriba: ${Math.abs(a.n)} × ${Math.abs(b.n)} = ${Math.abs(r.rawN)}; abajo: ${a.d} × ${b.d} = ${r.rawD}` +
    (negs === 1 ? ` — hay un solo signo negativo, así que el resultado es negativo` : negs === 2 ? ` — dos negativos se cancelan, el resultado es positivo` : '') + ` → ${tf(r.rawN, r.rawD)}`];
  if(r.d !== r.rawD || r.n !== r.rawN) lineas.push(explSimplif(r.rawN, r.rawD));
  return { res:{n:r.n, d:r.d}, lineas };
}
// a ÷ b
function pasosDivF(a, b){
  const rec = recipF(b);
  const lineas = [`${tfP(a.n,a.d)} ÷ ${tfP(b.n,b.d)}: dividir entre una fracción es multiplicar por la fracción volteada (su recíproco). Se voltea SOLO la segunda: ${tfP(b.n,b.d)} → ${tfP(rec.n,rec.d)}.`];
  const m = pasosMultF(a, rec);
  return { res:m.res, lineas: lineas.concat(m.lineas) };
}
const opTP = f => f.n<0 ? `(${opT(f)})` : opT(f);
// teclado numérico del teléfono a veces no trae signo "-" (iOS, sobre todo) — botón ± como atajo
function toggleSigno(id){
  const el = $(id);
  el.value = el.value.startsWith('-') ? el.value.slice(1) : '-' + el.value;
  el.focus();
}

/* ══════════════════════════════════════════════════════════
   2. EXPLICACIONES  (salen de las mismas variables que la respuesta)
   ══════════════════════════════════════════════════════════ */
// El ejemplo del truco se arma con el MISMO número del ejercicio, no con uno inventado.
function trucoDiv(n, d){
  const s = String(n), ult = +s[s.length-1], sd = sumaDig(n), dos = n%100;
  const corta = sd > 9 ? sumaDig(sd) : sd;
  const suma = sd > 9 ? `${s.split('').join('+')} = ${sd} → ${String(sd).split('').join('+')} = ${corta}`
                      : `${s.split('').join('+')} = ${sd}`;
  const m4 = dos===0     ? 'un 00, y cualquier centena completa ya es múltiplo de 4 → sí'
           : dos%4===0 ? `${dos} → ${dos/2} → ${dos/4}, exacto las dos veces → sí`
           : dos%2===0 ? `${dos} → ${dos/2}, y ${dos/2} ya no se parte exacto a la mitad → no`
           : `${dos} ni siquiera es par → no`;
  switch(d){
    case 2: return `Ni mires el resto del número: tapa todo con la mano menos la última cifra. Si esa cifra es 0, 2, 4, 6 u 8, es divisible entre 2 — da igual si el número tiene cuatro cifras o veinte. Ejemplo con este mismo: tapas ${n} y queda el ${ult}, que es ${ult%2===0?'par → sí':'impar → no'}.`;
    case 5: return `Igual que con el 2, solo cuenta la última cifra: 0 o 5 → sí, cualquier otra → no. Ni sumes ni dividas nada. Ejemplo con este mismo: ${n} termina en ${ult}, que ${(ult===0||ult===5)?'sí es 0 o 5 → sí':'no es 0 ni 5 → no'}.`;
    case 10: return `La más rápida de todas: ¿termina en 0? Sí. ¿No termina en 0? No. Ejemplo con este mismo: ${n} termina en ${ult} → ${ult===0?'sí':'no'}.`;
    case 3: return `Si al sumar los dígitos te queda un número grande, vuelve a sumar SUS dígitos y repite hasta quedarte con una sola cifra; si esa cifra es 3, 6 o 9, el número es divisible entre 3. Ejemplo con este mismo: ${suma}, y ${corta} ${sd%3===0?'sí es múltiplo de 3 → sí':'no es múltiplo de 3 → no'}.`;
    case 9: return `El mismo atajo del 3: suma los dígitos y, si te queda grande, vuelve a sumarlos hasta tener una sola cifra. Solo si esa cifra final es 9 el número es divisible entre 9. Ejemplo con este mismo: ${suma}, y ${corta} ${sd%9===0?'sí es 9 (o múltiplo de 9) → sí':'no llega a 9 → no'}.`;
    case 4: return `Toma las dos últimas cifras y pártelas a la mitad dos veces seguidas: si las dos veces sale exacto, es divisible entre 4. Ejemplo con este mismo: las dos últimas de ${n} son ${m4}.`;
    case 6: return `Empieza siempre por lo más barato: ¿es par? Si NO es par ya puedes contestar "no" sin sumar ni un dígito. Ejemplo con este mismo: ${n} ${ult%2===0 ? `sí es par, así que toca revisar el 3: ${suma}, que ${sd%3===0?'sí es múltiplo de 3 → sí':'no es múltiplo de 3 → no'}` : 'no es par → no, y ahí terminaste sin sumar nada'}.`;
    case 12: return `Empieza por la regla del 4 (solo dos cifras que mirar). Si falla, la respuesta ya es "no" y te ahorras sumar todos los dígitos. Ejemplo con este mismo: las dos últimas de ${n} son ${dos}, que ${dos%4===0 ? `sí se divide entre 4, así que toca el 3: ${suma}, y ${corta} ${sd%3===0?'sí es múltiplo de 3 → sí':'no es múltiplo de 3 → no'}` : 'no se divide exacto entre 4 → no, sin sumar ni un dígito'}.`;
  }
  return null;
}
function explDivisibilidad(n,d){
  const t = trucoDiv(n, d);
  return _pasosDivisibilidad(n,d).concat(t ? 'TRUCO: '+t : []);
}
function _pasosDivisibilidad(n,d){
  const s = String(n), ult = +s[s.length-1], sd = sumaDig(n), dos = n%100;
  const ok = n%d===0, si = ok?'sí':'no';
  const intro = 'Que un número sea "divisible" entre otro significa que, al dividirlos, el resultado es exacto — no sobra nada (el residuo es 0).';
  const final = `→ Por eso, ${n} ${si} es divisible por ${d}.`;
  const sumaTxt = `Sumamos sus dígitos: ${s.split('').join(' + ')} = ${sd}.`;
  switch(d){
    case 2: return [intro,
      'Para el 2 basta con mirar el último dígito (las demás cifras no importan): si es 0, 2, 4, 6 u 8 — un número par — sí es divisible entre 2.',
      `El último dígito de ${n} es ${ult}.`, `${ult} ${ult%2===0?'es par':'es impar (no par)'}. ${final}`];
    case 5: return [intro,
      'Para el 5 basta con mirar el último dígito: solo es divisible entre 5 si termina en 0 o en 5.',
      `El último dígito de ${n} es ${ult}.`, `${ult} ${(ult===0||ult===5)?'sí es 0 o 5':'no es ni 0 ni 5'}. ${final}`];
    case 10:return [intro,
      'Para el 10 basta con mirar el último dígito: solo es divisible entre 10 si termina exactamente en 0.',
      `El último dígito de ${n} es ${ult}.`, `${ult} ${ult===0?'sí es 0':'no es 0'}. ${final}`];
    case 3: return [intro,
      'Para el 3 hay un atajo: se suman todos los dígitos, y si esa suma es múltiplo de 3 (0, 3, 6, 9, 12...), el número completo también lo es.',
      sumaTxt, `${sd} ${sd%3===0?'sí es':'no es'} múltiplo de 3. ${final}`];
    case 9: return [intro,
      'Para el 9 el atajo es parecido: se suman todos los dígitos, y si esa suma es múltiplo de 9 (0, 9, 18, 27...), el número completo también lo es.',
      sumaTxt, `${sd} ${sd%9===0?'sí es':'no es'} múltiplo de 9. ${final}`];
    case 4: return [intro,
      'Para el 4 no hace falta mirar el número entero: solo importan sus dos últimos dígitos, porque cualquier "centena completa" ya es múltiplo de 4 por sí sola.',
      `Los dos últimos dígitos de ${n} forman el número ${dos}.`,
      `${dos} ÷ 4 ${dos%4===0?`= ${dos/4}, división exacta`:'no da exacta (sobra residuo)'}. ${final}`];
    case 6: return [intro,
      '6 = 2 × 3, así que un número es divisible entre 6 solo si cumple LAS DOS reglas a la vez: la del 2 y la del 3.',
      `¿Entre 2? El último dígito es ${ult}, que ${ult%2===0?'sí es par → sí':'no es par → no'}.`,
      `¿Entre 3? ${sumaTxt} ${sd%3===0?'Sí es múltiplo de 3 → sí':'No es múltiplo de 3 → no'}.`,
      `${ok?'Cumple las dos condiciones':'Falla al menos una de las dos condiciones'}. ${final}`];
    case 12:return [intro,
      '12 = 3 × 4, así que un número es divisible entre 12 solo si cumple LAS DOS reglas a la vez: la del 3 y la del 4.',
      `¿Entre 3? ${sumaTxt} ${sd%3===0?'Sí es múltiplo de 3 → sí':'No es múltiplo de 3 → no'}.`,
      `¿Entre 4? Los dos últimos dígitos forman ${dos}; ${dos%4===0?`${dos}÷4 es exacto → sí`:`${dos}÷4 no es exacto → no`}.`,
      `${ok?'Cumple las dos condiciones':'Falla al menos una de las dos condiciones'}. ${final}`];
  }
  return [`${n} ${si} es divisible por ${d}.`];
}

const TRAMPAS = [51,57,87,91,111,119,133,143,161,187,203,209,217,221,247,253,289,299];

function trucoPrimo(n){
  const sd = sumaDig(n), ult = n%10, lim = Math.floor(Math.sqrt(n));
  const par = n%2===0 && n!==2, cinco = ult===5 && n!==5, tres = sd%3===0 && n!==3;
  const revisa = `${n} ${par?'sí es par → compuesto':'no es par'}; ${cinco?'termina en 5 → compuesto':'no termina en 5'}; sus dígitos suman ${sd}, que ${tres?'sí es múltiplo de 3 → compuesto':'no es múltiplo de 3'}`;
  const cola = (par||cinco||tres) ? ' Con eso ya quedó resuelto, sin dividir nada.'
    : ` Como pasó las tres, no queda otra que dividir — pero basta probar hasta ${lim}, porque de ahí en adelante el primo por sí mismo ya pasa de ${n}.`;
  return `TRUCO: antes de ponerte a dividir, descarta lo fácil de un vistazo: ¿es par y no es el 2? ¿termina en 5 y no es el 5? ¿sus dígitos suman múltiplo de 3? Con que una sola diga que sí, ya es compuesto. Ejemplo con este mismo: ${revisa}.${cola}`;
}
function explPrimo(n){
  const intro = 'Un número "primo" es el que solo se puede dividir exacto entre 1 y entre sí mismo, sin ningún otro divisor. Si tiene algún otro divisor más, se llama "compuesto".';
  if(esPrimo(n)){
    const lim = Math.floor(Math.sqrt(n));
    const ps = [2,3,5,7,11,13,17].filter(x=>x<=lim);
    const li = [intro,
      `Para comprobarlo no hace falta probar todos los números: si ${n} tuviera un divisor mayor que √${n} (≈ ${lim}), tendría que existir otro divisor más pequeño que lo acompañe — así que basta con probar los primos hasta ${lim}.`];
    li.push(ps.length ? `Probamos dividir ${n} entre ${ps.join(', ')}: en ningún caso da una división exacta.`
                      : `Como √${n} es menor que 2, no hay ningún primo más pequeño que probar.`);
    li.push(`→ ${n} no tiene más divisores que 1 y él mismo, así que es PRIMO.`);
    li.push(trucoPrimo(n));
    return li;
  }
  let d = 2; while(n%d !== 0) d++;
  const li = [intro, 'Buscamos el divisor más pequeño de este número, distinto de 1.'];
  if(d>2) li.push(`${n} no es par, así que el 2 queda descartado; seguimos probando hacia arriba.`);
  li.push(`${n} ÷ ${d} = ${n/d}, y esa división sale exacta (sin residuo).`);
  li.push(`Como ${n} = ${d} × ${n/d}, ya tiene un divisor además de 1 y de sí mismo → es COMPUESTO, no primo.`);
  if(TRAMPAS.indexOf(n) >= 0) li.push(`Este es de los que engañan: ${n} no se ve tan obviamente compuesto a simple vista, por eso conviene probar varios primos antes de decidir.`);
  li.push(trucoPrimo(n));
  return li;
}

// lista los primos repetidos (2 × 2 × 3) para poder comprobar multiplicando
function planosDe(n){
  const f = factorizar(n), out = [];
  Object.keys(f).map(Number).sort((a,b)=>a-b).forEach(p => { for(let i=0;i<f[p];i++) out.push(p); });
  return out.join(' × ');
}
function explFactorizar(n){
  const li = ['"Factorizar" un número significa escribirlo como una multiplicación de números primos (números que solo se dividen entre 1 y entre sí mismos). Se hace dividiendo entre primos, empezando siempre por el más pequeño que quepa exacto:'];
  let m = n, d = 2;
  while(m > 1){
    if(m % d === 0){ li.push(`${m} ÷ ${d} = ${m/d} (${d} es primo y divide exacto)`); m = m/d; }
    else d++;
  }
  li.push(`Llegamos a 1, así que ya no hay más que dividir. Juntando todos los primos que usamos: ${n} = ${fmtFactores(factorizar(n))}`);
  li.push(`TRUCO: hazlo en "escalerita" — el número a la izquierda, el primo entre el que divides a la derecha, y NO subas al siguiente primo mientras el de ahora siga entrando exacto. Al final multiplica toda la columna de la derecha: tiene que darte el número original. Ejemplo con este mismo: multiplica ${planosDe(n)} y te vuelve a dar ${n}; si no diera, habría un error en algún renglón.`);
  return li;
}

function explMcmListado(a,b){
  const m = mcm(a,b), la = [], lb = [];
  for(let k=1; a*k<=m; k++) la.push(a*k);
  for(let k=1; b*k<=m; k++) lb.push(b*k);
  return [`El "MCM" (mínimo común múltiplo) es el número más pequeño que aparece en la tabla de multiplicar tanto de ${a} como de ${b} — el primer punto de encuentro entre las dos listas de múltiplos.`,
          `Múltiplos de ${a} (${a}, ${a}×2, ${a}×3...): ${la.join(', ')}`,
          `Múltiplos de ${b} (${b}, ${b}×2, ${b}×3...): ${lb.join(', ')}`,
          `El primer número que aparece en las dos listas es ${m} → MCM(${a}, ${b}) = ${m}`,
          `TRUCO: no hace falta escribir las dos listas. Ve nombrando solo los múltiplos del número MÁS GRANDE y en cada uno pregúntate si se divide exacto entre el chico; el primero que sí, es el MCM. Ejemplo con estos mismos: ${(()=>{ const G=Math.max(a,b), C=Math.min(a,b), ps=[]; for(let k=1; G*k<=m; k++) ps.push(`${G*k}${(G*k)%C===0?` sí se divide entre ${C}`:' no'}`); return ps.join(', '); })()} → MCM = ${m}, y te ahorraste escribir la lista de ${Math.min(a,b)}.`];
}

function explMcmFactores(ns){
  const fs = ns.map(factorizar);
  const li = ['Otra forma de hallar el MCM es a partir de la factorización prima de cada número:',
    ...ns.map((n,i)=>`${n} = ${fmtFactores(fs[i])}`)];
  const primos = [...new Set(fs.reduce((ac,f)=>ac.concat(Object.keys(f).map(Number)),[]))].sort((a,b)=>a-b);
  li.push('Para que el resultado sea múltiplo de todos ellos a la vez, se toma cada primo que aparezca con su MAYOR exponente, sin importar en cuál de los números apareció:');
  primos.forEach(p=>{
    const es = fs.map(f => f[p]||0);
    li.push(`Primo ${p}: aparece con exponente ${es.join(', ')} en cada número → se toma el mayor, ${Math.max.apply(null,es)}`);
  });
  const partes = primos.map(p=>{ const e = Math.max.apply(null, fs.map(f=>f[p]||0)); return e>1 ? p+sup(e) : ''+p; });
  li.push(`Multiplicando esos primos con sus mayores exponentes: MCM = ${partes.join(' × ')} = ${ns.reduce(mcm)}`);
  li.push(`TRUCO: antes de factorizar nada, revisa dos atajos. Si el número más grande ya se divide exacto entre los otros, el MCM es ese grande y terminaste. Y si los números no comparten ningún factor, el MCM es simplemente multiplicarlos. Ejemplo con estos mismos: ${(()=>{ const M=Math.max.apply(null,ns), prod=ns.reduce((x,y)=>x*y,1), r=ns.reduce(mcm); if(ns.every(x=>M%x===0)) return `${M} ya se divide exacto entre ${ns.filter(x=>x!==M).join(' y ')}, así que el MCM es ${M} sin factorizar nada`; if(r===prod) return `${ns.join(', ')} no comparten ningún factor, así que el MCM es ${ns.join(' × ')} = ${r}`; return `no aplica ninguno de los dos atajos (${M} no se divide exacto entre los otros, y sí comparten factores), así que toca factorizar como arriba`; })()}.`);
  return li;
}

function trucoMcd(ns){
  let a = Math.max.apply(null, ns), b = Math.min.apply(null, ns);
  const ps = [];
  while(b){ ps.push(`${a} entre ${b} sobra ${a%b}`); const r = a%b; a = b; b = r; }
  const extra = ns.length > 2 ? ` Con tres números, repites lo mismo entre ese resultado y el que falta.` : '';
  return `TRUCO: dos cosas que ahorran mucho tiempo. (1) El MCD nunca puede ser mayor que el número más chico, así que si el chico divide exacto al grande, el MCD ES el chico. (2) Si no lo ves, no factorices: divide el grande entre el chico y quédate con el RESIDUO; después divide el chico entre ese residuo, y sigue hasta que sobre 0 — el último número entre el que dividiste es el MCD. Ejemplo con estos mismos: ${ps.join('; ')} → el MCD es ${a}.${extra}`;
}
function explMcd(ns){
  const fs = ns.map(factorizar);
  const li = ['El "MCD" (máximo común divisor) es el número más grande que divide exacto a todos los números a la vez. Con factorización prima:',
    ...ns.map((n,i)=>`${n} = ${fmtFactores(fs[i])}`)];
  const comunes = Object.keys(fs[0]).map(Number).filter(p => fs.every(f=>f[p])).sort((a,b)=>a-b);
  if(!comunes.length){
    li.push('Ningún primo se repite en TODAS las factorizaciones a la vez.');
    li.push(`Sin ningún factor primo en común, el MCD es 1 — se dice que estos números son "primos entre sí".`);
    li.push(trucoMcd(ns));
    return li;
  }
  li.push('El MCD se arma con SOLO los primos que aparecen en TODAS las factorizaciones, tomando el MENOR exponente en que aparecen:');
  comunes.forEach(p=>{
    const es = fs.map(f=>f[p]);
    li.push(`Primo ${p}: aparece con exponente ${es.join(', ')} en cada número → se toma el menor, ${Math.min.apply(null,es)}`);
  });
  const partes = comunes.map(p=>{ const e = Math.min.apply(null, fs.map(f=>f[p])); return e>1 ? p+sup(e) : ''+p; });
  li.push(`Multiplicando esos primos comunes con sus menores exponentes: MCD = ${partes.join(' × ')} = ${ns.reduce(mcd)}`);
  li.push(trucoMcd(ns));
  return li;
}

function explComparar(a,b){
  const m = mcm(a.d,b.d), ka = m/a.d, kb = m/b.d;
  const na = a.n*ka, nb = b.n*kb, s = cmpSigno(na,nb);
  return [`No se pueden comparar directamente dos fracciones con denominadores distintos — primero hay que convertirlas para que tengan el MISMO denominador.`,
    `El denominador común más chico es el MCM de ${a.d} y ${b.d}: MCM(${a.d}, ${b.d}) = ${m}`,
    `${a.n}/${a.d} → se multiplica arriba y abajo por ${ka} (porque ${a.d}×${ka}=${m}) → ${na}/${m}`,
    `${b.n}/${b.d} → se multiplica arriba y abajo por ${kb} (porque ${b.d}×${kb}=${m}) → ${nb}/${m}`,
    `Con el mismo denominador, ya se pueden comparar solo los numeradores: ${na} ${s} ${nb}`,
    `→ ${a.n}/${a.d} ${s} ${b.n}/${b.d}`,
    `TRUCO: cuando son SOLO DOS fracciones, ni busques el MCM — multiplica en cruz: numerador de una por denominador de la otra, en los dos sentidos, y gana el lado más grande. Ejemplo con estas mismas: ${a.n} × ${b.d} = ${a.n*b.d} contra ${b.n} × ${a.d} = ${b.n*a.d}; como ${a.n*b.d} ${s} ${b.n*a.d}, queda ${a.n}/${a.d} ${s} ${b.n}/${b.d} — lo mismo que por el camino largo, en dos multiplicaciones.`];
}

          `TRUCO: piénsalo como dinero: el + es lo que tienes y el − es lo que debes. Si los dos son del mismo tipo se acumulan, y el signo ni se piensa, se copia tal cual. Ejemplo con este mismo: (${mm(A)}) + (${mm(B)}) es ${signo<0?`deber ${a} y deber ${b} → debes ${a+b}`:`tener ${a} y tener ${b} → tienes ${a+b}`} → ${mm(r)}.`] };
    }
    if(variante==='suma-dif'){
      const A=a, B=-b, r=A+B, mayor = a>=b?A:B;
      return { enunciado:`(${A}) + (${mm(B)}) =`, tipo:'num', respuesta:r,
        explicacion:[`Cuando los signos son DIFERENTES, no se suman: se restan sus valores (el más grande menos el más chico) y el resultado lleva el signo del que era más grande.`,
          `Sin el signo, los valores son ${a} y ${b}.`,
          `${Math.max(a,b)} − ${Math.min(a,b)} = ${Math.abs(r)}, y como ${mm(mayor)} era el de mayor valor, el resultado lleva su signo.`,
          `→ (${A}) + (${mm(B)}) = ${mm(r)}`,
          `TRUCO: también es dinero, pero de tipos distintos: tienes por un lado y debes por el otro, así que se cancelan entre sí. Gana el más grande y la respuesta se queda con SU signo. Ejemplo con este mismo: (${A}) + (${mm(B)}) es tener ${a} y deber ${b}; se cancelan ${Math.min(a,b)} y queda ${Math.abs(r)} ${r<0?'de deuda → ':'a favor → '}${mm(r)}.`] };
    }
    if(variante==='resta'){
      const A=a, B=-b, r=A+b;
      return { enunciado:`${A} − (${mm(B)}) =`, tipo:'num', respuesta:r,
        explicacion:[`Restar un número negativo es lo mismo que sumar su opuesto positivo — los dos signos de "menos" seguidos se cancelan entre sí.`,
          `${A} − (${mm(B)}) se convierte en ${A} + ${b}`, `→ = ${r}`,
          `TRUCO: cuando veas dos rayitas de menos seguidas, táchalas y escribe un + encima antes de calcular nada — quitarte una deuda es lo mismo que recibir dinero. Ejemplo con este mismo: ${A} − (${mm(B)}) → tachas las dos rayitas → ${A} + ${b} = ${r}.`] };
    }
    const op = pick(['mult','div']);
    const signoA = pick([1,-1]), signoB = pick([1,-1]), igual = signoA===signoB;
    if(op==='mult'){
      const A=signoA*a, B=signoB*b, r=A*B;
      return { enunciado:`(${mm(A)}) × (${mm(B)}) =`, tipo:'num', respuesta:r,
        explicacion:[`Para multiplicar: si los dos signos son iguales (los dos + o los dos −), el resultado sale positivo; si son diferentes, sale negativo.`,
          igual?`${mm(A)} y ${mm(B)} tienen el mismo signo.`:`${mm(A)} y ${mm(B)} tienen signos diferentes.`,
          `Se multiplican los valores sin el signo: ${a} × ${b} = ${a*b}`, `→ (${mm(A)}) × (${mm(B)}) = ${mm(r)}`,
          `TRUCO: no memorices la tabla de signos — cuenta cuántos signos menos hay. Cantidad PAR de menos (0, 2, 4...) → positivo. Cantidad IMPAR (1, 3...) → negativo. Sirve igual aunque multipliques tres o cuatro números de un tirón. Ejemplo con este mismo: (${mm(A)}) × (${mm(B)}) tiene ${(A<0?1:0)+(B<0?1:0)} menos, cantidad ${igual?'par':'impar'} → resultado ${r<0?'negativo':'positivo'}: ${mm(r)}.`] };
    }
    const A=signoA*(a*b), B=signoB*b, r=A/B;
    return { enunciado:`(${mm(A)}) ÷ (${mm(B)}) =`, tipo:'num', respuesta:r,
      explicacion:[`Para dividir aplica la misma regla que para multiplicar: signos iguales dan positivo, signos diferentes dan negativo.`,
        igual?`${mm(A)} y ${mm(B)} tienen el mismo signo.`:`${mm(A)} y ${mm(B)} tienen signos diferentes.`,
        `Se dividen los valores sin el signo: ${Math.abs(A)} ÷ ${b} = ${a}`, `→ (${mm(A)}) ÷ (${mm(B)}) = ${mm(r)}`,
        `TRUCO: el mismo de la multiplicación — cuenta los signos menos: cantidad par → positivo, impar → negativo. Haz la división con los números limpios (sin signo) y pégale el signo al final, así no te confundes a mitad de cuenta. Ejemplo con este mismo: ${Math.abs(A)} ÷ ${b} = ${a}, y como hay ${(A<0?1:0)+(B<0?1:0)} signo(s) menos (cantidad ${igual?'par':'impar'}), la respuesta es ${mm(r)}.`] };
  }
},

{
  id:'orden-operaciones-1', nombre:'Orden de operaciones', secciones:['1.4'],
  gen(nv){
    const chico = porNivel(nv, 6, 10, 15);
    const plantilla = pick(['completo','trampa-div','agrupa-mult','sustituir']);
    if(plantilla==='completo' || plantilla==='sustituir'){
      const b = R(2,chico), c = R(3,chico), d = R(1,c-1);
      const agr = c-d, pot = agr*agr, prod = b*pot;
      if(plantilla==='sustituir'){
        const x = R(1,chico), resp = x + prod;
        return { enunciado:`Si x = ${x}, calcula: x + ${b}(${c} − ${d})²`, tipo:'num', respuesta:resp,
          explicacion:[`Primero se reemplaza la variable x por el valor que dieron, ${x}, en todos los lugares donde aparezca.`,
            `Sustituyendo: ${x} + ${b}(${c} − ${d})²`,
            `El orden de operaciones dice: primero lo que está entre paréntesis, luego exponentes, luego multiplicación/división, y al final suma/resta.`,
            `Agrupación: ${c} − ${d} = ${agr}`, `Exponente: ${agr}² significa ${agr} × ${agr} = ${pot}`,
            `Multiplicación: ${b} × ${pot} = ${prod}`, `Suma (lo último): ${x} + ${prod} = ${resp}`,
            `TRUCO: al sustituir, escribe el valor entre paréntesis — parece tontería, pero es lo que evita que se pierda un signo o que el número se pegue con el de al lado. Y sustituye en TODA la expresión antes de calcular nada: no empieces mientras quede una letra. Ejemplo con este mismo: x vale ${x}, así que queda (${x}) + ${b}(${c} − ${d})², y recién ahí se empieza por el paréntesis.`] };
      }
      const a = R(1,chico), resp = a + prod;
      return { enunciado:`${a} + ${b}(${c} − ${d})²`, tipo:'num', respuesta:resp,
        explicacion:[`El orden de operaciones dice que siempre hay que resolver en este orden: 1) paréntesis, 2) exponentes, 3) multiplicación y división, 4) suma y resta — sin importar en qué orden aparezcan escritos.`,
          `Paréntesis primero: ${c} − ${d} = ${agr}`,
          `Exponente: ${agr}² significa ${agr} × ${agr} = ${pot}`,
          `Multiplicación: ${b} × ${pot} = ${prod}`,
          `Suma (lo último que queda): ${a} + ${prod} = ${resp}`,
          `TRUCO: vuelve a escribir la operación ENTERA en cada renglón, cambiando solo el pedacito que acabas de resolver; casi todos los errores salen de hacer dos pasos de cabeza a la vez. Y un número pegado a un paréntesis significa multiplicar. Ejemplo con este mismo, renglón por renglón: ${a} + ${b}(${c} − ${d})² → ${a} + ${b}(${agr})² → ${a} + ${b} × ${pot} → ${a} + ${prod} = ${resp}.`] };
    }
    if(plantilla==='trampa-div'){
      const c = R(2,chico), a = R(2,chico*3), d = R(1,chico), q = R(1,chico), bb = c*q;
      const resp = a - q + d;
      return { enunciado:`${a} − ${bb} ÷ ${c} + ${d}`, tipo:'num', respuesta:resp,
        explicacion:[`Aunque la resta aparezca primero de izquierda a derecha, la división tiene MAYOR prioridad y se resuelve antes.`,
          `División primero: ${bb} ÷ ${c} = ${q}`,
          `Ahora solo quedan suma y resta, que tienen la MISMA prioridad — se resuelven de izquierda a derecha: ${a} − ${q} + ${d}`,
          `${a} − ${q} = ${a-q}`, `${a-q} + ${d} = ${resp}`,
          `TRUCO: antes de calcular, pásale el lápiz por encima a las multiplicaciones y divisiones de toda la línea — esas van primero. Lo que sobra (sumas y restas) se resuelve de izquierda a derecha, como se lee. Ojo: multiplicar y dividir EMPATAN entre sí, manda el que esté más a la izquierda. Ejemplo con este mismo: subrayas ${bb} ÷ ${c} = ${q}, queda ${a} − ${q} + ${d} = ${resp}. Si hubieras restado primero, ${a} − ${bb} = ${a-bb}, y de ahí ya no salía.`] };
    }
    const b2 = R(1,chico), a2 = b2 + R(1,chico), c2 = R(2,chico), agr2 = a2-b2, resp2 = agr2*c2;
    return { enunciado:`(${a2} − ${b2}) × ${c2}`, tipo:'num', respuesta:resp2,
      explicacion:[`Lo que está dentro de un paréntesis siempre se resuelve primero, antes que cualquier multiplicación de afuera.`,
        `Paréntesis: ${a2} − ${b2} = ${agr2}`,
        `Ahora sí la multiplicación: ${agr2} × ${c2} = ${resp2}`,
        `TRUCO: el paréntesis es una "cajita cerrada": nada de afuera entra hasta que adentro quede un solo número. Resuélvelo, reemplázalo por ese número, y recién entonces sigue. Ejemplo con este mismo: (${a2} − ${b2}) × ${c2} → la cajita da ${agr2} → ${agr2} × ${c2} = ${resp2}. Multiplicando primero daría ${a2} − ${b2*c2}, que está mal.`] };
  }
},

{
  id:'lenguaje-algebraico', nombre:'Lenguaje algebraico', secciones:['2.1'],
  gen(nv){
    const alto = porNivel(nv, 12, 20, 30);
    const letra = pick(['x','y','a','m','n']);
    const coefUno = Math.random() < 0.2;
    const coef = coefUno ? 1 : R(2,alto);
    const signoConst = pick(['+','−']), cons = R(1,alto);
    const expr = `${coefUno?'':coef}${letra} ${signoConst} ${cons}`;
    if(Math.random() < 0.5) return {
      enunciado:`En la expresión <b>${expr}</b>, ¿cuál es el coeficiente?`, tipo:'num', respuesta:coef,
      explicacion:[`En una expresión algebraica, el "coeficiente" es el número que está multiplicando a la letra (la variable).`,
        coefUno ? `Cuando la letra aparece sola, sin ningún número escrito delante, su coeficiente es 1 (aunque no se escriba) — ${letra} es lo mismo que 1${letra}.` : `En ${coef}${letra}, el número ${coef} es el que multiplica a ${letra}.`,
        `→ El coeficiente es ${coef}.`,
        `TRUCO: tapa la letra con el dedo: lo que quede pegado justo delante es el coeficiente, y si no queda nada el coeficiente es 1. El número que anda suelto, sin letra al lado, es la constante. Ejemplo con este mismo: en ${expr} tapas la ${letra} y ${coefUno?'no queda nada delante, así que el coeficiente es 1':`queda ${coef}, ese es el coeficiente`}.`] };
    const respConst = signoConst==='+' ? cons : -cons;
    return {
      enunciado:`En la expresión <b>${expr}</b>, ¿cuál es la constante?`, tipo:'num', respuesta:respConst,
      explicacion:[`En una expresión algebraica, la "constante" es el número que NO tiene ninguna letra pegada — un valor fijo que no cambia.`,
        `En ${expr}, el término sin variable es ${signoConst==='+'?cons:'−'+cons}, incluyendo su signo.`,
        `→ La constante es ${respConst}.`,
        `TRUCO: el signo viaja SIEMPRE con el número que tiene a la derecha. Si delante hay un −, la constante es negativa; no lo dejes afuera al contestar. Ese es el error que más se repite en este tema. Ejemplo con este mismo: en ${expr} la constante es ${respConst}${signoConst==='−'?`, con el menos incluido — no ${cons}`:''}.`] };
  }
},

        expl:[`La propiedad "asociativa" dice que, al multiplicar tres o más números, se puede cambiar cuáles se AGRUPAN primero con paréntesis, sin que el resultado cambie.`,
          `A la izquierda se agrupan primero ${a} y ${b}; a la derecha se agrupan primero ${b} y ${c}. El resultado final es igual en ambos casos.`,
          `Esa es la propiedad asociativa.`] },
      'identidad-suma': { enun:`${a} + 0 = ${a}`, cat:'Identidad',
        expl:[`Una "identidad" es un valor especial que, al combinarse con cualquier número, lo deja sin cambiar.`,
          `Sumar 0 a cualquier número da ese mismo número — por eso el 0 es la "identidad aditiva" (de la suma).`] },
      'identidad-mult': { enun:`${a} × 1 = ${a}`, cat:'Identidad',
        expl:[`Una "identidad" es un valor especial que, al combinarse con cualquier número, lo deja sin cambiar.`,
          `Multiplicar cualquier número por 1 da ese mismo número — por eso el 1 es la "identidad multiplicativa" (de la multiplicación).`] },
      'distributiva': { enun:`${a}(${b} + ${c}) = ${a}×${b} + ${a}×${c}`, cat:'Distributiva',

          `${a} multiplica a todo (${b} + ${c}), así que se reparte: ${a} veces ${b}, más ${a} veces ${c}.`,
          `Esa es la propiedad distributiva.`] }
    };
    const cs = casos[p];
    return { enunciado:`¿Qué propiedad se usa en esta igualdad?<br><b>${cs.enun}</b>`,

  }
},
{
  id:'terminos-semejantes', nombre:'Términos semejantes', secciones:['2.3'],
  gen(nv){
    const alto = porNivel(nv, 12, 20, 30);
    const letra = pick(['x','y','a','m','n']);
    const variante = pick(['sumar','restar','multiplicar','no-combinan']);
    if(variante==='sumar'){
      const c1=R(2,alto), c2=R(2,alto);
      return { enunciado:`${c1}${letra} + ${c2}${letra} = ___${letra}`, tipo:'num', respuesta:c1+c2,
        explicacion:[`Dos términos son "semejantes" cuando tienen exactamente la misma parte con letra (misma variable, mismo exponente) — aquí, los dos tienen ${letra}.`,
          `Para sumar términos semejantes, se suman solo los coeficientes (los números) y la letra se queda igual, sin sumarse a sí misma.`,
          `${c1} + ${c2} = ${c1+c2}`, `→ ${c1+c2}${letra}`,
          `TRUCO: cambia la letra por una fruta. Ejemplo: ${c1}${letra} + ${c2}${letra} es lo mismo que ${c1} manzanas + ${c2} manzanas = ${c1+c2} manzanas, o sea ${c1+c2}${letra}. Nadie diría "${c1+c2} manzanas al cuadrado" — por eso al SUMAR la letra nunca cambia, solo se suman los números de adelante.`] };
    }
    if(variante==='restar'){
      const c2=R(2,alto), c1=c2+R(1,alto);
      return { enunciado:`${c1}${letra} − ${c2}${letra} = ___${letra}`, tipo:'num', respuesta:c1-c2,
        explicacion:[`Son términos semejantes (los dos tienen la letra ${letra}), así que se pueden combinar en uno solo.`,
          `Para restarlos, se restan solo los coeficientes y la letra se queda igual.`,
          `${c1} − ${c2} = ${c1-c2}`, `→ ${c1-c2}${letra}`,
          `TRUCO: el mismo de las frutas. Ejemplo: ${c1}${letra} − ${c2}${letra} es tener ${c1} manzanas y que te quiten ${c2}: quedan ${c1-c2} manzanas, o sea ${c1-c2}${letra}. La letra solo va de acompañante, no entra en la resta.`] };
    }
    if(variante==='multiplicar'){
      const c1=R(2,porNivel(nv,8,12,18)), c2=R(2,porNivel(nv,8,12,18));
      return { enunciado:`(${c1}${letra})(${c2}${letra}) = ___${letra}²`, tipo:'num', respuesta:c1*c2,
        explicacion:[`Multiplicar es distinto de sumar: aquí SÍ se multiplican tanto los coeficientes como las letras entre sí.`,
          `Coeficientes: ${c1} × ${c2} = ${c1*c2}`,
          `Letras: ${letra} × ${letra} = ${letra}² (multiplicar una letra por sí misma sube su exponente).`,
          `→ ${c1*c2}${letra}²`,
          `TRUCO: aquí NO vale el truco de las frutas — ese solo sirve para sumar y restar. Al multiplicar se junta todo con todo: números por números, letras por letras, y la letra por sí misma sube el exponente. Ejemplo con este mismo: (${c1}${letra})(${c2}${letra}) = ${c1*c2}${letra}², mientras que ${c1}${letra} + ${c2}${letra} sería solo ${c1+c2}${letra}.`] };
    }
    const c1=R(2,alto), c2=R(2,alto), letra2 = pick(['y','a','b','n'].filter(l=>l!==letra));
    return { enunciado:`¿Se pueden combinar estos términos?<br><b>${c1}${letra} + ${c2}${letra2}</b>`,
      tipo:'sino', respuesta:false,
      explicacion:[`Para que dos términos se puedan sumar o restar entre sí (ser "semejantes"), tienen que tener exactamente la misma letra con el mismo exponente.`,
        `Aquí un término tiene ${letra} y el otro tiene ${letra2} — son letras distintas, así que NO son semejantes.`,
        `→ No se pueden combinar; la expresión se queda tal cual, ${c1}${letra} + ${c2}${letra2}.`,
        `TRUCO: el de las frutas otra vez. Ejemplo: ${c1}${letra} + ${c2}${letra2} es ${c1} manzanas + ${c2} peras — no se puede escribir como un solo número de nada, se queda así. Para poder juntar dos términos, la parte de la letra tiene que ser idéntica, letra Y exponente (${letra} no se junta con ${letra2}, y ${letra} tampoco se junta con ${letra}²).`] };
  }
},
{
  id:'ecuaciones-lineales', nombre:'Ecuaciones lineales', secciones:['2.4'],
  gen(nv){
    const alto = porNivel(nv, 12, 25, 60);
    const x = R(-alto, alto) || 1;
    const letra = pick(['x','y','n']);
    const pasos = porNivel(nv, 1, Math.random()<0.5?2:1, 2);
    const T = (ecu, val) => `TRUCO: mira qué le están haciendo a ${letra} y hazle lo CONTRARIO en los dos lados: si suma, restas; si resta, sumas; si multiplica, divides; si divide, multiplicas. Y la comprobación es gratis: mete tu respuesta en la ecuación original. Ejemplo con este mismo: la ecuación era ${ecu}; pones ${letra} = ${val}, haces la cuenta, y si los dos lados dan igual está bien seguro, sin esperar a que te la corrijan.`;
    if(pasos===1){
      const tipoOp = pick(['suma','resta','mult','div']);
      if(tipoOp==='suma'){ const c=R(1,alto), r=x+c;
        return { enunciado:`${letra} + ${c} = ${r}`, tipo:'num', respuesta:x,
          explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad, para saber cuánto vale.`,
            `Aquí le están sumando ${c} a ${letra}. Para deshacer esa suma se hace la operación contraria — restar ${c} — en LOS DOS lados de la igualdad, así se mantiene el equilibrio.`,
            `${letra} = ${r} − ${c} = ${x}`, T(`${letra} + ${c} = ${r}`, x)] }; }
      if(tipoOp==='resta'){ const c=R(1,alto), r=x-c;
        return { enunciado:`${letra} − ${c} = ${r}`, tipo:'num', respuesta:x,
          explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad.`,
            `Aquí le están restando ${c} a ${letra}. La operación contraria de restar es sumar, así que se suma ${c} en los dos lados.`,
            `${letra} = ${r} + ${c} = ${x}`, T(`${letra} − ${c} = ${r}`, x)] }; }
      if(tipoOp==='mult'){ const c=R(2,10), r=x*c;
        return { enunciado:`${c}${letra} = ${r}`, tipo:'num', respuesta:x,
          explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad.`,
            `Aquí ${letra} está multiplicada por ${c}. La operación contraria de multiplicar es dividir, así que se divide entre ${c} en los dos lados.`,
            `${letra} = ${r} ÷ ${c} = ${x}`, T(`${c}${letra} = ${r}`, x)] }; }
      const c=R(2,10), k=R(1,alto), sol=k*c;
      return { enunciado:`${letra} ÷ ${c} = ${k}`, tipo:'num', respuesta:sol,
        explicacion:[`"Despejar" ${letra} significa dejarla sola en un lado de la igualdad.`,
          `Aquí ${letra} está dividida entre ${c}. La operación contraria de dividir es multiplicar, así que se multiplica por ${c} en los dos lados.`,
          `${letra} = ${k} × ${c} = ${sol}`, T(`${letra} ÷ ${c} = ${k}`, sol)] };
    }
    const c1 = R(2,10), c2 = R(1,alto), sig = pick(['+','−']);
    const r = sig==='+' ? c1*x + c2 : c1*x - c2;
    return { enunciado:`${c1}${letra} ${sig} ${c2} = ${r}`, tipo:'num', respuesta:x,
      explicacion:[`Esta ecuación necesita dos pasos porque a ${letra} le están haciendo dos cosas a la vez: multiplicarla por ${c1} y ${sig==='+'?'sumarle':'restarle'} ${c2}.`,
        `Paso 1 — deshacer la suma/resta primero (fue lo último que se le hizo a ${letra}, así que se deshace primero): ${sig==='+'?`${r} − ${c2}`:`${r} + ${c2}`} = ${c1*x}`,
        `Paso 2 — deshacer la multiplicación: ${c1*x} ÷ ${c1} = ${x}`, `→ ${letra} = ${x}`,
        `TRUCO: deshazlo en orden inverso, como quitarte la ropa: primero lo que está más LEJOS de ${letra} (el número que suma o resta) y de último lo que está pegado a ella (el que la multiplica). Nunca al revés. Ejemplo con este mismo: ${r} ${sig==='+'?'−':'+'} ${c2} = ${c1*x}, y ${c1*x} ÷ ${c1} = ${x}; para comprobar, ${c1}×${x} ${sig} ${c2} tiene que dar ${r}.`] };
  }
},
{

  }
},
{
  id:'promedio', nombre:'Media aritmética (promedio)', secciones:['2.5'],
  gen(nv){
    if(Math.random()<0.35){                                          // falta un dato, dado el promedio
      const cuantos = R(3, porNivel(nv,4,5,6));
      const media = R(porNivel(nv,8,15,25), porNivel(nv,30,60,100));
      const total = media*cuantos;
      const spread = porNivel(nv,6,12,20);
      let conocidos, falta;
      do {
        conocidos = []; for(let i=0;i<cuantos-1;i++) conocidos.push(R(Math.max(1,media-spread), media+spread));
        falta = total - conocidos.reduce((a,b)=>a+b,0);
      } while(falta < 1 || falta > media*3);
      return { enunciado:`El promedio de estos ${cuantos} números es <b>${media}</b>: ${conocidos.join(', ')}, y <b>x</b>. Halla x.`, tipo:'num', respuesta:falta,
        explicacion:[`Si el promedio de ${cuantos} números es ${media}, la SUMA de todos ellos tiene que ser ${media} × ${cuantos} = ${total} (el promedio es la suma dividida entre la cantidad, así que al revés se multiplica).`,
          `Suma de los que ya se conocen: ${conocidos.join(' + ')} = ${total-falta}`,
          `Al número que falta (x) le toca completar hasta ${total}: x = ${total} − ${total-falta} = ${falta}`,
          `→ x = ${falta}`,
          `TRUCO: "deshaz" el promedio multiplicando por la cantidad de datos para recuperar la suma total; de ahí es una resta común para encontrar lo que falta. Comprobación: suma TODOS los números (incluyendo x = ${falta}) y divide entre ${cuantos}; tiene que dar ${media} otra vez.`] };
    }
    const cuantos = R(3, porNivel(nv,4,5,6));
    const alto = porNivel(nv, 20, 100, 200);
    const vals = []; for(let i=0;i<cuantos;i++) vals.push(R(1,alto));
    const suma = vals.reduce((a,b)=>a+b,0);
    const media = Math.round((suma/cuantos)*100)/100;
    return { enunciado:`Halla el promedio de: <b>${vals.join(', ')}</b>`, tipo:'num', respuesta:media,
      explicacion:[`El "promedio" (o media aritmética) representa el valor que tendría cada dato si el total se repartiera en partes iguales entre todos.`,
        `Se calcula así: se suman todos los valores, y esa suma se divide entre la cantidad de valores que hay.`,
        `Suma: ${vals.join(' + ')} = ${suma}`, `Cantidad de valores: hay ${cuantos} números en la lista.`,
        `${suma} ÷ ${cuantos} = ${media}`,
        `TRUCO: comprueba sin volver a calcular: el promedio SIEMPRE tiene que caer entre el dato más chico y el más grande. Si te dio fuera de ahí, el error está en la suma o en la cantidad de datos (se divide entre cuántos números hay, no entre el último de ellos). Ejemplo con este mismo: te dio ${media}, y ${media} cae entre ${Math.min.apply(null,vals)} y ${Math.max.apply(null,vals)}, así que es creíble.`] };
  }
},

{

    // los tres lados tienen que poder cerrar un triángulo (cada lado menor que la suma de los
    // otros dos) — antes salían cosas como 15, 9 y 4, que no existen como triángulo
    else if(tipo==='isosceles'){ a=b=R(3,alto); do{ c=R(3,alto); }while(c===a || c>=a+b); }
    else { do{ a=R(3,alto); do{ b=R(3,alto); }while(b===a); do{ c=R(3,alto); }while(c===a||c===b); }while(a>=b+c || b>=a+c || c>=a+b); }
    const nombre = {equilatero:'Equilátero',isosceles:'Isósceles',escaleno:'Escaleno'}[tipo];
    return { enunciado:`Un triángulo tiene lados de <b>${a}, ${b} y ${c}</b>. ¿Cómo se clasifica según sus lados?`,
      tipo:'opciones', opciones: shuffle(['Equilátero','Isósceles','Escaleno']), respuesta: nombre,
      explicacion:[`Según sus lados, un triángulo puede ser: Equilátero (sus 3 lados miden exactamente lo mismo), Isósceles (solo 2 lados iguales y el tercero diferente), o Escaleno (los 3 lados son todos diferentes entre sí).`,
        `Los lados dados son ${a}, ${b} y ${c}.`, `→ ${nombre}`,
        `TRUCO: solo cuenta cuántos lados IGUALES hay, no hace falta nada más. ¿3 iguales? Equilátero (equi = igual). ¿Exactamente 2? Isósceles (iso = igual, pero solo dos). ¿Ninguno? Escaleno (piensa en escalera: todos los escalones distintos). Ejemplo con este mismo: ${a}, ${b} y ${c} → ${tipo==='equilatero'?'los 3 miden lo mismo':tipo==='isosceles'?'hay 2 iguales y 1 distinto':'los 3 son distintos'} → ${nombre}.`] };
  }
},
{
  id:'perimetro-area', nombre:'Perímetro y área', secciones:['2.7'],
  // El truco depende de si piden perímetro o área, no de la figura — se pega aquí
  // en vez de repetirlo en los 14 returns de _gen.
  gen(nv){
    const e = this._gen(nv);
    const esArea = /área/.test(e.enunciado);
    e.explicacion = e.explicacion.concat((esArea ? TRUCO_AREA : TRUCO_PERIM) + (esArea
      ? ` Ejemplo con este mismo: te dio ${e.respuesta} multiplicando las medidas; si en vez de eso sumaras los lados saldría otro número, y ese sería el perímetro.`
      : ` Ejemplo con este mismo: te dio ${e.respuesta} sumando lo que rodea la figura; si multiplicaras las medidas saldría otro número, y ese sería el área.`));
    return e;
  },
  _gen(nv){
    const alto = porNivel(nv, 12, 20, 35);
    const R2 = () => R(3,alto);
    const forma = pick(['cuadrado','rectangulo','triangulo','circulo','trapecio','rombo','romboide']);
    const medida = pick(['perimetro','area']);
    if(forma==='cuadrado'){
      const l = R2();
      return medida==='perimetro'
        ? { enunciado:`Halla el <b>perímetro</b> de un cuadrado de lado ${l}.`, tipo:'num', respuesta:4*l,
            explicacion:[`El perímetro es la distancia total alrededor de una figura — la suma de todos sus lados.`,
              `Un cuadrado tiene 4 lados, y los 4 miden lo mismo, así que el perímetro es 4 veces el lado: P = 4 × lado`,
              `P = 4 × ${l} = ${4*l}`] }
        : { enunciado:`Halla el <b>área</b> de un cuadrado de lado ${l}.`, tipo:'num', respuesta:l*l,
            explicacion:[`El área es la cantidad de superficie que cubre una figura por dentro, medida en unidades cuadradas.`,
              `En un cuadrado, el área es el lado multiplicado por sí mismo: A = lado²`,
              `A = ${l}² = ${l} × ${l} = ${l*l}`] };
    }
    if(forma==='rectangulo'){
      const l=R2(), w=R2();
      return medida==='perimetro'
        ? { enunciado:`Halla el <b>perímetro</b> de un rectángulo de ${l} por ${w}.`, tipo:'num', respuesta:2*l+2*w,
            explicacion:[`El perímetro es la distancia total alrededor de la figura — la suma de sus 4 lados.`,
              `Un rectángulo tiene 2 lados largos iguales y 2 lados anchos iguales: P = 2×largo + 2×ancho`,
              `P = 2×${l} + 2×${w} = ${2*l+2*w}`] }
        : { enunciado:`Halla el <b>área</b> de un rectángulo de ${l} por ${w}.`, tipo:'num', respuesta:l*w,
            explicacion:[`El área es la superficie que cubre la figura por dentro.`,
              `En un rectángulo, el área es largo por ancho: A = largo × ancho`,
              `A = ${l} × ${w} = ${l*w}`] };
    }
    if(forma==='triangulo'){
      if(medida==='area'){
        const b=R2(), h=R2(), bb=(b*h)%2===0?b:b+1, a=(bb*h)/2;
        return { enunciado:`Halla el <b>área</b> de un triángulo con base ${bb} y altura ${h}.`, tipo:'num', respuesta:a,
          explicacion:[`El área de un triángulo es la mitad de "base por altura" — la altura es la distancia perpendicular (en ángulo recto) desde la base hasta el vértice de enfrente.`,
            `A = (base × altura) ÷ 2`, `A = (${bb} × ${h}) ÷ 2 = ${bb*h} ÷ 2 = ${a}`] };
      }
      const l1=R2(), l2=R2();
      // un lado al azar podía violar la desigualdad triangular (cada lado < suma de los
      // otros dos) — l3 se acota al rango que sí forma un triángulo real; si ese rango
      // queda vacío (alto muy chico), el lado más largo repetido siempre es válido
      const _lo = Math.max(3, Math.abs(l1-l2)+1), _hi = Math.min(alto, l1+l2-1);
      const l3 = _lo<=_hi ? R(_lo,_hi) : Math.max(l1,l2);
      return { enunciado:`Halla el <b>perímetro</b> de un triángulo con lados ${l1}, ${l2} y ${l3}.`, tipo:'num', respuesta:l1+l2+l3,
        explicacion:[`El perímetro es la distancia total alrededor de la figura — simplemente se suman los 3 lados.`,
          `P = ${l1} + ${l2} + ${l3} = ${l1+l2+l3}`] };
    }
    if(forma==='circulo'){
      const r = R(2,15);
      if(medida==='perimetro'){ const c = Math.round(2*3.14*r*100)/100;
        return { enunciado:`Halla la <b>circunferencia</b> de un círculo con radio ${r} (usa π ≈ 3.14).`, tipo:'num', respuesta:c,
          explicacion:[`En un círculo, el "perímetro" se llama circunferencia — la distancia alrededor de todo el borde curvo.`,
            `π (pi) es un número especial, siempre el mismo para cualquier círculo, aproximadamente 3.14. Fórmula: C = 2πr, donde r es el radio (del centro al borde).`,
            `C = 2 × 3.14 × ${r} = ${c}`] }; }
      const a = Math.round(3.14*r*r*100)/100;
      return { enunciado:`Halla el <b>área</b> de un círculo con radio ${r} (usa π ≈ 3.14).`, tipo:'num', respuesta:a,
        explicacion:[`El área es la superficie que cubre el círculo por dentro.`,
          `La fórmula es A = πr² (pi por el radio, al cuadrado).`,
          `A = 3.14 × ${r}² = 3.14 × ${r*r} = ${a}`] };
    }
    if(forma==='trapecio'){
      const B=R2(), b2=R(2,B-1);
      if(medida==='area'){ const h=R2();
        let b3=((B+b2)*h)%2===0?b2:b2+1;
        if(b3>=B) b3=B-1;   // el +1 de arriba podía igualar a la base mayor — "bases X y X" no es un trapecio
        const a=((B+b3)*h)/2;
        return { enunciado:`Halla el <b>área</b> de un trapecio con bases ${B} y ${b3}, y altura ${h}.`, tipo:'num', respuesta:a,
          explicacion:[`Un trapecio tiene dos lados paralelos de distinto tamaño, llamados "base mayor" y "base menor". Su área es el promedio de esas dos bases, multiplicado por la altura.`,
            `A = ((base mayor + base menor) × altura) ÷ 2`, `A = ((${B} + ${b3}) × ${h}) ÷ 2 = ${(B+b3)*h} ÷ 2 = ${a}`] }; }
      let l1=R2(), l2=R2();
      // los dos lados no paralelos tienen que alcanzar a cerrar la diferencia entre las dos
      // bases (B−b2) — si no, ninguna figura real los conecta; se ajusta l2 cuando hace falta
      const _offset = B-b2;
      if(l1+l2 <= _offset) l2 = Math.min(alto, _offset-l1+R(1,3));
      return { enunciado:`Halla el <b>perímetro</b> de un trapecio con lados ${B}, ${b2}, ${l1} y ${l2}.`, tipo:'num', respuesta:B+b2+l1+l2,
        explicacion:[`El perímetro es la distancia total alrededor de la figura — se suman los 4 lados.`,
          `P = ${B} + ${b2} + ${l1} + ${l2} = ${B+b2+l1+l2}`] };
    }
    if(forma==='rombo'){
      const l = R2();
      if(medida==='perimetro') return { enunciado:`Halla el <b>perímetro</b> de un rombo de lado ${l}.`, tipo:'num', respuesta:4*l,
        explicacion:[`Un rombo tiene sus 4 lados iguales (como un cuadrado "inclinado"), así que el perímetro es 4 veces ese lado.`,
          `P = 4 × lado`, `P = 4 × ${l} = ${4*l}`] };
      const D=R(4,alto), d0=R(2,D-1), d=(D*d0)%2===0?d0:d0+1, a=(D*d)/2;
      return { enunciado:`Halla el <b>área</b> de un rombo con diagonales ${D} y ${d}.`, tipo:'num', respuesta:a,
        explicacion:[`Las "diagonales" van de una esquina a la opuesta, cruzando por dentro. El área de un rombo es la mitad del producto de sus dos diagonales.`,
          `A = (diagonal mayor × diagonal menor) ÷ 2`, `A = (${D} × ${d}) ÷ 2 = ${D*d} ÷ 2 = ${a}`] };
    }
    const b=R2(), h=R2(), l=R2();
    return medida==='area'
      ? { enunciado:`Halla el <b>área</b> de un romboide con base ${b} y altura ${h}.`, tipo:'num', respuesta:b*h,
          explicacion:[`Un romboide (paralelogramo) es como un rectángulo "inclinado". Su área se calcula igual: base por altura (la altura es la distancia perpendicular entre las dos bases, no el lado inclinado).`,
            `A = base × altura`, `A = ${b} × ${h} = ${b*h}`] }
      : { enunciado:`Halla el <b>perímetro</b> de un romboide con lados ${b} y ${l}.`, tipo:'num', respuesta:2*b+2*l,
          explicacion:[`El perímetro es la distancia alrededor de la figura. Un romboide tiene 2 pares de lados iguales, así que se duplica cada uno y se suman.`,
            `P = 2×lado a + 2×lado b`, `P = 2×${b} + 2×${l} = ${2*b+2*l}`] };
  }
},

        `→ ${n}/${d} = ${n*k}/${d*k}`,

        `Lo que se le hace al numerador hay que hacérselo también al denominador: ${d} × ${k} = ${d*k}`,
        `→ ${n}/${d} = ${n*k}/${d*k}`,

{

        `${n} = ${fmtFactores(factorizar(n))} y ${d} = ${fmtFactores(factorizar(d))}`,

  }

{
  id:'comparar', nombre:'Comparar y ordenar', secciones:['3.5','3.6'],
  gen(nv){
    const alto = porNivel(nv, 9, 14, 22);
    const nueva = () => { const d = R(2,alto); return { n:R(1,d-1), d }; };
    if(Math.random() < 0.65){                            // comparar dos
      const a = nueva();
      const b = Math.random()<0.2 ? {n:a.n*2, d:a.d*2} : nueva();   // a veces iguales
      const m = mcm(a.d,b.d);
      return { enunciado:`¿Qué signo va en el medio?<br>${fr(a.n,a.d)} &nbsp;___&nbsp; ${fr(b.n,b.d)}`,
        tipo:'cmp', respuesta: cmpSigno(a.n*(m/a.d), b.n*(m/b.d)), explicacion: explComparar(a,b) };
    }
    // ordenar tres
    const fs = []; while(fs.length<3){ const f = nueva();
      if(!fs.some(x => x.n*f.d === f.n*x.d)) fs.push(f); }
    const asc = Math.random()<0.5;
    const m = fs.reduce((ac,f)=>mcm(ac,f.d), 1);
    const conv = fs.map((f,i)=>({i, v:f.n*(m/f.d), f}));
    const orden = conv.slice().sort((a,b)=> asc ? a.v-b.v : b.v-a.v);
    return {
      enunciado:`Ordena estas fracciones de <b>${asc?'menor a mayor':'mayor a menor'}</b>.<br>`+
                `<small style="opacity:.75">Tócalas en orden.</small>`,
      tipo:'orden', opciones: fs, respuesta: orden.map(o=>o.i),
      explicacion:[`Para ordenar fracciones con denominadores distintos, primero se convierten todas al mismo denominador — así se pueden comparar directamente los numeradores.`,
        `Denominador común: MCM(${fs.map(f=>f.d).join(', ')}) = ${m}`,
        ...conv.map(c=>`${c.f.n}/${c.f.d} → ${c.v}/${m}`),
        `Ya con el mismo denominador, ordenamos los numeradores de ${asc?'menor a mayor':'mayor a menor'}: ${orden.map(o=>o.v).join(' , ')}`,
        `→ ${orden.map(o=>`${o.f.n}/${o.f.d}`).join(' , ')}`,
        `TRUCO: antes de sacar cuentas, compara cada fracción contra 1/2 — mira si el numerador llega a la mitad del denominador o no. Las que no llegan son las chiquitas y las que la pasan son las grandes; muchas veces eso ya deja el orden casi armado y solo hay que decidir entre dos. Ejemplo con estas mismas: ${fs.map(f=>`${f.n}/${f.d} ${f.n*2<f.d?'no llega a la mitad':f.n*2>f.d?'pasa la mitad':'es justo la mitad'}`).join(', ')}. Para las que queden parejas, ahí sí busca el denominador común o multiplica en cruz.`] };
  }
},
